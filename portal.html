.tgk-tuning-portal h1,.tgk-tuning-portal h2,.tgk-tuning-portal p{margin:0;padding:0}
.tgk-tuning-portal .wrap{max-width:760px;margin:0 auto;padding:20px 20px 80px}
.tgk-tuning-portal .portal-brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:32px 20px 12px}
.tgk-tuning-portal .portal-brand img{height:22px;width:auto;display:block}
.tgk-tuning-portal .portal-brand .ghost-icon{height:26px}
.tgk-tuning-portal .portal-brand .brand-sep{width:1px;height:16px;background:var(--border2)}
.tgk-tuning-portal .portal-brand .brand-sub{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.tgk-tuning-portal .card{background:rgba(255,255,255,.66);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:18px;box-shadow:0 2px 10px rgba(17,24,39,.06);position:relative;overflow:hidden}
.tgk-tuning-portal .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.tgk-tuning-portal .card.status-card{border-left:4px solid var(--status-accent, var(--teal))}

.tgk-tuning-portal .invoice-box{border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);padding:12px 16px;margin-bottom:12px}
.tgk-tuning-portal .invoice-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.tgk-tuning-portal .invoice-line:last-of-type{border-bottom:none}
.tgk-tuning-portal .invoice-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:2px;border-top:2px solid var(--text);font-weight:700}
.tgk-tuning-portal .invoice-total .amt{font-size:18px}


/* Carbon-fiber hero header replacing the plain white status card */
.hero-carbon{
  background-color:var(--cb-c);background-image:var(--cb-i);
  background-size:100% 100%,100% 100%,100% 100%,auto 260px;
  background-position:0 0,0 0,0 0,center 30%;
  border-radius:var(--r-lg);padding:26px 28px;margin-bottom:18px;
  box-shadow:0 8px 24px rgba(13,15,16,.35),inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;overflow:hidden;color:#fff;z-index:0
}
.hero-carbon::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent);z-index:2}
.hero-carbon::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,11,.72),rgba(8,10,11,.5) 50%,rgba(8,10,11,.72));z-index:1;pointer-events:none}
.hero-inner{position:relative;z-index:2}
.tgk-tuning-portal .hero-carbon h1{color:#fff;font-size:21px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tgk-tuning-portal .hero-carbon .sub{color:#B9C2CC;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tgk-tuning-portal .hero-carbon .car-line{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tgk-tuning-portal .hero-carbon .status-blurb{color:#D6DBE0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hero-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#5ce6cc;letter-spacing:.03em;text-transform:uppercase}

.stepper-row{display:flex;align-items:center;margin:20px 0 6px}
.stepper-row .st-dot{width:13px;height:13px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:transparent;flex:none;transition:all .2s}
.stepper-row .st-dot.done{border-color:var(--teal);background:var(--teal)}
.stepper-row .st-dot.current{border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(45,212,191,.3)}
.stepper-row .st-seg{flex:1;height:2px;background:rgba(255,255,255,.18)}
.stepper-row .st-seg.done{background:var(--teal)}
.stepper-labels{display:flex;justify-content:space-between;font-size:10.5px;color:#9CA6AF;margin-bottom:4px}
.stepper-labels span.current{color:#5ce6cc;font-weight:700}

/* Revision-request action, shown in the hero once a tune has been sent */
.revision-cta{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.revision-cta textarea.form-input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.revision-cta textarea.form-input::placeholder{color:#9CA6AF}
.revision-cta textarea.form-input:focus{border-color:var(--teal)}
.btn.btn-ghost-light{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
.btn.btn-ghost-light:hover{background:rgba(255,255,255,.1)}
.tgk-tuning-portal h1{font-size:20px;font-weight:800;margin-bottom:2px;color:var(--navy)}
.tgk-tuning-portal h2{font-size:14.5px;font-weight:700;margin-bottom:10px;color:var(--navy);display:flex;align-items:center;justify-content:space-between}
.tgk-tuning-portal .sub{font-size:13px;color:var(--text3);margin-bottom:6px}
.tgk-tuning-portal .status-blurb{font-size:13px;color:var(--text2);line-height:1.6;margin-top:10px}

.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--teal-d);letter-spacing:.03em;text-transform:uppercase}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(45,212,191,.5);animation:live-pulse 2s infinite}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}70%{box-shadow:0 0 0 6px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}

.pill{display:inline-flex;align-items:center;padding:3px 10px;font-size:11.5px;font-weight:700;border-radius:6px;border:1px solid transparent}
.pill-teal{background:rgba(45,212,191,.12);color:var(--teal-d);border-color:rgba(45,212,191,.25)}
.pill-orange{background:rgba(234,88,12,.1);color:var(--orange-d);border-color:rgba(234,88,12,.22)}
.pill-red{background:var(--red-dim);color:var(--red);border-color:rgba(220,38,38,.2)}
.pill-green{background:var(--green-dim);color:var(--green);border-color:rgba(22,163,74,.2)}
.pill-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(217,119,6,.2)}
.pill-muted{background:rgba(107,114,128,.12);color:var(--text3);border-color:var(--border)}

.car-line{font-size:15px;font-weight:700;color:var(--text);margin-top:6px}

.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:10px 12px;font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
.tgk-tuning-portal textarea.form-input{resize:vertical;min-height:70px}
.form-input:focus{border-color:var(--teal)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 22px;font-size:13.5px;font-weight:700;border:none;border-radius:var(--r);background:var(--orange);color:#fff;cursor:pointer;transition:background-color .15s,box-shadow .15s,transform .1s;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tgk-tuning-portal .btn:hover{background:var(--orange-d);box-shadow:0 2px 6px rgba(0,0,0,.16);transform:translateY(-1px)}
.tgk-tuning-portal .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{padding:7px 14px;font-size:12.5px;width:auto}

.msg-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:420px;overflow-y:auto;padding-right:2px}
.msg{padding:10px 13px;border-radius:var(--r);max-width:85%;font-size:13.5px}
.msg-them{background:var(--bg3);align-self:flex-start}
.msg-me{background:rgba(45,212,191,.12);align-self:flex-end;margin-left:auto}
.msg-system{background:var(--bg3);align-self:center;font-style:italic;color:var(--text3);font-size:12.5px;max-width:100%;text-align:center}
.msg-revision{background:var(--red-dim);align-self:flex-end;margin-left:auto;border:1px solid rgba(220,38,38,.25)}
.msg-revision-badge{font-weight:700;font-size:11.5px;color:var(--red);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
.msg-meta{font-size:10.5px;color:var(--text3);margin-bottom:3px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.msg-body{white-space:pre-wrap;word-break:break-word;line-height:1.5}

.file-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.file-row:last-child{border-bottom:none}
.file-name{font-weight:600;font-size:13.5px}
.file-meta{font-size:11.5px;color:var(--text3);margin-top:2px}

.status-msg{font-size:12.5px;border-radius:var(--r);padding:10px 12px;margin-top:12px;display:none}
.status-msg.err{display:block;background:var(--red-dim);color:var(--red)}
.status-msg.ok{display:block;background:var(--green-dim);color:var(--green)}
.empty-state{text-align:center;padding:24px 10px;color:var(--text3);font-size:13px}
.footer-note{text-align:center;margin-top:6px;font-size:11px;color:var(--text3)}
.skeleton{padding:60px 10px;text-align:center;color:var(--text3);font-size:13.5px}

@media(max-width:480px){
  /* Six stage labels in a space-between row genuinely overflow/crowd on a
     real phone width - keep the dots (they scale fine) but only show the
     current stage's label, invisibility rather than removal so it stays
     positioned above its correct dot instead of the row re-flowing. */
  .stepper-labels span:not(.current){visibility:hidden}
  .tgk-tuning-portal .wrap{padding:14px 14px 60px}
  .tgk-tuning-portal .portal-brand{padding:20px 14px 10px}
  .tgk-tuning-portal .card{padding:18px 16px}
  .hero-carbon{padding:20px 18px}
  .tgk-tuning-portal .hero-carbon h1{font-size:18px}
}
</style>
</head>

<script>
const SUPABASE_URL = "https://piamamighqiielfztgic.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JHTuiKlkCD_EHoyDtWtKsQ_gyQ6kgfJ";
let sb = null;

const TOKEN = new URLSearchParams(window.location.search).get('token');

const STATUS_LABEL = {
  submitted:'Submitted', under_review:'Under Review', needs_info:'Needs Info',
  accepted:'Accepted', declined:'Declined', active:'Active',
  tune_sent:'Tune Ready', revision_requested:'Revision Requested',
  completed:'Completed', archived:'Archived'
};
const STATUS_PILL = {
  submitted:'pill-yellow', under_review:'pill-orange', needs_info:'pill-orange',
  accepted:'pill-teal', declined:'pill-red', active:'pill-teal',
  tune_sent:'pill-green', revision_requested:'pill-yellow',
  completed:'pill-green', archived:'pill-muted'
};
const STATUS_BLURB = {
  submitted:"We've received your application. Our tuning department will review it and follow up within 7 business days.",
  under_review:"Your application is currently being reviewed by our tuning department.",
  needs_info:"We need a bit more information from you before we can move forward - check the messages below.",
  accepted:"Good news - your application was accepted! We'll be in touch about next steps.",
  declined:"Unfortunately we're not able to move forward with tuning at this time. Check the messages below for details.",
  active:"Your Ghost Tune is in progress.",
  tune_sent:"Your tune is ready - download it below.",
  revision_requested:"We've received your revision request and are looking into it.",
  completed:"Your Ghost Tune is complete. Thanks for choosing TGK Motorsport!",
  archived:"This application has been archived."
};
const STATUS_ACCENT = {
  submitted:'#d97706', under_review:'#ea580c', needs_info:'#ea580c',
  accepted:'#14b8a6', declined:'#dc2626', active:'#14b8a6',
  tune_sent:'#16a34a', revision_requested:'#d97706',
  completed:'#16a34a', archived:'#9ca3af'
};

let STATE = { application:null, messages:[], files:[], invoices:[], _channel:null, _prevMsgCount:0 };

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

async function callPortal(action, extra){
  const body = Object.assign({ action: action, token: TOKEN }, extra || {});
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-portal', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(!data.success) throw new Error(data.error || 'Request failed');
  return data;
}

function renderInvalid(msg){
  document.getElementById('portalWrap').innerHTML =
    '<div class="card"><h1>Ghost Tuning</h1>'
    + '<p class="status-blurb">' + escapeHtml(msg) + '</p>'
    + '<p class="footer-note" style="margin-top:14px">If you believe this is a mistake, check the link in your original confirmation email, or contact us directly.</p>'
    + '</div>';
}

function renderStageStepper(a){
  const MAIN_STAGES = [
    { id:'submitted', label:'Submitted' },
    { id:'under_review', label:'Review' },
    { id:'accepted', label:'Accepted' },
    { id:'active', label:'In Progress' },
    { id:'tune_sent', label:'Tune Sent' },
    { id:'completed', label:'Complete' }
  ];
  // Off-path statuses map onto the nearest main stage for stepper purposes,
  // so the stepper always reads as forward progress even when something
  // needs attention.
  const POSITION_OVERRIDE = { needs_info:'under_review', declined:'under_review', revision_requested:'tune_sent', archived:'completed' };
  const effective = POSITION_OVERRIDE[a.status] || a.status;
  const idx = MAIN_STAGES.findIndex(function(s){ return s.id === effective; });

  let dots = '<div class="stepper-row">';
  let labels = '<div class="stepper-labels">';
  MAIN_STAGES.forEach(function(s, i){
    const done = idx > i;
    const isCurrent = i === idx;
    dots += '<div class="st-dot ' + (done ? 'done' : (isCurrent ? 'current' : '')) + '"></div>';
    if(i < MAIN_STAGES.length - 1) dots += '<div class="st-seg ' + (idx > i ? 'done' : '') + '"></div>';
    labels += '<span class="' + (isCurrent ? 'current' : '') + '">' + s.label + '</span>';
  });
  dots += '</div>';
  labels += '</div>';
  return dots + labels;
}

function renderRevisionCta(a){
  if(a.status !== 'tune_sent') return '';
  return '<div class="revision-cta" id="revisionCta">'
    + '<button class="btn btn-ghost-light btn-sm" onclick="showRevisionForm()" id="revisionShowBtn">Request a Revision</button>'
    + '</div>';
}

function showRevisionForm(){
  const el = document.getElementById('revisionCta');
  if(!el) return;
  el.innerHTML = '<div class="sub" style="color:#D6DBE0;margin-bottom:8px">What would you like changed? (optional, but it helps your tuner get it right the first time)</div>'
    + '<textarea class="form-input" id="revisionNotes" placeholder="e.g. feels rich at idle, would like a bit more low-end..." style="margin-bottom:10px"></textarea>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="btn btn-sm" onclick="submitRevisionRequest()" id="revisionSubmitBtn">Submit Revision Request</button>'
    + '<button class="btn btn-ghost-light btn-sm" onclick="renderPortal()">Cancel</button>'
    + '</div>'
    + '<div class="status-msg" id="revisionErr"></div>';
}
window.showRevisionForm = showRevisionForm;

async function submitRevisionRequest(){
  const notes = document.getElementById('revisionNotes').value.trim();
  const btn = document.getElementById('revisionSubmitBtn');
  const errEl = document.getElementById('revisionErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const data = await callPortal('request_revision', { notes: notes });
    STATE.application = data.application;
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Revision request sent - your tuner has been notified.');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to submit: ' + e.message;
    btn.disabled = false; btn.textContent = 'Submit Revision Request';
  }
}
window.submitRevisionRequest = submitRevisionRequest;

function toastLike(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#141b25;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:999';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

function renderPortal(){
  const a = STATE.application;
  let html = '';

  html += '<div class="hero-carbon" style="--status-accent:' + (STATUS_ACCENT[a.status] || '#9ca3af') + '"><div class="hero-inner">';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">';
  html += '<h1 style="margin-bottom:0">Ghost Tuning Application #' + a.application_number + '</h1>';
  html += '<span class="hero-live"><span class="live-dot"></span>Live</span>';
  html += '</div>';
  html += '<div class="sub" style="margin-top:2px">' + escapeHtml(a.customer_name) + '</div>';
  html += '<div style="margin-top:12px"><span class="pill ' + (STATUS_PILL[a.status]||'pill-muted') + '">' + (STATUS_LABEL[a.status]||a.status) + '</span></div>';
  html += '<div class="car-line">' + escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ')) + '</div>';
  if(['declined','archived'].indexOf(a.status) === -1) html += renderStageStepper(a);
  html += '<p class="status-blurb">' + escapeHtml(STATUS_BLURB[a.status] || '') + '</p>';
  html += renderRevisionCta(a);
  html += '</div></div>';

  html += renderInvoiceCard();

  html += '<div class="card">';
  html += '<h2>Messages</h2>';
  html += '<div class="msg-list" id="msgList">' + renderMessages() + '</div>';
  html += '<textarea class="form-input" id="msgInput" placeholder="Write a message to your tuner..." style="margin-bottom:10px"></textarea>';
  html += '<button class="btn" onclick="sendMessage()" id="sendBtn">Send Message</button>';
  html += '<div class="status-msg" id="msgErr"></div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h2>Files</h2>';
  html += '<div id="fileList">' + renderFiles() + '</div>';
  html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">';
  html += '<div class="sub" style="margin-bottom:8px">Send a datalog or other file to your tuner</div>';
  html += '<input type="file" id="fileInput" style="margin-bottom:10px">';
  html += '<button class="btn btn-sm" onclick="uploadLog()" id="uploadBtn">Upload</button>';
  html += '<div class="status-msg" id="uploadErr"></div>';
  html += '</div>';
  html += '</div>';

  html += '<p class="footer-note">TGK Motorsport - Ghost Tuning</p>';

  document.getElementById('portalWrap').innerHTML = html;

  if(STATE.messages.length > STATE._prevMsgCount){
    const list = document.getElementById('msgList');
    if(list) list.scrollTop = list.scrollHeight;
  }
  STATE._prevMsgCount = STATE.messages.length;
}
window.renderPortal = renderPortal;

// Only shows once the tuner has actually sent an invoice - a fresh
// application with no invoice yet gets nothing here, not an empty box.
// Only shows once the tuner has actually sent at least one invoice - a
// fresh application with none yet gets nothing here, not an empty box.
// A customer who orders an additional tune later just sees a second
// invoice-box appear here, independent of the first.
function renderInvoiceCard(){
  const invoices = STATE.invoices || [];
  if(!invoices.length) return '';

  let html = '<div class="card">';
  html += '<h2 style="margin-bottom:12px">Invoices</h2>';
  html += invoices.map(function(inv){
    const isPaid = inv.status === 'paid';
    const lines = Array.isArray(inv.line_items) ? inv.line_items : [];
    const linesHtml = lines.map(function(l){
      return '<div class="invoice-line"><div style="flex:1;min-width:0">' + (l.quantity > 1 ? l.quantity + '&times; ' : '') + escapeHtml(l.title) + '</div><div style="flex-shrink:0;white-space:nowrap">$' + (Number(l.price) * Number(l.quantity||1)).toFixed(2) + '</div></div>';
    }).join('');
    const total = inv.amount != null ? Number(inv.amount).toFixed(2) : '0.00';

    let block = '<div class="invoice-box" style="margin-bottom:14px">';
    block += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">';
    block += '<span class="pill ' + (isPaid ? 'pill-green' : 'pill-yellow') + '">' + (isPaid ? 'Paid' : 'Awaiting Payment') + '</span>';
    block += '<span class="sub" style="font-size:12px">' + fmtDate(inv.sent_at || inv.created_at) + '</span>';
    block += '</div>';
    block += linesHtml;
    block += '<div class="invoice-total"><span>Total</span><span class="amt">$' + total + '</span></div>';
    if(inv.notes) block += '<p class="sub" style="margin:8px 0 0;font-size:13px">' + escapeHtml(inv.notes) + '</p>';
    if(isPaid){
      block += '<p class="sub" style="margin-top:8px">Paid' + (inv.paid_at ? ' ' + fmtDate(inv.paid_at) : '') + '. Thank you!</p>';
    } else if(inv.invoice_url){
      block += '<div style="margin-top:10px"><a href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener" class="btn" style="text-decoration:none">Pay Invoice - $' + total + '</a></div>';
    }
    block += '</div>';
    return block;
  }).join('');
  html += '</div>';
  return html;
}

function renderMessages(){
  if(!STATE.messages.length) return '<div class="empty-state">No messages yet.</div>';
  return STATE.messages.map(function(m){
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const cls = isRevisionRequest ? 'msg-revision' : (m.sender_type === 'system' ? 'msg-system' : (m.sender_type === 'customer' ? 'msg-me' : 'msg-them'));
    let html = '<div class="msg ' + cls + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">Revision Request Sent</div>';
    } else if(m.sender_type !== 'system'){
      html += '<div class="msg-meta">' + (m.sender_type === 'customer' ? 'You' : 'Ghost Tuning') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div></div>';
    return html;
  }).join('');
}

function renderFiles(){
  if(!STATE.files.length) return '<div class="empty-state">No files exchanged yet.</div>';
  return STATE.files.map(function(f){
    const label = f.uploaded_by === 'tuner' ? 'From your tuner' : 'You sent this';
    return '<div class="file-row">'
      + '<div style="flex:1"><div class="file-name">' + escapeHtml(f.file_name) + (f.revision_number ? ' <span class="pill pill-muted">rev ' + f.revision_number + '</span>' : '') + '</div>'
      + '<div class="file-meta">' + label + ' &middot; ' + fmtDate(f.created_at) + '</div></div>'
      + (f.uploaded_by === 'tuner' ? '<button class="btn btn-sm" onclick="downloadFile(\'' + f.id + '\')">Download</button>' : '')
      + '</div>';
  }).join('');
}

async function loadStatus(silent){
  try{
    const data = await callPortal('get_status', {});
    const draftEl = document.getElementById('msgInput');
    const draft = draftEl ? draftEl.value : '';
    STATE.application = data.application;
    STATE.messages = data.messages;
    STATE.files = data.files;
    STATE.invoices = data.invoices || [];
    renderPortal();
    const newDraftEl = document.getElementById('msgInput');
    if(newDraftEl && draft) newDraftEl.value = draft;
    subscribeRealtime();
  }catch(e){
    if(!silent) renderInvalid(e.message || "This link isn't valid.");
  }
}

// Real-time updates without giving the portal's anon key any direct table
// access: the tuner app broadcasts a content-free "something changed" ping
// on a channel keyed to this application's id whenever it sends a message,
// uploads a file, or changes status. This client just listens for the ping
// and re-fetches through the SAME token-gated edge function every other
// portal action already uses - no RLS relaxation needed for realtime to work.
function subscribeRealtime(){
  if(STATE._channel || !STATE.application || !STATE.application.id) return;
  STATE._channel = sb.channel('tuning-portal-' + STATE.application.id)
    .on('broadcast', { event: 'update' }, function(){ loadStatus(true); })
    .subscribe();
}

// Belt-and-suspenders fallback in case a broadcast is ever missed (a brief
// connection drop, a tab that was asleep, etc.) - quiet periodic refresh.
setInterval(function(){ if(STATE.application) loadStatus(true); }, 25000);

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  const errEl = document.getElementById('msgErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!body){ errEl.className = 'status-msg err'; errEl.textContent = 'Write a message first.'; return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('send_message', { body: body });
    STATE.messages.push(data.message);
    input.value = '';
    document.getElementById('msgList').innerHTML = renderMessages();
    document.getElementById('msgList').scrollTop = document.getElementById('msgList').scrollHeight;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Send Message';
}
window.sendMessage = sendMessage;

async function uploadLog(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  const errEl = document.getElementById('uploadErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!file){ errEl.className = 'status-msg err'; errEl.textContent = 'Choose a file first.'; return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;

    const data = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: 'log' });
    STATE.files.unshift(data.file);
    document.getElementById('fileList').innerHTML = renderFiles();
    input.value = '';
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Upload failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Upload';
}
window.uploadLog = uploadLog;

async function downloadFile(fileId){
  try{
    const data = await callPortal('download_file', { file_id: fileId });
    window.open(data.url, '_blank');
  }catch(e){
    alert('Could not open file: ' + e.message);
  }
}
window.downloadFile = downloadFile;

document.addEventListener('DOMContentLoaded', function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if(!TOKEN){
    renderInvalid("This link is missing its access token. Check the link in your original confirmation email.");
    return;
  }
  loadStatus();
});
</script>

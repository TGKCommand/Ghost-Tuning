.tgk-tuning-portal{
  --ink:#1b2529;--slate:#323d41;--orange:#d86000;--orange-d:#b85200;--teal:#30b8b0;--r:4px;
  --hf:"Open Sans Condensed","Arial Narrow","Roboto Condensed",sans-serif;--bf:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --surface:#fff;--surface2:#f8f8f8;--line:#dcdfe1;--line2:#c2c8cb;
  --text:#121212;--text2:#3a4347;--text3:#566166;
  --teal-t:#0b6b62;--orange-t:#a34700;--red-t:#b42318;--green-t:#14683a;--amber-t:#7a4a00;
  --teal-bg:#e3f5f3;--orange-bg:#fdeee0;--red-bg:#fdecea;--amber-bg:#fff3de;--grey-bg:#f1f3f4;
  --star-off:#858f98;--field-line:#8c969b;
  --border:#dcdfe1;--border2:#c2c8cb;--bg:#fff;--bg2:#f8f8f8;--bg3:#f1f3f4;--navy:#121212;
  font-family:var(--bf);color:var(--text);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;position:relative;
}
.tgk-tuning-portal h1,.tgk-tuning-portal h2,.tgk-tuning-portal h3,.tgk-tuning-portal p{margin:0;padding:0}
.tgk-tuning-portal [hidden]{display:none!important}
/* light text on the dark bands: a layer of its own gives clean grey-scale text smoothing instead of coloured fringes */
.tgk-tuning-portal .site-head,.tgk-tuning-portal #idBar,.tgk-tuning-portal .site-foot{will-change:opacity}

/* ===== the site header, menu bar and footer ===== */
.tgk-tuning-portal .site-head{background:var(--ink);color:#fff}
.tgk-tuning-portal .site-head-in{max-width:1180px;margin:0 auto;padding:0 16px;min-height:62px;display:flex;align-items:center;gap:14px}
.tgk-tuning-portal .site-head .logo{height:26px;width:auto;display:block}
.tgk-tuning-portal .brand-sep{width:1px;height:24px;background:#4b575c}
.tgk-tuning-portal .brand-sub{display:flex;align-items:center;gap:8px;font:700 21px/1 var(--hf);letter-spacing:.01em;color:#fff}
.tgk-tuning-portal .brand-sub .ghost-icon{width:26px;height:26px;display:block}
.tgk-tuning-portal .head-link{margin-left:auto;color:#d3dbde;font-size:15px;font-weight:700;text-decoration:none}
.tgk-tuning-portal .head-link:hover{color:#fff;text-decoration:underline}
.tgk-tuning-portal #idBar{background:var(--slate);color:#fff}
.tgk-tuning-portal #idBar:empty{display:none}
.tgk-tuning-portal .id-in{max-width:1180px;margin:0 auto;padding:7px 16px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:4px 18px;flex-wrap:wrap}
.tgk-tuning-portal .id-left{display:flex;align-items:baseline;gap:2px 14px;flex-wrap:wrap}
.tgk-tuning-portal .id-title{font:700 19px/1.2 var(--hf);letter-spacing:.01em;color:#fff}
.tgk-tuning-portal .id-sub{font-size:15px;color:#d3dbde}
.tgk-tuning-portal .id-state{display:flex;align-items:center;gap:8px;font:700 14.5px var(--bf);letter-spacing:.05em;text-transform:uppercase}
.tgk-tuning-portal .id-state i{width:9px;height:9px;background:var(--status-accent,var(--orange));display:inline-block;flex:none}
.tgk-tuning-portal .hero-live{margin-left:6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9fb4b8}
.tgk-tuning-portal .site-foot{background:var(--ink);color:#c3ccd0;margin-top:8px}
.tgk-tuning-portal .site-foot-in{max-width:1180px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;font-size:14.5px}
.tgk-tuning-portal .site-foot .footer-note{margin:0;text-align:left;font-size:14.5px;color:#c3ccd0}
.tgk-tuning-portal .site-foot a{color:#fff;font-weight:700;text-decoration:none}
.tgk-tuning-portal .site-foot a:hover{text-decoration:underline}

/* ===== the dashboard frame ===== */
.tgk-tuning-portal .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 24px}
.tgk-tuning-portal .skeleton{padding:50px 10px;text-align:center;color:var(--text3);font-size:15px}
.tgk-tuning-portal .dash{display:grid;grid-template-columns:216px minmax(0,1fr);border:1px solid var(--line2);background:#fff;align-items:start}
.tgk-tuning-portal .side{background:var(--surface2);border-right:1px solid var(--line);align-self:stretch}
.tgk-tuning-portal .ptabs{display:flex;flex-direction:column;padding:6px 0;position:sticky;top:0}
.tgk-tuning-portal .ptab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 16px 0 13px;border:0;border-left:3px solid transparent;border-radius:0;background:none;color:var(--text2);font:700 16px var(--bf);text-align:left;cursor:pointer}
.tgk-tuning-portal .ptab:hover{background:#eef0f1;color:var(--text)}
.tgk-tuning-portal .ptab.active{background:#fff;border-left-color:var(--orange);color:var(--text)}
.tgk-tuning-portal .ptab:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.tgk-tuning-portal .ptab-badge{color:var(--orange-t);font:700 16px var(--bf)}
.tgk-tuning-portal .nav-sep{height:1px;background:var(--line);margin:6px 0}
.tgk-tuning-portal .main{min-width:0}
.tgk-tuning-portal .view-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.tgk-tuning-portal .view-title{font:700 27px/1.1 var(--hf);color:var(--text)}
.tgk-tuning-portal .view-sub{font-size:15px;color:var(--text3)}
.tgk-tuning-portal .ptab-body{padding:16px 18px 20px}

/* ===== status panel (Overview) ===== */
.tgk-tuning-portal .status-panel{padding:14px 18px 16px;border-bottom:1px solid var(--line)}
.tgk-tuning-portal .stage-chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.tgk-tuning-portal .sc{display:flex;flex-direction:column;gap:6px;min-width:0;color:#66727a;font:700 12.5px var(--bf);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgk-tuning-portal .sc i{display:block;height:8px;background:#d9dde0;font-size:0;font-style:normal}
.tgk-tuning-portal .sc.done{color:var(--text2)}
.tgk-tuning-portal .sc.done i{background:var(--teal)}
.tgk-tuning-portal .sc.current{color:var(--text)}
.tgk-tuning-portal .sc.current i{background:var(--orange)}
.tgk-tuning-portal .cl-meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap;margin-top:10px}
.tgk-tuning-portal .status-blurb{font-size:15.5px;color:var(--text2);line-height:1.45;flex:1 1 320px}
.tgk-tuning-portal .queue-line{font-size:14.5px;color:var(--text3)}
.tgk-tuning-portal .queue-num{font:700 17px var(--hf);color:var(--teal-t)}
.tgk-tuning-portal .next-step{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:12px;padding:9px 10px 9px 14px;background:var(--slate);color:#fff;border-left:4px solid var(--orange)}
.tgk-tuning-portal .next-step.ns-wait{border-left-color:var(--teal)}
.tgk-tuning-portal .next-step.bleed{margin:0;border-bottom:1px solid var(--line)}
.tgk-tuning-portal .ns-kicker{flex:none;font:700 12.5px var(--bf);letter-spacing:.1em;text-transform:uppercase;color:#ffb36b}
.tgk-tuning-portal .ns-wait .ns-kicker{color:#8fe3dc}
.tgk-tuning-portal .ns-text{flex:1 1 260px;font-size:15.5px;line-height:1.4;color:#fff}
.tgk-tuning-portal .ns-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tgk-tuning-portal .action-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tgk-tuning-portal .action-label{display:none}
.tgk-tuning-portal .revision-cta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tgk-tuning-portal .revision-cta.open{display:block}
.tgk-tuning-portal .rev-hint{font-size:15px;color:var(--text3)}
.tgk-tuning-portal .rev-used{margin-left:auto;font-size:14.5px;font-weight:700;color:var(--text3)}

/* ===== readouts and panels (Overview) ===== */
.tgk-tuning-portal .readouts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.tgk-tuning-portal .rd{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0;padding:11px 16px 12px;border:0;border-right:1px solid var(--line);border-radius:0;background:#fff;text-align:left;cursor:pointer;font:inherit;color:var(--text)}
.tgk-tuning-portal .rd:last-child{border-right:0}
.tgk-tuning-portal .rd:hover{background:var(--surface2)}
.tgk-tuning-portal .rd:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.tgk-tuning-portal .rd-k{font:700 12px var(--bf);letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.tgk-tuning-portal .rd-v{font:700 31px/1.1 var(--hf);color:var(--text);margin-top:2px;white-space:nowrap}
.tgk-tuning-portal .rd-v small{font:700 14px var(--bf);letter-spacing:.05em;color:var(--text3)}
.tgk-tuning-portal .rd-s{font-size:14px;color:var(--text3);margin-top:1px}
.tgk-tuning-portal .rd.warn .rd-v{color:var(--orange-t)}
.tgk-tuning-portal .rd.good .rd-v{color:var(--teal-t)}
.tgk-tuning-portal .cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.tgk-tuning-portal .cell{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tgk-tuning-portal .cell:nth-child(2n){border-right:0}
.tgk-tuning-portal .cell:nth-last-child(-n+2){border-bottom:0}
.tgk-tuning-portal .cell-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tgk-tuning-portal .cell-title{font:700 18px/1.2 var(--hf);color:var(--text)}
.tgk-tuning-portal .cell-link{padding:2px 0;border:0;background:none;color:var(--teal-t);font:700 15px var(--bf);cursor:pointer;text-decoration:none}
.tgk-tuning-portal .cell-link:hover{text-decoration:underline}
.tgk-tuning-portal .cell-link:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.tgk-tuning-portal .cell-body{padding:12px 14px 14px}
.tgk-tuning-portal .cell .tune-hero{flex-direction:column;align-items:stretch;border:0;box-shadow:none;background:none;padding:0}
.tgk-tuning-portal .cell .tune-hero.empty{border:1px dashed var(--line2);padding:14px}
.tgk-tuning-portal .cell .th-actions{flex-direction:row;flex-wrap:wrap}
.tgk-tuning-portal .w-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tgk-tuning-portal .w-row:first-child{border-top:0;padding-top:0}
.tgk-tuning-portal .w-amt{font:700 25px/1.1 var(--hf);color:var(--text)}
.tgk-tuning-portal .w-amt small{font:700 14px var(--bf);color:var(--text3);letter-spacing:.04em}
.tgk-tuning-portal .w-meta{font-size:14.5px;color:var(--text3)}
.tgk-tuning-portal .w-msg{padding:7px 0;border-top:1px solid var(--line)}
.tgk-tuning-portal .w-msg:first-child{border-top:0;padding-top:0}
.tgk-tuning-portal .w-msg-who{font:700 12px var(--bf);letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.tgk-tuning-portal .w-msg-body{font-size:15.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgk-tuning-portal .w-stats{display:grid;grid-template-columns:1fr 1fr;margin-bottom:10px}
.tgk-tuning-portal .w-stats b{display:block;font:700 28px/1.1 var(--hf)}
.tgk-tuning-portal .w-stats span{font:700 12px var(--bf);letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.tgk-tuning-portal .w-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tgk-tuning-portal .main>.card{margin:14px 18px}

/* ===== panels, headings, badges ===== */
.tgk-tuning-portal .card{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:12px}
.tgk-tuning-portal .wrap>.card{max-width:560px;margin:24px auto}
.tgk-tuning-portal .card h1{font:700 26px/1.1 var(--hf);color:var(--text);margin-bottom:6px}
.tgk-tuning-portal h2{display:flex;align-items:center;gap:8px;font:700 19px/1.2 var(--hf);letter-spacing:.01em;color:var(--text);padding:0 0 6px;border-bottom:1px solid var(--line);margin:0 0 10px}
.tgk-tuning-portal h2::before{content:"";flex:none;width:4px;height:15px;background:var(--orange)}
.tgk-tuning-portal .sub{font-size:15px;color:var(--text3);margin-bottom:4px}
.tgk-tuning-portal .car-line{font-size:15.5px;font-weight:700;color:var(--text);margin-top:4px}
.tgk-tuning-portal .pill{display:inline-flex;align-items:center;padding:1px 8px;font:700 12px var(--bf);letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent;border-radius:2px;line-height:1.5}
.tgk-tuning-portal .pill-teal,.tgk-tuning-portal .pill-green{background:var(--teal-bg);color:var(--teal-t);border-color:#9bd8d2}
.tgk-tuning-portal .pill-orange{background:var(--orange-bg);color:var(--orange-t);border-color:#f0b98a}
.tgk-tuning-portal .pill-red{background:var(--red-bg);color:var(--red-t);border-color:#f0aaa4}
.tgk-tuning-portal .pill-yellow{background:var(--amber-bg);color:var(--amber-t);border-color:#efc77f}
.tgk-tuning-portal .pill-muted{background:var(--grey-bg);color:var(--text3);border-color:var(--line2)}

/* ===== buttons (the site's: orange, bold uppercase) ===== */
.tgk-tuning-portal .btn,.tgk-tuning-portal .action-chip,.tgk-tuning-portal .ns-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border:1px solid var(--orange);border-radius:var(--r);background:var(--orange);color:#fff;font:700 14.5px var(--bf);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s}
.tgk-tuning-portal .btn:hover,.tgk-tuning-portal .action-chip:hover,.tgk-tuning-portal .ns-btn:hover{background:var(--orange-d);border-color:var(--orange-d)}
.tgk-tuning-portal .btn:focus-visible,.tgk-tuning-portal .action-chip:focus-visible,.tgk-tuning-portal .ns-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tgk-tuning-portal .next-step .action-chip:focus-visible,.tgk-tuning-portal .next-step .ns-btn:focus-visible{outline-color:#fff}
.tgk-tuning-portal .btn:disabled{opacity:.5;cursor:not-allowed}
.tgk-tuning-portal .btn-sm{min-height:32px;padding:0 14px;font-size:13.5px;width:auto}
.tgk-tuning-portal .btn.btn-muted,.tgk-tuning-portal .btn.btn-ghost-light{background:#fff;color:var(--text);border-color:var(--text)}
.tgk-tuning-portal .btn.btn-muted:hover,.tgk-tuning-portal .btn.btn-ghost-light:hover{background:var(--grey-bg);border-color:var(--text)}
.tgk-tuning-portal .action-chip,.tgk-tuning-portal .ns-btn{min-height:34px;font-size:14px}

/* ===== form fields ===== */
.tgk-tuning-portal .form-input{width:100%;min-height:38px;background:#fff;border:1px solid var(--field-line);border-radius:var(--r);color:var(--text);padding:7px 10px;font-size:16px;font-family:inherit;outline:none}
.tgk-tuning-portal .form-input::placeholder{color:#6b767c}
.tgk-tuning-portal .form-input:focus{border-color:var(--text);outline:2px solid var(--orange);outline-offset:0}
.tgk-tuning-portal textarea.form-input{resize:vertical;min-height:70px}
.tgk-tuning-portal select.form-input{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='none' stroke='%23121212' stroke-width='2' d='M1 1.6l5 5 5-5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:11px;padding-right:30px;cursor:pointer}
.tgk-tuning-portal .status-msg{display:none;font-size:15px;font-weight:700;border-radius:var(--r);padding:8px 12px;margin-top:10px}
.tgk-tuning-portal .status-msg.err{display:block;background:var(--red-bg);color:var(--red-t);box-shadow:inset 3px 0 0 #d1443a}
.tgk-tuning-portal .status-msg.ok{display:block;background:var(--teal-bg);color:var(--teal-t);box-shadow:inset 3px 0 0 var(--teal)}
.tgk-tuning-portal .rev-label{font:700 12.5px var(--bf);letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:8px 0 4px;display:block}
.tgk-tuning-portal .rev-grid{display:flex;flex-wrap:wrap;margin:0 -4px 8px}
.tgk-tuning-portal .rev-check{display:flex;align-items:center;gap:8px;min-height:32px;font-size:15px;color:var(--text2);cursor:pointer;width:50%;padding:2px 4px}
.tgk-tuning-portal .rev-check input{accent-color:var(--orange);width:17px;height:17px;flex:none}
.tgk-tuning-portal .rev-row{display:flex;gap:10px;margin-bottom:8px}
.tgk-tuning-portal .rev-row>div{flex:1;min-width:0}

/* ===== messages ===== */
.tgk-tuning-portal .msg-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:360px;overflow-y:auto;padding-right:2px}
.tgk-tuning-portal .msg{padding:8px 12px;border:1px solid var(--line);max-width:88%;font-size:15.5px;background:var(--surface2)}
.tgk-tuning-portal .msg-them{align-self:flex-start;border-left:3px solid #aab3b8}
.tgk-tuning-portal .msg-me{background:#f1faf9;align-self:flex-end;margin-left:auto;border-right:3px solid var(--teal)}
.tgk-tuning-portal .msg-system{background:transparent;border:0;align-self:center;font-style:italic;color:var(--text3);font-size:14.5px;max-width:100%;text-align:center}
.tgk-tuning-portal .msg-revision{background:#fdf3f2;align-self:flex-end;margin-left:auto;border-right:3px solid #d1443a}
.tgk-tuning-portal .msg-modupdate{background:#fff8f0;align-self:flex-end;margin-left:auto;border-right:3px solid var(--orange)}
.tgk-tuning-portal .msg-meta{font:700 12px var(--bf);color:var(--text3);margin-bottom:1px;letter-spacing:.08em;text-transform:uppercase}
.tgk-tuning-portal .msg-revision-badge{font:700 12px var(--bf);color:var(--red-t);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1px}
.tgk-tuning-portal .msg-modupdate-badge{font:700 12px var(--bf);color:var(--orange-t);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1px}
.tgk-tuning-portal .msg-body{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.tgk-tuning-portal .empty-state{text-align:center;padding:18px 10px;color:var(--text3);font-size:15px}

/* ===== invoices ===== */
.tgk-tuning-portal .invoice-box{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--orange);padding:10px 14px 12px;margin-bottom:10px}
.tgk-tuning-portal .invoice-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:15.5px}
.tgk-tuning-portal .invoice-line:last-of-type{border-bottom:none}
.tgk-tuning-portal .invoice-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:3px;border-top:1px solid var(--text);font-weight:700}
.tgk-tuning-portal .invoice-total .amt{font:700 24px var(--hf)}
.tgk-tuning-portal .all-paid{color:var(--green-t);font-weight:700;font-size:16px;padding:4px 0}
.tgk-tuning-portal .paid-row{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--teal);margin-bottom:6px;cursor:pointer}
.tgk-tuning-portal .paid-sum{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;font-size:15.5px}
.tgk-tuning-portal .paid-row .chev{color:var(--text3)}
.tgk-tuning-portal .paid-row.open .chev{transform:rotate(180deg)}
.tgk-tuning-portal .paid-detail{display:none;padding:0 12px 6px;border-top:1px dashed var(--line2)}
.tgk-tuning-portal .paid-row.open .paid-detail{display:block}

/* ===== files ===== */

  const body = Object.assign({ action: action, token: TOKEN }, extra || {});
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-portal', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(!data.success) throw new Error(data.error || 'Request failed');
  return data;
}

async function submitRevisionRequest(){
  const btn = document.getElementById('revisionSubmitBtn');
  const errEl = document.getElementById('revisionErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  function fail(msg){ errEl.className = 'status-msg err'; errEl.textContent = msg; }

  const complaints = Array.prototype.slice.call(document.querySelectorAll('input[name="revComplaint"]:checked')).map(function(c){ return c.value; });
  const fuel = document.getElementById('revFuel').value;
  const ethanolRaw = document.getElementById('revEthanol').value;
  const conditions = document.getElementById('revConditions').value.trim();
  const notes = document.getElementById('revisionNotes').value.trim();
  const file = document.getElementById('revLogFile').files[0];

  if(!complaints.length) return fail('Pick at least one issue.');
  if(!fuel) return fail('Select the fuel you\'re running.');
  if(!file) return fail('Attach a datalog - your tuner needs it to diagnose the issue.');
  if(file.size > MAX_UPLOAD_MB * 1048576) return fail('That file is too large (the limit is ' + MAX_UPLOAD_MB + ' MB).');
  const ethanol = ethanolRaw === '' ? null : Number(ethanolRaw);
  if(ethanol !== null && (isNaN(ethanol) || ethanol < 0 || ethanol > 100)) return fail('Ethanol % must be between 0 and 100.');

  btn.disabled = true; btn.textContent = 'Uploading log...';
  uploadStart(file, 'revProgress');
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;
    const up = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: 'log' });
    if(up.file) STATE.files.unshift(up.file);

    uploadEnd();
    btn.textContent = 'Submitting...';
    const data = await callPortal('request_revision', {
      complaints: complaints, fuel: fuel, ethanol_pct: ethanol,
      conditions: conditions, notes: notes, log_file_id: up.file ? up.file.id : null
    });
    STATE.application = data.application;
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Revision request sent - your tuner has been notified.');
  }catch(e){
    uploadEnd();
    fail('Failed to submit: ' + e.message);
    btn.disabled = false; btn.textContent = 'Submit Revision Request';
  }
}
window.submitRevisionRequest = submitRevisionRequest;

// A styled file picker: the real <input type="file"> is visually hidden
// inside a drop zone, so the page never shows the browser's native
// "Browse..." button. Supports drag-and-drop; shows the chosen file with
// its size and a remove control.
function fileDropHtml(id, dark, enableBtnId){
  return '<label class="dropzone' + (dark ? ' dark' : '') + '" id="dz-' + id + '" data-input="' + id + '"' + (enableBtnId ? ' data-btn="' + enableBtnId + '"' : '') + '>'
    + '<input type="file" id="' + id + '" class="dz-input" onchange="dzChanged(\'' + id + '\')">'
    + '<span class="dz-empty"><span class="dz-strong">Drop a file here</span> or <span class="dz-link">browse</span></span>'
    + '<span class="dz-file"><span class="dz-name"></span><span class="dz-size"></span>'
    + '<button type="button" class="dz-clear" title="Remove" onclick="event.preventDefault();dzClear(\'' + id + '\')">&times;</button></span>'
    + '</label>';
}
// While a file is going up: say so, and stop the browser closing the page by accident.
let UPLOAD_GUARD = null;
function uploadStart(file, elId){
  const el = elId && document.getElementById(elId);
  if(el){ el.hidden = false; el.querySelector('.up-text').textContent = 'Uploading ' + file.name + ' (' + fmtBytes(file.size) + ') - please keep this page open.'; }
  if(!UPLOAD_GUARD){ UPLOAD_GUARD = function(e){ e.preventDefault(); e.returnValue = ''; }; window.addEventListener('beforeunload', UPLOAD_GUARD); }
}
function uploadEnd(){
  ['uploadProgress','revProgress'].forEach(function(id){ const el = document.getElementById(id); if(el) el.hidden = true; });
  if(UPLOAD_GUARD){ window.removeEventListener('beforeunload', UPLOAD_GUARD); UPLOAD_GUARD = null; }
}
function fmtBytes(n){ return n < 1024 ? n + ' B' : (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'); }
function dzChanged(id){
  const input = document.getElementById(id), zone = document.getElementById('dz-' + id);
  if(!input || !zone) return;
  const f = input.files && input.files[0];
  zone.classList.toggle('has-file', !!f);
  if(f){
    zone.querySelector('.dz-name').textContent = f.name;
    zone.querySelector('.dz-size').textContent = fmtBytes(f.size);
  }
  const btn = zone.getAttribute('data-btn') && document.getElementById(zone.getAttribute('data-btn'));
  if(btn) btn.disabled = !f;
}
window.dzChanged = dzChanged;
function dzClear(id){
  const input = document.getElementById(id);
  if(input){ input.value = ''; dzChanged(id); }
}
window.dzClear = dzClear;
function wireDropzones(){
  document.querySelectorAll('.dropzone').forEach(function(zone){
    if(zone._wired) return;
    zone._wired = true;
    ['dragenter','dragover'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      const id = zone.getAttribute('data-input');
      const input = document.getElementById(id);
      if(input && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        try{ input.files = e.dataTransfer.files; }catch(err){ /* very old browser: fall back to browse */ }
        dzChanged(id);
      }
    });
  });
}

let SEEN_MEM = '';
function seenKey(){ return 'tgk_portal_seen_' + (STATE.application ? STATE.application.id : ''); }
function lastSeenAt(){ try{ return localStorage.getItem(seenKey()) || SEEN_MEM; }catch(e){ return SEEN_MEM; } }

function nextStepInfo(a){

  if(s === 'archived') return { act:false, t:'This application is archived. Message us if you need anything.' };
  if(s === 'needs_info') return { act:true, t:'We need an answer from you. Reply in Messages so we can keep going.', tab:'messages', cta:'Open messages' };
  if(needsBaselineLog(a)) return { act:true, t:'Record and upload your baseline (stock) datalog - your tune cannot start without it.', tab: STATE.logGuide ? 'logging' : 'files', cta: STATE.logGuide ? 'See how to log' : 'Upload your log' };
  const unpaid = unpaidInvoices();
  if(unpaid.length) return { act:true, t:'Pay your open invoice so we can keep your tune moving.', tab:'invoices', cta:'Go to invoices' };
  if(s === 'tune_sent') return { act:true, t:'Download your tune from Files and flash it, then tap "I\'ve flashed this". If anything feels wrong, request a revision.', tab: hasFlashGuide(a) ? 'flash' : 'files', cta: hasFlashGuide(a) ? 'How to flash' : 'Open files' };
  if(s === 'completed') return a.review_rating ? { act:false, t:'All done - thank you! Message us any time if you have questions.' } : { act:true, t:'Your tune is complete. Tell us how we did.', review:true, cta:'Leave a review' };
  if(s === 'revision_requested') return { act:false, t:'Nothing needed from you. Your tuner is reviewing your revision request and will reply here.' };

function renderFilesTab(){
  const closed = ['declined','archived'].indexOf((STATE.application || {}).status) !== -1;
  const tunes = STATE.files.filter(function(f){ return f.uploaded_by === 'tuner' && f.file_type === 'tune'; })
    .sort(function(x, y){
      const rx = x.revision_number || 0, ry = y.revision_number || 0;
      if(rx !== ry) return ry - rx;
      return new Date(y.created_at) - new Date(x.created_at);
    });
  const cur = tunes.find(function(f){ return f.is_current; }) || tunes[0];
  const earlier = tunes.filter(function(f){ return f !== cur; });
  const mine = STATE.files.filter(function(f){ return f.uploaded_by === 'customer'; });
  const fromTuner = STATE.files.filter(function(f){ return f.uploaded_by === 'tuner' && f.file_type !== 'tune'; });

  let html = '<div id="fileList">';

  // 1. The tune on the car
  html += '<div class="fs-title">Your tune</div>' + renderCurrentTuneCard(tunes, closed);

  // 2. Send a file
  html += '<div class="fs-block">';
  html += '<div class="upload-head"><span class="fs-title" style="margin:0">Send a file to your tuner</span>'
    + '<div class="seg" role="group" aria-label="File type">'
    + [['log','Datalog'],['dyno','Dyno sheet'],['other','Other']].map(function(t, i){
        return '<button type="button" class="seg-btn' + (i === 0 ? ' on' : '') + '" data-val="' + t[0] + '" onclick="setUploadType(this)">' + t[1] + '</button>';
      }).join('')
    + '</div><input type="hidden" id="fileTypeSelect" value="log"></div>';
  html += fileDropHtml('fileInput', false, 'uploadBtn');
  html += '<div class="dz-hint">Datalogs, dyno sheets and other files - up to ' + MAX_UPLOAD_MB + ' MB each.</div>';
  html += '<div class="up-progress" id="uploadProgress" hidden><div class="up-bar"><span></span></div><div class="up-text"></div></div>';
  html += '<div class="upload-actions"><button class="btn btn-sm" onclick="uploadLog()" id="uploadBtn" disabled>Upload</button></div>';
  html += '<div class="status-msg" id="uploadErr"></div>';
  html += '</div>';

  // 3. What the customer has sent
  if(mine.length){
    html += '<div class="fs-title">Files you\'ve sent <span class="fs-count">' + mine.length + '</span></div><div class="fs-list">';
    html += mine.map(function(f){
      return '<div class="fs-row">' + fileKindBadge(f)
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(f.file_name) + '</div>'
        + '<div class="file-meta">' + fmtDate(f.created_at) + '</div></div></div>';
    }).join('');
    html += '</div>';
  }

  // 4. Non-tune files from the tuner
  if(fromTuner.length){
    html += '<div class="fs-title">From your tuner <span class="fs-count">' + fromTuner.length + '</span></div><div class="fs-list">';
    html += fromTuner.map(function(f){
      return '<div class="fs-row">' + fileKindBadge(f)
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(f.file_name) + '</div>'
        + '<div class="file-meta">' + fmtDate(f.created_at) + '</div></div>'
        + '<button class="btn btn-sm btn-muted" onclick="downloadFile(\'' + f.id + '\')">Download</button></div>';
    }).join('');
    html += '</div>';
  }

  // 5. Tune history, collapsed
  if(earlier.length){
    html += '<details class="fs-history"><summary>Earlier tune revisions <span class="fs-count">' + earlier.length + '</span></summary><div class="fs-list">';
    html += earlier.map(function(f){
      return '<div class="fs-row fs-rev">'
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(tuneLabel(f)) + (f.fuel ? ' <span class="pill pill-muted">' + escapeHtml(f.fuel) + '</span>' : '') + '</div>'
        + '<div class="file-meta">' + escapeHtml(f.file_name) + ' &middot; ' + fmtDate(f.created_at) + '</div>'
        + (f.description ? '<div class="fs-notes">' + escapeHtml(f.description) + '</div>' : '') + '</div>'
        + '<div class="fs-actions">'
        + (!closed ? '<button class="btn btn-sm btn-muted" id="flashBtn-' + f.id + '" onclick="markFlashed(\'' + f.id + '\')">Mark as flashed</button>' : '')
        + '<button class="btn btn-sm btn-muted" onclick="downloadFile(\'' + f.id + '\')">Download</button></div></div>';
    }).join('');
    html += '</div></details>';
  }

  html += '</div>';
  return html;
}

function renderReadouts(a){

function filesCellBody(){

function renderPortal(){
  const a = STATE.application;
  if(STATE.tab === 'messages') markMessagesSeen();   // the conversation is on screen, so it counts as read
  const tabs = portalTabs(a);
  if(!tabs.some(function(t){ return t.id === STATE.tab; })) STATE.tab = 'overview';
  document.getElementById('idBar').innerHTML = renderIdBar(a);

  let html = '<div class="dash">' + renderSide(tabs) + '<main class="main" id="tabCard">';
  if(STATE.tab === 'overview'){
    html += renderOverview(a);
  } else {
    html += viewHead(STATE.tab) + renderNextStep(a, true) + '<div class="ptab-body">';
    if(STATE.tab === 'messages') html += renderMessagesTab(a);
    else if(STATE.tab === 'files') html += renderFilesTab();
    else if(STATE.tab === 'invoices') html += renderInvoiceCard();
    else if(STATE.tab === 'logging') html += renderLogGuideCard(a);
    else if(STATE.tab === 'flash') html += renderFlashGuide();
    else if(STATE.tab === 'application') html += renderApplicationTab(a);
    else if(STATE.tab === 'settings') html += emailPrefsInner(a);
    else if(STATE.tab === 'help') html += helpInner();
    html += '</div>';
  }
  html += '</main></div>';

  document.getElementById('portalWrap').innerHTML = html;
  const unread = STATE.tab === 'messages' ? 0 : unreadMessageCount();
  document.title = (unread ? '(' + unread + ') ' : '') + BASE_TITLE;

  // Every render fully replaces this DOM (innerHTML), which resets any
  // scrollable element back to its top by default - so without this, an
  // unrelated realtime update (an invoice getting paid, a status change)
  // would silently scroll the customer away from their most recent
  // messages, not just a genuinely new message arriving.
  const list = document.getElementById('msgList');
  if(list) list.scrollTop = list.scrollHeight;
  wireDropzones();
}

      const total = Number(inv.amount || 0).toFixed(2);
      return '<div class="invoice-box" style="margin-bottom:12px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span class="pill pill-yellow">Awaiting Payment</span><span class="sub" style="font-size:12px;margin:0">' + fmtDate(inv.sent_at || inv.created_at) + '</span></div>'
        + invoiceLinesHtml(inv)
        + '<div class="invoice-total"><span>Total</span><span class="amt">' + money(inv.amount) + '</span></div>'
        + (inv.notes ? '<p class="sub" style="margin:8px 0 0;font-size:13px">' + escapeHtml(inv.notes) + '</p>' : '')
        + (inv.invoice_url ? '<div style="margin-top:10px"><a href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener" class="btn" style="text-decoration:none">Pay Invoice - ' + money(inv.amount) + '</a></div>' : '')
        + '</div>';
    }).join('');
  } else {
    html += '<div class="all-paid">&#10003; You\'re all paid up.</div>';
  }

  if(paid.length){
    html += '<h2 style="margin-top:18px">Payment history</h2>';
    html += paid.map(function(inv){
      return '<div class="paid-row" onclick="this.classList.toggle(\'open\')">'
        + '<div class="paid-sum"><span class="pill pill-green">Paid</span><span style="flex:1">' + fmtDate(inv.paid_at || inv.sent_at) + '</span><strong>' + money(inv.amount) + '</strong><span class="chev">&#9662;</span></div>'
        + '<div class="paid-detail">' + invoiceLinesHtml(inv)
        + (inv.invoice_url ? '<div class="rcpt-row"><a class="rcpt" href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">View invoice / receipt</a></div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
  }
  return html;
}

// Shows the tuner-assigned DS1 logging instructions, and - until the
// customer has uploaded one - asks clearly for the baseline log.
function needsBaselineLog(a){
  const myLogs = STATE.files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  return !myLogs.length && ['submitted','under_review','needs_info','accepted'].indexOf(a.status) !== -1;
}
function hasLoggingTab(a){
  if(['declined','archived','completed'].indexOf(a.status) !== -1) return false;
  return !!STATE.logGuide || needsBaselineLog(a);
}
function renderLogGuideCard(a){
  if(!hasLoggingTab(a)) return '';
  const g = STATE.logGuide;
  const myLogs = STATE.files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  const needsBaseline = needsBaselineLog(a);

  let html = '';
  html += '<h2>' + (g ? 'How to log: ' + escapeHtml(g.name) : 'Datalog needed') + '</h2>';
  if(needsBaseline){
    html += '<div class="baseline-banner">Your tuner needs a <strong>baseline (stock) datalog</strong> before your tune can start. '
      + 'Record it following the steps below, then upload it in the Files section.</div>';
  }
  if(g){
    const params = (g.parameters || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if(params.length){
      html += '<div class="sub" style="font-weight:700;color:var(--text2);margin:10px 0 6px">Parameters to log</div>';
      html += '<ul class="log-params">' + params.map(function(p){ return '<li>' + escapeHtml(p) + '</li>'; }).join('') + '</ul>';
    }
    if(g.procedure){
      html += '<div class="sub" style="font-weight:700;color:var(--text2);margin:10px 0 6px">Procedure</div>';
      html += '<div class="log-procedure">' + escapeHtml(g.procedure) + '</div>';
    }
  }
  if(myLogs.length){
    html += '<div class="sub" style="margin-top:12px"><span class="pill pill-green">Log received</span> Latest: ' + escapeHtml(myLogs[0].file_name) + ' &middot; ' + fmtDate(myLogs[0].created_at) + '</div>';
  }
  html += '<div style="margin-top:14px"><button class="btn btn-sm" onclick="setPortalTab(\'files\')">Upload a log</button></div>';
  return html;
}

// Completion review - once the tune is done. Rating + optional comment,
// one per application; after submitting it shows as a thank-you.
function renderReviewCard(a){
  if(a.status !== 'completed') return '';
  if(a.review_rating){
    return '<div class="card"><h2>Your review</h2>'
      + '<div class="review-stars static">' + [1,2,3,4,5].map(function(n){ return '<span class="' + (n <= a.review_rating ? 'on' : '') + '">&#9733;</span>'; }).join('') + '</div>'
      + (a.review_comment ? '<p class="sub" style="margin-top:6px;white-space:pre-wrap">' + escapeHtml(a.review_comment) + '</p>' : '')
      + '<p class="sub" style="margin-top:6px">Thanks for the feedback!</p></div>';
  }
  return '<div class="card" id="reviewCard"><h2>How did we do?</h2>'
    + '<div class="sub" style="margin-bottom:8px">Your tune is complete. Rate your experience with Ghost Tuning.</div>'
    + '<div class="review-stars" id="reviewStars">' + [1,2,3,4,5].map(function(n){ return '<span onclick="setReviewRating(' + n + ')" data-n="' + n + '">&#9733;</span>'; }).join('') + '</div>'
    + '<textarea class="form-input" id="reviewComment" placeholder="Anything you\'d like to share? (optional)" style="margin:10px 0;min-height:60px"></textarea>'
    + '<button class="btn btn-sm" id="reviewBtn" onclick="submitReview()">Submit Review</button>'
    + '<div class="status-msg" id="reviewErr"></div></div>';
}

let REVIEW_RATING = 0;
function setReviewRating(n){
  REVIEW_RATING = n;
  document.querySelectorAll('#reviewStars span').forEach(function(el){
    el.className = Number(el.getAttribute('data-n')) <= n ? 'on' : '';
  });
}
window.setReviewRating = setReviewRating;

async function submitReview(){
  const errEl = document.getElementById('reviewErr');
  const btn = document.getElementById('reviewBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!REVIEW_RATING){ errEl.className = 'status-msg err'; errEl.textContent = 'Pick a star rating first.'; return; }
  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const data = await callPortal('submit_review', { rating: REVIEW_RATING, comment: document.getElementById('reviewComment').value.trim() });
    STATE.application = data.application;
    renderPortal();
    toastLike('Thanks for your review!');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to submit: ' + e.message;
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
}
window.submitReview = submitReview;

function renderMessages(){
  if(!STATE.messages.length) return '<div class="empty-state">No messages yet.</div>';
  return STATE.messages.map(function(m){
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const isModUpdate = m.message_type === 'mod_update';
    const cls = isRevisionRequest ? 'msg-revision' : (isModUpdate ? 'msg-modupdate' : (m.sender_type === 'system' ? 'msg-system' : (m.sender_type === 'customer' ? 'msg-me' : 'msg-them')));
    let html = '<div class="msg ' + cls + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">Revision Request Sent</div>';
    } else if(isModUpdate){
      html += '<div class="msg-modupdate-badge">Mod Update Sent &middot; ' + fmtDate(m.created_at) + '</div>';
    } else if(m.sender_type !== 'system'){
      html += '<div class="msg-meta">' + (m.sender_type === 'customer' ? 'You' : 'Ghost Tuning') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div></div>';
    return html;
  }).join('');
}

// Customer tells the tuner which revision is actually on the car. Updates
// the tuner's dashboard live and is logged there with who set it.
async function markFlashed(fileId){
  const f = STATE.files.find(function(x){ return x.id === fileId; });
  const label = f && f.revision_number ? 'Revision ' + f.revision_number : (f ? f.file_name : 'this tune');
  if(!confirm('Mark ' + label + ' as the tune currently flashed on your car?\n\nYour tuner will be notified.')) return;
  const btn = document.getElementById('flashBtn-' + fileId);
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    const data = await callPortal('set_current_tune', { file_id: fileId });
    if(data.files) STATE.files = data.files;
    renderPortal();
    toastLike(label + ' marked as flashed - your tuner has been notified.');
  }catch(e){
    toastLike('Could not update: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Mark as flashed'; }
  }
}
window.markFlashed = markFlashed;


// Mid-project setup changes (new parts, different fuel) - flagged to the
// tuner so the next revision is built for what's actually on the car.
function showModUpdateForm(){
  const el = document.getElementById('modUpdateBox');
  if(!el) return;
  el.innerHTML = '<div class="sub" style="margin-bottom:6px">What changed on the car? Your tuner will be notified.</div>'
    + '<textarea class="form-input" id="modChanges" placeholder="e.g. Installed catless downpipes, switched to E40" style="margin-bottom:10px;min-height:60px"></textarea>'
    + '<div style="display:flex;gap:8px"><button class="btn btn-sm" id="modSubmitBtn" onclick="submitModUpdate()">Send Update</button>'
    + '<button class="btn btn-sm btn-muted" onclick="hideModUpdateForm()">Cancel</button></div>'
    + '<div class="status-msg" id="modErr"></div>';
}
window.showModUpdateForm = showModUpdateForm;
function hideModUpdateForm(){
  const el = document.getElementById('modUpdateBox');
  if(el) el.innerHTML = '<button class="btn btn-sm btn-muted" onclick="showModUpdateForm()">Changed your mods? Let your tuner know</button>';
}
window.hideModUpdateForm = hideModUpdateForm;

async function submitModUpdate(){
  const changes = document.getElementById('modChanges').value.trim();
  const errEl = document.getElementById('modErr');
  const btn = document.getElementById('modSubmitBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!changes){ errEl.className = 'status-msg err'; errEl.textContent = 'Describe what changed.'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('update_mods', { changes: changes });
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Mod update sent - your tuner has been notified.');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
    btn.disabled = false; btn.textContent = 'Send Update';
  }
}
window.submitModUpdate = submitModUpdate;

function isCustomerEditing(){
  if(document.getElementById('revFuel')) return true;          // revision form open
  if(document.getElementById('modChanges')) return true;       // mod update form open
  const fi = document.getElementById('fileInput');
  if(fi && fi.files && fi.files.length) return true;          // file chosen, not yet uploaded
  const rc = document.getElementById('reviewComment');
  if((rc && rc.value.trim()) || REVIEW_RATING) return true;   // review in progress
  return false;
}

// The conversation is "at the bottom" when the newest message is in view -
// only then should a refresh scroll it down to show new messages. Someone
// scrolled up reading older messages stays where they are.
function msgListAtBottom(list){
  return !list || list.scrollHeight - list.scrollTop - list.clientHeight < 40;
}

// Swap in the latest messages without touching anything else on the page -
// used while the customer is typing, so the message box keeps its focus,
// cursor and text (and a phone keyboard stays open).
function refreshMessageListInPlace(){
  const list = document.getElementById('msgList');
  if(!list) return;
  const html = renderMessages();
  if(list.innerHTML === html) return;
  const atBottom = msgListAtBottom(list), top = list.scrollTop;
  list.innerHTML = html;
  list.scrollTop = atBottom ? list.scrollHeight : top;
}

async function loadStatus(silent){
  try{
    const data = await callPortal('get_status', { silent: !!silent });   // a background refresh must not count as a visit
    // Read what the customer is doing right before deciding how to redraw.
    const draftEl = document.getElementById('msgInput');
    const draft = draftEl ? draftEl.value : '';
    const typing = !!draftEl && document.activeElement === draftEl;
    const tunerBefore = tunerMessageCount();
    STATE.application = data.application;
    STATE.messages = data.messages;
    STATE.files = data.files;
    STATE.invoices = data.invoices || [];
    STATE.logGuide = data.log_guide || null;
    STATE.queue = data.queue || null;
    STATE.timeline = data.timeline || [];
    STATE.flashGuide = data.flash_guide || null;
    STATE.revisions = data.revisions || null;
    if(silent && tunerMessageCount() > tunerBefore && STATE.tab !== 'messages') toastLike('New message from your tuner');
    // A background refresh (25s poll or realtime ping) must never wipe out
    // something the customer is halfway through. The data is updated
    // either way; the re-render just waits until they submit or cancel,
    // both of which re-render on their own.
    if(silent && isCustomerEditing()){ subscribeRealtime(); return; }
    // Typing a message: rebuilding the page would throw them out of the box
    // mid-sentence (and close a phone keyboard). Show new messages in place
    // instead; the full refresh happens on the first one after they leave it.
    if(silent && typing){ refreshMessageListInPlace(); subscribeRealtime(); return; }
    const oldList = document.getElementById('msgList');
    const listAtBottom = msgListAtBottom(oldList), listTop = oldList ? oldList.scrollTop : 0;
    const pageY = window.scrollY;
    renderPortal();
    const newDraftEl = document.getElementById('msgInput');
    if(newDraftEl && draft) newDraftEl.value = draft;
    if(silent){
      // Leave the reader where they were: page position, and the conversation
      // too unless they were already looking at the newest message.
      const newList = document.getElementById('msgList');
      if(newList && oldList && !listAtBottom) newList.scrollTop = listTop;
      if(Math.abs(window.scrollY - pageY) > 1) window.scrollTo(0, pageY);
    }
    subscribeRealtime();
  }catch(e){
    if(!silent) renderInvalid(e.message || "This link isn't valid.");
  }
}

// Real-time updates without giving the portal's anon key any direct table
// access: the tuner app broadcasts a content-free "something changed" ping
// on a channel keyed to this application's id whenever it sends a message,
// uploads a file, or changes status. This client just listens for the ping
// and re-fetches through the SAME token-gated edge function every other
// portal action already uses - no RLS relaxation needed for realtime to work.
function subscribeRealtime(){
  if(STATE._channel || !STATE.application || !STATE.application.id) return;
  STATE._channel = sb.channel('tuning-portal-' + STATE.application.id)
    .on('broadcast', { event: 'update' }, function(){ loadStatus(true); })
    .subscribe();
}

// Belt-and-suspenders fallback in case a broadcast is ever missed (a brief
// connection drop, a tab that was asleep, etc.) - quiet periodic refresh.
setInterval(function(){ if(STATE.application) loadStatus(true); }, 25000);

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  const errEl = document.getElementById('msgErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!body){ errEl.className = 'status-msg err'; errEl.textContent = 'Write a message first.'; return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('send_message', { body: body });
    STATE.messages.push(data.message);
    input.value = '';
    document.getElementById('msgList').innerHTML = renderMessages();
    document.getElementById('msgList').scrollTop = document.getElementById('msgList').scrollHeight;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Send Message';
}
window.sendMessage = sendMessage;

async function uploadLog(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  const errEl = document.getElementById('uploadErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!file){ errEl.className = 'status-msg err'; errEl.textContent = 'Choose a file first.'; return; }
  if(file.size > MAX_UPLOAD_MB * 1048576){ errEl.className = 'status-msg err'; errEl.textContent = 'That file is too large (the limit is ' + MAX_UPLOAD_MB + ' MB).'; return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  uploadStart(file, 'uploadProgress');
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;

    const typeEl = document.getElementById('fileTypeSelect');
    const data = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: typeEl ? typeEl.value : 'log' });
    STATE.files.unshift(data.file);
    // Full re-render so the logging card's baseline banner clears too.
    uploadEnd();
    renderPortal();
    toastLike('Upload complete - your tuner has been notified.');
    return;
  }catch(e){
    uploadEnd();
    errEl.className = 'status-msg err'; errEl.textContent = 'Upload failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Upload';
}
window.uploadLog = uploadLog;

async function downloadFile(fileId){
  try{
    const data = await callPortal('download_file', { file_id: fileId });
    window.open(data.url, '_blank');
  }catch(e){
    alert('Could not open file: ' + e.message);
  }
}
window.downloadFile = downloadFile;

document.addEventListener('DOMContentLoaded', function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if(!TOKEN){
    renderInvalid("This link is missing its access token. Check the link in your original confirmation email.");
    return;
  }
  loadStatus();
});
</script>

html,body{margin:0;padding:0;background:#fff}
.tgk-tuning-portal,.tgk-tuning-portal *,.tgk-tuning-portal *::before,.tgk-tuning-portal *::after{box-sizing:border-box;margin:0;padding:0}
.tgk-tuning-portal{
  --ink:#22272b;--ink2:#171b1f;--ink3:#2b3238;--orange:#e8731c;--orange-d:#f5934a;
  --teal:#39c3b5;--teal-d:#13998c;--line:#3a4249;--r:4px;--r-lg:8px;
  --hf:"Francois One",Impact,"Arial Narrow",sans-serif;--bf:Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(16,20,24,.14),0 14px 30px -16px rgba(16,20,24,.5);
  /* page (white) colours */
  --text:#14171a;--text2:#3c4349;--text3:#5b646b;--border:#c9ccd1;--border2:#c9ccd1;--navy:#14171a;
  --bg:#fff;--bg2:#f3f5f6;--bg3:#e3e6e9;
  --red:#b42318;--green:#14683a;--yellow:#7a4a00;--teal-d:#13998c;
  --red-dim:rgba(180,35,24,.1);--green-dim:rgba(20,104,58,.1);--yellow-dim:rgba(245,165,36,.16);
  font-family:var(--bf);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;position:relative;
}
/* Light text on a dark panel shows coloured fringes when the browser sharpens it with the screen's red/green/blue sub-pixels.
   Putting each dark panel on its own layer makes the browser use clean grey-scale smoothing instead (nothing becomes transparent). */
.tgk-tuning-portal .card,.tgk-tuning-portal .hero-carbon,.tgk-tuning-portal .prefs{will-change:opacity}
/* inside every dark panel the same variables flip to light-on-dark, so the script's own inline styles still read well */
.tgk-tuning-portal .card,.tgk-tuning-portal .hero-carbon,.tgk-tuning-portal .prefs{
  --text:#fff;--text2:#d6dbe0;--text3:#aab3ba;--border:#3a4249;--border2:#6b747c;--navy:#fff;
  --bg:#22272b;--bg2:#2b3238;--bg3:#2b3238;
  --red:#ffb4aa;--green:#aef0e8;--yellow:#ffd48a;--orange-d:#ffb070;--teal-d:#aef0e8;
  --red-dim:rgba(255,107,91,.15);--green-dim:rgba(57,195,181,.16);--yellow-dim:rgba(245,165,36,.16);
  color:#fff;
}
.tgk-tuning-portal h1,.tgk-tuning-portal h2,.tgk-tuning-portal p{margin:0;padding:0}
.tgk-tuning-portal .wrap{max-width:860px;margin:0 auto;padding:8px 16px 80px}
.tgk-tuning-portal .portal-brand{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto;padding:24px 16px 16px}
.tgk-tuning-portal .portal-brand img{height:22px;width:auto;display:block}
.tgk-tuning-portal .portal-brand .ghost-icon{height:26px;width:26px}
.tgk-tuning-portal .portal-brand .brand-sep{width:1px;height:18px;background:#d5d9dd}
.tgk-tuning-portal .portal-brand .brand-sub{font-size:13px;font-weight:700;color:#5b646b;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.tgk-tuning-portal .skeleton{padding:60px 10px;text-align:center;color:#5b646b;font-size:14.5px}
.tgk-tuning-portal [hidden]{display:none!important}

/* ---- status header: a smooth dark gradient; the status colour is the thin bar on its left ---- */
.tgk-tuning-portal .hero-carbon{position:relative;overflow:hidden;margin:0 0 22px;padding:26px 30px 30px;color:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);
  background:radial-gradient(820px 240px at 8% -30%,rgba(57,195,181,.14),rgba(57,195,181,0) 70%),linear-gradient(180deg,#262d33,#161a1e);background-color:#1b1f23}
.tgk-tuning-portal .hero-carbon::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--status-accent,var(--orange))}
.tgk-tuning-portal .hero-carbon::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--teal));opacity:.9}
.tgk-tuning-portal .hero-inner{position:relative}
.tgk-tuning-portal .hero-carbon h1{font-family:var(--hf);font-weight:400;font-size:clamp(24px,4.2vw,36px);line-height:1.08;letter-spacing:.01em;text-transform:uppercase;color:#fff;margin:0}
.tgk-tuning-portal .hero-carbon .sub{font-size:15px;color:#c5ccd2;margin:6px 0 0}
.tgk-tuning-portal .hero-carbon .car-line{color:#fff}
.tgk-tuning-portal .hero-carbon .status-blurb{font-size:15px;color:#d6dbe0;line-height:1.6;margin-top:16px}
.tgk-tuning-portal .hero-live{display:inline-flex;align-items:center;gap:7px;flex:none;font-size:12px;font-weight:800;color:#aef0e8;letter-spacing:.12em;text-transform:uppercase}
.tgk-tuning-portal .live-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(57,195,181,.5);animation:live-pulse 2s infinite}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(57,195,181,.5)}70%{box-shadow:0 0 0 6px rgba(57,195,181,0)}100%{box-shadow:0 0 0 0 rgba(57,195,181,0)}}
@media (prefers-reduced-motion:reduce){.tgk-tuning-portal .live-dot{animation:none}}
.tgk-tuning-portal .queue-line{margin-top:12px;font-size:14px;color:#d6dbe0}
.tgk-tuning-portal .queue-num{font:400 20px var(--hf);color:#aef0e8;letter-spacing:.02em}

/* ---- progress: circles on a rail (finished = teal, current = orange) ---- */
.tgk-tuning-portal .stage-chips{display:flex;margin:24px 0 8px}
.tgk-tuning-portal .sc{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 2px;color:#aab3ba;font:800 11.5px var(--bf);letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.25}
.tgk-tuning-portal .sc::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.18)}
.tgk-tuning-portal .sc:first-child::before{display:none}
.tgk-tuning-portal .sc.done::before,.tgk-tuning-portal .sc.current::before{background:var(--teal)}
.tgk-tuning-portal .sc i{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#1f252a;border:2px solid #56606a;color:#c5ccd2;font:400 14px var(--hf);font-style:normal}
.tgk-tuning-portal .sc.done,.tgk-tuning-portal .sc.current{color:#fff}
.tgk-tuning-portal .sc.done i{background:var(--teal);border-color:var(--teal);color:#14171a}
.tgk-tuning-portal .sc.current i{background:var(--orange);border-color:var(--orange);color:#14171a;box-shadow:0 0 0 4px rgba(232,115,28,.28)}

/* ---- panels ---- */
.tgk-tuning-portal .card{position:relative;background:var(--ink);padding:24px 28px 28px;margin-bottom:20px;border-radius:var(--r-lg);box-shadow:var(--shadow)}
.tgk-tuning-portal .card.tab-card{padding:0;overflow:hidden}
.tgk-tuning-portal .card h1{font-family:var(--hf);font-weight:400;font-size:28px;letter-spacing:.02em;text-transform:uppercase;color:#fff;margin-bottom:8px}
.tgk-tuning-portal h2{position:relative;display:flex;align-items:center;justify-content:space-between;font-family:var(--hf);font-weight:400;font-size:19px;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:0 0 9px 16px;border-bottom:1px solid var(--line);margin:0 0 16px}
.tgk-tuning-portal h2::before{content:"";position:absolute;left:0;top:1px;bottom:10px;width:4px;border-radius:2px;background:var(--teal)}
.tgk-tuning-portal .sub{font-size:14px;color:var(--text3);margin-bottom:6px}
.tgk-tuning-portal .status-blurb{font-size:14px;color:var(--text2);line-height:1.6;margin-top:10px}
.tgk-tuning-portal .car-line{font-size:15px;font-weight:700;color:var(--text);margin-top:6px}

/* ---- status badges ---- */
.tgk-tuning-portal .pill{display:inline-flex;align-items:center;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent;border-radius:3px}
.tgk-tuning-portal .pill-teal{background:rgba(57,195,181,.18);color:#aef0e8;border-color:rgba(57,195,181,.4)}
.tgk-tuning-portal .pill-orange{background:rgba(232,115,28,.2);color:#ffb070;border-color:rgba(232,115,28,.45)}
.tgk-tuning-portal .pill-red{background:rgba(255,107,91,.16);color:#ffb4aa;border-color:rgba(255,107,91,.4)}
.tgk-tuning-portal .pill-green{background:rgba(57,195,181,.18);color:#aef0e8;border-color:rgba(57,195,181,.4)}
.tgk-tuning-portal .pill-yellow{background:rgba(245,165,36,.18);color:#ffd48a;border-color:rgba(245,165,36,.4)}
.tgk-tuning-portal .pill-muted{background:rgba(255,255,255,.08);color:#c5ccd2;border-color:rgba(255,255,255,.18)}

/* ---- buttons ---- */
.tgk-tuning-portal .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border:0;border-radius:var(--r);background:var(--orange);color:#14171a;font:800 13.5px var(--bf);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:background-color .15s,transform .05s}
.tgk-tuning-portal .btn:hover{background:var(--orange-d)}
.tgk-tuning-portal .btn:active{transform:translateY(1px)}
.tgk-tuning-portal .btn:focus-visible,.tgk-tuning-portal .action-chip:focus-visible,.tgk-tuning-portal .ns-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tgk-tuning-portal .btn:disabled{opacity:.5;cursor:not-allowed}
.tgk-tuning-portal .btn-sm{min-height:44px;padding:0 20px;font-size:12.5px;width:auto}
.tgk-tuning-portal .btn.btn-muted,.tgk-tuning-portal .btn.btn-ghost-light{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #7b858d}
.tgk-tuning-portal .btn.btn-muted:hover,.tgk-tuning-portal .btn.btn-ghost-light:hover{background:rgba(255,255,255,.08)}
.tgk-tuning-portal .action-chips{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:18px}
.tgk-tuning-portal .action-label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#aab3ba}
.tgk-tuning-portal .action-chip{min-height:44px;padding:0 20px;border:0;border-radius:var(--r);background:var(--orange);color:#14171a;font:800 12.5px var(--bf);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.28)}
.tgk-tuning-portal .action-chip:hover{background:var(--orange-d)}

/* ---- form fields: white on the dark panel ---- */
.tgk-tuning-portal .form-input{width:100%;min-height:48px;background:#fff;border:1px solid #fff;border-radius:var(--r);color:#14171a;padding:11px 13px;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.tgk-tuning-portal .form-input::placeholder{color:#6b747c}
.tgk-tuning-portal .form-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,115,28,.35)}
.tgk-tuning-portal textarea.form-input{resize:vertical;min-height:80px}
.tgk-tuning-portal select.form-input{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='none' stroke='%2314171a' stroke-width='2' d='M1 1.6l5 5 5-5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:12px;padding-right:34px;cursor:pointer}
.tgk-tuning-portal .status-msg{display:none;font-size:14px;font-weight:600;border-radius:var(--r);padding:11px 14px;margin-top:12px}
.tgk-tuning-portal .status-msg.err{display:block;background:rgba(255,107,91,.15);color:#ffb4aa;box-shadow:inset 3px 0 0 #ff6b5b}
.tgk-tuning-portal .status-msg.ok{display:block;background:rgba(57,195,181,.16);color:#aef0e8;box-shadow:inset 3px 0 0 var(--teal)}

/* ---- revision request (inside the status header) ---- */
.tgk-tuning-portal .revision-cta{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.tgk-tuning-portal .rev-label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d6dbe0;margin:6px 0 6px}
.tgk-tuning-portal .rev-grid{display:flex;flex-wrap:wrap;margin:0 -6px 12px}
.tgk-tuning-portal .rev-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:#d6dbe0;cursor:pointer;width:50%;padding:4px 6px}
.tgk-tuning-portal .rev-check input{accent-color:var(--teal);width:18px;height:18px;flex:none}
.tgk-tuning-portal .rev-row{display:flex;gap:12px;margin-bottom:10px}
.tgk-tuning-portal .rev-row>div{flex:1;min-width:0}
.tgk-tuning-portal .revision-cta .rev-input,.tgk-tuning-portal .revision-cta textarea.form-input{background:#fff;color:#14171a;border-color:#fff}
.tgk-tuning-portal .revision-cta select.rev-input option{color:#111}

/* ---- tabs: text tabs with an orange underline ---- */
.tgk-tuning-portal .ptabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px 0 10px;background:var(--ink2);border-left:5px solid var(--orange);-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tgk-tuning-portal .ptab{flex:none;display:flex;align-items:center;gap:8px;min-height:54px;padding:0 16px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:#aab3ba;font:800 12.5px var(--bf);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:color .15s,background-color .15s}
.tgk-tuning-portal .ptab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tgk-tuning-portal .ptab.active{color:#fff;border-bottom-color:var(--orange)}
.tgk-tuning-portal .ptab:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.tgk-tuning-portal .ptab-badge{background:var(--orange);color:#14171a;border-radius:10px;font-size:11px;font-weight:800;padding:0 7px;line-height:18px;min-width:18px;text-align:center}
.tgk-tuning-portal .ptab-body{padding:24px 28px 28px}

/* ---- messages ---- */
.tgk-tuning-portal .msg-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:340px;overflow-y:auto;padding-right:2px}
.tgk-tuning-portal .msg{padding:11px 14px;border-radius:var(--r);max-width:88%;font-size:14.5px}
.tgk-tuning-portal .msg-them{background:var(--ink3);align-self:flex-start;box-shadow:inset 3px 0 0 #56606a}
.tgk-tuning-portal .msg-me{background:rgba(57,195,181,.16);align-self:flex-end;margin-left:auto;box-shadow:inset -3px 0 0 var(--teal)}
.tgk-tuning-portal .msg-system{background:transparent;align-self:center;font-style:italic;color:var(--text3);font-size:13px;max-width:100%;text-align:center}
.tgk-tuning-portal .msg-revision{background:rgba(255,107,91,.15);align-self:flex-end;margin-left:auto;box-shadow:inset -3px 0 0 #ff6b5b}
.tgk-tuning-portal .msg-modupdate{background:rgba(232,115,28,.16);align-self:flex-end;margin-left:auto;box-shadow:inset -3px 0 0 var(--orange)}
.tgk-tuning-portal .msg-meta{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .msg-revision-badge{font-weight:800;font-size:12px;color:#ffb4aa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.tgk-tuning-portal .msg-modupdate-badge{font-weight:800;font-size:12px;color:#ffb070;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.tgk-tuning-portal .msg-body{white-space:pre-wrap;word-break:break-word;line-height:1.55}
.tgk-tuning-portal .empty-state{text-align:center;padding:24px 10px;color:var(--text3);font-size:14px}

/* ---- invoices ---- */
.tgk-tuning-portal .invoice-box{background:var(--ink3);border:0;border-radius:var(--r);box-shadow:inset 4px 0 0 var(--orange);padding:16px 20px;margin-bottom:12px}
.tgk-tuning-portal .invoice-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .invoice-line:last-of-type{border-bottom:none}
.tgk-tuning-portal .invoice-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:1px solid #fff;font-weight:700;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .invoice-total .amt{font:400 26px var(--hf);letter-spacing:.02em}
.tgk-tuning-portal .all-paid{color:#aef0e8;font-weight:800;font-size:15px;padding:6px 0 4px}
.tgk-tuning-portal .paid-row{background:var(--ink3);border:0;border-radius:var(--r);box-shadow:inset 4px 0 0 var(--teal);margin-bottom:8px;cursor:pointer}
.tgk-tuning-portal .paid-sum{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 16px 10px 20px;font-size:14.5px;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .paid-row .chev{color:var(--text3);transition:transform .15s}
.tgk-tuning-portal .paid-row.open .chev{transform:rotate(180deg)}
.tgk-tuning-portal .paid-detail{display:none;padding:0 16px 10px 20px;border-top:1px dashed var(--line)}
.tgk-tuning-portal .paid-row.open .paid-detail{display:block}

/* ---- files ---- */
.tgk-tuning-portal .fs-title{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#d6dbe0}
.tgk-tuning-portal #fileList>.fs-title:first-child{margin-top:0}
.tgk-tuning-portal .fs-count{font-size:11px;font-weight:800;color:#d6dbe0;background:var(--ink3);border:1px solid var(--line);border-radius:9px;padding:0 8px;line-height:18px;letter-spacing:0}
.tgk-tuning-portal .tune-hero{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--ink3);border:0;border-radius:var(--r);box-shadow:inset 4px 0 0 var(--teal);padding:18px 20px 18px 24px}
.tgk-tuning-portal .tune-hero.not-marked{box-shadow:inset 4px 0 0 var(--orange)}
.tgk-tuning-portal .tune-hero.empty{display:block;background:transparent;box-shadow:none;border:1px dashed #56606a;text-align:center;padding:22px}
.tgk-tuning-portal .th-empty-title{font:400 20px var(--hf);letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.tgk-tuning-portal .th-main{flex:1;min-width:0}
.tgk-tuning-portal .th-main .file-meta,.tgk-tuning-portal .fs-info .file-meta{overflow-wrap:anywhere;word-break:break-word}
.tgk-tuning-portal .th-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#aef0e8;margin-bottom:3px}
.tgk-tuning-portal .not-marked .th-kicker{color:#ffb070}
.tgk-tuning-portal .th-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:400 26px/1.1 var(--hf);letter-spacing:.02em;text-transform:uppercase;color:#fff}
.tgk-tuning-portal .th-marked{font-size:13px;color:#aef0e8;font-weight:700;margin-top:4px}
.tgk-tuning-portal .th-unmarked{font-size:13px;color:#ffb070;font-weight:700;margin-top:4px}
.tgk-tuning-portal .th-notes{margin-top:12px;font-size:14px;color:#d6dbe0;background:rgba(0,0,0,.22);border-radius:var(--r);box-shadow:inset 3px 0 0 #56606a;padding:10px 14px;white-space:pre-wrap}
.tgk-tuning-portal .th-notes span{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#aab3ba;margin-bottom:2px}
.tgk-tuning-portal .th-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.tgk-tuning-portal .fs-block{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.tgk-tuning-portal .fs-list{background:var(--ink3);border:0;border-radius:var(--r);overflow:hidden}
.tgk-tuning-portal .fs-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.tgk-tuning-portal .fs-row:first-child{border-top:none}
.tgk-tuning-portal .fs-info{flex:1;min-width:0}
.tgk-tuning-portal .fs-name{font-weight:700;font-size:14.5px;color:#fff;overflow-wrap:anywhere}
.tgk-tuning-portal .fs-notes{font-size:13px;color:#d6dbe0;margin-top:3px;white-space:pre-wrap}
.tgk-tuning-portal .fs-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tgk-tuning-portal .file-meta{font-size:12.5px;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .file-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tgk-tuning-portal .file-row:last-child{border-bottom:none}
.tgk-tuning-portal .file-name{font-weight:700;font-size:14.5px}
.tgk-tuning-portal .fk-badge{flex-shrink:0;width:48px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;padding:5px 0;border-radius:3px}
.tgk-tuning-portal .fk-log{background:rgba(232,115,28,.22);color:#ffb070}
.tgk-tuning-portal .fk-dyno{background:rgba(57,195,181,.22);color:#aef0e8}
.tgk-tuning-portal .fk-file{background:rgba(255,255,255,.1);color:#d6dbe0}
.tgk-tuning-portal .fs-history{margin-top:24px}
.tgk-tuning-portal .fs-history>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#d6dbe0;margin-bottom:6px}
.tgk-tuning-portal .fs-history>summary::-webkit-details-marker{display:none}
.tgk-tuning-portal .fs-history>summary::after{content:'Show';margin-left:auto;font-size:12px;letter-spacing:.04em;text-transform:none;color:#aef0e8;font-weight:700}
.tgk-tuning-portal .fs-history[open]>summary::after{content:'Hide'}
.tgk-tuning-portal .fs-history>summary:focus-visible,.tgk-tuning-portal .prefs>summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tgk-tuning-portal .tune-version.is-current{box-shadow:inset 3px 0 0 var(--teal);padding-left:12px}
.tgk-tuning-portal .tune-changelog{font-size:13px;color:#d6dbe0;margin-top:4px;white-space:pre-wrap}
.tgk-tuning-portal .tv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tgk-tuning-portal .tv-info{flex:1;min-width:0}
.tgk-tuning-portal .tv-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tgk-tuning-portal .tv-marked{font-size:13px;color:#aef0e8;margin-top:2px;font-weight:700}

/* ---- sending a file ---- */
.tgk-tuning-portal .upload-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tgk-tuning-portal .upload-title{font-size:13px;font-weight:800;color:#d6dbe0}
.tgk-tuning-portal .upload-actions{display:flex;justify-content:flex-end;margin-top:12px}
.tgk-tuning-portal .seg{display:inline-flex;gap:4px;background:transparent;border:0;padding:0}
.tgk-tuning-portal .seg-btn{min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:var(--r);background:var(--ink3);color:#d6dbe0;font:800 12px var(--bf);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;line-height:1.4}
.tgk-tuning-portal .seg-btn:hover{background:#363e45}
.tgk-tuning-portal .seg-btn.on{border-color:var(--teal);background:rgba(57,195,181,.16);color:#fff;box-shadow:none}
.tgk-tuning-portal .seg-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tgk-tuning-portal .dropzone{display:flex;align-items:center;justify-content:center;min-height:64px;border:1px dashed #7b858d;border-radius:var(--r-lg);background:var(--ink3);padding:12px 16px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;font-size:14px;color:#aab3ba;text-align:center}
.tgk-tuning-portal .dropzone:hover,.tgk-tuning-portal .dropzone.drag{border-color:var(--teal);background:rgba(57,195,181,.14)}
.tgk-tuning-portal .dropzone:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.tgk-tuning-portal .dz-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.tgk-tuning-portal .dz-strong{color:#fff;font-weight:700}
.tgk-tuning-portal .dz-link{color:#aef0e8;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tgk-tuning-portal .dz-file{display:none;align-items:center;gap:10px;width:100%;text-align:left}
.tgk-tuning-portal .dropzone.has-file{border-style:solid;border-color:var(--teal);justify-content:flex-start}
.tgk-tuning-portal .dropzone.has-file .dz-empty{display:none}
.tgk-tuning-portal .dropzone.has-file .dz-file{display:flex}
.tgk-tuning-portal .dz-name{flex:1;min-width:0;color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgk-tuning-portal .dz-size{color:#aab3ba;font-size:12.5px;flex-shrink:0}
.tgk-tuning-portal .dz-clear{min-width:44px;min-height:44px;background:none;border:none;color:#d6dbe0;font-size:24px;line-height:1;cursor:pointer;flex-shrink:0}
.tgk-tuning-portal .dz-clear:hover{color:#ff9b8f}
.tgk-tuning-portal .dropzone.dark{margin-bottom:12px}

/* ---- email preferences and help ---- */
.tgk-tuning-portal .prefs{margin:0 0 20px;background:var(--ink);border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.tgk-tuning-portal .prefs>summary{list-style:none;cursor:pointer;min-height:54px;display:flex;align-items:center;padding:0 24px;font:400 17px var(--hf);letter-spacing:.04em;text-transform:uppercase;color:#fff;position:relative;background:var(--ink2);border-left:5px solid var(--orange)}
.tgk-tuning-portal .prefs>summary::-webkit-details-marker{display:none}
.tgk-tuning-portal .prefs>summary::after{content:'+';position:absolute;right:24px;top:50%;transform:translateY(-50%);color:#aab3ba;font:400 22px var(--bf)}
.tgk-tuning-portal .prefs[open]>summary::after{content:'\2212'}
.tgk-tuning-portal .prefs-body{padding:6px 24px 16px}
.tgk-tuning-portal .pref-row{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:56px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tgk-tuning-portal .pref-row:first-child{border-top:none}
.tgk-tuning-portal .pref-label{display:block;font-size:14.5px;font-weight:700;color:#fff}
.tgk-tuning-portal .pref-hint{display:block;font-size:12.5px;color:#aab3ba;margin-top:1px}
.tgk-tuning-portal .pref-note{font-size:12.5px;color:#aab3ba;padding-top:10px;border-top:1px solid var(--line)}
.tgk-tuning-portal .switch{position:relative;width:44px;height:26px;flex-shrink:0}
.tgk-tuning-portal .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.tgk-tuning-portal .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#6b747c;border-radius:26px;transition:background .15s}
.tgk-tuning-portal .slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tgk-tuning-portal .switch input:checked+.slider{background:#13998c}
.tgk-tuning-portal .switch input:checked+.slider::before{transform:translateX(18px)}
.tgk-tuning-portal .switch input:disabled+.slider{opacity:.6}
.tgk-tuning-portal .switch input:focus-visible+.slider{outline:2px solid #fff;outline-offset:2px}

/* ---- logging guide, review ---- */
.tgk-tuning-portal .baseline-banner{background:rgba(245,165,36,.16);border-radius:var(--r);box-shadow:inset 4px 0 0 #f5a524;padding:12px 16px 12px 20px;font-size:14.5px;color:#ffd48a;margin-bottom:10px}
.tgk-tuning-portal .baseline-banner strong{color:#fff}
.tgk-tuning-portal .log-params{margin:0 0 4px;padding-left:20px;font-size:14.5px;columns:2;column-gap:24px;color:#d6dbe0}
.tgk-tuning-portal .log-params li{margin-bottom:3px;break-inside:avoid}
.tgk-tuning-portal .log-procedure{font-size:14.5px;white-space:pre-wrap;line-height:1.6;color:#d6dbe0}
.tgk-tuning-portal .review-stars span{font-size:32px;color:#6b747c;cursor:pointer;padding-right:4px;transition:color .1s}
.tgk-tuning-portal .review-stars span.on{color:#f5b301}
.tgk-tuning-portal .review-stars.static span{cursor:default;font-size:24px}
.tgk-tuning-portal .footer-note{text-align:center;margin-top:8px;font-size:13px;color:#5b646b}
.tgk-tuning-portal .card .footer-note{color:#aab3ba}

/* ---- next step, application details, timeline, receipts, upload progress, help, link recovery ---- */
.tgk-tuning-portal .card a:not(.btn),.tgk-tuning-portal .prefs a{color:#aef0e8;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tgk-tuning-portal .linkbtn{display:inline-block;padding:12px 2px;border:0;background:none;color:#aef0e8;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tgk-tuning-portal .linkbtn:focus-visible,.tgk-tuning-portal .card a:focus-visible,.tgk-tuning-portal .prefs a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tgk-tuning-portal .next-step{margin-top:18px;padding:14px 18px 16px 22px;background:rgba(0,0,0,.26);border-radius:6px;box-shadow:inset 4px 0 0 var(--teal)}
.tgk-tuning-portal .next-step.ns-act{background:rgba(232,115,28,.15);box-shadow:inset 4px 0 0 var(--orange)}
.tgk-tuning-portal .ns-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#aef0e8}
.tgk-tuning-portal .ns-act .ns-kicker{color:#ffb070}
.tgk-tuning-portal .ns-row{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-top:6px}
.tgk-tuning-portal .ns-text{flex:1 1 300px;font-size:15px;line-height:1.5;color:#fff}
.tgk-tuning-portal .ns-btn{flex:none;min-height:44px;padding:0 20px;border:0;border-radius:var(--r);background:var(--orange);color:#14171a;font:800 12.5px var(--bf);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.28)}
.tgk-tuning-portal .ns-btn:hover{background:var(--orange-d)}
.tgk-tuning-portal .rev-used{display:inline-block;vertical-align:middle;margin-left:14px;font-size:13px;font-weight:700;color:#aab3ba}
.tgk-tuning-portal .kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin-bottom:6px}
.tgk-tuning-portal .kv{min-width:0}
.tgk-tuning-portal .kv-wide{grid-column:1/-1}
.tgk-tuning-portal .kv-k{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#aab3ba}
.tgk-tuning-portal .kv-v{font-size:14.5px;color:#fff;overflow-wrap:anywhere;white-space:pre-wrap}
.tgk-tuning-portal .kv-none{color:#8a949c;font-style:italic}
.tgk-tuning-portal .ptab-body h2:not(:first-child){margin-top:28px}
.tgk-tuning-portal .tl-list{list-style:none}
.tgk-tuning-portal .tl-list li{display:flex;justify-content:space-between;gap:12px;padding:11px 16px 11px 20px;background:var(--ink3);border-radius:var(--r);box-shadow:inset 4px 0 0 #56606a;margin-bottom:6px}
.tgk-tuning-portal .tl-list li.tl-now{box-shadow:inset 4px 0 0 var(--orange)}
.tgk-tuning-portal .tl-what{font-weight:800;color:#fff}
.tgk-tuning-portal .tl-when{color:#aab3ba;white-space:nowrap;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .rcpt-row{padding-top:2px}
.tgk-tuning-portal .rcpt{display:inline-block;padding:12px 0;font-size:13.5px}
.tgk-tuning-portal .dz-hint{font-size:12.5px;color:#aab3ba;margin-top:8px}
.tgk-tuning-portal .up-progress{margin-top:12px}
.tgk-tuning-portal .up-bar{position:relative;height:6px;border-radius:3px;background:var(--ink3);overflow:hidden}
.tgk-tuning-portal .up-bar span{position:absolute;top:0;bottom:0;width:35%;border-radius:3px;background:var(--teal);animation:up-slide 1.2s infinite ease-in-out}
@keyframes up-slide{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.tgk-tuning-portal .up-bar span{animation:none;width:100%;opacity:.7}}
.tgk-tuning-portal .up-text{font-size:13px;font-weight:700;color:#d6dbe0;margin-top:6px}
.tgk-tuning-portal .faq-q{margin-top:16px;font:400 17px var(--hf);letter-spacing:.03em;text-transform:uppercase;color:#fff}
.tgk-tuning-portal .faq-a{margin-top:4px;font-size:14.5px;line-height:1.6;color:#d6dbe0}
.tgk-tuning-portal .help .pref-note{margin-top:18px}
.tgk-tuning-portal .link-recovery{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}

@media(max-width:700px){
  .tgk-tuning-portal .wrap{padding:4px 12px 60px}
  .tgk-tuning-portal .portal-brand{padding:16px 12px 12px}
  .tgk-tuning-portal .hero-carbon{padding:20px 18px 24px}
  .tgk-tuning-portal .sc{font-size:0;gap:0}
  .tgk-tuning-portal .sc i{font-size:14px}
  .tgk-tuning-portal .sc.current{font-size:11px;gap:8px}
  .tgk-tuning-portal .card{padding:20px 16px 24px}
  .tgk-tuning-portal .ptabs{padding:0 8px 0 6px}
  .tgk-tuning-portal .ptab{padding:0 14px}
  .tgk-tuning-portal .ptab-body{padding:20px 16px 24px}
  .tgk-tuning-portal .rev-check{width:100%}
  .tgk-tuning-portal .rev-row{flex-direction:column}
  .tgk-tuning-portal .log-params{columns:1}
  .tgk-tuning-portal .tune-hero{flex-direction:column;align-items:stretch}
  .tgk-tuning-portal .th-actions .btn{width:100%}
  .tgk-tuning-portal .fs-rev{flex-wrap:wrap}
  .tgk-tuning-portal .fs-rev .fs-actions{width:100%;justify-content:flex-start}
  .tgk-tuning-portal .tune-version{flex-wrap:wrap}
  .tgk-tuning-portal .tv-info{flex-basis:100%}
  .tgk-tuning-portal .tv-actions{width:100%;justify-content:flex-start}
  .tgk-tuning-portal .prefs>summary{padding:0 16px}
  .tgk-tuning-portal .prefs-body{padding:4px 16px 14px}
  .tgk-tuning-portal .kv-grid{grid-template-columns:1fr}
  .tgk-tuning-portal .ns-btn{width:100%}
  .tgk-tuning-portal .rev-used{display:block;margin:10px 0 0}
}
</style>

async function submitRevisionRequest(){
  const btn = document.getElementById('revisionSubmitBtn');
  const errEl = document.getElementById('revisionErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  function fail(msg){ errEl.className = 'status-msg err'; errEl.textContent = msg; }

  const complaints = Array.prototype.slice.call(document.querySelectorAll('input[name="revComplaint"]:checked')).map(function(c){ return c.value; });
  const fuel = document.getElementById('revFuel').value;
  const ethanolRaw = document.getElementById('revEthanol').value;
  const conditions = document.getElementById('revConditions').value.trim();
  const notes = document.getElementById('revisionNotes').value.trim();
  const file = document.getElementById('revLogFile').files[0];

  if(!complaints.length) return fail('Pick at least one issue.');
  if(!fuel) return fail('Select the fuel you\'re running.');
  if(!file) return fail('Attach a datalog - your tuner needs it to diagnose the issue.');
  if(file.size > MAX_UPLOAD_MB * 1048576) return fail('That file is too large (the limit is ' + MAX_UPLOAD_MB + ' MB).');
  const ethanol = ethanolRaw === '' ? null : Number(ethanolRaw);
  if(ethanol !== null && (isNaN(ethanol) || ethanol < 0 || ethanol > 100)) return fail('Ethanol % must be between 0 and 100.');

  btn.disabled = true; btn.textContent = 'Uploading log...';
  uploadStart(file, 'revProgress');
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;
    const up = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: 'log' });
    if(up.file) STATE.files.unshift(up.file);

    uploadEnd();
    btn.textContent = 'Submitting...';
    const data = await callPortal('request_revision', {
      complaints: complaints, fuel: fuel, ethanol_pct: ethanol,
      conditions: conditions, notes: notes, log_file_id: up.file ? up.file.id : null
    });
    STATE.application = data.application;
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Revision request sent - your tuner has been notified.');
  }catch(e){
    uploadEnd();
    fail('Failed to submit: ' + e.message);
    btn.disabled = false; btn.textContent = 'Submit Revision Request';
  }
}
window.submitRevisionRequest = submitRevisionRequest;

// A styled file picker: the real <input type="file"> is visually hidden
// inside a drop zone, so the page never shows the browser's native
// "Browse..." button. Supports drag-and-drop; shows the chosen file with
// its size and a remove control.
function fileDropHtml(id, dark, enableBtnId){
  return '<label class="dropzone' + (dark ? ' dark' : '') + '" id="dz-' + id + '" data-input="' + id + '"' + (enableBtnId ? ' data-btn="' + enableBtnId + '"' : '') + '>'
    + '<input type="file" id="' + id + '" class="dz-input" onchange="dzChanged(\'' + id + '\')">'
    + '<span class="dz-empty"><span class="dz-strong">Drop a file here</span> or <span class="dz-link">browse</span></span>'
    + '<span class="dz-file"><span class="dz-name"></span><span class="dz-size"></span>'
    + '<button type="button" class="dz-clear" title="Remove" onclick="event.preventDefault();dzClear(\'' + id + '\')">&times;</button></span>'
    + '</label>';
}
// While a file is going up: say so, and stop the browser closing the page by accident.
let UPLOAD_GUARD = null;
function uploadStart(file, elId){
  const el = elId && document.getElementById(elId);
  if(el){ el.hidden = false; el.querySelector('.up-text').textContent = 'Uploading ' + file.name + ' (' + fmtBytes(file.size) + ') - please keep this page open.'; }
  if(!UPLOAD_GUARD){ UPLOAD_GUARD = function(e){ e.preventDefault(); e.returnValue = ''; }; window.addEventListener('beforeunload', UPLOAD_GUARD); }
}
function uploadEnd(){
  ['uploadProgress','revProgress'].forEach(function(id){ const el = document.getElementById(id); if(el) el.hidden = true; });
  if(UPLOAD_GUARD){ window.removeEventListener('beforeunload', UPLOAD_GUARD); UPLOAD_GUARD = null; }
}
function fmtBytes(n){ return n < 1024 ? n + ' B' : (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'); }
function dzChanged(id){
  const input = document.getElementById(id), zone = document.getElementById('dz-' + id);
  if(!input || !zone) return;
  const f = input.files && input.files[0];
  zone.classList.toggle('has-file', !!f);
  if(f){
    zone.querySelector('.dz-name').textContent = f.name;
    zone.querySelector('.dz-size').textContent = fmtBytes(f.size);
  }
  const btn = zone.getAttribute('data-btn') && document.getElementById(zone.getAttribute('data-btn'));
  if(btn) btn.disabled = !f;
}
window.dzChanged = dzChanged;
function dzClear(id){
  const input = document.getElementById(id);
  if(input){ input.value = ''; dzChanged(id); }
}
window.dzClear = dzClear;
function wireDropzones(){
  document.querySelectorAll('.dropzone').forEach(function(zone){
    if(zone._wired) return;
    zone._wired = true;
    ['dragenter','dragover'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      const id = zone.getAttribute('data-input');
      const input = document.getElementById(id);
      if(input && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        try{ input.files = e.dataTransfer.files; }catch(err){ /* very old browser: fall back to browse */ }
        dzChanged(id);
      }
    });
  });
}

// Messages from the tuner the customer has not looked at yet. "Seen" is remembered on this device (and in memory if storage is blocked).
let SEEN_MEM = '';
function seenKey(){ return 'tgk_portal_seen_' + (STATE.application ? STATE.application.id : ''); }
function lastSeenAt(){ try{ return localStorage.getItem(seenKey()) || SEEN_MEM; }catch(e){ return SEEN_MEM; } }
function tunerMessages(){ return (STATE.messages || []).filter(function(m){ return m.sender_type === 'tuner'; }); }
function tunerMessageCount(){ return tunerMessages().length; }
function markMessagesSeen(){
  const m = tunerMessages(); if(!m.length) return;
  SEEN_MEM = m[m.length - 1].created_at;
  try{ localStorage.setItem(seenKey(), SEEN_MEM); }catch(e){ /* storage blocked: memory still works for this visit */ }
}
function unreadMessageCount(){
  const seen = lastSeenAt();

}

  if(s === 'archived') return { act:false, t:'This application is archived. Message us if you need anything.' };
  if(s === 'needs_info') return { act:true, t:'We need an answer from you. Reply in Messages so we can keep going.', tab:'messages', cta:'Open messages' };
  if(needsBaselineLog(a)) return { act:true, t:'Record and upload your baseline (stock) datalog - your tune cannot start without it.', tab: STATE.logGuide ? 'logging' : 'files', cta: STATE.logGuide ? 'See how to log' : 'Upload your log' };

    ['I lost my portal link', 'Open <a href="' + escapeHtml(location.origin + location.pathname) + '">this page without your link</a> and use "Lost your link?" to have it emailed to you again.']
  ];
  return '<details class="prefs help"><summary>Help &amp; FAQ</summary><div class="prefs-body">'
    + qa.map(function(q){ return '<div class="faq-q">' + q[0] + '</div><div class="faq-a">' + q[1] + '</div>'; }).join('')
    + '<div class="pref-note">Still stuck? Message your tuner in the Messages tab, or <a href="' + escapeHtml(SUPPORT_URL) + '" target="_blank" rel="noopener">contact TGK Motorsport support</a>.</div></div></details>';
}

function renderActionChips(a){
  const chips = [];
  const unpaid = unpaidInvoices();
  if(unpaid.length){
    const owed = unpaid.reduce(function(t, i){ return t + (Number(i.amount) || 0); }, 0);
    chips.push('<button class="action-chip" onclick="setPortalTab(\'invoices\')">Pay invoice &middot; ' + money(owed) + '</button>');
  }
  if(needsBaselineLog(a)) chips.push('<button class="action-chip" onclick="setPortalTab(\'' + (STATE.logGuide ? 'logging' : 'files') + '\')">Upload your baseline log</button>');
  if(a.status === 'completed' && !a.review_rating) chips.push('<button class="action-chip" onclick="var r=document.getElementById(\'reviewCard\');if(r)r.scrollIntoView({behavior:\'smooth\'})">Leave a review</button>');
  if(!chips.length) return '';
  return '<div class="action-chips"><span class="action-label">To do:</span>' + chips.join('') + '</div>';
}

function renderMessagesTab(a){
  let html = '<div class="msg-list" id="msgList">' + renderMessages() + '</div>';
  html += '<textarea class="form-input" id="msgInput" placeholder="Write a message to your tuner..." style="margin-bottom:10px"></textarea>';
  html += '<button class="btn" onclick="sendMessage()" id="sendBtn">Send Message</button>';
  html += '<div class="status-msg" id="msgErr"></div>';
  if(['declined','archived','completed'].indexOf(a.status) === -1){
    html += '<div id="modUpdateBox" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><button class="btn btn-sm btn-muted" onclick="showModUpdateForm()">Changed your mods? Let your tuner know</button></div>';
  }
  return html;
}

// Files tab, ordered by what the customer actually needs: the tune on the
// car first, then sending a file, then what they've sent, then history.
// Only the current tune's Download is a primary (orange) button.
function tuneLabel(f){ return f.revision_number ? 'Revision ' + f.revision_number : f.file_name; }
function fileKindBadge(f){
  const k = f.file_type === 'log' ? ['LOG','fk-log'] : (f.file_type === 'dyno' ? ['DYNO','fk-dyno'] : ['FILE','fk-file']);
  return '<span class="fk-badge ' + k[1] + '">' + k[0] + '</span>';
}

function renderCurrentTuneCard(tunes, closed){
  if(!tunes.length){
    return '<div class="tune-hero empty"><div class="th-empty-title">No tune yet</div>'
      + '<div class="file-meta">Your tune will appear here as soon as your tuner uploads it.</div></div>';
  }
  const cur = tunes.find(function(f){ return f.is_current; });
  const f = cur || tunes[0];
  const who = f.flashed_marked_by === 'customer' ? 'by you' : (f.flashed_marked_by ? 'by your tuner' : '');
  let html = '<div class="tune-hero' + (cur ? '' : ' not-marked') + '">'
    + '<div class="th-main">'
      + '<div class="th-kicker">' + (cur ? 'Currently flashed' : 'Latest tune') + '</div>'
      + '<div class="th-title">' + escapeHtml(tuneLabel(f)) + (f.fuel ? ' <span class="pill pill-muted">' + escapeHtml(f.fuel) + '</span>' : '') + '</div>'
      + '<div class="file-meta">' + escapeHtml(f.file_name) + ' &middot; sent ' + fmtDate(f.created_at) + '</div>'
      + (cur
          ? (who || f.flashed_marked_at ? '<div class="th-marked">Marked flashed ' + who + (f.flashed_marked_at ? ' &middot; ' + fmtDate(f.flashed_marked_at) : '') + '</div>' : '')
          : '<div class="th-unmarked">Not marked as flashed yet</div>')
      + (f.description ? '<div class="th-notes"><span>Tuner notes</span>' + escapeHtml(f.description) + '</div>' : '')
    + '</div>'
    + '<div class="th-actions">'
      + '<button class="btn" onclick="downloadFile(\'' + f.id + '\')">Download tune</button>'
      + (!cur && !closed ? '<button class="btn btn-muted" id="flashBtn-' + f.id + '" onclick="markFlashed(\'' + f.id + '\')">I\'ve flashed this</button>' : '')
    + '</div></div>';
  return html;
}

function renderFilesTab(){
  const closed = ['declined','archived'].indexOf((STATE.application || {}).status) !== -1;
  const tunes = STATE.files.filter(function(f){ return f.uploaded_by === 'tuner' && f.file_type === 'tune'; })
    .sort(function(x, y){
      const rx = x.revision_number || 0, ry = y.revision_number || 0;
      if(rx !== ry) return ry - rx;
      return new Date(y.created_at) - new Date(x.created_at);
    });
  const cur = tunes.find(function(f){ return f.is_current; }) || tunes[0];
  const earlier = tunes.filter(function(f){ return f !== cur; });
  const mine = STATE.files.filter(function(f){ return f.uploaded_by === 'customer'; });
  const fromTuner = STATE.files.filter(function(f){ return f.uploaded_by === 'tuner' && f.file_type !== 'tune'; });

  let html = '<div id="fileList">';

  // 1. The tune on the car
  html += '<div class="fs-title">Your tune</div>' + renderCurrentTuneCard(tunes, closed);

  // 2. Send a file
  html += '<div class="fs-block">';
  html += '<div class="upload-head"><span class="fs-title" style="margin:0">Send a file to your tuner</span>'
    + '<div class="seg" role="group" aria-label="File type">'
    + [['log','Datalog'],['dyno','Dyno sheet'],['other','Other']].map(function(t, i){
        return '<button type="button" class="seg-btn' + (i === 0 ? ' on' : '') + '" data-val="' + t[0] + '" onclick="setUploadType(this)">' + t[1] + '</button>';
      }).join('')
    + '</div><input type="hidden" id="fileTypeSelect" value="log"></div>';
  html += fileDropHtml('fileInput', false, 'uploadBtn');
  html += '<div class="dz-hint">Datalogs, dyno sheets and other files - up to ' + MAX_UPLOAD_MB + ' MB each.</div>';
  html += '<div class="up-progress" id="uploadProgress" hidden><div class="up-bar"><span></span></div><div class="up-text"></div></div>';
  html += '<div class="upload-actions"><button class="btn btn-sm" onclick="uploadLog()" id="uploadBtn" disabled>Upload</button></div>';
  html += '<div class="status-msg" id="uploadErr"></div>';
  html += '</div>';

  // 3. What the customer has sent
  if(mine.length){
    html += '<div class="fs-title">Files you\'ve sent <span class="fs-count">' + mine.length + '</span></div><div class="fs-list">';
    html += mine.map(function(f){
      return '<div class="fs-row">' + fileKindBadge(f)
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(f.file_name) + '</div>'
        + '<div class="file-meta">' + fmtDate(f.created_at) + '</div></div></div>';
    }).join('');
    html += '</div>';
  }

  // 4. Non-tune files from the tuner
  if(fromTuner.length){
    html += '<div class="fs-title">From your tuner <span class="fs-count">' + fromTuner.length + '</span></div><div class="fs-list">';
    html += fromTuner.map(function(f){
      return '<div class="fs-row">' + fileKindBadge(f)
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(f.file_name) + '</div>'
        + '<div class="file-meta">' + fmtDate(f.created_at) + '</div></div>'
        + '<button class="btn btn-sm btn-muted" onclick="downloadFile(\'' + f.id + '\')">Download</button></div>';
    }).join('');
    html += '</div>';
  }

  // 5. Tune history, collapsed
  if(earlier.length){
    html += '<details class="fs-history"><summary>Earlier tune revisions <span class="fs-count">' + earlier.length + '</span></summary><div class="fs-list">';
    html += earlier.map(function(f){
      return '<div class="fs-row fs-rev">'
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(tuneLabel(f)) + (f.fuel ? ' <span class="pill pill-muted">' + escapeHtml(f.fuel) + '</span>' : '') + '</div>'
        + '<div class="file-meta">' + escapeHtml(f.file_name) + ' &middot; ' + fmtDate(f.created_at) + '</div>'
        + (f.description ? '<div class="fs-notes">' + escapeHtml(f.description) + '</div>' : '') + '</div>'
        + '<div class="fs-actions">'
        + (!closed ? '<button class="btn btn-sm btn-muted" id="flashBtn-' + f.id + '" onclick="markFlashed(\'' + f.id + '\')">Mark as flashed</button>' : '')
        + '<button class="btn btn-sm btn-muted" onclick="downloadFile(\'' + f.id + '\')">Download</button></div></div>';
    }).join('');
    html += '</div></details>';
  }

  html += '</div>';
  return html;
}

function renderPortal(){
  const a = STATE.application;
  let html = '';

  html += '<div class="hero-carbon" style="--status-accent:' + (STATUS_ACCENT[a.status] || '#9ca3af') + '"><div class="hero-inner">';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">';
  html += '<h1 style="margin-bottom:0">Ghost Tuning Application #' + a.application_number + '</h1>';
  html += '<span class="hero-live"><span class="live-dot"></span>Live</span>';
  html += '</div>';
  html += '<div class="sub" style="margin-top:2px">' + escapeHtml(a.customer_name) + ' &middot; ' + escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ')) + '</div>';
  html += '<div style="margin-top:12px"><span class="pill ' + (STATUS_PILL[a.status]||'pill-muted') + '">' + (STATUS_LABEL[a.status]||a.status) + '</span></div>';
  if(['declined','archived'].indexOf(a.status) === -1) html += renderStageStepper(a);
  html += '<p class="status-blurb">' + escapeHtml(STATUS_BLURB[a.status] || '') + '</p>';
  if(STATE.queue){
    html += '<div class="queue-line"><span class="queue-num">#' + STATE.queue.position + '</span> in the build queue'
      + (STATE.queue.in_progress ? ' &middot; ' + STATE.queue.in_progress + ' tune' + (STATE.queue.in_progress > 1 ? 's' : '') + ' currently being built' : '') + '</div>';
  }
  html += renderNextStep(a);
  html += renderActionChips(a);
  html += renderRevisionCta(a);
  html += '</div></div>';

  html += renderReviewCard(a);

  if(STATE.tab === 'messages') markMessagesSeen();   // the conversation is on screen, so it counts as read
  const tabs = portalTabs(a);
  if(!tabs.some(function(t){ return t.id === STATE.tab; })) STATE.tab = 'messages';
  html += '<div class="card tab-card" id="tabCard"><div class="ptabs">' + tabs.map(function(t){
    return '<button class="ptab' + (STATE.tab === t.id ? ' active' : '') + '" onclick="setPortalTab(\'' + t.id + '\')">' + t.label
      + (t.badge ? '<span class="ptab-badge">' + t.badge + '</span>' : '') + '</button>';
  }).join('') + '</div><div class="ptab-body">';
  if(STATE.tab === 'messages') html += renderMessagesTab(a);
  else if(STATE.tab === 'files') html += renderFilesTab();
  else if(STATE.tab === 'invoices') html += renderInvoiceCard();
  else if(STATE.tab === 'logging') html += renderLogGuideCard(a);
  else if(STATE.tab === 'flash') html += renderFlashGuide();
  else if(STATE.tab === 'application') html += renderApplicationTab(a);
  html += '</div></div>';

  html += renderEmailPrefs(a);
  html += renderHelp();
  html += '<p class="footer-note">TGK Motorsport - Ghost Tuning</p>';

  document.getElementById('portalWrap').innerHTML = html;
  const unread = STATE.tab === 'messages' ? 0 : unreadMessageCount();
  document.title = (unread ? '(' + unread + ') ' : '') + BASE_TITLE;

  // Every render fully replaces this DOM (innerHTML), which resets any
  // scrollable element back to its top by default - so without this, an
  // unrelated realtime update (an invoice getting paid, a status change)
  // would silently scroll the customer away from their most recent
  // messages, not just a genuinely new message arriving.
  const list = document.getElementById('msgList');
  if(list) list.scrollTop = list.scrollHeight;
  wireDropzones();
}
window.renderPortal = renderPortal;

// Only shows once the tuner has actually sent an invoice - a fresh
// application with no invoice yet gets nothing here, not an empty box.
// Only shows once the tuner has actually sent at least one invoice - a
// fresh application with none yet gets nothing here, not an empty box.
// A customer who orders an additional tune later just sees a second
// invoice-box appear here, independent of the first.
// Invoices tab. Unpaid invoices are shown in full with a Pay button;
// paid ones collapse into a short payment history, so what needs doing
// stands out.
function unpaidInvoices(){ return (STATE.invoices || []).filter(function(i){ return i.status !== 'paid'; }); }

function invoiceLinesHtml(inv){
  const lines = Array.isArray(inv.line_items) ? inv.line_items : [];
  return lines.map(function(l){
    return '<div class="invoice-line"><div style="flex:1;min-width:0">' + (l.quantity > 1 ? l.quantity + '&times; ' : '') + escapeHtml(l.title) + '</div><div style="flex-shrink:0;white-space:nowrap">' + money(Number(l.price) * Number(l.quantity||1)) + '</div></div>';
  }).join('');
}

function renderInvoiceCard(){
  const invoices = STATE.invoices || [];
  if(!invoices.length) return '<div class="empty-state">No invoices yet.</div>';
  const unpaid = unpaidInvoices();
  const paid = invoices.filter(function(i){ return i.status === 'paid'; });
  let html = '';

  if(unpaid.length){
    html += '<h2>Awaiting payment</h2>';
    html += unpaid.map(function(inv){
      const total = Number(inv.amount || 0).toFixed(2);
      return '<div class="invoice-box" style="margin-bottom:12px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span class="pill pill-yellow">Awaiting Payment</span><span class="sub" style="font-size:12px;margin:0">' + fmtDate(inv.sent_at || inv.created_at) + '</span></div>'
        + invoiceLinesHtml(inv)
        + '<div class="invoice-total"><span>Total</span><span class="amt">' + money(inv.amount) + '</span></div>'
        + (inv.notes ? '<p class="sub" style="margin:8px 0 0;font-size:13px">' + escapeHtml(inv.notes) + '</p>' : '')
        + (inv.invoice_url ? '<div style="margin-top:10px"><a href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener" class="btn" style="text-decoration:none">Pay Invoice - ' + money(inv.amount) + '</a></div>' : '')
        + '</div>';
    }).join('');
  } else {
    html += '<div class="all-paid">&#10003; You\'re all paid up.</div>';
  }

  if(paid.length){
    html += '<h2 style="margin-top:18px">Payment history</h2>';
    html += paid.map(function(inv){
      return '<div class="paid-row" onclick="this.classList.toggle(\'open\')">'
        + '<div class="paid-sum"><span class="pill pill-green">Paid</span><span style="flex:1">' + fmtDate(inv.paid_at || inv.sent_at) + '</span><strong>' + money(inv.amount) + '</strong><span class="chev">&#9662;</span></div>'
        + '<div class="paid-detail">' + invoiceLinesHtml(inv)
        + (inv.invoice_url ? '<div class="rcpt-row"><a class="rcpt" href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">View invoice / receipt</a></div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
  }
  return html;
}

// Shows the tuner-assigned DS1 logging instructions, and - until the
// customer has uploaded one - asks clearly for the baseline log.
function needsBaselineLog(a){
  const myLogs = STATE.files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  return !myLogs.length && ['submitted','under_review','needs_info','accepted'].indexOf(a.status) !== -1;
}
function hasLoggingTab(a){
  if(['declined','archived','completed'].indexOf(a.status) !== -1) return false;
  return !!STATE.logGuide || needsBaselineLog(a);
}
function renderLogGuideCard(a){
  if(!hasLoggingTab(a)) return '';
  const g = STATE.logGuide;
  const myLogs = STATE.files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  const needsBaseline = needsBaselineLog(a);

  let html = '';
  html += '<h2>' + (g ? 'How to log: ' + escapeHtml(g.name) : 'Datalog needed') + '</h2>';
  if(needsBaseline){
    html += '<div class="baseline-banner">Your tuner needs a <strong>baseline (stock) datalog</strong> before your tune can start. '
      + 'Record it following the steps below, then upload it in the Files section.</div>';
  }
  if(g){
    const params = (g.parameters || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if(params.length){
      html += '<div class="sub" style="font-weight:700;color:var(--text2);margin:10px 0 6px">Parameters to log</div>';
      html += '<ul class="log-params">' + params.map(function(p){ return '<li>' + escapeHtml(p) + '</li>'; }).join('') + '</ul>';
    }
    if(g.procedure){
      html += '<div class="sub" style="font-weight:700;color:var(--text2);margin:10px 0 6px">Procedure</div>';
      html += '<div class="log-procedure">' + escapeHtml(g.procedure) + '</div>';
    }
  }
  if(myLogs.length){
    html += '<div class="sub" style="margin-top:12px"><span class="pill pill-green">Log received</span> Latest: ' + escapeHtml(myLogs[0].file_name) + ' &middot; ' + fmtDate(myLogs[0].created_at) + '</div>';
  }
  html += '<div style="margin-top:14px"><button class="btn btn-sm" onclick="setPortalTab(\'files\')">Upload a log</button></div>';
  return html;
}

// Completion review - once the tune is done. Rating + optional comment,
// one per application; after submitting it shows as a thank-you.
function renderReviewCard(a){
  if(a.status !== 'completed') return '';
  if(a.review_rating){
    return '<div class="card"><h2>Your review</h2>'
      + '<div class="review-stars static">' + [1,2,3,4,5].map(function(n){ return '<span class="' + (n <= a.review_rating ? 'on' : '') + '">&#9733;</span>'; }).join('') + '</div>'
      + (a.review_comment ? '<p class="sub" style="margin-top:6px;white-space:pre-wrap">' + escapeHtml(a.review_comment) + '</p>' : '')
      + '<p class="sub" style="margin-top:6px">Thanks for the feedback!</p></div>';
  }
  return '<div class="card" id="reviewCard"><h2>How did we do?</h2>'
    + '<div class="sub" style="margin-bottom:8px">Your tune is complete. Rate your experience with Ghost Tuning.</div>'
    + '<div class="review-stars" id="reviewStars">' + [1,2,3,4,5].map(function(n){ return '<span onclick="setReviewRating(' + n + ')" data-n="' + n + '">&#9733;</span>'; }).join('') + '</div>'
    + '<textarea class="form-input" id="reviewComment" placeholder="Anything you\'d like to share? (optional)" style="margin:10px 0;min-height:60px"></textarea>'
    + '<button class="btn btn-sm" id="reviewBtn" onclick="submitReview()">Submit Review</button>'
    + '<div class="status-msg" id="reviewErr"></div></div>';
}

let REVIEW_RATING = 0;
function setReviewRating(n){
  REVIEW_RATING = n;
  document.querySelectorAll('#reviewStars span').forEach(function(el){
    el.className = Number(el.getAttribute('data-n')) <= n ? 'on' : '';
  });
}
window.setReviewRating = setReviewRating;

async function submitReview(){
  const errEl = document.getElementById('reviewErr');
  const btn = document.getElementById('reviewBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!REVIEW_RATING){ errEl.className = 'status-msg err'; errEl.textContent = 'Pick a star rating first.'; return; }
  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const data = await callPortal('submit_review', { rating: REVIEW_RATING, comment: document.getElementById('reviewComment').value.trim() });
    STATE.application = data.application;
    renderPortal();
    toastLike('Thanks for your review!');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to submit: ' + e.message;
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
}
window.submitReview = submitReview;

function renderMessages(){
  if(!STATE.messages.length) return '<div class="empty-state">No messages yet.</div>';
  return STATE.messages.map(function(m){
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const isModUpdate = m.message_type === 'mod_update';
    const cls = isRevisionRequest ? 'msg-revision' : (isModUpdate ? 'msg-modupdate' : (m.sender_type === 'system' ? 'msg-system' : (m.sender_type === 'customer' ? 'msg-me' : 'msg-them')));
    let html = '<div class="msg ' + cls + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">Revision Request Sent</div>';
    } else if(isModUpdate){
      html += '<div class="msg-modupdate-badge">Mod Update Sent &middot; ' + fmtDate(m.created_at) + '</div>';
    } else if(m.sender_type !== 'system'){
      html += '<div class="msg-meta">' + (m.sender_type === 'customer' ? 'You' : 'Ghost Tuning') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div></div>';
    return html;
  }).join('');
}

// Customer tells the tuner which revision is actually on the car. Updates
// the tuner's dashboard live and is logged there with who set it.
async function markFlashed(fileId){
  const f = STATE.files.find(function(x){ return x.id === fileId; });
  const label = f && f.revision_number ? 'Revision ' + f.revision_number : (f ? f.file_name : 'this tune');
  if(!confirm('Mark ' + label + ' as the tune currently flashed on your car?\n\nYour tuner will be notified.')) return;
  const btn = document.getElementById('flashBtn-' + fileId);
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    const data = await callPortal('set_current_tune', { file_id: fileId });
    if(data.files) STATE.files = data.files;
    renderPortal();
    toastLike(label + ' marked as flashed - your tuner has been notified.');
  }catch(e){
    toastLike('Could not update: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Mark as flashed'; }
  }
}
window.markFlashed = markFlashed;


// Mid-project setup changes (new parts, different fuel) - flagged to the
// tuner so the next revision is built for what's actually on the car.
function showModUpdateForm(){
  const el = document.getElementById('modUpdateBox');
  if(!el) return;
  el.innerHTML = '<div class="sub" style="margin-bottom:6px">What changed on the car? Your tuner will be notified.</div>'
    + '<textarea class="form-input" id="modChanges" placeholder="e.g. Installed catless downpipes, switched to E40" style="margin-bottom:10px;min-height:60px"></textarea>'
    + '<div style="display:flex;gap:8px"><button class="btn btn-sm" id="modSubmitBtn" onclick="submitModUpdate()">Send Update</button>'
    + '<button class="btn btn-sm btn-muted" onclick="hideModUpdateForm()">Cancel</button></div>'
    + '<div class="status-msg" id="modErr"></div>';
}
window.showModUpdateForm = showModUpdateForm;
function hideModUpdateForm(){
  const el = document.getElementById('modUpdateBox');
  if(el) el.innerHTML = '<button class="btn btn-sm btn-muted" onclick="showModUpdateForm()">Changed your mods? Let your tuner know</button>';
}
window.hideModUpdateForm = hideModUpdateForm;

async function submitModUpdate(){
  const changes = document.getElementById('modChanges').value.trim();
  const errEl = document.getElementById('modErr');
  const btn = document.getElementById('modSubmitBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!changes){ errEl.className = 'status-msg err'; errEl.textContent = 'Describe what changed.'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('update_mods', { changes: changes });
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Mod update sent - your tuner has been notified.');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
    btn.disabled = false; btn.textContent = 'Send Update';
  }
}
window.submitModUpdate = submitModUpdate;

function isCustomerEditing(){
  if(document.getElementById('revFuel')) return true;          // revision form open
  if(document.getElementById('modChanges')) return true;       // mod update form open
  const fi = document.getElementById('fileInput');
  if(fi && fi.files && fi.files.length) return true;          // file chosen, not yet uploaded
  const rc = document.getElementById('reviewComment');
  if((rc && rc.value.trim()) || REVIEW_RATING) return true;   // review in progress
  return false;
}

// The conversation is "at the bottom" when the newest message is in view -
// only then should a refresh scroll it down to show new messages. Someone
// scrolled up reading older messages stays where they are.
function msgListAtBottom(list){
  return !list || list.scrollHeight - list.scrollTop - list.clientHeight < 40;
}

// Swap in the latest messages without touching anything else on the page -
// used while the customer is typing, so the message box keeps its focus,
// cursor and text (and a phone keyboard stays open).
function refreshMessageListInPlace(){
  const list = document.getElementById('msgList');
  if(!list) return;
  const html = renderMessages();
  if(list.innerHTML === html) return;
  const atBottom = msgListAtBottom(list), top = list.scrollTop;
  list.innerHTML = html;
  list.scrollTop = atBottom ? list.scrollHeight : top;
}

async function loadStatus(silent){
  try{
    const data = await callPortal('get_status', { silent: !!silent });   // a background refresh must not count as a visit
    // Read what the customer is doing right before deciding how to redraw.
    const draftEl = document.getElementById('msgInput');
    const draft = draftEl ? draftEl.value : '';
    const typing = !!draftEl && document.activeElement === draftEl;
    const tunerBefore = tunerMessageCount();
    STATE.application = data.application;
    STATE.messages = data.messages;
    STATE.files = data.files;
    STATE.invoices = data.invoices || [];
    STATE.logGuide = data.log_guide || null;
    STATE.queue = data.queue || null;
    STATE.timeline = data.timeline || [];
    STATE.flashGuide = data.flash_guide || null;
    STATE.revisions = data.revisions || null;
    if(silent && tunerMessageCount() > tunerBefore && STATE.tab !== 'messages') toastLike('New message from your tuner');
    // A background refresh (25s poll or realtime ping) must never wipe out
    // something the customer is halfway through. The data is updated
    // either way; the re-render just waits until they submit or cancel,
    // both of which re-render on their own.
    if(silent && isCustomerEditing()){ subscribeRealtime(); return; }
    // Typing a message: rebuilding the page would throw them out of the box
    // mid-sentence (and close a phone keyboard). Show new messages in place
    // instead; the full refresh happens on the first one after they leave it.
    if(silent && typing){ refreshMessageListInPlace(); subscribeRealtime(); return; }
    const oldList = document.getElementById('msgList');
    const listAtBottom = msgListAtBottom(oldList), listTop = oldList ? oldList.scrollTop : 0;
    const pageY = window.scrollY;
    renderPortal();
    const newDraftEl = document.getElementById('msgInput');
    if(newDraftEl && draft) newDraftEl.value = draft;
    if(silent){
      // Leave the reader where they were: page position, and the conversation
      // too unless they were already looking at the newest message.
      const newList = document.getElementById('msgList');
      if(newList && oldList && !listAtBottom) newList.scrollTop = listTop;
      if(Math.abs(window.scrollY - pageY) > 1) window.scrollTo(0, pageY);
    }
    subscribeRealtime();
  }catch(e){
    if(!silent) renderInvalid(e.message || "This link isn't valid.");
  }
}

// Real-time updates without giving the portal's anon key any direct table
// access: the tuner app broadcasts a content-free "something changed" ping
// on a channel keyed to this application's id whenever it sends a message,
// uploads a file, or changes status. This client just listens for the ping
// and re-fetches through the SAME token-gated edge function every other
// portal action already uses - no RLS relaxation needed for realtime to work.
function subscribeRealtime(){
  if(STATE._channel || !STATE.application || !STATE.application.id) return;
  STATE._channel = sb.channel('tuning-portal-' + STATE.application.id)
    .on('broadcast', { event: 'update' }, function(){ loadStatus(true); })
    .subscribe();
}

// Belt-and-suspenders fallback in case a broadcast is ever missed (a brief
// connection drop, a tab that was asleep, etc.) - quiet periodic refresh.
setInterval(function(){ if(STATE.application) loadStatus(true); }, 25000);

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  const errEl = document.getElementById('msgErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!body){ errEl.className = 'status-msg err'; errEl.textContent = 'Write a message first.'; return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('send_message', { body: body });
    STATE.messages.push(data.message);
    input.value = '';
    document.getElementById('msgList').innerHTML = renderMessages();
    document.getElementById('msgList').scrollTop = document.getElementById('msgList').scrollHeight;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Send Message';
}
window.sendMessage = sendMessage;

async function uploadLog(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  const errEl = document.getElementById('uploadErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!file){ errEl.className = 'status-msg err'; errEl.textContent = 'Choose a file first.'; return; }
  if(file.size > MAX_UPLOAD_MB * 1048576){ errEl.className = 'status-msg err'; errEl.textContent = 'That file is too large (the limit is ' + MAX_UPLOAD_MB + ' MB).'; return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  uploadStart(file, 'uploadProgress');
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;

    const typeEl = document.getElementById('fileTypeSelect');
    const data = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: typeEl ? typeEl.value : 'log' });
    STATE.files.unshift(data.file);
    // Full re-render so the logging card's baseline banner clears too.
    uploadEnd();
    renderPortal();
    toastLike('Upload complete - your tuner has been notified.');
    return;
  }catch(e){
    uploadEnd();
    errEl.className = 'status-msg err'; errEl.textContent = 'Upload failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Upload';
}
window.uploadLog = uploadLog;

async function downloadFile(fileId){
  try{
    const data = await callPortal('download_file', { file_id: fileId });
    window.open(data.url, '_blank');
  }catch(e){
    alert('Could not open file: ' + e.message);
  }
}
window.downloadFile = downloadFile;

document.addEventListener('DOMContentLoaded', function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if(!TOKEN){
    renderInvalid("This link is missing its access token. Check the link in your original confirmation email.");
    return;
  }
  loadStatus();
});
</script>

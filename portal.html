html,body{margin:0;padding:0;background:#f2f4f6}
html[data-theme="dark"],html[data-theme="dark"] body{background:#fff}
.tgk-tuning-portal,.tgk-tuning-portal *,.tgk-tuning-portal *::before,.tgk-tuning-portal *::after{box-sizing:border-box;margin:0;padding:0}
.tgk-tuning-portal{
  --orange:#e8731c;--orange-d:#f5934a;--teal:#39c3b5;--teal-d:#13998c;--ink:#14181b;--r:3px;
  --hf:"Francois One",Impact,"Arial Narrow",sans-serif;--bf:Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* light theme (default) */
  --surface:#fff;--surface2:#f5f7f9;--line:#dfe3e7;--line2:#c4cbd2;
  --text:#14171a;--text2:#3a4147;--text3:#5d6872;
  --teal-t:#0b6b62;--orange-t:#9a4608;--red-t:#b42318;--green-t:#14683a;--amber-t:#7a4a00;--blue-t:#1a4fa3;
  --teal-bg:#e3f5f3;--orange-bg:#fdeee0;--red-bg:#fdecea;--amber-bg:#fff3de;--grey-bg:#eef1f4;--blue-bg:#e4eefb;
  --page-text:#5d6872;--page-line:#c4cbd2;--star-off:#858f98;--field-bg:#fff;--field-line:#c4cbd2;--field-text:#14171a;--field-ph:#6b747c;
  --border:#dfe3e7;--border2:#c4cbd2;--bg:#fff;--bg2:#f5f7f9;--bg3:#eef1f4;--navy:#14171a;
  font-family:var(--bf);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;position:relative;
}
/* dark-panel variant */
html[data-theme="dark"] .tgk-tuning-portal{
  --surface:#1d2227;--surface2:#262c32;--line:#343c43;--line2:#4a545c;--text:#fff;--text2:#d6dbe0;--text3:#aab3ba;
  --teal-t:#aef0e8;--orange-t:#ffb070;--red-t:#ffb4aa;--green-t:#aef0e8;--amber-t:#ffd48a;--blue-t:#bcd6ff;
  --teal-bg:rgba(57,195,181,.16);--orange-bg:rgba(232,115,28,.17);--red-bg:rgba(255,107,91,.15);--amber-bg:rgba(245,165,36,.16);--grey-bg:rgba(255,255,255,.08);--blue-bg:rgba(120,170,255,.16);
  --star-off:#6b747c;--border:#343c43;--border2:#4a545c;--bg:#1d2227;--bg2:#262c32;--bg3:#262c32;--navy:#fff;
}
/* the status cluster is dark in both themes */
.tgk-tuning-portal .hero-carbon{
  --surface:#14181b;--surface2:#1e2429;--line:#2d353c;--line2:#4a545c;--text:#fff;--text2:#d6dbe0;--text3:#aab3ba;
  --teal-t:#aef0e8;--orange-t:#ffb070;--red-t:#ffb4aa;--green-t:#aef0e8;--amber-t:#ffd48a;--blue-t:#bcd6ff;
  --teal-bg:rgba(57,195,181,.16);--orange-bg:rgba(232,115,28,.17);--red-bg:rgba(255,107,91,.15);--amber-bg:rgba(245,165,36,.16);--grey-bg:rgba(255,255,255,.08);--blue-bg:rgba(120,170,255,.16);
  --star-off:#6b747c;--border:#2d353c;--border2:#4a545c;--bg:#14181b;--bg2:#1e2429;--bg3:#1e2429;--navy:#fff;
  color:#fff;
}
/* light text on a dark panel shows coloured fringes with sub-pixel text smoothing: a layer of its own gives clean grey-scale smoothing */
.tgk-tuning-portal .hero-carbon,html[data-theme="dark"] .tgk-tuning-portal .card,html[data-theme="dark"] .tgk-tuning-portal .prefs{will-change:opacity}
.tgk-tuning-portal h1,.tgk-tuning-portal h2,.tgk-tuning-portal p{margin:0;padding:0}
.tgk-tuning-portal [hidden]{display:none!important}
.tgk-tuning-portal .wrap{max-width:780px;margin:0 auto;padding:0 16px 44px}
.tgk-tuning-portal .portal-brand{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto;padding:14px 16px 10px}
.tgk-tuning-portal .portal-brand img{height:20px;width:auto;display:block}
.tgk-tuning-portal .portal-brand .ghost-icon{height:22px;width:22px}
.tgk-tuning-portal .portal-brand .brand-sep{width:1px;height:14px;background:var(--page-line)}
.tgk-tuning-portal .portal-brand .brand-sub{font-size:12.5px;font-weight:700;color:var(--page-text);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.tgk-tuning-portal .skeleton{padding:50px 10px;text-align:center;color:var(--page-text);font-size:14px}

/* ===== status cluster ===== */
.tgk-tuning-portal .hero-carbon{position:relative;overflow:hidden;margin:0 0 10px;padding:14px 16px 12px;border-radius:4px;background:#14181b}
.tgk-tuning-portal .hero-carbon::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--orange),var(--teal))}
.tgk-tuning-portal .hero-inner{position:relative}
.tgk-tuning-portal .cl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tgk-tuning-portal .hero-carbon h1{font-family:var(--hf);font-weight:400;font-size:18px;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;color:#fff;margin:0}
.tgk-tuning-portal .hero-carbon .sub{font-size:12.5px;color:#aab3ba;margin:2px 0 0}
.tgk-tuning-portal .hero-carbon .car-line{color:#fff}
.tgk-tuning-portal .cl-state{display:flex;align-items:center;gap:12px}
.tgk-tuning-portal .hero-carbon .pill::before{content:"";width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--status-accent,var(--orange));box-shadow:0 0 6px var(--status-accent,var(--orange))}
.tgk-tuning-portal .hero-live{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:10.5px;font-weight:800;color:#aef0e8;letter-spacing:.14em;text-transform:uppercase}
.tgk-tuning-portal .live-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(57,195,181,.5);animation:live-pulse 2s infinite}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(57,195,181,.5)}70%{box-shadow:0 0 0 5px rgba(57,195,181,0)}100%{box-shadow:0 0 0 0 rgba(57,195,181,0)}}
@media (prefers-reduced-motion:reduce){.tgk-tuning-portal .live-dot{animation:none}}
/* shift-light progress: six segments, finished = teal, current = orange */
.tgk-tuning-portal .stage-chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:12px 0 8px}
.tgk-tuning-portal .sc{display:flex;flex-direction:column;gap:5px;min-width:0;color:#7e8993;font:700 10px var(--bf);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgk-tuning-portal .sc i{display:block;height:6px;border-radius:1px;background:#2a3238;font-size:0;font-style:normal}
.tgk-tuning-portal .sc.done{color:#c5ccd2}
.tgk-tuning-portal .sc.done i{background:var(--teal)}
.tgk-tuning-portal .sc.current{color:#fff}
.tgk-tuning-portal .sc.current i{background:var(--orange);box-shadow:0 0 8px rgba(232,115,28,.65)}
.tgk-tuning-portal .cl-meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.tgk-tuning-portal .hero-carbon .status-blurb{font-size:13px;color:#c5ccd2;line-height:1.45;margin:0;flex:1 1 320px}
.tgk-tuning-portal .queue-line{font-size:12px;color:#aab3ba;margin:0}
.tgk-tuning-portal .queue-num{font:700 13px var(--mono);color:#aef0e8}
/* one slim action row: what to do next, with its button(s) */
.tgk-tuning-portal .next-step{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:10px;padding:7px 8px 7px 12px;background:rgba(255,255,255,.06);border-radius:3px;box-shadow:inset 3px 0 0 var(--teal)}
.tgk-tuning-portal .next-step.ns-act{background:rgba(232,115,28,.13);box-shadow:inset 3px 0 0 var(--orange)}
.tgk-tuning-portal .ns-kicker{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#aef0e8}
.tgk-tuning-portal .ns-act .ns-kicker{color:#ffb070}
.tgk-tuning-portal .ns-text{flex:1 1 260px;font-size:13px;line-height:1.4;color:#fff}
.tgk-tuning-portal .ns-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tgk-tuning-portal .action-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.tgk-tuning-portal .action-label{display:none}
.tgk-tuning-portal .revision-cta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid #2d353c}
.tgk-tuning-portal .revision-cta.open{display:block}
.tgk-tuning-portal .rev-hint{font-size:12.5px;color:#aab3ba}
.tgk-tuning-portal .rev-used{margin-left:auto;font-size:12px;font-weight:700;color:#aab3ba;font-family:var(--mono)}

/* ===== body panels ===== */
.tgk-tuning-portal .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px 18px;margin-bottom:10px}
.tgk-tuning-portal .card.tab-card{padding:0;overflow:hidden}
.tgk-tuning-portal .card h1{font-family:var(--hf);font-weight:400;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:6px}
.tgk-tuning-portal h2{display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 11.5px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);padding:0 0 6px;border-bottom:1px solid var(--line);margin:0 0 10px}
.tgk-tuning-portal h2::before{content:"";flex:none;width:3px;height:11px;background:var(--orange);margin-right:2px}
.tgk-tuning-portal h2{justify-content:flex-start}
.tgk-tuning-portal .sub{font-size:13px;color:var(--text3);margin-bottom:4px}
.tgk-tuning-portal .status-blurb{font-size:13.5px;color:var(--text2);line-height:1.5;margin-top:8px}
.tgk-tuning-portal .car-line{font-size:14px;font-weight:700;color:var(--text);margin-top:4px}

/* ===== badges ===== */
.tgk-tuning-portal .pill{display:inline-flex;align-items:center;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border:1px solid transparent;border-radius:3px;line-height:1.5}
.tgk-tuning-portal .pill-teal{background:var(--teal-bg);color:var(--teal-t);border-color:rgba(57,195,181,.45)}
.tgk-tuning-portal .pill-orange{background:var(--orange-bg);color:var(--orange-t);border-color:rgba(232,115,28,.45)}
.tgk-tuning-portal .pill-red{background:var(--red-bg);color:var(--red-t);border-color:rgba(255,107,91,.5)}
.tgk-tuning-portal .pill-green{background:var(--teal-bg);color:var(--green-t);border-color:rgba(57,195,181,.45)}
.tgk-tuning-portal .pill-yellow{background:var(--amber-bg);color:var(--amber-t);border-color:rgba(245,165,36,.5)}
.tgk-tuning-portal .pill-muted{background:var(--grey-bg);color:var(--text3);border-color:var(--line2)}

/* ===== buttons ===== */
.tgk-tuning-portal .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 16px;border:0;border-radius:var(--r);background:var(--orange);color:#14171a;font:800 12px var(--bf);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .15s}
.tgk-tuning-portal .btn:hover{background:var(--orange-d)}
.tgk-tuning-portal .btn:focus-visible,.tgk-tuning-portal .action-chip:focus-visible,.tgk-tuning-portal .ns-btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.tgk-tuning-portal .hero-carbon .btn:focus-visible,.tgk-tuning-portal .hero-carbon .action-chip:focus-visible,.tgk-tuning-portal .hero-carbon .ns-btn:focus-visible{outline-color:#fff}
.tgk-tuning-portal .btn:disabled{opacity:.45;cursor:not-allowed}
.tgk-tuning-portal .btn-sm{min-height:32px;padding:0 14px;font-size:11.5px;width:auto}
.tgk-tuning-portal .btn.btn-muted,.tgk-tuning-portal .btn.btn-ghost-light{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.tgk-tuning-portal .btn.btn-muted:hover,.tgk-tuning-portal .btn.btn-ghost-light:hover{background:var(--grey-bg)}
.tgk-tuning-portal .hero-carbon .btn.btn-ghost-light{color:#fff;box-shadow:inset 0 0 0 1px #6b747c}
.tgk-tuning-portal .hero-carbon .btn.btn-ghost-light:hover{background:rgba(255,255,255,.08)}
.tgk-tuning-portal .action-chip,.tgk-tuning-portal .ns-btn{min-height:30px;padding:0 14px;border:0;border-radius:var(--r);background:var(--orange);color:#14171a;font:800 11.5px var(--bf);letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.tgk-tuning-portal .action-chip:hover,.tgk-tuning-portal .ns-btn:hover{background:var(--orange-d)}

/* ===== form fields ===== */
.tgk-tuning-portal .form-input{width:100%;min-height:36px;background:var(--field-bg);border:1px solid var(--field-line);border-radius:var(--r);color:var(--field-text);padding:7px 10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.tgk-tuning-portal .form-input::placeholder{color:var(--field-ph)}
.tgk-tuning-portal .form-input:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(232,115,28,.28)}
.tgk-tuning-portal textarea.form-input{resize:vertical;min-height:64px}
.tgk-tuning-portal select.form-input{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='none' stroke='%2314171a' stroke-width='2' d='M1 1.6l5 5 5-5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:11px;padding-right:30px;cursor:pointer}
.tgk-tuning-portal .status-msg{display:none;font-size:13px;font-weight:600;border-radius:var(--r);padding:8px 12px;margin-top:10px}
.tgk-tuning-portal .status-msg.err{display:block;background:var(--red-bg);color:var(--red-t);box-shadow:inset 3px 0 0 #e5483a}
.tgk-tuning-portal .status-msg.ok{display:block;background:var(--teal-bg);color:var(--teal-t);box-shadow:inset 3px 0 0 var(--teal)}

/* revision request form (opens inside the cluster) */
.tgk-tuning-portal .rev-label{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--text2);margin:8px 0 4px}
.tgk-tuning-portal .rev-grid{display:flex;flex-wrap:wrap;margin:0 -4px 8px}
.tgk-tuning-portal .rev-check{display:flex;align-items:center;gap:8px;min-height:30px;font-size:13px;color:var(--text2);cursor:pointer;width:50%;padding:2px 4px}
.tgk-tuning-portal .rev-check input{accent-color:var(--teal-d);width:16px;height:16px;flex:none}
.tgk-tuning-portal .rev-row{display:flex;gap:10px;margin-bottom:8px}
.tgk-tuning-portal .rev-row>div{flex:1;min-width:0}
.tgk-tuning-portal .revision-cta .rev-input,.tgk-tuning-portal .revision-cta textarea.form-input{background:#fff;color:#14171a;border-color:#fff}
.tgk-tuning-portal .revision-cta select.rev-input option{color:#111}

/* ===== tabs ===== */
.tgk-tuning-portal .ptabs{display:flex;gap:0;overflow-x:auto;padding:0 6px;background:var(--surface2);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tgk-tuning-portal .ptab{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--text3);font:800 11.5px var(--bf);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;cursor:pointer;margin-bottom:-1px;transition:color .15s}
.tgk-tuning-portal .ptab:hover{color:var(--text)}
.tgk-tuning-portal .ptab.active{color:var(--text);border-bottom-color:var(--orange)}
.tgk-tuning-portal .ptab:focus-visible{outline:2px solid var(--orange);outline-offset:-3px}
.tgk-tuning-portal .ptab-badge{background:var(--orange);color:#14171a;border-radius:8px;font-size:10px;font-weight:800;padding:0 6px;line-height:16px;min-width:16px;text-align:center}
.tgk-tuning-portal .ptab-body{padding:14px 16px 16px}

/* ===== messages ===== */
.tgk-tuning-portal .msg-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:320px;overflow-y:auto;padding-right:2px}
.tgk-tuning-portal .msg{padding:8px 12px;border-radius:var(--r);max-width:88%;font-size:13.5px}
.tgk-tuning-portal .msg-them{background:var(--grey-bg);align-self:flex-start;box-shadow:inset 2px 0 0 var(--line2)}
.tgk-tuning-portal .msg-me{background:var(--teal-bg);align-self:flex-end;margin-left:auto;box-shadow:inset -2px 0 0 var(--teal)}
.tgk-tuning-portal .msg-system{background:transparent;align-self:center;font-style:italic;color:var(--text3);font-size:12.5px;max-width:100%;text-align:center}
.tgk-tuning-portal .msg-revision{background:var(--red-bg);align-self:flex-end;margin-left:auto;box-shadow:inset -2px 0 0 #e5483a}
.tgk-tuning-portal .msg-modupdate{background:var(--orange-bg);align-self:flex-end;margin-left:auto;box-shadow:inset -2px 0 0 var(--orange)}
.tgk-tuning-portal .msg-meta{font-size:10.5px;color:var(--text3);margin-bottom:2px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .msg-revision-badge{font-weight:800;font-size:11px;color:var(--red-t);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.tgk-tuning-portal .msg-modupdate-badge{font-weight:800;font-size:11px;color:var(--orange-t);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.tgk-tuning-portal .msg-body{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.tgk-tuning-portal .empty-state{text-align:center;padding:18px 10px;color:var(--text3);font-size:13px}

/* ===== invoices ===== */
.tgk-tuning-portal .invoice-box{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 3px 0 0 var(--orange);padding:10px 14px 12px 16px;margin-bottom:8px}
.tgk-tuning-portal .invoice-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:13.5px;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .invoice-line:last-of-type{border-bottom:none}
.tgk-tuning-portal .invoice-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:3px;border-top:1px solid var(--text);font-weight:700}
.tgk-tuning-portal .invoice-total .amt{font:700 18px var(--mono);letter-spacing:-.01em}
.tgk-tuning-portal .all-paid{color:var(--green-t);font-weight:800;font-size:14px;padding:4px 0}
.tgk-tuning-portal .paid-row{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 3px 0 0 var(--teal);margin-bottom:6px;cursor:pointer}
.tgk-tuning-portal .paid-sum{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 12px 6px 16px;font-size:13.5px;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .paid-row .chev{color:var(--text3);transition:transform .15s}
.tgk-tuning-portal .paid-row.open .chev{transform:rotate(180deg)}
.tgk-tuning-portal .paid-detail{display:none;padding:0 12px 6px 16px;border-top:1px dashed var(--line2)}
.tgk-tuning-portal .paid-row.open .paid-detail{display:block}

/* ===== files ===== */
.tgk-tuning-portal .fs-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.tgk-tuning-portal #fileList>.fs-title:first-child{margin-top:0}
.tgk-tuning-portal .fs-count{font-size:10.5px;font-weight:800;color:var(--text2);background:var(--grey-bg);border:1px solid var(--line);border-radius:8px;padding:0 7px;line-height:16px;letter-spacing:0}
.tgk-tuning-portal .tune-hero{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 3px 0 0 var(--teal);padding:12px 14px 12px 18px}
.tgk-tuning-portal .tune-hero.not-marked{box-shadow:inset 3px 0 0 var(--orange)}
.tgk-tuning-portal .tune-hero.empty{display:block;background:transparent;box-shadow:none;border:1px dashed var(--line2);text-align:center;padding:16px}
.tgk-tuning-portal .th-empty-title{font:400 17px var(--hf);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.tgk-tuning-portal .th-main{flex:1;min-width:0}
.tgk-tuning-portal .th-main .file-meta,.tgk-tuning-portal .fs-info .file-meta{overflow-wrap:anywhere;word-break:break-word}
.tgk-tuning-portal .th-kicker{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--teal-t);margin-bottom:2px}
.tgk-tuning-portal .not-marked .th-kicker{color:var(--orange-t)}
.tgk-tuning-portal .th-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:400 20px/1.15 var(--hf);letter-spacing:.03em;text-transform:uppercase;color:var(--text)}
.tgk-tuning-portal .th-marked{font-size:12.5px;color:var(--teal-t);font-weight:700;margin-top:3px}
.tgk-tuning-portal .th-unmarked{font-size:12.5px;color:var(--orange-t);font-weight:700;margin-top:3px}
.tgk-tuning-portal .th-notes{margin-top:8px;font-size:13px;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;white-space:pre-wrap}
.tgk-tuning-portal .th-notes span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:1px}
.tgk-tuning-portal .th-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.tgk-tuning-portal .fs-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.tgk-tuning-portal .fs-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tgk-tuning-portal .fs-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.tgk-tuning-portal .fs-row:first-child{border-top:none}
.tgk-tuning-portal .fs-info{flex:1;min-width:0}
.tgk-tuning-portal .fs-name{font-weight:700;font-size:13.5px;color:var(--text);overflow-wrap:anywhere}
.tgk-tuning-portal .fs-notes{font-size:12.5px;color:var(--text2);margin-top:2px;white-space:pre-wrap}
.tgk-tuning-portal .fs-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tgk-tuning-portal .file-meta{font-size:12px;color:var(--text3);margin-top:1px;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .file-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tgk-tuning-portal .file-row:last-child{border-bottom:none}
.tgk-tuning-portal .file-name{font-weight:700;font-size:13.5px}
.tgk-tuning-portal .fk-badge{flex-shrink:0;width:42px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 0;border-radius:3px}
.tgk-tuning-portal .fk-log{background:var(--orange-bg);color:var(--orange-t)}
.tgk-tuning-portal .fk-dyno{background:var(--teal-bg);color:var(--teal-t)}
.tgk-tuning-portal .fk-file{background:var(--grey-bg);color:var(--text2)}
.tgk-tuning-portal .fs-history{margin-top:16px}
.tgk-tuning-portal .fs-history>summary{list-style:none;cursor:pointer;min-height:34px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
.tgk-tuning-portal .fs-history>summary::-webkit-details-marker{display:none}
.tgk-tuning-portal .fs-history>summary::after{content:'Show';margin-left:auto;font-size:12px;letter-spacing:.03em;text-transform:none;color:var(--teal-t);font-weight:700}
.tgk-tuning-portal .fs-history[open]>summary::after{content:'Hide'}
.tgk-tuning-portal .fs-history>summary:focus-visible,.tgk-tuning-portal .prefs>summary:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.tgk-tuning-portal .tune-version.is-current{box-shadow:inset 3px 0 0 var(--teal);padding-left:10px}
.tgk-tuning-portal .tune-changelog{font-size:12.5px;color:var(--text2);margin-top:3px;white-space:pre-wrap}
.tgk-tuning-portal .tv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tgk-tuning-portal .tv-info{flex:1;min-width:0}
.tgk-tuning-portal .tv-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tgk-tuning-portal .tv-marked{font-size:12.5px;color:var(--teal-t);margin-top:2px;font-weight:700}

/* ===== sending a file ===== */
.tgk-tuning-portal .upload-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tgk-tuning-portal .upload-title{font-size:12.5px;font-weight:800;color:var(--text2)}
.tgk-tuning-portal .upload-actions{display:flex;justify-content:flex-end;margin-top:8px}
.tgk-tuning-portal .seg{display:inline-flex;gap:0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.tgk-tuning-portal .seg-btn{min-height:30px;padding:0 12px;border:0;border-left:1px solid var(--line2);border-radius:0;background:var(--surface);color:var(--text2);font:800 11px var(--bf);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;line-height:1.4}
.tgk-tuning-portal .seg-btn:first-child{border-left:0}
.tgk-tuning-portal .seg-btn:hover{background:var(--grey-bg)}
.tgk-tuning-portal .seg-btn.on{background:var(--teal-bg);color:var(--teal-t);box-shadow:inset 0 -2px 0 var(--teal)}
.tgk-tuning-portal .seg-btn:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.tgk-tuning-portal .dropzone{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px dashed var(--line2);border-radius:var(--r);background:var(--surface2);padding:8px 12px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;font-size:13px;color:var(--text3);text-align:center}
.tgk-tuning-portal .dropzone:hover,.tgk-tuning-portal .dropzone.drag{border-color:var(--teal);background:var(--teal-bg)}
.tgk-tuning-portal .dropzone:focus-within{outline:2px solid var(--orange);outline-offset:2px}
.tgk-tuning-portal .dz-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.tgk-tuning-portal .dz-strong{color:var(--text);font-weight:700}
.tgk-tuning-portal .dz-link{color:var(--teal-t);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tgk-tuning-portal .dz-file{display:none;align-items:center;gap:10px;width:100%;text-align:left}
.tgk-tuning-portal .dropzone.has-file{border-style:solid;border-color:var(--teal);justify-content:flex-start}
.tgk-tuning-portal .dropzone.has-file .dz-empty{display:none}
.tgk-tuning-portal .dropzone.has-file .dz-file{display:flex}
.tgk-tuning-portal .dz-name{flex:1;min-width:0;color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgk-tuning-portal .dz-size{color:var(--text3);font-size:12px;flex-shrink:0}
.tgk-tuning-portal .dz-clear{min-width:34px;min-height:34px;background:none;border:none;color:var(--text2);font-size:20px;line-height:1;cursor:pointer;flex-shrink:0}
.tgk-tuning-portal .dz-clear:hover{color:var(--red-t)}
.tgk-tuning-portal .dropzone.dark{margin-bottom:8px}

/* ===== email preferences and help ===== */
.tgk-tuning-portal .prefs{margin:0 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tgk-tuning-portal .prefs>summary{list-style:none;cursor:pointer;min-height:40px;display:flex;align-items:center;padding:0 16px;font:800 11.5px var(--bf);letter-spacing:.11em;text-transform:uppercase;color:var(--text2);position:relative;background:var(--surface2)}
.tgk-tuning-portal .prefs>summary::-webkit-details-marker{display:none}
.tgk-tuning-portal .prefs>summary::after{content:'+';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text3);font:400 18px var(--bf)}
.tgk-tuning-portal .prefs[open]>summary::after{content:'\2212'}
.tgk-tuning-portal .prefs[open]>summary{border-bottom:1px solid var(--line)}
.tgk-tuning-portal .prefs-body{padding:4px 16px 12px}
.tgk-tuning-portal .pref-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.tgk-tuning-portal .pref-row:first-child{border-top:none}
.tgk-tuning-portal .pref-label{display:block;font-size:13.5px;font-weight:700;color:var(--text)}
.tgk-tuning-portal .pref-hint{display:block;font-size:12px;color:var(--text3);margin-top:1px}
.tgk-tuning-portal .pref-note{font-size:12px;color:var(--text3);padding-top:8px;border-top:1px solid var(--line)}
.tgk-tuning-portal .switch{position:relative;width:38px;height:22px;flex-shrink:0}
.tgk-tuning-portal .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.tgk-tuning-portal .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#9aa4ad;border-radius:22px;transition:background .15s}
.tgk-tuning-portal .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tgk-tuning-portal .switch input:checked+.slider{background:#13998c}
.tgk-tuning-portal .switch input:checked+.slider::before{transform:translateX(16px)}
.tgk-tuning-portal .switch input:disabled+.slider{opacity:.6}
.tgk-tuning-portal .switch input:focus-visible+.slider{outline:2px solid var(--orange);outline-offset:2px}

/* ===== logging guide, review ===== */
.tgk-tuning-portal .baseline-banner{background:var(--amber-bg);border-radius:var(--r);box-shadow:inset 3px 0 0 #f5a524;padding:9px 12px 9px 16px;font-size:13.5px;color:var(--amber-t);margin-bottom:8px}
.tgk-tuning-portal .baseline-banner strong{color:var(--text)}
.tgk-tuning-portal .log-params{margin:0 0 4px;padding-left:18px;font-size:13.5px;columns:2;column-gap:20px;color:var(--text2)}
.tgk-tuning-portal .log-params li{margin-bottom:2px;break-inside:avoid}
.tgk-tuning-portal .log-procedure{font-size:13.5px;white-space:pre-wrap;line-height:1.55;color:var(--text2)}
.tgk-tuning-portal .review-stars span{font-size:26px;color:var(--star-off);cursor:pointer;padding-right:3px;transition:color .1s}
.tgk-tuning-portal .review-stars span.on{color:#f5b301}
.tgk-tuning-portal .review-stars.static span{cursor:default;font-size:20px}
.tgk-tuning-portal .footer-note{text-align:center;margin-top:10px;font-size:12px;color:var(--page-text)}
.tgk-tuning-portal .card .footer-note{color:var(--text3)}

/* ===== links, application details, timeline, receipts, upload progress, help, link recovery ===== */
.tgk-tuning-portal .card a:not(.btn),.tgk-tuning-portal .prefs a{color:var(--teal-t);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tgk-tuning-portal .linkbtn{display:inline-block;padding:6px 2px;border:0;background:none;color:var(--teal-t);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tgk-tuning-portal .linkbtn:focus-visible,.tgk-tuning-portal .card a:focus-visible,.tgk-tuning-portal .prefs a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.tgk-tuning-portal .kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:4px}
.tgk-tuning-portal .kv{min-width:0;padding:7px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.tgk-tuning-portal .kv-wide{grid-column:1/-1}
.tgk-tuning-portal .kv-k{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--text3)}
.tgk-tuning-portal .kv-v{font-size:13.5px;color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .kv-none{color:var(--text3);font-style:italic}
.tgk-tuning-portal .ptab-body h2:not(:first-child){margin-top:18px}
.tgk-tuning-portal .tl-list{list-style:none;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tgk-tuning-portal .tl-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}
.tgk-tuning-portal .tl-list li:first-child{border-top:0}
.tgk-tuning-portal .tl-list li.tl-now{background:var(--orange-bg);box-shadow:inset 3px 0 0 var(--orange)}
.tgk-tuning-portal .tl-what{font-weight:800;color:var(--text)}
.tgk-tuning-portal .tl-when{color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums}
.tgk-tuning-portal .rcpt-row{padding-top:0}
.tgk-tuning-portal .rcpt{display:inline-block;padding:6px 0;font-size:12.5px}
.tgk-tuning-portal .dz-hint{font-size:12px;color:var(--text3);margin-top:6px}
.tgk-tuning-portal .up-progress{margin-top:8px}
.tgk-tuning-portal .up-bar{position:relative;height:4px;border-radius:2px;background:var(--grey-bg);overflow:hidden}
.tgk-tuning-portal .up-bar span{position:absolute;top:0;bottom:0;width:35%;border-radius:2px;background:var(--teal);animation:up-slide 1.2s infinite ease-in-out}
@keyframes up-slide{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.tgk-tuning-portal .up-bar span{animation:none;width:100%;opacity:.7}}
.tgk-tuning-portal .up-text{font-size:12.5px;font-weight:700;color:var(--text2);margin-top:4px}
.tgk-tuning-portal .faq-q{margin-top:12px;font-size:13.5px;font-weight:800;color:var(--text)}
.tgk-tuning-portal .faq-a{margin-top:2px;font-size:13px;line-height:1.55;color:var(--text2)}
.tgk-tuning-portal .help .pref-note{margin-top:14px}
.tgk-tuning-portal .link-recovery{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* ===== phones and touch: same design, finger-sized controls ===== */
@media(max-width:700px){
  .tgk-tuning-portal .wrap{padding:0 10px 36px}
  .tgk-tuning-portal .portal-brand{padding:12px 10px 8px}
  .tgk-tuning-portal .hero-carbon{padding:12px 12px 10px}
  .tgk-tuning-portal .hero-carbon h1{font-size:16px}
  .tgk-tuning-portal .sc{font-size:0;gap:0}
  .tgk-tuning-portal .sc.current{font-size:10px;gap:5px;overflow:visible;text-overflow:clip}
  .tgk-tuning-portal .sc:last-child.current{align-items:flex-end;text-align:right}
  .tgk-tuning-portal .sc:last-child.current i{align-self:stretch}
  .tgk-tuning-portal .rev-hint{display:none}
  .tgk-tuning-portal .revision-cta{margin-top:8px;padding-top:8px}
  .tgk-tuning-portal .stage-chips{gap:3px}
  .tgk-tuning-portal .ptab-body{padding:12px 12px 14px}
  .tgk-tuning-portal .card{padding:14px 14px 16px}
  .tgk-tuning-portal .form-input,.tgk-tuning-portal select.form-input,.tgk-tuning-portal textarea.form-input{font-size:16px}
  .tgk-tuning-portal .rev-check{width:100%}
  .tgk-tuning-portal .rev-row{flex-direction:column}
  .tgk-tuning-portal .log-params{columns:1}
  .tgk-tuning-portal .kv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tgk-tuning-portal .tune-hero{flex-direction:column;align-items:stretch}
  .tgk-tuning-portal .th-actions .btn{width:100%}
  .tgk-tuning-portal .fs-rev{flex-wrap:wrap}
  .tgk-tuning-portal .fs-rev .fs-actions{width:100%;justify-content:flex-start}
  .tgk-tuning-portal .tune-version{flex-wrap:wrap}
  .tgk-tuning-portal .tv-info{flex-basis:100%}
  .tgk-tuning-portal .tv-actions{width:100%;justify-content:flex-start}
  .tgk-tuning-portal .prefs>summary{padding:0 12px}
  .tgk-tuning-portal .prefs-body{padding:4px 12px 10px}
  .tgk-tuning-portal .ns-actions{width:100%}
  .tgk-tuning-portal .rev-used{margin-left:0}
}
@media(max-width:460px){.tgk-tuning-portal .kv-grid{grid-template-columns:1fr}}
@media(pointer:coarse){
  .tgk-tuning-portal .btn,.tgk-tuning-portal .btn-sm,.tgk-tuning-portal .action-chip,.tgk-tuning-portal .ns-btn,.tgk-tuning-portal .seg-btn{min-height:44px}
  .tgk-tuning-portal .ptab{min-height:44px}
  .tgk-tuning-portal .form-input{min-height:44px;font-size:16px}
  .tgk-tuning-portal .rev-check{min-height:44px}
  .tgk-tuning-portal .pref-row{min-height:52px}
  .tgk-tuning-portal .paid-sum{min-height:44px}
  .tgk-tuning-portal .dz-clear{min-width:44px;min-height:44px}
  .tgk-tuning-portal .fs-history>summary,.tgk-tuning-portal .prefs>summary{min-height:44px}
  .tgk-tuning-portal .linkbtn,.tgk-tuning-portal .rcpt{min-height:44px;display:inline-flex;align-items:center;padding:0 2px}
}
</style>

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDay(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

async function callPortal(action, extra){
  const body = Object.assign({ action: action, token: TOKEN }, extra || {});
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-portal', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(!data.success) throw new Error(data.error || 'Request failed');
  return data;
}

}

// Lost-link recovery: asks the server to email the customer their portal link(s). The answer is the same whether or not the
// address is known, so this cannot be used to find out who is a customer.
async function requestLink(){
  const inp = document.getElementById('linkEmail'), msg = document.getElementById('linkMsg'), btn = document.getElementById('linkBtn');
  const email = inp.value.trim();
  msg.className = 'status-msg'; msg.textContent = '';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ msg.className = 'status-msg err'; msg.textContent = 'Enter the email address you applied with.'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('request_link', { email: email, return_url: location.origin + location.pathname });
    msg.className = 'status-msg ok'; msg.textContent = data.message || 'If we have an application for that email address, we have just sent it a link.';
    btn.textContent = 'Sent - check your inbox';
    setTimeout(function(){ btn.disabled = false; btn.textContent = 'Email me my link'; }, 30000);
  }catch(e){
    msg.className = 'status-msg err'; msg.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Email me my link';
  }
}
window.requestLink = requestLink;

function renderStageStepper(a){
  const MAIN_STAGES = [
    { id:'submitted', label:'Submitted' },
    { id:'under_review', label:'Review' },
    { id:'accepted', label:'Accepted' },
    { id:'active', label:'In Progress' },
    { id:'tune_sent', label:'Tune Sent' },
    { id:'completed', label:'Complete' }
  ];
  // Off-path statuses map onto the nearest main stage for stepper purposes,
  // so the stepper always reads as forward progress even when something
  // needs attention.
  const POSITION_OVERRIDE = { needs_info:'under_review', declined:'under_review', revision_requested:'tune_sent', archived:'completed' };
  const effective = POSITION_OVERRIDE[a.status] || a.status;
  const idx = MAIN_STAGES.findIndex(function(s){ return s.id === effective; });

  let html = '<div class="stage-chips" role="list" aria-label="Application progress">';
  MAIN_STAGES.forEach(function(s, i){
    const done = idx > i;
    const isCurrent = i === idx;
    html += '<div class="sc ' + (done ? 'done' : (isCurrent ? 'current' : '')) + '" role="listitem"' + (isCurrent ? ' aria-current="step"' : '') + '>'
      + '<i>' + (done ? '&#10003;' : (i + 1)) + '</i>' + s.label + '</div>';
  });
  return html + '</div>';
}

    + fileDropHtml('revLogFile', true, null)

    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn btn-sm" onclick="submitRevisionRequest()" id="revisionSubmitBtn">Submit Revision Request</button>'
    + '<button class="btn btn-ghost-light btn-sm" onclick="renderPortal()">Cancel</button>'
    + '</div>'
    + '<div class="status-msg" id="revisionErr"></div>';
  el.classList.add('open');

async function submitRevisionRequest(){
  const btn = document.getElementById('revisionSubmitBtn');
  const errEl = document.getElementById('revisionErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  function fail(msg){ errEl.className = 'status-msg err'; errEl.textContent = msg; }

  const complaints = Array.prototype.slice.call(document.querySelectorAll('input[name="revComplaint"]:checked')).map(function(c){ return c.value; });
  const fuel = document.getElementById('revFuel').value;
  const ethanolRaw = document.getElementById('revEthanol').value;
  const conditions = document.getElementById('revConditions').value.trim();
  const notes = document.getElementById('revisionNotes').value.trim();
  const file = document.getElementById('revLogFile').files[0];

  if(!complaints.length) return fail('Pick at least one issue.');
  if(!fuel) return fail('Select the fuel you\'re running.');
  if(!file) return fail('Attach a datalog - your tuner needs it to diagnose the issue.');
  if(file.size > MAX_UPLOAD_MB * 1048576) return fail('That file is too large (the limit is ' + MAX_UPLOAD_MB + ' MB).');
  const ethanol = ethanolRaw === '' ? null : Number(ethanolRaw);
  if(ethanol !== null && (isNaN(ethanol) || ethanol < 0 || ethanol > 100)) return fail('Ethanol % must be between 0 and 100.');

  btn.disabled = true; btn.textContent = 'Uploading log...';
  uploadStart(file, 'revProgress');
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;
    const up = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: 'log' });
    if(up.file) STATE.files.unshift(up.file);

    uploadEnd();
    btn.textContent = 'Submitting...';
    const data = await callPortal('request_revision', {
      complaints: complaints, fuel: fuel, ethanol_pct: ethanol,
      conditions: conditions, notes: notes, log_file_id: up.file ? up.file.id : null
    });
    STATE.application = data.application;
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Revision request sent - your tuner has been notified.');
  }catch(e){
    uploadEnd();
    fail('Failed to submit: ' + e.message);
    btn.disabled = false; btn.textContent = 'Submit Revision Request';
  }
}
window.submitRevisionRequest = submitRevisionRequest;

function toastLike(msg){

  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

// A styled file picker: the real <input type="file"> is visually hidden
// inside a drop zone, so the page never shows the browser's native
// "Browse..." button. Supports drag-and-drop; shows the chosen file with
// its size and a remove control.
function fileDropHtml(id, dark, enableBtnId){
  return '<label class="dropzone' + (dark ? ' dark' : '') + '" id="dz-' + id + '" data-input="' + id + '"' + (enableBtnId ? ' data-btn="' + enableBtnId + '"' : '') + '>'
    + '<input type="file" id="' + id + '" class="dz-input" onchange="dzChanged(\'' + id + '\')">'
    + '<span class="dz-empty"><span class="dz-strong">Drop a file here</span> or <span class="dz-link">browse</span></span>'
    + '<span class="dz-file"><span class="dz-name"></span><span class="dz-size"></span>'
    + '<button type="button" class="dz-clear" title="Remove" onclick="event.preventDefault();dzClear(\'' + id + '\')">&times;</button></span>'
    + '</label>';
}
// While a file is going up: say so, and stop the browser closing the page by accident.
let UPLOAD_GUARD = null;
function uploadStart(file, elId){
  const el = elId && document.getElementById(elId);
  if(el){ el.hidden = false; el.querySelector('.up-text').textContent = 'Uploading ' + file.name + ' (' + fmtBytes(file.size) + ') - please keep this page open.'; }
  if(!UPLOAD_GUARD){ UPLOAD_GUARD = function(e){ e.preventDefault(); e.returnValue = ''; }; window.addEventListener('beforeunload', UPLOAD_GUARD); }
}
function uploadEnd(){
  ['uploadProgress','revProgress'].forEach(function(id){ const el = document.getElementById(id); if(el) el.hidden = true; });
  if(UPLOAD_GUARD){ window.removeEventListener('beforeunload', UPLOAD_GUARD); UPLOAD_GUARD = null; }
}
function fmtBytes(n){ return n < 1024 ? n + ' B' : (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'); }
function dzChanged(id){
  const input = document.getElementById(id), zone = document.getElementById('dz-' + id);
  if(!input || !zone) return;
  const f = input.files && input.files[0];
  zone.classList.toggle('has-file', !!f);
  if(f){
    zone.querySelector('.dz-name').textContent = f.name;
    zone.querySelector('.dz-size').textContent = fmtBytes(f.size);
  }
  const btn = zone.getAttribute('data-btn') && document.getElementById(zone.getAttribute('data-btn'));
  if(btn) btn.disabled = !f;
}
window.dzChanged = dzChanged;
function dzClear(id){
  const input = document.getElementById(id);
  if(input){ input.value = ''; dzChanged(id); }
}
window.dzClear = dzClear;
function wireDropzones(){
  document.querySelectorAll('.dropzone').forEach(function(zone){
    if(zone._wired) return;
    zone._wired = true;
    ['dragenter','dragover'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      const id = zone.getAttribute('data-input');
      const input = document.getElementById(id);
      if(input && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        try{ input.files = e.dataTransfer.files; }catch(err){ /* very old browser: fall back to browse */ }
        dzChanged(id);
      }
    });
  });
}
function setUploadType(btn){
  btn.parentNode.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.toggle('on', b === btn); });

// Messages from the tuner the customer has not looked at yet. "Seen" is remembered on this device (and in memory if storage is blocked).
let SEEN_MEM = '';
function seenKey(){ return 'tgk_portal_seen_' + (STATE.application ? STATE.application.id : ''); }
function lastSeenAt(){ try{ return localStorage.getItem(seenKey()) || SEEN_MEM; }catch(e){ return SEEN_MEM; } }
function tunerMessages(){ return (STATE.messages || []).filter(function(m){ return m.sender_type === 'tuner'; }); }
function tunerMessageCount(){ return tunerMessages().length; }
function markMessagesSeen(){
  const m = tunerMessages(); if(!m.length) return;
  SEEN_MEM = m[m.length - 1].created_at;
  try{ localStorage.setItem(seenKey(), SEEN_MEM); }catch(e){ /* storage blocked: memory still works for this visit */ }
}
function unreadMessageCount(){
  const seen = lastSeenAt();

function nextStepInfo(a){
  const s = a.status;
  if(s === 'declined') return { act:false, t:'Nothing to do - please read the message from our team in Messages.', tab:'messages', cta:'Open messages' };
  if(s === 'archived') return { act:false, t:'This application is archived. Message us if you need anything.' };
  if(s === 'needs_info') return { act:true, t:'We need an answer from you. Reply in Messages so we can keep going.', tab:'messages', cta:'Open messages' };
  if(needsBaselineLog(a)) return { act:true, t:'Record and upload your baseline (stock) datalog - your tune cannot start without it.', tab: STATE.logGuide ? 'logging' : 'files', cta: STATE.logGuide ? 'See how to log' : 'Upload your log' };
  const unpaid = unpaidInvoices();

  if(s === 'completed') return a.review_rating ? { act:false, t:'All done - thank you! Message us any time if you have questions.' } : { act:true, t:'Your tune is complete. Tell us how we did.', review:true, cta:'Leave a review' };
  if(s === 'revision_requested') return { act:false, t:'Nothing needed from you. Your tuner is reviewing your revision request and will reply here.' };
  if(s === 'active') return { act:false, t:'Nothing needed from you. Your tune is being built - we will email you when it is ready.' };
  if(s === 'accepted') return { act:false, t:'Nothing needed from you right now. We will email you when your tune build starts.' };

// A half-written message is kept - in memory and in the browser's storage -

let PORTAL_DRAFT_TIMER = null;
function portalDraftKey(){ return 'tgk-portal-draft-' + (STATE.application && STATE.application.id || 'app'); }
function portalDraftGet(){
  if(STATE._draft === undefined){ try{ STATE._draft = localStorage.getItem(portalDraftKey()) || ''; }catch(e){ STATE._draft = ''; } }
  return STATE._draft;
}
function portalDraftSave(){
  const t = document.getElementById('msgInput'); if(!t) return;
  STATE._draft = t.value;
  clearTimeout(PORTAL_DRAFT_TIMER);
  PORTAL_DRAFT_TIMER = setTimeout(function(){
    try{ if(STATE._draft) localStorage.setItem(portalDraftKey(), STATE._draft); else localStorage.removeItem(portalDraftKey()); }catch(e){ /* storage unavailable */ }
  }, 400);
}
function portalDraftClear(){
  STATE._draft = '';
  clearTimeout(PORTAL_DRAFT_TIMER);
  try{ localStorage.removeItem(portalDraftKey()); }catch(e){ /* storage unavailable */ }
}

  }
  html += '</div>';

  html += renderRevisionCta(a);
  html += '</div></div>';

  html += renderReviewCard(a);

  if(STATE.tab === 'messages') markMessagesSeen();   // the conversation is on screen, so it counts as read
  const tabs = portalTabs(a);
  if(!tabs.some(function(t){ return t.id === STATE.tab; })) STATE.tab = 'messages';
  html += '<div class="card tab-card" id="tabCard"><div class="ptabs">' + tabs.map(function(t){
    return '<button class="ptab' + (STATE.tab === t.id ? ' active' : '') + '" onclick="setPortalTab(\'' + t.id + '\')">' + t.label
      + (t.badge ? '<span class="ptab-badge">' + t.badge + '</span>' : '') + '</button>';
  }).join('') + '</div><div class="ptab-body">';

  html += renderEmailPrefs(a);

function renderPortal(){
  const typed = document.getElementById('msgInput');
  if(typed) STATE._draft = typed.value;       // whatever is in the box right now becomes the draft before the page is rebuilt
  document.getElementById('portalWrap').innerHTML = buildPortalHtml();
  const unread = STATE.tab === 'messages' ? 0 : unreadMessageCount();
  document.title = (unread ? '(' + unread + ') ' : '') + BASE_TITLE;

  // Every render fully replaces this DOM (innerHTML), which resets any
  // scrollable element back to its top by default - so without this, an
  // unrelated realtime update (an invoice getting paid, a status change)
  // would silently scroll the customer away from their most recent
  // messages, not just a genuinely new message arriving.
  const list = document.getElementById('msgList');
  if(list) list.scrollTop = list.scrollHeight;
  wireDropzones();
}

// Is something open in the top of the page that a refresh would wipe: the
// revision form, or a review being written?
function topFormOpen(){
  if(document.getElementById('revFuel')) return true;
  const rc = document.getElementById('reviewComment');
  return !!((rc && rc.value.trim()) || REVIEW_RATING);
}

// A refresh for someone on the Messages tab: everything is brought up to date
// (status, queue, tab badges, the conversation, the notes below) EXCEPT the
// message box itself and a form open under it. Those are never rebuilt - on a
// phone, destroying a focused box closes the keyboard (and code can't reopen
// it), and rewriting it mid-sentence upsets autocorrect.
function renderPortalKeepComposer(opts){
  const wrap = document.getElementById('portalWrap'), live = document.getElementById('tabCard');
  if(!wrap || !live || !document.getElementById('msgInput')) return false;
  const tmp = document.createElement('div'); tmp.innerHTML = buildPortalHtml();
  const fresh = tmp.querySelector('#tabCard');
  if(!fresh || !fresh.querySelector('#msgInput')) return false;
  const pageY = window.scrollY;
  const split = function(box, anchor){
    const before = [], after = []; let seen = false;
    Array.prototype.slice.call(box.children).forEach(function(n){ if(n === anchor) seen = true; else (seen ? after : before).push(n); });
    return { before: before, after: after };
  };
  const L = split(wrap, live), F = split(tmp, fresh);
  if(!(opts && opts.keepTop)){                      // the hero / review card, unless a form is open in them
    L.before.forEach(function(n){ n.remove(); });
    F.before.forEach(function(n){ wrap.insertBefore(n, live); });
  }
  L.after.forEach(function(n){ n.remove(); });      // email preferences, help, footer
  F.after.forEach(function(n){ wrap.appendChild(n); });
  // the tab card: its tab strip and the conversation only
  const tabs = live.querySelector('.ptabs'), ftabs = fresh.querySelector('.ptabs');
  if(tabs && ftabs) tabs.innerHTML = ftabs.innerHTML;
  const list = live.querySelector('#msgList'), flist = fresh.querySelector('#msgList');
  if(list && flist && list.innerHTML !== flist.innerHTML){
    const atBottom = msgListAtBottom(list), top = list.scrollTop;
    list.innerHTML = flist.innerHTML;
    list.scrollTop = atBottom ? list.scrollHeight : top;
  }
  // the "changed your mods?" box, unless its form is open
  if(!document.getElementById('modChanges')){
    const mu = live.querySelector('#modUpdateBox'), fmu = fresh.querySelector('#modUpdateBox');
    if(mu) mu.remove();
    if(fmu){ const err = live.querySelector('#msgErr'); if(err) err.after(fmu); else live.querySelector('.ptab-body').appendChild(fmu); }
  }
  document.title = BASE_TITLE;
  wireDropzones();
  if(Math.abs(window.scrollY - pageY) > 1) window.scrollTo(0, pageY);
  return true;
}

async function submitReview(){
  const errEl = document.getElementById('reviewErr');
  const btn = document.getElementById('reviewBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!REVIEW_RATING){ errEl.className = 'status-msg err'; errEl.textContent = 'Pick a star rating first.'; return; }
  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const data = await callPortal('submit_review', { rating: REVIEW_RATING, comment: document.getElementById('reviewComment').value.trim() });
    STATE.application = data.application;
    renderPortal();
    toastLike('Thanks for your review!');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to submit: ' + e.message;
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
}
window.submitReview = submitReview;

function renderMessages(){
  if(!STATE.messages.length) return '<div class="empty-state">No messages yet.</div>';
  return STATE.messages.map(function(m){
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const isModUpdate = m.message_type === 'mod_update';
    const cls = isRevisionRequest ? 'msg-revision' : (isModUpdate ? 'msg-modupdate' : (m.sender_type === 'system' ? 'msg-system' : (m.sender_type === 'customer' ? 'msg-me' : 'msg-them')));
    let html = '<div class="msg ' + cls + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">Revision Request Sent</div>';
    } else if(isModUpdate){
      html += '<div class="msg-modupdate-badge">Mod Update Sent &middot; ' + fmtDate(m.created_at) + '</div>';
    } else if(m.sender_type !== 'system'){
      html += '<div class="msg-meta">' + (m.sender_type === 'customer' ? 'You' : 'Ghost Tuning') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div></div>';
    return html;
  }).join('');
}

// Customer tells the tuner which revision is actually on the car. Updates
// the tuner's dashboard live and is logged there with who set it.
async function markFlashed(fileId){
  const f = STATE.files.find(function(x){ return x.id === fileId; });
  const label = f && f.revision_number ? 'Revision ' + f.revision_number : (f ? f.file_name : 'this tune');
  if(!confirm('Mark ' + label + ' as the tune currently flashed on your car?\n\nYour tuner will be notified.')) return;
  const btn = document.getElementById('flashBtn-' + fileId);
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    const data = await callPortal('set_current_tune', { file_id: fileId });
    if(data.files) STATE.files = data.files;
    renderPortal();
    toastLike(label + ' marked as flashed - your tuner has been notified.');
  }catch(e){
    toastLike('Could not update: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Mark as flashed'; }
  }
}
window.markFlashed = markFlashed;

  const errEl = document.getElementById('modErr');
  const btn = document.getElementById('modSubmitBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!changes){ errEl.className = 'status-msg err'; errEl.textContent = 'Describe what changed.'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('update_mods', { changes: changes });
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Mod update sent - your tuner has been notified.');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
    btn.disabled = false; btn.textContent = 'Send Update';
  }
}
window.submitModUpdate = submitModUpdate;

function isCustomerEditing(){
  if(document.getElementById('revFuel')) return true;          // revision form open
  if(document.getElementById('modChanges')) return true;       // mod update form open
  const fi = document.getElementById('fileInput');
  if(fi && fi.files && fi.files.length) return true;          // file chosen, not yet uploaded
  const rc = document.getElementById('reviewComment');
  if((rc && rc.value.trim()) || REVIEW_RATING) return true;   // review in progress
  return false;
}

// The conversation is "at the bottom" when the newest message is in view -
// only then should a refresh scroll it down to show new messages. Someone
// scrolled up reading older messages stays where they are.
function msgListAtBottom(list){
  return !list || list.scrollHeight - list.scrollTop - list.clientHeight < 40;
}

async function loadStatus(silent){
  try{
    const data = await callPortal('get_status', { silent: !!silent });   // a background refresh must not count as a visit
    // Read what the customer is doing right before deciding how to redraw.
    const draftEl = document.getElementById('msgInput');
    const draft = draftEl ? draftEl.value : '';
    const tunerBefore = tunerMessageCount();
    STATE.application = data.application;
    STATE.messages = data.messages;
    STATE.files = data.files;
    STATE.invoices = data.invoices || [];
    STATE.logGuide = data.log_guide || null;
    STATE.queue = data.queue || null;
    STATE.timeline = data.timeline || [];
    STATE.flashGuide = data.flash_guide || null;
    STATE.revisions = data.revisions || null;
    if(silent && tunerMessageCount() > tunerBefore && STATE.tab !== 'messages') toastLike('New message from your tuner');
    // A background refresh (25s poll or realtime ping) must never wipe out
    // something the customer is halfway through. The data is updated
    // either way; the re-render just waits until they submit or cancel,
    // both of which re-render on their own.
    if(silent){
      // Messages tab: refresh everything around the message box, never the box.
      if(STATE.tab === 'messages' && renderPortalKeepComposer({ keepTop: topFormOpen() })){ subscribeRealtime(); return; }
      if(isCustomerEditing()){ subscribeRealtime(); return; }
    }
    const oldList = document.getElementById('msgList');
    const listAtBottom = msgListAtBottom(oldList), listTop = oldList ? oldList.scrollTop : 0;
    const pageY = window.scrollY;
    renderPortal();
    const newDraftEl = document.getElementById('msgInput');
    if(newDraftEl && draft) newDraftEl.value = draft;
    if(silent){
      // Leave the reader where they were: page position, and the conversation
      // too unless they were already looking at the newest message.
      const newList = document.getElementById('msgList');
      if(newList && oldList && !listAtBottom) newList.scrollTop = listTop;
      if(Math.abs(window.scrollY - pageY) > 1) window.scrollTo(0, pageY);
    }
    subscribeRealtime();
  }catch(e){
    if(!silent) renderInvalid(e.message || "This link isn't valid.");
  }
}

// Real-time updates without giving the portal's anon key any direct table
// access: the tuner app broadcasts a content-free "something changed" ping
// on a channel keyed to this application's id whenever it sends a message,
// uploads a file, or changes status. This client just listens for the ping
// and re-fetches through the SAME token-gated edge function every other
// portal action already uses - no RLS relaxation needed for realtime to work.
function subscribeRealtime(){
  if(STATE._channel || !STATE.application || !STATE.application.id) return;
  STATE._channel = sb.channel('tuning-portal-' + STATE.application.id)
    .on('broadcast', { event: 'update' }, function(){ loadStatus(true); })
    .subscribe();
}

// Belt-and-suspenders fallback in case a broadcast is ever missed (a brief
// connection drop, a tab that was asleep, etc.) - quiet periodic refresh.
setInterval(function(){ if(STATE.application) loadStatus(true); }, 25000);

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  const errEl = document.getElementById('msgErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!body){ errEl.className = 'status-msg err'; errEl.textContent = 'Write a message first.'; return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('send_message', { body: body });
    STATE.messages.push(data.message);
    input.value = '';
    portalDraftClear();
    document.getElementById('msgList').innerHTML = renderMessages();
    document.getElementById('msgList').scrollTop = document.getElementById('msgList').scrollHeight;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Send Message';
}
window.sendMessage = sendMessage;

async function uploadLog(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  const errEl = document.getElementById('uploadErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!file){ errEl.className = 'status-msg err'; errEl.textContent = 'Choose a file first.'; return; }
  if(file.size > MAX_UPLOAD_MB * 1048576){ errEl.className = 'status-msg err'; errEl.textContent = 'That file is too large (the limit is ' + MAX_UPLOAD_MB + ' MB).'; return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  uploadStart(file, 'uploadProgress');
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;

    const typeEl = document.getElementById('fileTypeSelect');
    const data = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: typeEl ? typeEl.value : 'log' });
    STATE.files.unshift(data.file);
    // Full re-render so the logging card's baseline banner clears too.
    uploadEnd();
    renderPortal();
    toastLike('Upload complete - your tuner has been notified.');
    return;
  }catch(e){
    uploadEnd();
    errEl.className = 'status-msg err'; errEl.textContent = 'Upload failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Upload';
}
window.uploadLog = uploadLog;

async function downloadFile(fileId){
  try{
    const data = await callPortal('download_file', { file_id: fileId });
    window.open(data.url, '_blank');
  }catch(e){
    alert('Could not open file: ' + e.message);
  }
}
window.downloadFile = downloadFile;

document.addEventListener('DOMContentLoaded', function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if(!TOKEN){
    renderInvalid("This link is missing its access token. Check the link in your original confirmation email.");
    return;
  }
  loadStatus();
});
</script>

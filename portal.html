.tgk-tuning-portal h1,.tgk-tuning-portal h2,.tgk-tuning-portal p{margin:0;padding:0}
.tgk-tuning-portal .wrap{max-width:760px;margin:0 auto;padding:20px 20px 80px}
.tgk-tuning-portal .portal-brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:32px 20px 12px}
.tgk-tuning-portal .portal-brand img{height:22px;width:auto;display:block}
.tgk-tuning-portal .portal-brand .ghost-icon{height:26px}
.tgk-tuning-portal .portal-brand .brand-sep{width:1px;height:16px;background:var(--border2)}
.tgk-tuning-portal .portal-brand .brand-sub{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.tgk-tuning-portal .card{background:rgba(255,255,255,.66);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:18px;box-shadow:0 2px 10px rgba(17,24,39,.06);position:relative;overflow:hidden}
.tgk-tuning-portal .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.tgk-tuning-portal .card.status-card{border-left:4px solid var(--status-accent, var(--teal))}

.tgk-tuning-portal .invoice-box{border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);padding:12px 16px;margin-bottom:12px}
.tgk-tuning-portal .invoice-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.tgk-tuning-portal .invoice-line:last-of-type{border-bottom:none}
.tgk-tuning-portal .invoice-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:2px;border-top:2px solid var(--text);font-weight:700}
.tgk-tuning-portal .invoice-total .amt{font-size:18px}


/* Carbon-fiber hero header replacing the plain white status card */
.hero-carbon{
  background-color:var(--cb-c);background-image:var(--cb-i);
  background-size:100% 100%,100% 100%,100% 100%,auto 260px;
  background-position:0 0,0 0,0 0,center 30%;
  border-radius:var(--r-lg);padding:26px 28px;margin-bottom:18px;
  box-shadow:0 8px 24px rgba(13,15,16,.35),inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;overflow:hidden;color:#fff;z-index:0
}
.hero-carbon::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent);z-index:2}
.hero-carbon::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,11,.72),rgba(8,10,11,.5) 50%,rgba(8,10,11,.72));z-index:1;pointer-events:none}
.hero-inner{position:relative;z-index:2}
.tgk-tuning-portal .hero-carbon h1{color:#fff;font-size:21px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tgk-tuning-portal .hero-carbon .sub{color:#B9C2CC;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tgk-tuning-portal .hero-carbon .car-line{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tgk-tuning-portal .hero-carbon .status-blurb{color:#D6DBE0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hero-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#5ce6cc;letter-spacing:.03em;text-transform:uppercase}

.stepper-row{display:flex;align-items:center;margin:20px 0 6px}
.stepper-row .st-dot{width:13px;height:13px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:transparent;flex:none;transition:all .2s}
.stepper-row .st-dot.done{border-color:var(--teal);background:var(--teal)}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

    headers: {

      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'apikey': SUPABASE_ANON_KEY

    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(!data.success) throw new Error(data.error || 'Request failed');
  return data;
}

  const POSITION_OVERRIDE = { needs_info:'under_review', declined:'under_review', revision_requested:'tune_sent', archived:'completed' };
  const effective = POSITION_OVERRIDE[a.status] || a.status;
  const idx = MAIN_STAGES.findIndex(function(s){ return s.id === effective; });

  let dots = '<div class="stepper-row">';
  let labels = '<div class="stepper-labels">';
  MAIN_STAGES.forEach(function(s, i){
    const done = idx > i;
    const isCurrent = i === idx;
    dots += '<div class="st-dot ' + (done ? 'done' : (isCurrent ? 'current' : '')) + '"></div>';
    if(i < MAIN_STAGES.length - 1) dots += '<div class="st-seg ' + (idx > i ? 'done' : '') + '"></div>';
    labels += '<span class="' + (isCurrent ? 'current' : '') + '">' + s.label + '</span>';
  });
  dots += '</div>';
  labels += '</div>';
  return dots + labels;
}

function renderRevisionCta(a){

const REVISION_COMPLAINTS = [

  { id:'rich', label:'Running rich' },
  { id:'lean', label:'Running lean' },
  { id:'boost_low', label:'Boost too low' },

// of a one-line "still slow" - and a datalog is required, since a revision

// pipeline as the Files card, then its id is attached to the request.
function showRevisionForm(){

    + '<div class="rev-grid">' + checks + '</div>'

      + '<div><div class="rev-label">Ethanol % (if known)</div><input class="form-input rev-input" id="revEthanol" type="number" min="0" max="100" placeholder="e.g. 42"></div>'

    + '<div class="rev-label">Anything else?</div>'

    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn btn-sm" onclick="submitRevisionRequest()" id="revisionSubmitBtn">Submit Revision Request</button>'
    + '<button class="btn btn-ghost-light btn-sm" onclick="renderPortal()">Cancel</button>'
    + '</div>'
    + '<div class="status-msg" id="revisionErr"></div>';

async function submitRevisionRequest(){
  const btn = document.getElementById('revisionSubmitBtn');
  const errEl = document.getElementById('revisionErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  function fail(msg){ errEl.className = 'status-msg err'; errEl.textContent = msg; }

  const complaints = Array.prototype.slice.call(document.querySelectorAll('input[name="revComplaint"]:checked')).map(function(c){ return c.value; });
  const fuel = document.getElementById('revFuel').value;
  const ethanolRaw = document.getElementById('revEthanol').value;
  const conditions = document.getElementById('revConditions').value.trim();
  const notes = document.getElementById('revisionNotes').value.trim();
  const file = document.getElementById('revLogFile').files[0];

  if(!complaints.length) return fail('Pick at least one issue.');
  if(!fuel) return fail('Select the fuel you\'re running.');
  if(!file) return fail('Attach a datalog - your tuner needs it to diagnose the issue.');
  const ethanol = ethanolRaw === '' ? null : Number(ethanolRaw);
  if(ethanol !== null && (isNaN(ethanol) || ethanol < 0 || ethanol > 100)) return fail('Ethanol % must be between 0 and 100.');

  btn.disabled = true; btn.textContent = 'Uploading log...';
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;
    const up = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: 'log' });
    if(up.file) STATE.files.unshift(up.file);

    btn.textContent = 'Submitting...';
    const data = await callPortal('request_revision', {
      complaints: complaints, fuel: fuel, ethanol_pct: ethanol,
      conditions: conditions, notes: notes, log_file_id: up.file ? up.file.id : null
    });
    STATE.application = data.application;
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Revision request sent - your tuner has been notified.');
  }catch(e){
    fail('Failed to submit: ' + e.message);
    btn.disabled = false; btn.textContent = 'Submit Revision Request';
  }
}
window.submitRevisionRequest = submitRevisionRequest;

function toastLike(msg){

  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

// A styled file picker: the real <input type="file"> is visually hidden
// inside a drop zone, so the page never shows the browser's native
// "Browse..." button. Supports drag-and-drop; shows the chosen file with
// its size and a remove control.
function fileDropHtml(id, dark, enableBtnId){
  return '<label class="dropzone' + (dark ? ' dark' : '') + '" id="dz-' + id + '" data-input="' + id + '"' + (enableBtnId ? ' data-btn="' + enableBtnId + '"' : '') + '>'
    + '<input type="file" id="' + id + '" class="dz-input" onchange="dzChanged(\'' + id + '\')">'
    + '<span class="dz-empty"><span class="dz-strong">Drop a file here</span> or <span class="dz-link">browse</span></span>'
    + '<span class="dz-file"><span class="dz-name"></span><span class="dz-size"></span>'
    + '<button type="button" class="dz-clear" title="Remove" onclick="event.preventDefault();dzClear(\'' + id + '\')">&times;</button></span>'
    + '</label>';
}
function fmtBytes(n){ return n < 1024 ? n + ' B' : (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'); }
function dzChanged(id){
  const input = document.getElementById(id), zone = document.getElementById('dz-' + id);
  if(!input || !zone) return;
  const f = input.files && input.files[0];
  zone.classList.toggle('has-file', !!f);
  if(f){
    zone.querySelector('.dz-name').textContent = f.name;
    zone.querySelector('.dz-size').textContent = fmtBytes(f.size);
  }
  const btn = zone.getAttribute('data-btn') && document.getElementById(zone.getAttribute('data-btn'));
  if(btn) btn.disabled = !f;
}
window.dzChanged = dzChanged;
function dzClear(id){
  const input = document.getElementById(id);
  if(input){ input.value = ''; dzChanged(id); }
}
window.dzClear = dzClear;
function wireDropzones(){
  document.querySelectorAll('.dropzone').forEach(function(zone){
    if(zone._wired) return;
    zone._wired = true;
    ['dragenter','dragover'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      const id = zone.getAttribute('data-input');
      const input = document.getElementById(id);
      if(input && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        try{ input.files = e.dataTransfer.files; }catch(err){ /* very old browser: fall back to browse */ }
        dzChanged(id);
      }
    });
  });
}
function setUploadType(btn){
  btn.parentNode.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.toggle('on', b === btn); });

function fileKindBadge(f){

function renderCurrentTuneCard(tunes, closed){
  if(!tunes.length){
    return '<div class="tune-hero empty"><div class="th-empty-title">No tune yet</div>'
      + '<div class="file-meta">Your tune will appear here as soon as your tuner uploads it.</div></div>';
  }
  const cur = tunes.find(function(f){ return f.is_current; });

  const who = f.flashed_marked_by === 'customer' ? 'by you' : (f.flashed_marked_by ? 'by your tuner' : '');
  let html = '<div class="tune-hero' + (cur ? '' : ' not-marked') + '">'
    + '<div class="th-main">'
      + '<div class="th-kicker">' + (cur ? 'Currently flashed' : 'Latest tune') + '</div>'
      + '<div class="th-title">' + escapeHtml(tuneLabel(f)) + (f.fuel ? ' <span class="pill pill-muted">' + escapeHtml(f.fuel) + '</span>' : '') + '</div>'
      + '<div class="file-meta">' + escapeHtml(f.file_name) + ' &middot; sent ' + fmtDate(f.created_at) + '</div>'
      + (cur
          ? (who || f.flashed_marked_at ? '<div class="th-marked">Marked flashed ' + who + (f.flashed_marked_at ? ' &middot; ' + fmtDate(f.flashed_marked_at) : '') + '</div>' : '')
          : '<div class="th-unmarked">Not marked as flashed yet</div>')

      + (!cur && !closed ? '<button class="btn btn-muted" id="flashBtn-' + f.id + '" onclick="markFlashed(\'' + f.id + '\')">I\'ve flashed this</button>' : '')
    + '</div></div>';
  return html;
}

function renderFilesTab(){
  const closed = ['declined','archived'].indexOf((STATE.application || {}).status) !== -1;
  const tunes = STATE.files.filter(function(f){ return f.uploaded_by === 'tuner' && f.file_type === 'tune'; })
    .sort(function(x, y){
      const rx = x.revision_number || 0, ry = y.revision_number || 0;
      if(rx !== ry) return ry - rx;
      return new Date(y.created_at) - new Date(x.created_at);
    });
  const cur = tunes.find(function(f){ return f.is_current; }) || tunes[0];
  const earlier = tunes.filter(function(f){ return f !== cur; });
  const mine = STATE.files.filter(function(f){ return f.uploaded_by === 'customer'; });
  const fromTuner = STATE.files.filter(function(f){ return f.uploaded_by === 'tuner' && f.file_type !== 'tune'; });

  let html = '<div id="fileList">';

  // 1. The tune on the car
  html += '<div class="fs-title">Your tune</div>' + renderCurrentTuneCard(tunes, closed);

  // 2. Send a file
  html += '<div class="fs-block">';
  html += '<div class="upload-head"><span class="fs-title" style="margin:0">Send a file to your tuner</span>'
    + '<div class="seg" role="group" aria-label="File type">'
    + [['log','Datalog'],['dyno','Dyno sheet'],['other','Other']].map(function(t, i){
        return '<button type="button" class="seg-btn' + (i === 0 ? ' on' : '') + '" data-val="' + t[0] + '" onclick="setUploadType(this)">' + t[1] + '</button>';
      }).join('')
    + '</div><input type="hidden" id="fileTypeSelect" value="log"></div>';
  html += fileDropHtml('fileInput', false, 'uploadBtn');
  html += '<div class="upload-actions"><button class="btn btn-sm" onclick="uploadLog()" id="uploadBtn" disabled>Upload</button></div>';
  html += '<div class="status-msg" id="uploadErr"></div>';
  html += '</div>';

  // 3. What the customer has sent
  if(mine.length){
    html += '<div class="fs-title">Files you\'ve sent <span class="fs-count">' + mine.length + '</span></div><div class="fs-list">';
    html += mine.map(function(f){
      return '<div class="fs-row">' + fileKindBadge(f)
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(f.file_name) + '</div>'
        + '<div class="file-meta">' + fmtDate(f.created_at) + '</div></div></div>';
    }).join('');
    html += '</div>';
  }

  // 4. Non-tune files from the tuner
  if(fromTuner.length){
    html += '<div class="fs-title">From your tuner <span class="fs-count">' + fromTuner.length + '</span></div><div class="fs-list">';
    html += fromTuner.map(function(f){
      return '<div class="fs-row">' + fileKindBadge(f)
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(f.file_name) + '</div>'
        + '<div class="file-meta">' + fmtDate(f.created_at) + '</div></div>'
        + '<button class="btn btn-sm btn-muted" onclick="downloadFile(\'' + f.id + '\')">Download</button></div>';
    }).join('');
    html += '</div>';
  }

  // 5. Tune history, collapsed
  if(earlier.length){
    html += '<details class="fs-history"><summary>Earlier tune revisions <span class="fs-count">' + earlier.length + '</span></summary><div class="fs-list">';
    html += earlier.map(function(f){
      return '<div class="fs-row fs-rev">'
        + '<div class="fs-info"><div class="fs-name">' + escapeHtml(tuneLabel(f)) + (f.fuel ? ' <span class="pill pill-muted">' + escapeHtml(f.fuel) + '</span>' : '') + '</div>'
        + '<div class="file-meta">' + escapeHtml(f.file_name) + ' &middot; ' + fmtDate(f.created_at) + '</div>'
        + (f.description ? '<div class="fs-notes">' + escapeHtml(f.description) + '</div>' : '') + '</div>'
        + '<div class="fs-actions">'
        + (!closed ? '<button class="btn btn-sm btn-muted" id="flashBtn-' + f.id + '" onclick="markFlashed(\'' + f.id + '\')">Mark as flashed</button>' : '')
        + '<button class="btn btn-sm btn-muted" onclick="downloadFile(\'' + f.id + '\')">Download</button></div></div>';
    }).join('');
    html += '</div></details>';
  }

  html += '</div>';
  return html;
}

  html += '<div class="sub" style="margin-top:2px">' + escapeHtml(a.customer_name) + ' &middot; ' + escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ')) + '</div>';
  html += '<div style="margin-top:12px"><span class="pill ' + (STATUS_PILL[a.status]||'pill-muted') + '">' + (STATUS_LABEL[a.status]||a.status) + '</span></div>';
  if(['declined','archived'].indexOf(a.status) === -1) html += renderStageStepper(a);
  html += '<p class="status-blurb">' + escapeHtml(STATUS_BLURB[a.status] || '') + '</p>';
  if(STATE.queue){
    html += '<div class="queue-line"><span class="queue-num">#' + STATE.queue.position + '</span> in the build queue'
      + (STATE.queue.in_progress ? ' &middot; ' + STATE.queue.in_progress + ' tune' + (STATE.queue.in_progress > 1 ? 's' : '') + ' currently being built' : '') + '</div>';
  }
  html += renderActionChips(a);
  html += renderRevisionCta(a);
  html += '</div></div>';

  html += renderReviewCard(a);

  const tabs = portalTabs(a);
  if(!tabs.some(function(t){ return t.id === STATE.tab; })) STATE.tab = 'messages';
  html += '<div class="card tab-card" id="tabCard"><div class="ptabs">' + tabs.map(function(t){
    return '<button class="ptab' + (STATE.tab === t.id ? ' active' : '') + '" onclick="setPortalTab(\'' + t.id + '\')">' + t.label
      + (t.badge ? '<span class="ptab-badge">' + t.badge + '</span>' : '') + '</button>';
  }).join('') + '</div><div class="ptab-body">';
  if(STATE.tab === 'messages') html += renderMessagesTab(a);
  else if(STATE.tab === 'files') html += renderFilesTab();
  else if(STATE.tab === 'invoices') html += renderInvoiceCard();
  else if(STATE.tab === 'logging') html += renderLogGuideCard(a);
  html += '</div></div>';

  html += renderEmailPrefs(a);
  html += '<p class="footer-note">TGK Motorsport - Ghost Tuning</p>';

  document.getElementById('portalWrap').innerHTML = html;

  // Every render fully replaces this DOM (innerHTML), which resets any
  // scrollable element back to its top by default - so without this, an
  // unrelated realtime update (an invoice getting paid, a status change)
  // would silently scroll the customer away from their most recent
  // messages, not just a genuinely new message arriving.
  const list = document.getElementById('msgList');
  if(list) list.scrollTop = list.scrollHeight;
  wireDropzones();
}

function renderInvoiceCard(){
  const invoices = STATE.invoices || [];
  if(!invoices.length) return '<div class="empty-state">No invoices yet.</div>';
  const unpaid = unpaidInvoices();
  const paid = invoices.filter(function(i){ return i.status === 'paid'; });
  let html = '';

  if(unpaid.length){
    html += '<h2>Awaiting payment</h2>';
    html += unpaid.map(function(inv){
      const total = Number(inv.amount || 0).toFixed(2);
      return '<div class="invoice-box" style="margin-bottom:12px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span class="pill pill-yellow">Awaiting Payment</span><span class="sub" style="font-size:12px;margin:0">' + fmtDate(inv.sent_at || inv.created_at) + '</span></div>'
        + invoiceLinesHtml(inv)
        + '<div class="invoice-total"><span>Total</span><span class="amt">$' + total + '</span></div>'
        + (inv.notes ? '<p class="sub" style="margin:8px 0 0;font-size:13px">' + escapeHtml(inv.notes) + '</p>' : '')
        + (inv.invoice_url ? '<div style="margin-top:10px"><a href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener" class="btn" style="text-decoration:none">Pay Invoice - $' + total + '</a></div>' : '')
        + '</div>';
    }).join('');
  } else {
    html += '<div class="all-paid">&#10003; You\'re all paid up.</div>';
  }

  if(paid.length){
    html += '<h2 style="margin-top:18px">Payment history</h2>';
    html += paid.map(function(inv){
      return '<div class="paid-row" onclick="this.classList.toggle(\'open\')">'
        + '<div class="paid-sum"><span class="pill pill-green">Paid</span><span style="flex:1">' + fmtDate(inv.paid_at || inv.sent_at) + '</span><strong>$' + Number(inv.amount || 0).toFixed(2) + '</strong><span class="chev">&#9662;</span></div>'
        + '<div class="paid-detail">' + invoiceLinesHtml(inv) + '</div>'
        + '</div>';
    }).join('');
  }
  return html;
}

// Shows the tuner-assigned DS1 logging instructions, and - until the
// customer has uploaded one - asks clearly for the baseline log.
function needsBaselineLog(a){
  const myLogs = STATE.files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  return !myLogs.length && ['submitted','under_review','needs_info','accepted'].indexOf(a.status) !== -1;
}
function hasLoggingTab(a){
  if(['declined','archived','completed'].indexOf(a.status) !== -1) return false;
  return !!STATE.logGuide || needsBaselineLog(a);
}
function renderLogGuideCard(a){
  if(!hasLoggingTab(a)) return '';
  const g = STATE.logGuide;
  const myLogs = STATE.files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  const needsBaseline = needsBaselineLog(a);

  let html = '';
  html += '<h2>' + (g ? 'How to log: ' + escapeHtml(g.name) : 'Datalog needed') + '</h2>';
  if(needsBaseline){
    html += '<div class="baseline-banner">Your tuner needs a <strong>baseline (stock) datalog</strong> before your tune can start. '
      + 'Record it following the steps below, then upload it in the Files section.</div>';
  }
  if(g){
    const params = (g.parameters || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if(params.length){
      html += '<div class="sub" style="font-weight:700;color:var(--text2);margin:10px 0 6px">Parameters to log</div>';
      html += '<ul class="log-params">' + params.map(function(p){ return '<li>' + escapeHtml(p) + '</li>'; }).join('') + '</ul>';
    }
    if(g.procedure){
      html += '<div class="sub" style="font-weight:700;color:var(--text2);margin:10px 0 6px">Procedure</div>';
      html += '<div class="log-procedure">' + escapeHtml(g.procedure) + '</div>';
    }
  }
  if(myLogs.length){
    html += '<div class="sub" style="margin-top:12px"><span class="pill pill-green">Log received</span> Latest: ' + escapeHtml(myLogs[0].file_name) + ' &middot; ' + fmtDate(myLogs[0].created_at) + '</div>';
  }
  html += '<div style="margin-top:14px"><button class="btn btn-sm" onclick="setPortalTab(\'files\')">Upload a log</button></div>';
  return html;
}

// Completion review - once the tune is done. Rating + optional comment,
// one per application; after submitting it shows as a thank-you.
function renderReviewCard(a){
  if(a.status !== 'completed') return '';
  if(a.review_rating){
    return '<div class="card"><h2>Your review</h2>'
      + '<div class="review-stars static">' + [1,2,3,4,5].map(function(n){ return '<span class="' + (n <= a.review_rating ? 'on' : '') + '">&#9733;</span>'; }).join('') + '</div>'
      + (a.review_comment ? '<p class="sub" style="margin-top:6px;white-space:pre-wrap">' + escapeHtml(a.review_comment) + '</p>' : '')
      + '<p class="sub" style="margin-top:6px">Thanks for the feedback!</p></div>';
  }
  return '<div class="card" id="reviewCard"><h2>How did we do?</h2>'
    + '<div class="sub" style="margin-bottom:8px">Your tune is complete. Rate your experience with Ghost Tuning.</div>'
    + '<div class="review-stars" id="reviewStars">' + [1,2,3,4,5].map(function(n){ return '<span onclick="setReviewRating(' + n + ')" data-n="' + n + '">&#9733;</span>'; }).join('') + '</div>'
    + '<textarea class="form-input" id="reviewComment" placeholder="Anything you\'d like to share? (optional)" style="margin:10px 0;min-height:60px"></textarea>'
    + '<button class="btn btn-sm" id="reviewBtn" onclick="submitReview()">Submit Review</button>'
    + '<div class="status-msg" id="reviewErr"></div></div>';
}

let REVIEW_RATING = 0;
function setReviewRating(n){
  REVIEW_RATING = n;
  document.querySelectorAll('#reviewStars span').forEach(function(el){
    el.className = Number(el.getAttribute('data-n')) <= n ? 'on' : '';
  });
}
window.setReviewRating = setReviewRating;

async function submitReview(){
  const errEl = document.getElementById('reviewErr');
  const btn = document.getElementById('reviewBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!REVIEW_RATING){ errEl.className = 'status-msg err'; errEl.textContent = 'Pick a star rating first.'; return; }
  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const data = await callPortal('submit_review', { rating: REVIEW_RATING, comment: document.getElementById('reviewComment').value.trim() });
    STATE.application = data.application;
    renderPortal();
    toastLike('Thanks for your review!');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to submit: ' + e.message;
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
}
window.submitReview = submitReview;

function renderMessages(){
  if(!STATE.messages.length) return '<div class="empty-state">No messages yet.</div>';
  return STATE.messages.map(function(m){
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const isModUpdate = m.message_type === 'mod_update';
    const cls = isRevisionRequest ? 'msg-revision' : (isModUpdate ? 'msg-modupdate' : (m.sender_type === 'system' ? 'msg-system' : (m.sender_type === 'customer' ? 'msg-me' : 'msg-them')));
    let html = '<div class="msg ' + cls + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">Revision Request Sent</div>';
    } else if(isModUpdate){
      html += '<div class="msg-modupdate-badge">Mod Update Sent &middot; ' + fmtDate(m.created_at) + '</div>';
    } else if(m.sender_type !== 'system'){
      html += '<div class="msg-meta">' + (m.sender_type === 'customer' ? 'You' : 'Ghost Tuning') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div></div>';
    return html;
  }).join('');
}

// Customer tells the tuner which revision is actually on the car. Updates
// the tuner's dashboard live and is logged there with who set it.
async function markFlashed(fileId){
  const f = STATE.files.find(function(x){ return x.id === fileId; });
  const label = f && f.revision_number ? 'Revision ' + f.revision_number : (f ? f.file_name : 'this tune');
  if(!confirm('Mark ' + label + ' as the tune currently flashed on your car?\n\nYour tuner will be notified.')) return;
  const btn = document.getElementById('flashBtn-' + fileId);
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    const data = await callPortal('set_current_tune', { file_id: fileId });
    if(data.files) STATE.files = data.files;
    renderPortal();
    toastLike(label + ' marked as flashed - your tuner has been notified.');
  }catch(e){
    toastLike('Could not update: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Mark as flashed'; }
  }
}
window.markFlashed = markFlashed;


// Mid-project setup changes (new parts, different fuel) - flagged to the
// tuner so the next revision is built for what's actually on the car.
function showModUpdateForm(){
  const el = document.getElementById('modUpdateBox');
  if(!el) return;
  el.innerHTML = '<div class="sub" style="margin-bottom:6px">What changed on the car? Your tuner will be notified.</div>'
    + '<textarea class="form-input" id="modChanges" placeholder="e.g. Installed catless downpipes, switched to E40" style="margin-bottom:10px;min-height:60px"></textarea>'
    + '<div style="display:flex;gap:8px"><button class="btn btn-sm" id="modSubmitBtn" onclick="submitModUpdate()">Send Update</button>'
    + '<button class="btn btn-sm btn-muted" onclick="hideModUpdateForm()">Cancel</button></div>'
    + '<div class="status-msg" id="modErr"></div>';
}
window.showModUpdateForm = showModUpdateForm;
function hideModUpdateForm(){
  const el = document.getElementById('modUpdateBox');
  if(el) el.innerHTML = '<button class="btn btn-sm btn-muted" onclick="showModUpdateForm()">Changed your mods? Let your tuner know</button>';
}
window.hideModUpdateForm = hideModUpdateForm;

async function submitModUpdate(){
  const changes = document.getElementById('modChanges').value.trim();
  const errEl = document.getElementById('modErr');
  const btn = document.getElementById('modSubmitBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!changes){ errEl.className = 'status-msg err'; errEl.textContent = 'Describe what changed.'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('update_mods', { changes: changes });
    if(data.message) STATE.messages.push(data.message);
    renderPortal();
    toastLike('Mod update sent - your tuner has been notified.');
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
    btn.disabled = false; btn.textContent = 'Send Update';
  }
}
window.submitModUpdate = submitModUpdate;

function isCustomerEditing(){
  if(document.getElementById('revFuel')) return true;          // revision form open
  if(document.getElementById('modChanges')) return true;       // mod update form open
  const fi = document.getElementById('fileInput');
  if(fi && fi.files && fi.files.length) return true;          // file chosen, not yet uploaded
  const rc = document.getElementById('reviewComment');
  if((rc && rc.value.trim()) || REVIEW_RATING) return true;   // review in progress
  return false;
}

async function loadStatus(silent){
  try{
    const data = await callPortal('get_status', {});
    const draftEl = document.getElementById('msgInput');
    const draft = draftEl ? draftEl.value : '';
    STATE.application = data.application;
    STATE.messages = data.messages;
    STATE.files = data.files;
    STATE.invoices = data.invoices || [];
    STATE.logGuide = data.log_guide || null;
    STATE.queue = data.queue || null;
    // A background refresh (25s poll or realtime ping) must never wipe out
    // something the customer is halfway through. The data is updated
    // either way; the re-render just waits until they submit or cancel,
    // both of which re-render on their own.
    if(silent && isCustomerEditing()){ subscribeRealtime(); return; }
    renderPortal();
    const newDraftEl = document.getElementById('msgInput');
    if(newDraftEl && draft) newDraftEl.value = draft;
    subscribeRealtime();
  }catch(e){
    if(!silent) renderInvalid(e.message || "This link isn't valid.");
  }
}

// Real-time updates without giving the portal's anon key any direct table
// access: the tuner app broadcasts a content-free "something changed" ping
// on a channel keyed to this application's id whenever it sends a message,
// uploads a file, or changes status. This client just listens for the ping
// and re-fetches through the SAME token-gated edge function every other
// portal action already uses - no RLS relaxation needed for realtime to work.
function subscribeRealtime(){
  if(STATE._channel || !STATE.application || !STATE.application.id) return;
  STATE._channel = sb.channel('tuning-portal-' + STATE.application.id)
    .on('broadcast', { event: 'update' }, function(){ loadStatus(true); })
    .subscribe();
}

// Belt-and-suspenders fallback in case a broadcast is ever missed (a brief
// connection drop, a tab that was asleep, etc.) - quiet periodic refresh.
setInterval(function(){ if(STATE.application) loadStatus(true); }, 25000);

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  const errEl = document.getElementById('msgErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!body){ errEl.className = 'status-msg err'; errEl.textContent = 'Write a message first.'; return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const data = await callPortal('send_message', { body: body });
    STATE.messages.push(data.message);
    input.value = '';
    document.getElementById('msgList').innerHTML = renderMessages();
    document.getElementById('msgList').scrollTop = document.getElementById('msgList').scrollHeight;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Failed to send: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Send Message';
}
window.sendMessage = sendMessage;

async function uploadLog(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  const errEl = document.getElementById('uploadErr');
  errEl.className = 'status-msg'; errEl.textContent = '';
  if(!file){ errEl.className = 'status-msg err'; errEl.textContent = 'Choose a file first.'; return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  try{
    const req = await callPortal('request_upload_url', { file_name: file.name });
    const { error: upErr } = await sb.storage.from('tuning-files').uploadToSignedUrl(req.path, req.uploadToken, file);
    if(upErr) throw upErr;

    const typeEl = document.getElementById('fileTypeSelect');
    const data = await callPortal('confirm_upload', { path: req.path, file_name: file.name, file_type: typeEl ? typeEl.value : 'log' });
    STATE.files.unshift(data.file);
    // Full re-render so the logging card's baseline banner clears too.
    renderPortal();
    toastLike('Upload complete - your tuner has been notified.');
    return;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.textContent = 'Upload failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Upload';
}
window.uploadLog = uploadLog;

async function downloadFile(fileId){
  try{
    const data = await callPortal('download_file', { file_id: fileId });
    window.open(data.url, '_blank');
  }catch(e){
    alert('Could not open file: ' + e.message);
  }
}
window.downloadFile = downloadFile;

document.addEventListener('DOMContentLoaded', function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if(!TOKEN){
    renderInvalid("This link is missing its access token. Check the link in your original confirmation email.");
    return;
  }
  loadStatus();
});
</script>

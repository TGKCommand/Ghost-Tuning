<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Tuning Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#f0f2f5;--bg4:#e9ebee;--bg5:#dde0e5;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#111827;--text2:#374151;--text3:#565f6d;
  --teal:#0d9488;--teal-d:#0f766e;--teal-dim:rgba(13,148,136,.09);
  --orange:#ea580c;--orange-d:#c2410c;--orange-dim:rgba(234,88,12,.09);
  --red:#dc2626;--red-dim:rgba(220,38,38,.09);
  --green:#16a34a;--green-dim:rgba(22,163,74,.09);
  --yellow:#d97706;--yellow-dim:rgba(217,119,6,.09);
  --r:6px;--r-lg:10px;--r-sm:4px;--r-md:8px;--r-pill:999px;
  --t-xs:10px;--t-sm:11.5px;--t-md:12.5px;--t-lg:14px;--t-xl:16px;--t-2xl:20px;
  --font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--t-lg);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;margin:0}
input,button,select,textarea{font-family:var(--font)}
.hidden{display:none!important}

/* ---- auth gate ---- */
#auth-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg2);z-index:100}
#auth-gate .panel{width:100%;max-width:380px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:36px 32px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.brand-mark{font-size:var(--t-2xl);font-weight:800;color:var(--teal);text-align:center}
.brand-sub{font-size:var(--t-sm);color:var(--text3);text-align:center;margin-top:4px;margin-bottom:26px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:9px 11px;font-size:var(--t-lg);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--teal)}
textarea.form-input{resize:vertical;min-height:70px}

/* ---- shell ---- */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar-wrap{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sidebar-logo{padding:16px 16px 12px;border-bottom:1px solid var(--border);position:relative}
.sidebar-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.sidebar-brand{font-size:var(--t-sm);font-weight:800;color:var(--teal);letter-spacing:.14em;text-transform:uppercase}
.sidebar-brand small{display:block;font-size:var(--t-lg);font-weight:700;color:var(--text);letter-spacing:0;text-transform:none;margin-top:2px}
#navList{flex:1;overflow-y:auto;padding-top:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;margin:1px 8px;border-radius:var(--r-md);cursor:pointer;transition:all .12s;border:1px solid transparent;background:transparent;width:calc(100% - 16px);text-align:left;color:var(--text2);font-size:var(--t-md);font-weight:500;outline:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0}
.nav-item.active .nav-dot{background:var(--teal)}
.nav-badge{font-size:var(--t-xs);font-family:var(--mono);font-weight:700;color:var(--text3);background:var(--bg4);border:1px solid var(--border);padding:1px 6px;border-radius:var(--r-md);min-width:20px;text-align:center;margin-left:auto}
.nav-item.active .nav-badge{color:var(--teal);background:var(--teal-dim);border-color:rgba(13,148,136,.22)}
.sidebar-footer{margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--border)}
.sync-pill{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-label{font-size:var(--t-sm);color:var(--text2);flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-sub{font-size:var(--t-xs);color:var(--text3);margin-top:8px;cursor:pointer}
.sync-sub:hover{color:var(--text)}
.version-row{margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.version-row span{font-size:var(--t-xs);font-family:var(--mono);color:var(--text3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#ECEEF0}
.topbar{height:52px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;position:relative}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal) 30%,var(--orange) 70%,transparent 100%);opacity:.7}
.topbar-title{font-size:var(--t-xl);font-weight:700;color:var(--text)}
.content{flex:1;overflow-y:auto;padding:22px 26px}

/* ---- generic ---- */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:var(--t-xl);font-weight:700;margin:0 0 4px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.stat-num{font-size:24px;font-weight:800;color:var(--text)}
.stat-label{font-size:var(--t-sm);color:var(--text3);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:var(--t-md)}
th{text-align:left;font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:var(--bg3)}

.pill{display:inline-flex;align-items:center;padding:2.5px 9px;font-size:var(--t-xs);font-weight:600;border-radius:var(--r-md);border:1px solid transparent;white-space:nowrap}
.pill-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.pill-orange{background:var(--orange-dim);color:var(--orange);border-color:rgba(234,88,12,.2)}
.pill-red{background:var(--red-dim);color:var(--red);border-color:rgba(220,38,38,.2)}
.pill-green{background:var(--green-dim);color:var(--green);border-color:rgba(22,163,74,.2)}
.pill-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(217,119,6,.2)}
.pill-muted{background:var(--bg4);color:var(--text3);border-color:var(--border)}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:6px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:var(--t-sm);font-weight:600;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--bg5);color:var(--text)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.22)}
.btn-teal:hover{background:rgba(13,148,136,.16)}
.btn-sm{padding:4px 10px;font-size:var(--t-xs)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:6px 13px;border-radius:var(--r-pill);border:1px solid var(--border2);background:var(--bg);color:var(--text2);font-size:var(--t-sm);font-weight:600;cursor:pointer}
.filter-chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.search-input{flex:1;min-width:200px;max-width:280px}

/* ---- side panel ---- */
#tk-overlay{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
#tk-overlay.open{opacity:1;pointer-events:auto}
#tk-panel{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:94vw;background:var(--bg);box-shadow:-6px 0 24px rgba(0,0,0,.14);z-index:41;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
#tk-panel.open{transform:translateX(0)}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.panel-head h3{font-size:var(--t-xl);font-weight:700;margin:0}
.panel-head .sub{font-size:var(--t-sm);color:var(--text3);margin-top:2px}
.panel-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1;padding:4px}
.panel-close:hover{color:var(--text)}
.panel-tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-tab{padding:10px 14px;font-size:var(--t-sm);font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.panel-tab.active{color:var(--teal);border-color:var(--teal)}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px}
.panel-foot{border-top:1px solid var(--border);padding:14px 20px;flex-shrink:0}

.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.dl-item{display:flex;flex-direction:column;gap:2px}
.dl-item.full{grid-column:1/-1}
.dl-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.dl-value{font-size:var(--t-lg);color:var(--text);white-space:pre-wrap;word-break:break-word}
.section-title{font-size:var(--t-md);font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px}
.section-title:first-child{margin-top:0}

.msg-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{padding:10px 13px;border-radius:var(--r-md);max-width:88%;font-size:var(--t-md)}
.msg-tuner{background:var(--teal-dim);align-self:flex-end;margin-left:auto}
.msg-customer{background:var(--bg3);align-self:flex-start}
.msg-system{background:var(--bg4);align-self:center;font-style:italic;color:var(--text3);font-size:var(--t-sm);max-width:100%}
.msg-note{background:var(--yellow-dim);align-self:flex-end;margin-left:auto;border:1px dashed var(--yellow)}
.msg-meta{font-size:var(--t-xs);color:var(--text3);margin-bottom:3px;font-weight:600}
.msg-body{white-space:pre-wrap;word-break:break-word}

.file-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.file-row:last-child{border-bottom:none}
.file-name{font-weight:600;font-size:var(--t-md)}
.file-meta{font-size:var(--t-xs);color:var(--text3)}

.activity-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--t-sm)}
.activity-row:last-child{border-bottom:none}
.activity-row .when{color:var(--text3);font-family:var(--mono);font-size:var(--t-xs);white-space:nowrap}

.check-row{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--text2);cursor:pointer}
.check-row input{accent-color:var(--teal-d);cursor:pointer}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:var(--t-md);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--red)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .big{font-size:32px;margin-bottom:8px}

@media(max-width:820px){
  #tk-panel{width:100%;max-width:100%}
  .dl-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="auth-gate">
  <div style="width:100%;max-width:380px;padding:16px">
    <div class="panel">
      <div class="brand-mark">GHOST TUNING</div>
      <div class="brand-sub">Sign in to continue</div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="you@tgkmotorsport.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-error" style="color:var(--red);font-size:var(--t-sm);min-height:18px;margin-bottom:6px"></div>
      <button id="login-btn" class="btn btn-primary" style="width:100%;padding:10px;font-size:var(--t-md);justify-content:center" onclick="doLogin()">Sign In</button>
    </div>
    <div style="text-align:center;margin-top:10px;font-size:var(--t-xs);color:var(--text3)">Ghost Tuning Center &middot; Access restricted to the tuner</div>
  </div>
</div>

<div id="tgk-app" class="hidden" style="height:100%;width:100%">
  <div class="shell">
    <div class="sidebar-wrap">
      <div class="sidebar-logo">
        <div class="sidebar-brand">TGK MOTORSPORT<small>Ghost Tuning</small></div>
      </div>
      <div id="navList"></div>
      <div class="sidebar-footer">
        <div class="sync-pill">
          <span class="sync-dot"></span>
          <span class="sync-label" id="userLabel">-</span>
        </div>
        <div class="sync-sub" onclick="doLogout()">Sign out</div>
        <div class="version-row">
          <span>v1.00</span>
          <span id="buildDate"></span>
        </div>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="pageTitle">Dashboard</div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div id="tk-overlay" onclick="closePanel()"></div>
<div id="tk-panel"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://piamamighqiielfztgic.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA";
let sb = null;

const STATUS_ORDER = ['submitted','under_review','needs_info','accepted','declined','active','tune_sent','revision_requested','completed','archived'];
const STATUS_LABEL = {
  submitted:'Submitted', under_review:'Under Review', needs_info:'Needs Info',
  accepted:'Accepted', declined:'Declined', active:'Active',
  tune_sent:'Tune Sent', revision_requested:'Revision Requested',
  completed:'Completed', archived:'Archived'
};
const STATUS_PILL = {
  submitted:'pill-yellow', under_review:'pill-orange', needs_info:'pill-orange',
  accepted:'pill-teal', declined:'pill-red', active:'pill-teal',
  tune_sent:'pill-green', revision_requested:'pill-yellow',
  completed:'pill-green', archived:'pill-muted'
};

const NAV = [
  { id:'dashboard', label:'Dashboard' },
  { id:'applications', label:'Applications', badge: function(){ return S.applications.filter(function(a){ return a.has_unread; }).length; } },
  { id:'templates', label:'Templates' }
];

const S = { user:null, page:'dashboard', applications:[], openAppId:null, messages:{}, files:{}, activity:{}, templates:[], activeTab:'overview', filter:'active', search:'' };

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}
function fmtDateShort(iso){
  if(!iso) return '-';
  return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.className=''; }, 3200);
}
function yn(v){ return v === true ? 'Yes' : (v === false ? 'No' : '-'); }

/* ================= AUTH ================= */
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await afterLogin(data.user);
  }catch(e){
    errEl.textContent = e.message || 'Login failed.';
  }
}
window.doLogin = doLogin;

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}
window.doLogout = doLogout;

async function afterLogin(user){
  S.user = user;
  let row = null, lookupError = null;
  try{
    const { data, error } = await sb.from('team_members').select('email,display_name,tuning_access').ilike('email', user.email).maybeSingle();
    if(error) throw error;
    row = data;
  }catch(e){ lookupError = e; }

  if(!row || row.tuning_access !== true){
    let msg = 'Your account does not have Ghost Tuning Center access.';
    if(lookupError) msg += ' (team_members lookup failed: ' + lookupError.message + ')';
    else if(!row) msg += ' No team_members row found for ' + user.email + '.';
    else msg += ' Ask whoever manages the database to set tuning_access = true for this account.';
    document.getElementById('login-error').textContent = msg;
    await sb.auth.signOut();
    return;
  }

  document.getElementById('auth-gate').classList.add('hidden');
  document.getElementById('tgk-app').classList.remove('hidden');
  document.getElementById('userLabel').textContent = row.display_name || user.email;

  await loadApplications();
  await loadTemplates();
  renderNav();
  goPage('dashboard');
}

/* ================= DATA LOADING ================= */
async function loadApplications(){
  try{
    const { data, error } = await sb.from('tuning_applications').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    S.applications = data || [];
  }catch(e){
    toast('Failed to load applications: ' + e.message, true);
  }
}

async function loadMessages(appId){
  try{
    const { data, error } = await sb.from('tuning_messages').select('*').eq('application_id', appId).order('created_at', { ascending:true });
    if(error) throw error;
    S.messages[appId] = data || [];
  }catch(e){ toast('Failed to load messages: ' + e.message, true); }
}

async function loadFiles(appId){
  try{
    const { data, error } = await sb.from('tuning_files').select('*').eq('application_id', appId).order('created_at', { ascending:false });
    if(error) throw error;
    S.files[appId] = data || [];
  }catch(e){ toast('Failed to load files: ' + e.message, true); }
}

async function loadActivity(appId){
  try{
    const { data, error } = await sb.from('tuning_activity_log').select('*').eq('application_id', appId).order('created_at', { ascending:false });
    if(error) throw error;
    S.activity[appId] = data || [];
  }catch(e){ toast('Failed to load activity: ' + e.message, true); }
}

async function loadTemplates(){
  try{
    const { data, error } = await sb.from('tuning_templates').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    S.templates = data || [];
  }catch(e){ /* non-critical */ }
}

async function logActivity(appId, fieldChanged, oldValue, newValue){
  try{
    await sb.from('tuning_activity_log').insert({
      application_id: appId,
      field_changed: fieldChanged,
      old_value: oldValue != null ? String(oldValue) : null,
      new_value: newValue != null ? String(newValue) : null,
      changed_by: S.user ? S.user.email : null
    });
  }catch(e){ /* non-critical, do not block the real action on log failure */ }
}

/* ================= NAV / PAGES ================= */
function renderNav(){
  document.getElementById('navList').innerHTML = NAV.map(function(n){
    const badgeCount = n.badge ? n.badge() : 0;
    return '<button class="nav-item ' + (S.page === n.id ? 'active' : '') + '" onclick="goPage(\'' + n.id + '\')">'
      + '<span class="nav-dot"></span><span>' + escapeHtml(n.label) + '</span>'
      + (badgeCount > 0 ? '<span class="nav-badge">' + badgeCount + '</span>' : '')
      + '</button>';
  }).join('');
}

function goPage(id){
  S.page = id;
  renderNav();
  document.getElementById('pageTitle').textContent = (NAV.find(function(n){ return n.id===id; }) || {}).label || 'Dashboard';
  renderPage();
}
window.goPage = goPage;

function renderPage(){
  const el = document.getElementById('content');
  if(S.page === 'dashboard') el.innerHTML = renderDashboard();
  else if(S.page === 'applications') el.innerHTML = renderApplications();
  else if(S.page === 'templates') el.innerHTML = renderTemplates();
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const apps = S.applications;
  const needsAttention = apps.filter(function(a){ return a.status === 'submitted' || a.status === 'revision_requested'; });
  const active = apps.filter(function(a){ return ['accepted','active','tune_sent'].indexOf(a.status) !== -1; });
  const completed = apps.filter(function(a){ return a.status === 'completed'; });

  const counts = {};
  STATUS_ORDER.forEach(function(s){ counts[s] = apps.filter(function(a){ return a.status === s; }).length; });

  let html = '<div class="stat-row">';
  html += statCard(needsAttention.length, 'Needs Attention');
  html += statCard(active.length, 'Active Builds');
  html += statCard(completed.length, 'Completed');
  html += statCard(apps.length, 'Total Applications');
  html += '</div>';

  html += '<div class="card"><h2>Needs Attention</h2><div class="sub" style="color:var(--text3);font-size:var(--t-sm);margin-bottom:12px">New submissions and revision requests waiting on you</div>';
  html += needsAttention.length ? appTable(needsAttention) : '<div class="empty-state"><div class="big">&#10003;</div>All caught up. Nothing needs your attention right now.</div>';
  html += '</div>';

  return html;
}
function statCard(num, label){
  return '<div class="stat-card"><div class="stat-num">' + num + '</div><div class="stat-label">' + escapeHtml(label) + '</div></div>';
}

/* ================= APPLICATIONS LIST ================= */
function renderApplications(){
  const filters = [
    { id:'active', label:'Active', test: function(a){ return ['submitted','under_review','needs_info','accepted','active','tune_sent','revision_requested'].indexOf(a.status) !== -1; } },
    { id:'new', label:'New', test: function(a){ return a.status === 'submitted'; } },
    { id:'completed', label:'Completed', test: function(a){ return a.status === 'completed'; } },
    { id:'declined', label:'Declined', test: function(a){ return a.status === 'declined'; } },
    { id:'archived', label:'Archived', test: function(a){ return a.status === 'archived'; } },
    { id:'all', label:'All', test: function(){ return true; } }
  ];
  const active = filters.find(function(f){ return f.id === S.filter; }) || filters[0];
  let rows = S.applications.filter(active.test);
  if(S.search.trim()){
    const q = S.search.trim().toLowerCase();
    rows = rows.filter(function(a){
      return (a.customer_name||'').toLowerCase().indexOf(q) !== -1
        || (a.customer_email||'').toLowerCase().indexOf(q) !== -1
        || (a.car_make||'').toLowerCase().indexOf(q) !== -1
        || (a.car_model||'').toLowerCase().indexOf(q) !== -1;
    });
  }

  let html = '<div class="filter-row">';
  filters.forEach(function(f){
    html += '<div class="filter-chip ' + (S.filter === f.id ? 'active' : '') + '" onclick="setAppFilter(\'' + f.id + '\')">' + escapeHtml(f.label) + '</div>';
  });
  html += '<input class="form-input search-input" placeholder="Search name, email, car..." value="' + escapeHtml(S.search) + '" oninput="setAppSearch(this.value)">';
  html += '</div>';
  html += '<div class="card" style="padding:0">' + (rows.length ? appTable(rows) : '<div class="empty-state"><div class="big">-</div>No applications match this filter.</div>') + '</div>';
  return html;
}
function setAppFilter(id){ S.filter = id; renderPage(); }
window.setAppFilter = setAppFilter;
function setAppSearch(v){ S.search = v; renderPage(); }
window.setAppSearch = setAppSearch;

function appTable(rows){
  let html = '<table><thead><tr><th>#</th><th>Customer</th><th>Car</th><th>Status</th><th>Submitted</th></tr></thead><tbody>';
  rows.forEach(function(a){
    html += '<tr class="row-click" onclick="openApplication(\'' + a.id + '\')">'
      + '<td>' + (a.has_unread ? '<span class="unread-dot"></span>' : '') + '#' + a.application_number + '</td>'
      + '<td>' + escapeHtml(a.customer_name) + '<div class="file-meta">' + escapeHtml(a.customer_email) + '</div></td>'
      + '<td>' + escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ')) + '</td>'
      + '<td><span class="pill ' + (STATUS_PILL[a.status]||'pill-muted') + '">' + (STATUS_LABEL[a.status]||a.status) + '</span></td>'
      + '<td>' + fmtDateShort(a.created_at) + '</td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

/* ================= APPLICATION DETAIL PANEL ================= */
async function openApplication(id){
  S.openAppId = id;
  S.activeTab = 'overview';
  const app = S.applications.find(function(a){ return a.id === id; });
  if(!app) return;

  document.getElementById('tk-overlay').classList.add('open');
  const panel = document.getElementById('tk-panel');
  panel.innerHTML = renderPanelShell(app);
  panel.classList.add('open');

  if(app.has_unread){
    try{
      await sb.from('tuning_applications').update({ has_unread:false, unread_count:0 }).eq('id', id);
      app.has_unread = false; app.unread_count = 0;
      renderNav();
    }catch(e){ /* non-critical */ }
  }

  await Promise.all([loadMessages(id), loadFiles(id), loadActivity(id)]);
  renderPanelBody();
}
window.openApplication = openApplication;

function closePanel(){
  document.getElementById('tk-overlay').classList.remove('open');
  document.getElementById('tk-panel').classList.remove('open');
  S.openAppId = null;
}
window.closePanel = closePanel;

function renderPanelShell(app){
  return '<div class="panel-head">'
    + '<div><h3>#' + app.application_number + ' - ' + escapeHtml(app.customer_name) + '</h3>'
    + '<div class="sub">' + escapeHtml(app.customer_email) + '</div></div>'
    + '<button class="panel-close" onclick="closePanel()">&times;</button>'
    + '</div>'
    + '<div style="padding:14px 20px 0">' + statusSelector(app) + '</div>'
    + '<div class="panel-tabs" id="panelTabs">' + tabButtons() + '</div>'
    + '<div class="panel-body" id="panelBody"></div>';
}
function tabButtons(){
  return ['overview','messages','files','activity'].map(function(t){
    return '<div class="panel-tab ' + (S.activeTab===t?'active':'') + '" onclick="switchTab(\'' + t + '\')">' + t.charAt(0).toUpperCase()+t.slice(1) + '</div>';
  }).join('');
}
function switchTab(t){
  S.activeTab = t;
  document.getElementById('panelTabs').innerHTML = tabButtons();
  renderPanelBody();
}
window.switchTab = switchTab;

function statusSelector(app){
  let html = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
  html += '<select class="form-input" style="width:auto;padding:6px 10px;font-size:var(--t-sm)" onchange="updateStatus(\'' + app.id + '\',this.value)">';
  STATUS_ORDER.forEach(function(s){
    html += '<option value="' + s + '" ' + (app.status===s?'selected':'') + '>' + STATUS_LABEL[s] + '</option>';
  });
  html += '</select>';
  if(app.assigned_tuner) html += '<span class="file-meta">Assigned: ' + escapeHtml(app.assigned_tuner) + '</span>';
  html += '</div>';
  return html;
}

async function updateStatus(appId, newStatus){
  const app = S.applications.find(function(a){ return a.id === appId; });
  if(!app) return;
  const oldStatus = app.status;
  if(oldStatus === newStatus) return;

  let declinedReason = app.declined_reason;
  if(newStatus === 'declined' || newStatus === 'needs_info'){
    const reason = prompt(newStatus === 'declined' ? 'Reason for declining (kept internal, optional):' : 'What do you need from the customer? (optional)');
    if(reason) declinedReason = reason;
  }

  const patch = { status:newStatus, updated_at:new Date().toISOString() };
  if(newStatus === 'declined') patch.declined_reason = declinedReason;
  if(!app.reviewed_at && oldStatus === 'submitted'){
    patch.reviewed_at = new Date().toISOString();
    patch.reviewed_by = S.user ? S.user.email : null;
  }
  if(!app.assigned_tuner) patch.assigned_tuner = S.user ? S.user.email : null;

  try{
    const { data, error } = await sb.from('tuning_applications').update(patch).eq('id', appId).select().single();
    if(error) throw error;
    Object.assign(app, data);
    await logActivity(appId, 'status', oldStatus, newStatus);
    toast('Status updated to ' + STATUS_LABEL[newStatus]);
    renderPanelShell_refresh(app);
    renderPage();
  }catch(e){
    toast('Failed to update status: ' + e.message, true);
  }
}
window.updateStatus = updateStatus;

function renderPanelShell_refresh(app){
  document.getElementById('tk-panel').innerHTML = renderPanelShell(app);
  renderPanelBody();
}

function renderPanelBody(){
  const app = S.applications.find(function(a){ return a.id === S.openAppId; });
  if(!app) return;
  const el = document.getElementById('panelBody');
  if(!el) return;
  if(S.activeTab === 'overview') el.innerHTML = renderOverview(app);
  else if(S.activeTab === 'messages') el.innerHTML = renderMessagesTab(app);
  else if(S.activeTab === 'files') el.innerHTML = renderFilesTab(app);
  else if(S.activeTab === 'activity') el.innerHTML = renderActivityTab(app);
}

function dl(label, value){
  return '<div class="dl-item"><div class="dl-label">' + escapeHtml(label) + '</div><div class="dl-value">' + escapeHtml(value || '-') + '</div></div>';
}
function dlFull(label, value){
  return '<div class="dl-item full"><div class="dl-label">' + escapeHtml(label) + '</div><div class="dl-value">' + escapeHtml(value || '-') + '</div></div>';
}

function renderOverview(a){
  let html = '';
  html += '<div class="section-title">Owner</div><div class="dl-grid">'
    + dlFull('Already a TGK customer?', a.existing_customer)
    + dlFull('Why seeking custom tuning', a.tuning_reason)
    + '</div>';

  html += '<div class="section-title">Car Information</div><div class="dl-grid">'
    + dl('Year', a.car_year) + dl('Make', a.car_make) + dl('Model', a.car_model) + dl('Mileage', a.car_mileage)
    + '</div>';

  html += '<div class="section-title">Modifications</div><div class="dl-grid">'
    + dl('Intake', a.mod_intake) + dl('Turbos', a.mod_turbos)
    + dl('Cooling', a.mod_cooling) + dl('Wastegates', a.mod_wastegates)
    + dl('Map Sensors', a.mod_map_sensors) + dl('Downpipes/Exhaust', a.mod_downpipes_exhaust)
    + dl('Transmission/Tune', a.mod_transmission_tune) + dl('Fueling', a.mod_fueling)
    + dl('Water Methanol', yn(a.has_water_meth)) + dl('Plan to Run Ethanol', yn(a.plan_ethanol))
    + dl('Has Dyno Spectrum DS1', yn(a.has_ds1)) + dl('Purchasing DS1 Through Us', yn(a.purchasing_ds1_through_us))
    + dlFull('Other Modifications', a.other_mods)
    + '</div>';

  html += '<div class="section-title">Maintenance</div><div class="dl-grid">'
    + dl('Spark Plug Date', a.spark_plug_date) + dl('Spark Plug Mileage', a.spark_plug_mileage)
    + dl('Spark Plug Brand', a.spark_plug_brand) + dl('Spark Plug Gap', a.spark_plug_gap)
    + dl('Oil Change Date', a.oil_change_date) + dl('Oil Change Mileage', a.oil_change_mileage)
    + dlFull('Oil Brand and Weight', a.oil_brand_weight)
    + dl('Trans Service Date', a.trans_service_date) + dl('Trans Service Mileage', a.trans_service_mileage)
    + dl('Air Filter Date', a.air_filter_date) + dl('Air Filter Mileage', a.air_filter_mileage)
    + dl('Self Performed', yn(a.maintenance_self_performed))
    + dl('Shop Name', a.maintenance_shop_name)
    + '</div>';

  html += '<div class="section-title">Contact &amp; Legal</div><div class="dl-grid">'
    + dl('Country', a.customer_country)
    + dl('Legal Policy Agreed', yn(a.legal_agree))
    + dlFull('Policy Agreement Signature', a.policy_agreement_signature)
    + dlFull('Legal Signature', a.legal_signature)
    + dl('Submitted', fmtDate(a.created_at))
    + dl('Last Updated', fmtDate(a.updated_at))
    + '</div>';

  if(a.decision_notes || a.declined_reason){
    html += '<div class="section-title">Internal Notes</div><div class="dl-grid">'
      + dlFull('Decision Notes', a.decision_notes)
      + dlFull('Declined / Needs Info Reason', a.declined_reason)
      + '</div>';
  }
  return html;
}

/* ---- messages tab ---- */
function renderMessagesTab(a){
  const msgs = S.messages[a.id] || [];
  let html = '<div class="msg-list">';
  if(!msgs.length) html += '<div class="empty-state">No messages yet. Send the first one below.</div>';
  msgs.forEach(function(m){
    const cls = m.sender_type === 'system' ? 'msg-system' : (m.is_internal_note ? 'msg-note' : (m.sender_type === 'tuner' ? 'msg-tuner' : 'msg-customer'));
    html += '<div class="msg ' + cls + '">';
    if(m.sender_type !== 'system') html += '<div class="msg-meta">' + escapeHtml(m.sender_name || m.sender_type) + (m.is_internal_note ? ' (internal note)' : '') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="panel-foot" style="border:none;padding:0;margin-top:8px">';
  if(S.templates.length){
    html += '<select class="form-input" style="margin-bottom:8px" onchange="applyTemplate(this.value)"><option value="">Insert a template...</option>';
    S.templates.forEach(function(t){ html += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });
    html += '</select>';
  }
  html += '<textarea class="form-input" id="replyBody" placeholder="Write a reply to the customer..." style="min-height:90px"></textarea>';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">';
  html += '<label class="check-row"><input type="checkbox" id="replyIsNote"> Internal note (not sent to customer)</label>';
  html += '<button class="btn btn-primary" onclick="sendMessage(\'' + a.id + '\')">Send</button>';
  html += '</div></div>';
  return html;
}

function applyTemplate(id){
  if(!id) return;
  const t = S.templates.find(function(x){ return String(x.id) === String(id); });
  if(t) document.getElementById('replyBody').value = t.body;
}
window.applyTemplate = applyTemplate;

async function sendMessage(appId){
  const body = document.getElementById('replyBody').value.trim();
  if(!body){ toast('Write a message first', true); return; }
  const isNote = document.getElementById('replyIsNote').checked;

  try{
    const { data, error } = await sb.from('tuning_messages').insert({
      application_id: appId,
      sender_type: 'tuner',
      sender_name: S.user.email,
      body: body,
      is_internal_note: isNote
    }).select().single();
    if(error) throw error;
    if(!S.messages[appId]) S.messages[appId] = [];
    S.messages[appId].push(data);

    if(!isNote){
      await sb.from('tuning_applications').update({ customer_has_unread:true, updated_at:new Date().toISOString() }).eq('id', appId);
      const app = S.applications.find(function(x){ return x.id === appId; });
      if(app) app.customer_has_unread = true;
    }
    await logActivity(appId, isNote ? 'internal_note' : 'message', null, null);
    renderPanelBody();
    toast(isNote ? 'Note saved' : 'Message sent');
  }catch(e){
    toast('Failed to send: ' + e.message, true);
  }
}
window.sendMessage = sendMessage;

/* ---- files tab ---- */
function renderFilesTab(a){
  const files = S.files[a.id] || [];
  let html = '<div style="margin-bottom:16px">';
  html += '<label class="form-label">Upload a Tune File or Log</label>';
  html += '<input type="file" id="fileInput" style="margin-top:6px">';
  html += '<div style="display:flex;gap:8px;margin-top:8px">';
  html += '<select class="form-input" id="fileTypeSelect" style="width:auto">'
    + '<option value="tune">Tune</option><option value="log">Log</option><option value="other">Other</option></select>';
  html += '<input class="form-input" id="fileRevision" type="number" placeholder="Revision #" style="width:110px">';
  html += '<button class="btn btn-primary" onclick="uploadFile(\'' + a.id + '\')">Upload</button>';
  html += '</div></div>';

  html += '<div>';
  if(!files.length) html += '<div class="empty-state">No files exchanged yet.</div>';
  files.forEach(function(f){
    html += '<div class="file-row">'
      + '<div style="flex:1">'
      + '<div class="file-name">' + escapeHtml(f.file_name) + (f.revision_number ? ' <span class="pill pill-muted">rev ' + f.revision_number + '</span>' : '') + ' <span class="pill ' + (f.file_type==='tune'?'pill-teal':(f.file_type==='log'?'pill-orange':'pill-muted')) + '">' + escapeHtml(f.file_type||'file') + '</span></div>'
      + '<div class="file-meta">' + escapeHtml(f.uploaded_by_name || f.uploaded_by) + ' &middot; ' + fmtDate(f.created_at) + '</div>'
      + '</div>'
      + '<button class="btn btn-sm" onclick="downloadFile(\'' + f.id + '\',\'' + f.file_path + '\')">Download</button>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

async function uploadFile(appId){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file){ toast('Choose a file first', true); return; }
  const type = document.getElementById('fileTypeSelect').value;
  const revision = document.getElementById('fileRevision').value || null;
  const path = appId + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

  try{
    const { error: upErr } = await sb.storage.from('tuning-files').upload(path, file);
    if(upErr) throw upErr;

    const { data, error } = await sb.from('tuning_files').insert({
      application_id: appId,
      uploaded_by: 'tuner',
      uploaded_by_name: S.user.email,
      file_name: file.name,
      file_path: path,
      file_type: type,
      revision_number: revision ? parseInt(revision, 10) : null
    }).select().single();
    if(error) throw error;

    if(!S.files[appId]) S.files[appId] = [];
    S.files[appId].unshift(data);
    await logActivity(appId, 'file_uploaded', null, file.name);

    if(type === 'tune'){
      await sb.from('tuning_applications').update({ customer_has_unread:true, updated_at:new Date().toISOString() }).eq('id', appId);
      const app = S.applications.find(function(x){ return x.id === appId; });
      if(app) app.customer_has_unread = true;
    }
    renderPanelBody();
    toast('File uploaded');
  }catch(e){
    toast('Upload failed: ' + e.message, true);
  }
}
window.uploadFile = uploadFile;

async function downloadFile(fileId, path){
  try{
    const { data, error } = await sb.storage.from('tuning-files').createSignedUrl(path, 3600);
    if(error) throw error;
    window.open(data.signedUrl, '_blank');
  }catch(e){
    toast('Could not generate download link: ' + e.message, true);
  }
}
window.downloadFile = downloadFile;

/* ---- activity tab ---- */
function renderActivityTab(a){
  const log = S.activity[a.id] || [];
  if(!log.length) return '<div class="empty-state">No activity recorded yet.</div>';
  let html = '';
  log.forEach(function(l){
    let desc = l.field_changed || 'update';
    if(l.field_changed === 'status') desc = 'Status changed from ' + (STATUS_LABEL[l.old_value]||l.old_value) + ' to ' + (STATUS_LABEL[l.new_value]||l.new_value);
    else if(l.field_changed === 'message') desc = 'Message sent to customer';
    else if(l.field_changed === 'internal_note') desc = 'Internal note added';
    else if(l.field_changed === 'file_uploaded') desc = 'File uploaded: ' + l.new_value;
    html += '<div class="activity-row"><div class="when">' + fmtDate(l.created_at) + '</div><div>' + escapeHtml(desc) + ' <span class="file-meta">- ' + escapeHtml(l.changed_by||'') + '</span></div></div>';
  });
  return html;
}

/* ================= TEMPLATES PAGE ================= */
function renderTemplates(){
  let html = '<div class="card">';
  html += '<h2>Canned Replies</h2><div style="color:var(--text3);font-size:var(--t-sm);margin-bottom:14px">Quick-insert templates available from the message reply box</div>';
  html += '<div class="form-group"><label class="form-label">Name</label><input class="form-input" id="tplName"></div>';
  html += '<div class="form-group"><label class="form-label">Body</label><textarea class="form-input" id="tplBody"></textarea></div>';
  html += '<button class="btn btn-primary" onclick="addTemplate()">Add Template</button>';
  html += '</div>';

  html += '<div class="card">';
  if(!S.templates.length) html += '<div class="empty-state">No templates yet.</div>';
  S.templates.forEach(function(t){
    html += '<div class="file-row"><div style="flex:1"><div class="file-name">' + escapeHtml(t.name) + '</div><div class="file-meta">' + escapeHtml(t.body.slice(0,120)) + (t.body.length>120?'...':'') + '</div></div>'
      + '<button class="btn btn-sm" onclick="deleteTemplate(\'' + t.id + '\')">Delete</button></div>';
  });
  html += '</div>';
  return html;
}

async function addTemplate(){
  const name = document.getElementById('tplName').value.trim();
  const body = document.getElementById('tplBody').value.trim();
  if(!name || !body){ toast('Name and body are required', true); return; }
  try{
    const { data, error } = await sb.from('tuning_templates').insert({ name, body }).select().single();
    if(error) throw error;
    S.templates.unshift(data);
    renderPage();
    toast('Template added');
  }catch(e){ toast('Failed to add template: ' + e.message, true); }
}
window.addTemplate = addTemplate;

async function deleteTemplate(id){
  if(!confirm('Delete this template?')) return;
  try{
    await sb.from('tuning_templates').delete().eq('id', id);
    S.templates = S.templates.filter(function(t){ return t.id !== id; });
    renderPage();
    toast('Template deleted');
  }catch(e){ toast('Failed to delete: ' + e.message, true); }
}
window.deleteTemplate = deleteTemplate;

/* ================= BOOT ================= */
document.addEventListener('DOMContentLoaded', async function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){
      await afterLogin(data.session.user);
    }
  }catch(e){ /* fall through to login screen */ }
});
</script>

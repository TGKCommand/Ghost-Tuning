// Totals, amounts and the send button, updated in place while typing.
function invRefreshTotals(){
  S.modalInvoiceLines.forEach(function(l, i){
    const el = document.getElementById('invAmt-' + i);
    if(el) el.textContent = money((Number(l.price) || 0) * (Number(l.quantity) || 1));
  });
  const t = invoiceLineTotal();
  const count = S.modalInvoiceLines.reduce(function(n, l){ return n + (Number(l.quantity) || 1); }, 0);
  const set = function(id, v){ const el = document.getElementById(id); if(el) el.textContent = v; };
  set('invSubtotal', money(t)); set('invTotal', money(t)); set('invCount', String(count));
  const b = document.getElementById('invSendBtn');
  if(b){ b.innerHTML = invSendLabel(); b.disabled = !S.modalInvoiceLines.length; }
}

function invSetField(i, field, v){
  const l = S.modalInvoiceLines[i]; if(!l) return;
  if(field === 'quantity'){ const n = parseInt(v, 10); l.quantity = n > 0 ? n : 1; }
  else if(field === 'price'){ l.price = v === '' ? '' : parseFloat(v); }
  else l[field] = v;
  if(S.invInvalid){ delete S.invInvalid['d' + i]; delete S.invInvalid['p' + i]; }
  invRefreshTotals();
}
window.invSetField = invSetField;
function invNormalizeQty(i, el){ const l = S.modalInvoiceLines[i]; if(l) el.value = l.quantity; }
window.invNormalizeQty = invNormalizeQty;

// ---- product picker
function invPickMatches(q){
  q = (q || '').trim().toLowerCase();
  return (S.invoiceCatalog || []).map(function(v, idx){ return { v: v, idx: idx }; })
    .filter(function(x){ return !q || ((x.v.sku || '') + ' ' + x.v.title).toLowerCase().indexOf(q) !== -1; })
    .sort(function(a, b){ return String(a.v.sku || '~').localeCompare(String(b.v.sku || '~')); });
}
function invPickRender(){
  const list = document.getElementById('invPickList'); if(!list) return;
  if(!(S.invoiceCatalog || []).length){ list.innerHTML = '<div class="inv-pick-empty">No Ghostronics products found in Shopify.</div>'; return; }
  const m = invPickMatches(S.invPickQuery);
  list.innerHTML = m.length ? m.map(function(x, k){
    return '<button type="button" class="inv-pick-item' + (k === (S.invPickHi || 0) ? ' hi' : '') + '" onmousedown="event.preventDefault()" onclick="invPick(' + x.idx + ')">'
      + '<span class="inv-sku">' + escapeHtml(x.v.sku || '-') + '</span>'
      + '<span class="inv-pick-name">' + escapeHtml(x.v.title) + '</span>'
      + '<span class="inv-pick-price">' + money(x.v.price) + '</span></button>';
  }).join('') : '<div class="inv-pick-empty">No product matches "' + escapeHtml(S.invPickQuery) + '". Use + Custom line for a one-off item.</div>';
}
function invPickOpen(on){
  const list = document.getElementById('invPickList'); if(!list) return;
  list.classList.toggle('open', !!on);
  if(on){ S.invPickHi = 0; invPickRender(); }
}
window.invPickOpen = invPickOpen;
function invPickFilter(v){ S.invPickQuery = v; S.invPickHi = 0; invPickOpen(true); }
window.invPickFilter = invPickFilter;
function invPickKey(ev, appId){
  const m = invPickMatches(S.invPickQuery);
  if(ev.key === 'ArrowDown'){ ev.preventDefault(); S.invPickHi = Math.min(m.length - 1, (S.invPickHi || 0) + 1); invPickRender(); }
  else if(ev.key === 'ArrowUp'){ ev.preventDefault(); S.invPickHi = Math.max(0, (S.invPickHi || 0) - 1); invPickRender(); }
  else if(ev.key === 'Enter'){ ev.preventDefault(); const x = m[S.invPickHi || 0]; if(x) invPick(x.idx); }
  else if(ev.key === 'Escape'){ invPickOpen(false); }
}
window.invPickKey = invPickKey;
// Picking a product already on the invoice bumps its quantity instead of
// adding a duplicate line.
function invPick(idx){
  const v = (S.invoiceCatalog || [])[idx]; if(!v) return;
  const existing = S.modalInvoiceLines.find(function(l){ return l.type === 'product' && String(l.variant_id) === String(v.variant_id); });
  if(existing) existing.quantity = (Number(existing.quantity) || 1) + 1;
  else S.modalInvoiceLines.push({ type:'product', variant_id: v.variant_id, sku: v.sku, title: v.title, price: v.price, quantity: 1 });
  S.invPickQuery = '';
  reopenInvoiceModal(S.invAppId);
  const inp = document.getElementById('invPickInput'); if(inp) inp.focus();
}
window.invPick = invPick;

window.addCustomLine = addCustomLine;

function removeInvoiceLine(appId, idx){

  reopenInvoiceModal(appId);
}
window.removeInvoiceLine = removeInvoiceLine;

// Custom lines need a description and a price above $0 before sending;
// problems are highlighted in the table rather than just toasted.
function invValidate(){
  const bad = {};
  S.modalInvoiceLines.forEach(function(l, i){
    if(l.type !== 'custom') return;
    if(!String(l.title || '').trim()) bad['d' + i] = true;
    if(!(Number(l.price) > 0)) bad['p' + i] = true;
  });
  S.invInvalid = bad;
  return !Object.keys(bad).length;
}


function replaceInvoiceInState(appId, invoice){
  const list = S.invoices[appId] || (S.invoices[appId] = []);
  const idx = list.findIndex(function(i){ return i.id === invoice.id; });
  if(idx !== -1) list[idx] = invoice; else list.unshift(invoice);
  if(S.openAppId === appId) renderPanelBody();
}

// Low-level "call tuning-invoice's send action" - always creates a brand
// new invoice. Used by the modal's Send button and as the redo half of an
// invoice-cancel undo entry, so redoing a cancelled invoice doesn't need to
// reopen the modal.
async function sendInvoiceLines(appId, lines, notes){
  const { data: sess } = await sb.auth.getSession();
  const token = sess && sess.session && sess.session.access_token;
  if(!token) throw new Error('Not signed in');
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ action: 'send', application_id: appId, line_items: lines, notes: notes })
  });
  const result = await resp.json();
  if(!result.success) throw new Error(result.error || 'Send failed');
  replaceInvoiceInState(appId, result.invoice);
  return result.invoice;
}

// Edits and re-sends one specific existing (still-unpaid) invoice.
async function updateInvoiceLines(appId, invoiceId, lines, notes){
  const { data: sess } = await sb.auth.getSession();
  const token = sess && sess.session && sess.session.access_token;
  if(!token) throw new Error('Not signed in');
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ action: 'update', invoice_id: invoiceId, line_items: lines, notes: notes })
  });
  const result = await resp.json();
  if(!result.success) throw new Error(result.error || 'Update failed');
  replaceInvoiceInState(appId, result.invoice);
  return result.invoice;
}

async function confirmSendInvoice(appId){
  if(!S.modalInvoiceLines.length){ toast('Add at least one line item', true); return; }
  if(!invValidate()){
    reopenInvoiceModal(appId);
    toast('Custom lines need a description and a price', true);
    return;
  }
  const notesInput = document.getElementById('invoiceNotesInput');
  const notes = notesInput.value.trim() || null;
  const lines = S.modalInvoiceLines.slice();
  const editingInvoiceId = S.modalInvoiceId;

  const sendBtn = document.getElementById('invSendBtn');
  if(sendBtn){ sendBtn.disabled = true; sendBtn.textContent = editingInvoiceId ? 'Saving...' : 'Sending...'; }

  try{
    const app = S.applications.find(function(a){ return a.id === appId; });

    if(editingInvoiceId){
      // Snapshot what's being replaced so undo can put it back with another edit.
      const before = (S.invoices[appId] || []).find(function(i){ return i.id === editingInvoiceId; });
      const beforeLines = before && Array.isArray(before.line_items) ? before.line_items.slice() : [];
      const beforeNotes = before ? before.notes : null;

      await updateInvoiceLines(appId, editingInvoiceId, lines, notes);
      closeModal();
      toast('Invoice updated and resent via Shopify');

      pushUndo({
        label: 'invoice edit on #' + (app ? app.application_number : appId),
        undo: function(){ return updateInvoiceLines(appId, editingInvoiceId, beforeLines, beforeNotes); },
        redo: function(){ return updateInvoiceLines(appId, editingInvoiceId, lines, notes); }
      });
    } else {
      const invoice = await sendInvoiceLines(appId, lines, notes);
      closeModal();
      toast('Invoice sent via Shopify');

      // "A way to undo orders": the invoice this just created is a real
      // Shopify draft order, so undoing it means actually cancelling that
      // draft order in Shopify, not just reverting a local field.
      pushUndo({
        label: 'invoice send on #' + (app ? app.application_number : appId),
        undo: function(){ return cancelInvoice(appId, invoice.id, true, true); },
        redo: function(){ return sendInvoiceLines(appId, lines, notes); }
      });
    }
  }catch(e){
    toast('Failed to save invoice: ' + e.message, true);
    if(sendBtn){ sendBtn.disabled = false; sendBtn.innerHTML = invSendLabel(); }
  }
}
window.confirmSendInvoice = confirmSendInvoice;

// The explicit "undo an order" action: deletes the Shopify draft order
// (only possible while it's unpaid - Shopify won't let a completed draft
// order be deleted) and marks that one invoice 'cancelled' - other
// invoices on the same application are untouched. Available both as its
// own button on that invoice, and as what pressing the global Undo button
// does right after a send.
async function cancelInvoice(appId, invoiceId, quiet, skipUndo){
  const invoice = (S.invoices[appId] || []).find(function(i){ return i.id === invoiceId; });
  if(!invoice) return;
  if(!quiet && !confirm('Cancel this invoice? This deletes the draft order in Shopify - the customer will no longer be able to pay it.')) return;

  // Snapshot what's being cancelled before the server wipes the draft
  // order, so an undo of this cancel (redo of the original send) has
  // something to resend.
  const snapshotLines = Array.isArray(invoice.line_items) ? invoice.line_items.slice() : null;
  const snapshotNotes = invoice.notes || null;

  const btn = document.getElementById('cancelInvoiceBtn-' + invoiceId);
  if(btn){ btn.disabled = true; btn.textContent = 'Cancelling...'; }

  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'cancel', invoice_id: invoiceId })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Cancel failed');
    replaceInvoiceInState(appId, result.invoice);
    if(!quiet) toast('Invoice cancelled');

    if(!skipUndo && snapshotLines && snapshotLines.length){
      const app = S.applications.find(function(a){ return a.id === appId; });
      pushUndo({
        label: 'invoice cancel on #' + (app ? app.application_number : appId),
        undo: function(){ return sendInvoiceLines(appId, snapshotLines, snapshotNotes); },
        redo: function(){ return cancelInvoice(appId, invoiceId, true, true); }
      });
    }
  }catch(e){
    toast('Failed to cancel invoice: ' + e.message, true);
    if(btn){ btn.disabled = false; btn.textContent = 'Cancel invoice'; }
  }
}
window.cancelInvoice = cancelInvoice;

async function saveOverviewEdit(appId){
  const app = S.applications.find(function(x){ return x.id === appId; });
  if(!app) return;

  const val = function(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const boolVal = function(id){ const v = val(id); return v === 'yes' ? true : (v === 'no' ? false : null); };
  const numOrText = function(v){ if(!v) return null; return isNaN(Number(v)) ? v : Number(v); };
  const textOrNull = function(v){ return v ? v : null; };

  const patch = {
    customer_name: val('ovf_customer_name'),
    customer_email: val('ovf_customer_email'),
    car_year: numOrText(val('ovf_car_year')),
    car_make: textOrNull(val('ovf_car_make')),
    car_model: textOrNull(val('ovf_car_model')),
    car_mileage: numOrText(val('ovf_car_mileage')),
    existing_customer: textOrNull(val('ovf_existing_customer')),
    tuning_reason: textOrNull(val('ovf_tuning_reason')),
    mod_intake: textOrNull(val('ovf_mod_intake')),
    mod_turbos: textOrNull(val('ovf_mod_turbos')),
    mod_cooling: textOrNull(val('ovf_mod_cooling')),
    mod_wastegates: textOrNull(val('ovf_mod_wastegates')),
    mod_map_sensors: textOrNull(val('ovf_mod_map_sensors')),
    mod_downpipes_exhaust: textOrNull(val('ovf_mod_downpipes_exhaust')),
    mod_transmission_tune: textOrNull(val('ovf_mod_transmission_tune')),
    mod_fueling: textOrNull(val('ovf_mod_fueling')),
    has_water_meth: boolVal('ovf_has_water_meth'),
    plan_ethanol: boolVal('ovf_plan_ethanol'),
    has_ds1: boolVal('ovf_has_ds1'),
    purchasing_ds1_through_us: boolVal('ovf_purchasing_ds1_through_us'),
    other_mods: textOrNull(val('ovf_other_mods')),
    spark_plug_date: textOrNull(val('ovf_spark_plug_date')),
    spark_plug_mileage: numOrText(val('ovf_spark_plug_mileage')),
    spark_plug_brand: textOrNull(val('ovf_spark_plug_brand')),
    spark_plug_gap: textOrNull(val('ovf_spark_plug_gap')),
    oil_change_date: textOrNull(val('ovf_oil_change_date')),
    oil_change_mileage: numOrText(val('ovf_oil_change_mileage')),
    oil_brand_weight: textOrNull(val('ovf_oil_brand_weight')),
    trans_service_date: textOrNull(val('ovf_trans_service_date')),
    trans_service_mileage: numOrText(val('ovf_trans_service_mileage')),
    air_filter_date: textOrNull(val('ovf_air_filter_date')),
    air_filter_mileage: numOrText(val('ovf_air_filter_mileage')),
    maintenance_self_performed: boolVal('ovf_maintenance_self_performed'),
    maintenance_shop_name: textOrNull(val('ovf_maintenance_shop_name')),
    customer_country: textOrNull(val('ovf_customer_country')),
    decision_notes: textOrNull(val('ovf_decision_notes')),
    declined_reason: textOrNull(val('ovf_declined_reason'))
  };

  if(!patch.customer_name){ toast('Customer name is required', true); return; }
  if(!patch.customer_email){ toast('Customer email is required', true); return; }

  const btn = document.getElementById('ovfSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    const { data, error } = await sb.from('tuning_applications').update(patch).eq('id', appId).select().single();
    if(error) throw error;

    // Only log fields that actually changed, so the Activity tab reads as
    // a real changelog rather than a wall of every field on every save.
    const changedFields = Object.keys(patch).filter(function(k){ return String(app[k] == null ? '' : app[k]) !== String(patch[k] == null ? '' : patch[k]); });
    if(changedFields.length){
      await sb.from('tuning_activity_log').insert({
        application_id: appId,
        field_changed: 'profile_edited',
        old_value: null,
        new_value: changedFields.join(', '),
        changed_by: (S.user && S.user.email) || 'Unknown'
      });
    }

    const idx = S.applications.findIndex(function(x){ return x.id === appId; });
    if(idx !== -1) S.applications[idx] = data;
    S.editingOverview = false;
    renderNav();
    renderPanelShell_refresh(data);
    toast('Profile updated');
  }catch(e){
    toast('Failed to save: ' + e.message, true);
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
  }

function renderMessagesTab(a){
  const msgs = S.messages[a.id] || [];
  let html = '<div class="msg-list">';
  if(!msgs.length) html += '<div class="empty-state">No messages yet. Send the first one below.</div>';
  msgs.forEach(function(m){
    // Pre-migration rows won't have message_type set yet - fall back to
    // the exact body prefix the edge function has always used, so old
    // revision requests still get the prominent treatment.
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const cls = isRevisionRequest ? 'msg-revision' : (m.sender_type === 'system' ? 'msg-system' : (m.is_internal_note ? 'msg-note' : (m.sender_type === 'tuner' ? 'msg-tuner' : 'msg-customer')));
    html += '<div class="msg ' + cls + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">&#8635; Revision Requested</div>';
      html += '<div class="msg-meta">' + escapeHtml(a.customer_name) + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    } else if(m.sender_type !== 'system'){
      html += '<div class="msg-meta">' + escapeHtml(m.sender_name || m.sender_type) + (m.is_internal_note ? ' (internal note)' : '') + ' &middot; ' + fmtDate(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="panel-foot" style="border:none;padding:0;margin-top:8px">';
  if(S.templates.length){
    html += '<select class="form-input" style="margin-bottom:8px" onchange="applyTemplate(this.value)"><option value="">Insert a template...</option>';
    S.templates.forEach(function(t){ html += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });
    html += '</select>';
  }
  html += '<textarea class="form-input" id="replyBody" placeholder="Write a reply to the customer..." style="min-height:90px"></textarea>';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">';
  html += '<label class="check-row"><input type="checkbox" id="replyIsNote"> Internal note (not sent to customer)</label>';
  html += '<button class="btn btn-primary" onclick="sendMessage(\'' + a.id + '\')">Send</button>';
  html += '</div></div>';
  return html;
}

const TEMPLATE_VARS = [
  { key:'first_name', desc:"Customer's first name" },
  { key:'customer_name', desc:"Customer's full name" },
  { key:'app_number', desc:'Application number' },
  { key:'car', desc:'Year make model' },

function fillTemplate(body, a){
  if(!a) return body;
  const g = S.logGuides.find(function(x){ return x.id === a.log_guide_id; });
  const vals = {
    first_name: (a.customer_name || '').trim().split(/\s+/)[0] || '',
    customer_name: a.customer_name || '',
    app_number: '#' + a.application_number,
    car: [a.car_year, a.car_make, a.car_model].filter(Boolean).join(' '),
    status: STATUS_LABEL[a.status] || a.status,
    log_guide: g ? g.name : '',
    portal_link: a.portal_access_token ? PORTAL_BASE_URL + '/portal.html?token=' + encodeURIComponent(a.portal_access_token) : ''
  };
  return body.replace(/\{([a-z_]+)\}/g, function(m, k){ return Object.prototype.hasOwnProperty.call(vals, k) ? vals[k] : m; });
}
function applyTemplate(id){
  if(!id) return;
  const t = S.templates.find(function(x){ return String(x.id) === String(id); });
  const a = S.applications.find(function(x){ return x.id === S.openAppId; });
  if(t) document.getElementById('replyBody').value = fillTemplate(t.body, a);
}

async function sendMessage(appId){
  const body = document.getElementById('replyBody').value.trim();
  if(!body){ toast('Write a message first', true); return; }
  const isNote = document.getElementById('replyIsNote').checked;

  try{
    const { data, error } = await sb.from('tuning_messages').insert({
      application_id: appId,
      sender_type: 'tuner',
      sender_name: S.user.email,
      body: body,
      is_internal_note: isNote
    }).select().single();
    if(error) throw error;
    if(!S.messages[appId]) S.messages[appId] = [];
    S.messages[appId].push(data);

    if(!isNote){
      const nowIso = new Date().toISOString();
      await sb.from('tuning_applications').update({ customer_has_unread:true, updated_at:nowIso }).eq('id', appId);
      const app = S.applications.find(function(x){ return x.id === appId; });
      if(app){ app.customer_has_unread = true; app.last_message_at = nowIso; app.last_message_by = 'tuner'; }
      callNotify('new_message', { application_id: appId, message_body: body });
      pingPortal(appId);
    }
    await logActivity(appId, isNote ? 'internal_note' : 'message', null, null);
    renderPanelBody();
    toast(isNote ? 'Note saved' : 'Message sent');
  }catch(e){
    toast('Failed to send: ' + e.message, true);
  }
}
window.sendMessage = sendMessage;

// Deletes the stored file and its record. Not undoable - storage deletes
// are permanent - so it confirms first, with a stronger warning for the
// tune the customer currently has flashed.
async function deleteFile(appId, fileId){
  const f = (S.files[appId] || []).find(function(x){ return x.id === fileId; });
  if(!f) return;
  const who = f.uploaded_by === 'customer' ? 'uploaded by the customer' : 'uploaded by a tuner';
  let msg = 'Delete "' + f.file_name + '" (' + who + ')?\n\nThis permanently removes the file for both you and the customer.';
  if(f.file_type === 'tune' && f.is_current) msg += '\n\nThis is the tune marked "Currently flashed" - the customer will no longer see it.';
  if(!confirm(msg)) return;
  try{
    const { error: stErr } = await sb.storage.from('tuning-files').remove([f.file_path]);
    // A missing storage object shouldn't block cleaning up the record.
    if(stErr && !/not.?found/i.test(stErr.message || '')) throw stErr;
    const { error } = await sb.from('tuning_files').delete().eq('id', fileId);
    if(error) throw error;
    S.files[appId] = (S.files[appId] || []).filter(function(x){ return x.id !== fileId; });
    S.pendingLogs = (S.pendingLogs || []).filter(function(x){ return x.id !== fileId; });
    await logActivity(appId, 'file_deleted', f.file_name, null);
    pingPortal(appId);
    renderNav();
    renderPanelBody();
    toast('File deleted');
  }catch(e){ toast('Delete failed: ' + e.message, true); }
}
window.deleteFile = deleteFile;

function setUploadType(t){
  // Keep a chosen file across the switch - re-rendering would drop it.
  const input = document.getElementById('fileInput');
  const kept = input && input.files && input.files.length ? input.files : null;
  S.uploadType = t;
  renderPanelBody();
  if(kept){
    const fresh = document.getElementById('fileInput');
    try{ fresh.files = kept; dzChanged('fileInput'); }catch(e){ /* older browser: re-pick */ }
  }
}
window.setUploadType = setUploadType;

// Styled file picker: the real input is hidden inside a drop zone, so the
// browser's native "Choose File" button never shows. Drag-and-drop works
// on desktop; tapping opens the picker on phones.
function fileDropHtml(id, enableBtnId){
  return '<label class="dropzone" id="dz-' + id + '" data-input="' + id + '"' + (enableBtnId ? ' data-btn="' + enableBtnId + '"' : '') + '>'
    + '<input type="file" id="' + id + '" class="dz-input" onchange="dzChanged(\'' + id + '\')">'
    + '<span class="dz-empty"><span class="dz-strong">Drop a file here</span> or <span class="dz-link">browse</span></span>'
    + '<span class="dz-file"><span class="dz-name"></span><span class="dz-size"></span>'
    + '<button type="button" class="dz-clear" aria-label="Remove file" onclick="event.preventDefault();dzClear(\'' + id + '\')">&times;</button></span>'
    + '</label>';
}
function fmtBytes(n){ return n < 1024 ? n + ' B' : (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'); }
function dzChanged(id){
  const input = document.getElementById(id), zone = document.getElementById('dz-' + id);
  if(!input || !zone) return;
  const f = input.files && input.files[0];
  zone.classList.toggle('has-file', !!f);
  if(f){ zone.querySelector('.dz-name').textContent = f.name; zone.querySelector('.dz-size').textContent = fmtBytes(f.size); }
  const btnId = zone.getAttribute('data-btn');
  const btn = btnId && document.getElementById(btnId);
  if(btn) btn.disabled = !f;
}
window.dzChanged = dzChanged;
function dzClear(id){ const input = document.getElementById(id); if(input){ input.value = ''; dzChanged(id); } }
window.dzClear = dzClear;
function wireDropzones(){
  document.querySelectorAll('.dropzone').forEach(function(zone){
    if(zone._wired) return;
    zone._wired = true;
    ['dragenter','dragover'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      const id = zone.getAttribute('data-input'), input = document.getElementById(id);
      if(input && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        try{ input.files = e.dataTransfer.files; }catch(err){ /* very old browser */ }
        dzChanged(id);
      }
    });
  });
}

// Clears the current flag on every tune for this application. Must run
// BEFORE marking a new one - the unique index allows only one current tune.
async function clearCurrentTune(appId){
  const { error } = await sb.from('tuning_files').update({ is_current:false })
    .eq('application_id', appId).eq('file_type', 'tune').eq('is_current', true);
  if(error) throw error;
  (S.files[appId] || []).forEach(function(f){ if(f.file_type === 'tune') f.is_current = false; });
}

async function setCurrentTune(appId, fileId){
  try{
    // One transaction server-side (clear old + set new), shared with the
    // customer portal - see tuning_set_current_tune in Phase 19.
    const { data, error } = await sb.rpc('tuning_set_current_tune', { p_file_id: fileId, p_marked_by: S.user.email });
    if(error) throw error;
    (S.files[appId] || []).forEach(function(f){ if(f.file_type === 'tune') f.is_current = false; });
    const list = S.files[appId] || [];
    const idx = list.findIndex(function(f){ return f.id === fileId; });
    if(idx !== -1) list[idx] = data;
    await logActivity(appId, 'current_tune', null, data.file_name + (data.revision_number ? ' (rev ' + data.revision_number + ')' : ''));
    pingPortal(appId);
    renderPanelBody();
    toast('Marked as currently flashed');
  }catch(e){ toast('Failed to update: ' + e.message, true); }
}
window.setCurrentTune = setCurrentTune;

async function uploadFile(appId){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file){ toast('Choose a file first', true); return; }
  const type = document.getElementById('fileTypeSelect').value;
  const isTune = type === 'tune';
  const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
  const revision = isTune ? (val('fileRevision') || null) : null;
  const fuel = isTune ? (val('fileFuel') || null) : null;
  const changelog = isTune ? (val('fileChangelog').trim() || null) : null;
  const cur = document.getElementById('fileIsCurrent');
  const markCurrent = isTune && !!(cur && cur.checked);
  const upBtn = document.getElementById('uploadBtn');
  if(upBtn){ upBtn.disabled = true; upBtn.textContent = 'Uploading...'; }
  const path = appId + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

  try{
    const { error: upErr } = await sb.storage.from('tuning-files').upload(path, file);
    if(upErr) throw upErr;

    if(markCurrent) await clearCurrentTune(appId);

    const { data, error } = await sb.from('tuning_files').insert({
      application_id: appId,
      uploaded_by: 'tuner',
      uploaded_by_name: S.user.email,
      file_name: file.name,
      file_path: path,
      file_type: type,
      revision_number: revision ? parseInt(revision, 10) : null,
      fuel: fuel,
      description: changelog,
      is_current: markCurrent,
      flashed_marked_by: markCurrent ? S.user.email : null,
      flashed_marked_at: markCurrent ? new Date().toISOString() : null
    }).select().single();
    if(error) throw error;

    if(!S.files[appId]) S.files[appId] = [];
    if(!S.files[appId].some(function(f){ return f.id === data.id; })) S.files[appId].unshift(data);
    await logActivity(appId, 'file_uploaded', null, file.name);

    if(isTune){
      await sb.from('tuning_applications').update({ customer_has_unread:true, updated_at:new Date().toISOString() }).eq('id', appId);
      const app = S.applications.find(function(x){ return x.id === appId; });
      if(app) app.customer_has_unread = true;
    }
    callNotify('file_uploaded', { application_id: appId, file_name: file.name, file_type: type });
    pingPortal(appId);
    renderPanelBody();
    toast('File uploaded');
  }catch(e){
    toast('Upload failed: ' + e.message, true);
    if(upBtn){ upBtn.disabled = false; upBtn.textContent = 'Retry upload'; }
  }
}
window.uploadFile = uploadFile;

/* ================= DATALOG VIEWER ================= */
// Generic CSV log viewer: finds the header row itself (logs often carry
// preamble lines), detects the delimiter, and lets the tuner pick which
// columns to chart. Nothing here assumes DS1's column names - flag rules
// are tuner-defined against the real headers (tuning_log_rules).

function splitLogLine(line, delim){
  if(line.indexOf('"') === -1) return line.split(delim).map(function(c){ return c.trim(); });
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(ch === '"'){ if(q && line[i+1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if(ch === delim && !q){ out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}

function toNum(v, commaDecimal){
  if(v === '' || v == null) return NaN;
  return Number(commaDecimal ? String(v).replace(',', '.') : v);
}

function parseLog(text){
  const lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ''; });
  if(lines.length < 3) throw new Error('This file does not look like a datalog (too few lines).');
  // Delimiter: whichever of , ; tab appears most consistently in the first lines.
  const sample = lines.slice(0, 60);
  let delim = ',', best = 0;
  [',', ';', '\t'].forEach(function(d){
    const counts = sample.map(function(l){ return l.split(d).length - 1; }).filter(function(c){ return c > 0; });
    if(counts.length > best){ best = counts.length; delim = d; }
  });
  const commaDecimal = delim !== ',';
  const numRatio = function(cells){
    const n = cells.filter(function(c){ return c !== '' && !isNaN(toNum(c, commaDecimal)); }).length;
    return cells.length ? n / cells.length : 0;
  };
  // Filled-cell numeric ratio: DS1 writes a near-empty marker row ("0,,,,")
  // right under the header, so empty cells must not count against a row.
  const filledRatio = function(cells){
    const filled = cells.filter(function(c){ return c !== ''; });
    return filled.length / Math.max(1, cells.length);
  };
  // Header = the text row followed by the LONGEST run of equal-width,
  // mostly-numeric rows. Taking the first candidate isn't enough: loggers
  // like JB4 start with settings blocks (a name row + a value row) that
  // look like a tiny table, and the real data only starts after them.
  let headerIdx = -1, bestRun = 0;
  for(let i = 0; i < Math.min(200, lines.length - 1); i++){
    const a = splitLogLine(lines[i], delim);
    if(a.length < 2 || numRatio(a) >= 0.5) continue;
    let run = 0;
    for(let j = i + 1; j < lines.length && run < 500; j++){
      const b = splitLogLine(lines[j], delim);
      if(b.length !== a.length) break;
      if(filledRatio(b) < 0.5) continue;
      if(numRatio(b) >= 0.6) run++; else break;
    }
    if(run > bestRun){ bestRun = run; headerIdx = i; }
  }
  if(headerIdx === -1) throw new Error('Could not find a header row in this file.');
  // Anything above the header is kept as log info: pairs of a name row and
  // a value row of the same width (JB4: firmware, VIN, map settings...).
  const preamble = [];
  for(let r = 0; r + 1 < headerIdx; r++){
    const kr = splitLogLine(lines[r], delim), vr = splitLogLine(lines[r + 1], delim);
    if(kr.length < 2 || kr.length !== vr.length || numRatio(kr) >= 0.5) continue;
    kr.forEach(function(k, x){ if(k && vr[x] !== '' && vr[x] !== undefined) preamble.push({ k: k, v: vr[x] }); });
    r++;
  }
  const headers = splitLogLine(lines[headerIdx], delim).map(function(h, i){ return h || ('Column ' + (i + 1)); });
  const cols = headers.map(function(){ return []; });
  for(let r = headerIdx + 1; r < lines.length; r++){
    const cells = splitLogLine(lines[r], delim);
    if(cells.length !== headers.length) continue;
    if(filledRatio(cells) < 0.5) continue; // marker / padding rows
    for(let c = 0; c < headers.length; c++) cols[c].push(toNum(cells[c], commaDecimal));
  }
  const rowCount = cols[0].length;
  if(!rowCount) throw new Error('No data rows found under the header.');
  const numeric = headers.map(function(h, c){
    const ok = cols[c].filter(function(v){ return !isNaN(v); }).length;
    return ok / rowCount >= 0.8;
  });
  // Time axis: a time-like header that mostly increases; otherwise sample index.
  let timeIdx = -1;
  headers.forEach(function(h, c){
    if(timeIdx !== -1 || !numeric[c] || !/time|sec|stamp/i.test(h)) return;
    let up = 0;
    for(let i = 1; i < rowCount; i++) if(cols[c][i] >= cols[c][i - 1]) up++;
    if(up / Math.max(1, rowCount - 1) > 0.95) timeIdx = c;
  });
  // Show time relative to the first sample, and in seconds when the log
  // records milliseconds (DS1: "Timestamp [ms]").
  let timeScale = 1, timeUnit = '';
  if(timeIdx !== -1){
    const h = headers[timeIdx];
    if(/[\[(]\s*ms\s*[\])]|\bms\b/i.test(h)){ timeScale = 1000; timeUnit = 's'; }
    else if(/[\[(]\s*s(ec(onds?)?)?\s*[\])]/i.test(h)) timeUnit = 's';
  }
  return applyLogProfile({ headers: headers, cols: cols, numeric: numeric, timeIdx: timeIdx, rows: rowCount, delim: delim,
    t0: timeIdx !== -1 ? cols[timeIdx][0] : 0, timeScale: timeScale, timeUnit: timeUnit, preamble: preamble });
}

function logSignature(headers){ return 'tgk-logview:' + headers.join('|').slice(0, 400); }
function normCol(x){ return String(x || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

// Rule -> columns. An exact header match wins; otherwise every header that
// contains the rule's name matches. That's what lets one rule on
// "IKCtl_agKnkInt_as8" check all six per-cylinder DS1 columns [0]..[5].
function ruleColumns(rule, log){
  const want = normCol(rule.column_name);
  if(!want) return [];
  const exact = [], partial = [];
  log.headers.forEach(function(h, i){
    if(!log.numeric[i] || i === log.timeIdx) return;
    const n = normCol(h);
    if(n === want) exact.push(i);
    else if(n.indexOf(want) !== -1) partial.push(i);
  });
  return exact.length ? exact : partial;
}

// Per rule: which columns tripped, how many separate events (runs of
// consecutive samples), and the worst value. hitsByCol drives the red
// markers on each chart.
function evaluateRules(log){
  return (S.logRules || []).map(function(rule){
    const cols = ruleColumns(rule, log);
    const th = Number(rule.threshold);
    const out = { rule: rule, cols: cols, hitsByCol: {}, events: 0, worst: null, worstCol: -1, trippedCols: [], total: 0 };
    cols.forEach(function(c){
      const data = colData(log, c), hits = [];
      for(let i = 0; i < data.length; i++){
        const v = data[i];
        if(isNaN(v)) continue;
        if(rule.operator === '>' ? v > th : v < th){
          hits.push(i);
          if(out.worst === null || (rule.operator === '>' ? v > out.worst : v < out.worst)){ out.worst = v; out.worstCol = c; }
        }
      }
      if(!hits.length) return;
      out.hitsByCol[c] = hits;
      out.trippedCols.push(c);
      out.total += hits.length;
      for(let k = 0; k < hits.length; k++) if(k === 0 || hits[k] - hits[k - 1] > 1) out.events++;
    });
    return out;
  });
}

function xValue(log, i){ return log.timeIdx !== -1 ? (log.cols[log.timeIdx][i] - log.t0) / log.timeScale : i; }

// Fuel cut / overrun: on lift-off the ECU stops injecting and lambda
// channels jump to their maximum (16 on DS1/Bosch), passing through values
// like 2-12 on the way. A gasoline engine never runs at lambda >= 2 while
// combusting, so any sample where ANY lambda channel (actual or setpoint)
// reads >= 2 is overrun. With "Hide fuel cut" on, those samples are gaps
// on every lambda chart and are ignored by flag rules - otherwise a lean
// rule fires every time the driver lifts.
const FUEL_CUT_LAMBDA = 2.0;
function mixtureKind(log, c){
  const m = log.meta && log.meta[c];
  if(m && (m.role === 'lambda' || m.role === 'lambda_target')) return 'lambda';
  if(m && (m.role === 'afr' || m.role === 'afr2')) return 'afr';
  if(!m && /^lam|lambda/i.test(log.headers[c] || '')) return 'lambda';
  return null;
}
function isLambdaCol(log, c){ return mixtureKind(log, c) !== null; }
// Fuel cut / overrun. Lambda: any lambda channel >= 2 (no combustion runs
// that lean). AFR loggers (e.g. JB4) peg their wideband near 20 on lift-off,
// so AFR >= 19.9 counts only while the pedal is closed.
function fuelCutMask(log){
  if(log._fcMask) return log._fcMask;
  const lam = [], afr = [];
  log.headers.forEach(function(h, c){ if(!log.numeric[c]) return; const k = mixtureKind(log, c); if(k === 'lambda') lam.push(c); else if(k === 'afr') afr.push(c); });
  const ped = roleCols(log, 'pedal')[0];
  const mask = new Array(log.rows).fill(false);
  for(let i = 0; i < log.rows; i++){
    if(lam.some(function(c){ return log.cols[c][i] >= FUEL_CUT_LAMBDA; })){ mask[i] = true; continue; }
    if(afr.length){
      const closed = ped === undefined ? false : !(log.cols[ped][i] >= 5);
      if(closed && afr.some(function(c){ return log.cols[c][i] >= 19.9; })) mask[i] = true;
      else if(ped === undefined && afr.some(function(c){ return log.cols[c][i] >= FUEL_CUT_LAMBDA * 14.7; })) mask[i] = true;
    }
  }
  log._fcMask = mask;
  return mask;
}
function colData(log, c){
  const hide = !S.logView || S.logView.hideFuelCut !== false;
  if(!hide || !isLambdaCol(log, c)) return log.cols[c];
  log._fc = log._fc || {};
  if(!log._fc[c]){
    const mask = fuelCutMask(log);
    log._fc[c] = log.cols[c].map(function(v, i){ return mask[i] ? NaN : v; });

}

function sampleAt(log, t){

  return Math.abs(xValue(log, lo) - t) <= Math.abs(xValue(log, hi) - t) ? lo : hi;
}
// Matching channel in the comparison log, by normalized header name.
function compareCol(c){
  const V = S.logView;
  if(!V || !V.compare) return -1;
  const want = normCol(V.log.headers[c]);
  const b = V.compare.log;
  for(let i = 0; i < b.headers.length; i++) if(b.numeric[i] && normCol(b.headers[i]) === want) return i;
  return -1;
}
function timeLabel(log){ return log.timeIdx === -1 ? 'Sample' : (log.timeUnit ? 'Time (' + log.timeUnit + ')' : log.headers[log.timeIdx]); }
function fmtNum(v){ if(v === null || isNaN(v)) return '-'; const a = Math.abs(v); return a >= 1000 ? v.toFixed(0) : (a >= 10 ? v.toFixed(1) : v.toFixed(2)); }

// Downsample to ~W buckets keeping each bucket's min and max, so short
// spikes (a knock event, a boost overshoot) survive on a long log.
/* ---------- LOG FORMAT PROFILES ---------- */
// parseLog finds the data table (STRUCTURE); this layer decides what each
// column MEANS. A profile recognizes one logger's files and maps columns
// to roles (rpm, boost, per-cylinder knock, ...) with units. Everything
// downstream - names, layouts, WOT zoom, fuel-cut handling, analysis -
// asks for roles, never raw column names. Adding a logger = adding one
// profile. Unknown formats get the GENERIC best guess, and a tuner can
// reassign any column in the viewer; that correction is saved per format.
const LOG_ROLES = {

  speed:{label:'Vehicle speed'}, gear:{label:'Gear'}, load:{label:'Load'},
  boost:{label:'Boost pressure (actual)'}, boost_target:{label:'Boost pressure (target)'}, boost2:{label:'Boost pressure (bank 2)'},
  boost_ecu:{label:'ECU boost'}, boost_target_ecu:{label:'ECU boost target'}, wgdc:{label:'Wastegate duty'},
  timing:{label:'Ignition timing'}, ign_cyl:{label:'Ignition timing', group:true},
  knock_cyl:{label:'Knock retard', group:true},
  lambda:{label:'Lambda'}, lambda_target:{label:'Lambda target'}, afr:{label:'AFR'}, afr2:{label:'AFR (bank 2)'},
  hpfp:{label:'Rail pressure (actual)'}, hpfp_target:{label:'Rail pressure (setpoint)'}, lpfp:{label:'Low-pressure fuel'},
  inj_time:{label:'Injection time'}, fuel_trim:{label:'Fuel trim'}, ethanol:{label:'Ethanol content'},
  iat:{label:'Intake air temp'}, coolant:{label:'Coolant temp'}, oil_temp:{label:'Oil temp'}, trans_temp:{label:'Trans temp'},
  maf:{label:'Mass airflow'}

// map entries: [role, regex on the column name (unit stripped), options]

// negative retard like DS1, +1 = positive degrees pulled like JB4, 0 = infer).
const LOG_PROFILES = [
  { id:'ds1', name:'DS1',
    detect: function(h){ return h.some(function(x){ return /^(nmot_w|IKCtl_agKnkInt|pvdr_w|zwoutzyl)/i.test(chBase(x)); }); },
    map: [ ['rpm',/^nmot_w$/i], ['pedal',/^AccP_r_VW$/i], ['throttle',/^wdk_w/i], ['speed',/^CHdT_vVehloc$/i],
      ['gear',/^CoEng_nrActGearHem$/i], ['load',/^rl_w$/i], ['iat',/^tans/i], ['coolant',/^tmot/i],
      ['oil_temp',/^SLmpCtl_tOilSwmp/i], ['knock_cyl',/^IKCtl_agKnkInt/i,{sign:-1}], ['ign_cyl',/^zwoutzyl/i],
      ['inj_time',/^InjSys_tiInjSum$/i], ['lpfp',/^FuelP_pAct$/i], ['hpfp',/^prist_w/i], ['hpfp_target',/^prsoll_w/i],
      ['boost',/^pvdr_w/i], ['boost_target',/^pvds_w/i], ['lambda',/^lam/i] ] },
  { id:'jb4', name:'JB4', timeUnit:'s',
    detect: function(h, pre){ return pre.some(function(p){ return /JB4_MAC_Address/i.test(p.k); }) || (h.indexOf('WGDC_FF') !== -1 && h.indexOf('ECU Boost') !== -1); },
    note: 'JB4 files carry no units or channel descriptions. Ign_2 to Ign_8 are treated as per-cylinder timing corrections (degrees pulled) because that is how they behave in the logs checked. "Target" is not treated as boost target because it does not track boost. Reassign anything under Channel roles if needed.',
    map: [ ['rpm',/^RPM$/i], ['pedal',/^Pedal$/i], ['throttle',/^Throttle$/i], ['speed',/^Speed$/i,{unit:'mph'}], ['gear',/^GEAR$/i],
      ['boost',/^Boost$/i,{unit:'psi'}], ['boost2',/^Boost2$/i,{unit:'psi'}], ['boost_ecu',/^ECU Boost$/i,{unit:'psi'}],
      ['boost_target_ecu',/^ECU Target$/i,{unit:'psi'}], ['wgdc',/^WGDC$/i,{unit:'%'}], ['timing',/^Timing$/i,{unit:'deg'}],
      ['knock_cyl',/^Ign_(\d+)$/i,{sign:1, unit:'deg'}], ['afr',/^AFR$/i], ['afr2',/^AFR2$/i], ['hpfp',/^FuelP High$/i],
      ['lpfp',/^FuelP Low$/i], ['fuel_trim',/^Fuel Trims$/i], ['ethanol',/^E85$/i,{unit:'%'}], ['iat',/^IAT$/i,{unit:'deg F'}],
      ['coolant',/^Water Temp$/i,{unit:'deg F'}], ['oil_temp',/^Oil Temp$/i,{unit:'deg F'}], ['trans_temp',/^Trans Temp$/i,{unit:'deg F'}],
      ['maf',/^MAF$/i] ] },
  { id:'generic', name:'Unrecognized format (best guess)',
    detect: function(){ return true; },
    note: 'This logger is not recognized, so channels were matched by common names. Check Channel roles and correct anything wrong - the correction is remembered for every log from this logger.',
    map: [ ['rpm',/^(rpm|engine ?(speed|rpm)|eng ?spd)/i], ['pedal',/(accel|pedal)/i], ['throttle',/(throttle|tps)/i],
      ['gear',/^(gear|current ?gear)/i], ['speed',/(vehicle ?speed|^speed$|^vss|^mph|km\/?h)/i],
      ['boost_target',/(boost|map).*(target|request|set|desired|cmd)|(target|requested|desired).*(boost|pressure)/i],
      ['boost',/^(boost|boost ?pressure|map|manifold ?(abs|pressure)?)/i],
      ['knock_cyl',/(knock|kr|kc|timing ?corr|ign\w* ?corr)\D*(\d)/i,{sign:0}],
      ['ign_cyl',/(ign\w*|timing|spark)\D*cyl\D*(\d)|^(ign|timing)[ _-]?(\d)$/i],

      ['lambda_target',/lambda.*(target|req|set|cmd)|(target|commanded).*lambda/i], ['lambda',/lambda/i],
      ['afr',/(^afr|air ?fuel)/i], ['hpfp',/(rail|hpfp|high.*fuel|fuel.*high)/i], ['lpfp',/(lpfp|low.*fuel|fuel.*low)/i],
      ['iat',/(^iat|intake ?air|charge ?air)/i], ['coolant',/(coolant|water ?temp|^ect)/i], ['oil_temp',/oil ?temp/i],
      ['ethanol',/(ethanol|^e85|flex)/i], ['wgdc',/(wgdc|wastegate)/i], ['load',/load/i], ['maf',/^maf/i] ] }
];

const HEADER_META = {};   // column name -> { role, idx, unit, sign } for name/unit lookups
function chMeta(h){ return HEADER_META[h] || null; }

function roleOverrides(){
  try{ return JSON.parse((S.settings && S.settings.log_role_maps) || '{}') || {}; }catch(e){ return {}; }
}
function logFingerprint(log){
  let hsh = 0; const str = log.headers.join('|');
  for(let i = 0; i < str.length; i++){ hsh = ((hsh << 5) - hsh + str.charCodeAt(i)) | 0; }
  return (log.profile ? log.profile.id : 'x') + ':' + (hsh >>> 0).toString(36);
}
function colIsFlat(log, c){
  const d = log.cols[c]; let mn = Infinity, mx = -Infinity;
  for(let i = 0; i < d.length; i++){ const v = d[i]; if(!isNaN(v)){ if(v < mn) mn = v; if(v > mx) mx = v; } }
  return mn === Infinity || mn === mx;
}
function groupIdxFromName(name){ const m = chBase(name).match(/\[(\d+)\]/) || chBase(name).match(/(\d+)\D*$/); return m ? m[1] : null; }

function applyLogProfile(log){
  const prof = LOG_PROFILES.find(function(p){ return p.detect(log.headers, log.preamble || []); });
  log.profile = prof;
  if(prof.timeUnit && log.timeIdx !== -1 && !log.timeUnit) log.timeUnit = prof.timeUnit;
  log.meta = {};
  const usedSingle = {};
  log.headers.forEach(function(h, c){
    // Constant or empty columns (JB4 logs many) get no role - except in a
    // per-cylinder group, where a flat column is a cylinder that never
    // knocked, which is worth showing.
    if(!log.numeric[c] || c === log.timeIdx) return;
    const flat = colIsFlat(log, c);
    for(let k = 0; k < prof.map.length; k++){
      const m = prof.map[k];
      if(!m[1].test(chBase(h))) continue;
      const role = m[0], def = LOG_ROLES[role] || {}, opt = m[2] || {};
      if(flat && !def.group) break;
      if(!def.group && usedSingle[role]) continue;   // singles: first match wins
      log.meta[c] = { role: role, idx: def.group ? groupIdxFromName(h) : null, unit: opt.unit || '', sign: opt.sign };
      usedSingle[role] = true;
      break;
    }
  });
  // Tuner corrections for this format win over the profile.
  log.fingerprint = logFingerprint(log);
  const ov = roleOverrides()[log.fingerprint] || {};
  Object.keys(ov).forEach(function(name){
    const c = log.headers.indexOf(name); if(c === -1) return;
    const r = ov[name];
    if(r === 'none'){ delete log.meta[c]; return; }
    const def = LOG_ROLES[r]; if(!def) return;
    const prev = log.meta[c] || {};
    log.meta[c] = { role: r, idx: def.group ? groupIdxFromName(name) : null, unit: prev.unit || '', sign: r === 'knock_cyl' ? (prev.sign !== undefined ? prev.sign : 0) : undefined };
  });
  log.roles = {};
  Object.keys(log.meta).forEach(function(k){ const m = log.meta[k]; (log.roles[m.role] = log.roles[m.role] || []).push(Number(k)); });
  Object.keys(log.roles).forEach(function(r){
    if(LOG_ROLES[r] && LOG_ROLES[r].group) log.roles[r].sort(function(a, b){ return (Number(log.meta[a].idx) || 0) - (Number(log.meta[b].idx) || 0); });
  });
  log.headers.forEach(function(h, c){ if(log.meta[c]) HEADER_META[h] = log.meta[c]; else delete HEADER_META[h]; });
  log._fc = null; log._fcMask = null; log._disp = null;

}
function roleCols(log, role){ return (log.roles && log.roles[role]) ? log.roles[role].slice() : []; }

// Existing code asks for DS1 patterns (e.g. /^pvdr_w/i); each maps to a
// role, so those calls resolve to the right column in ANY format.
const RE_ROLE = {};
LOG_PROFILES[0].map.forEach(function(m){ RE_ROLE[m[1].source] = m[0]; });

// Knock sign: -1 when values are negative retard, +1 when positive degrees
// pulled. Unknown (generic) is inferred from the data.
function knockSign(log, cols){
  const m = log.meta && cols.length ? log.meta[cols[0]] : null;
  if(m && (m.sign === 1 || m.sign === -1)) return m.sign;
  let pos = 0, neg = 0;
  cols.forEach(function(c){ log.cols[c].forEach(function(v){ if(v > 0) pos++; else if(v < 0) neg++; }); });

function unitOf(log, c){ return c === undefined ? '' : chConv(log.headers[c]).unit; }
// Pressure differences to hPa, so thresholds work whatever unit a log uses.
function hpaFactor(unit){

function chGroupRaw(h){ return chBase(h).replace(/\[\d+\]/, '').replace(/[ _-]?\d+$/, '').trim(); }
const LOG_COLORS = ['#0d9488', '#ea580c', '#2563eb', '#9333ea', '#db2777', '#65a30d', '#0891b2', '#ca8a04'];

function chUnitRaw(h){ const m = String(h).match(/\[([^\]]*)\]\s*$/) || String(h).match(/\(([^)]*)\)\s*$/); return m ? m[1].trim() : ''; }

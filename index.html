/* ================= DASHBOARD ================= */
// Dashboard is a triage screen, not a full list: each section shows the
// top few rows and links to where the full list lives (the Board for
// applications). Keeps it to roughly one screen.
const DASH_LIMIT = 5;
function dashHead(title, sub, linkHtml){
  return '<div class="dash-head"><div><div class="section-title" style="margin:0">' + title + '</div>'
    + (sub ? '<div class="file-meta" style="margin-top:2px">' + sub + '</div>' : '') + '</div>'
    + (linkHtml || '') + '</div>';
}
function dashLink(label, onclick){ return '<a class="dash-link" onclick="' + onclick + '">' + label + ' &rarr;</a>'; }

function renderDashboard(){
  const apps = S.applications;
  // Everything waiting on the tuner: new submissions + revision requests,
  // revisions first (a customer already has a tune and is unhappy), then
  // oldest first within each.
  const attention = apps.filter(function(a){ return a.status === 'submitted' || a.status === 'revision_requested'; })
    .sort(function(x, y){
      if(x.status !== y.status) return x.status === 'revision_requested' ? -1 : 1;
      return stageDays(y) - stageDays(x);
    });
  const active = apps.filter(function(a){ return ['accepted','active','tune_sent','revision_requested'].indexOf(a.status) !== -1; });
  const completed = apps.filter(function(a){ return a.status === 'completed'; });
  const unpaidTotal = S.unpaidInvoices.reduce(function(sum, i){ return sum + (Number(i.amount) || 0); }, 0);

  let html = '<div class="stat-row">';
  html += statCard(attention.length, 'Needs Attention', 'sc-attn');
  html += statCard(active.length, 'Active Builds', 'sc-teal');
  html += statCard(S.unpaidInvoices.length ? '$' + unpaidTotal.toFixed(0) : '$0', 'Unpaid Invoices', S.unpaidInvoices.some(isStaleInvoice) ? 'sc-attn' : '');
  html += statCard(completed.length, 'Completed', 'sc-green');
  html += '</div>';

  html += dashHead('Needs Attention', 'New submissions and revision requests', attention.length > DASH_LIMIT ? dashLink('All ' + attention.length + ' on the Board', "goPage('board')") : '');
  html += '<div class="tbl-wrap">' + (attention.length ? appTable(attention.slice(0, DASH_LIMIT)) : '<div class="empty-state"><div class="big">&#10003;</div>You\'re all caught up.</div>') + '</div>';

  if(S.unpaidInvoices.length){
    const showAll = S.dashShowAllUnpaid;
    html += dashHead('Unpaid Invoices', STALE_INVOICE_DAYS + '+ days unpaid is flagged red',
      S.unpaidInvoices.length > DASH_LIMIT ? dashLink(showAll ? 'Show fewer' : 'Show all ' + S.unpaidInvoices.length, 'toggleDashUnpaid()') : '');

async function saveNewApplication(){

function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

// Loosely brackets the "7 business days" promise made on the intake form
// (about 9-10 calendar days once weekends are accounted for) without doing
// exact business-day math.
function agingCell(a){
  const days = daysSince(a.created_at);
  let html = fmtDateShort(a.created_at);
  if(a.status === 'submitted' && days !== null){
    if(days >= 9) html += '<div style="color:var(--red);font-weight:700;font-size:var(--t-xs);margin-top:2px">' + days + 'd old - overdue</div>';
    else if(days >= 4) html += '<div style="color:var(--orange-d);font-weight:700;font-size:var(--t-xs);margin-top:2px">' + days + 'd old</div>';
    else html += '<div style="color:var(--text3);font-size:var(--t-xs);margin-top:2px">' + days + 'd old</div>';
  }
  return html;
}

// Who needs to act next, computed from status plus (when relevant) who sent
// the last customer-facing message - both already sitting on the row, no
// extra query needed.
// rank: lower sorts first - the tuner needs to look at rank 0 rows before
// anything else, since the ball is in their court there.
function waitingOnLabel(a){
  if(a.status === 'revision_requested') return { text:'Waiting on tuner', cls:'pill-red', rank:0 };
  if(a.status === 'active'){
    if(a.last_message_by === 'customer') return { text:'Waiting on tuner', cls:'pill-red', rank:0 };
    if(a.last_message_by === 'tuner') return { text:'Waiting on customer', cls:'pill-orange', rank:2 };
    return { text:'In progress', cls:'pill-teal', rank:1 };
  }
  if(a.status === 'tune_sent') return { text:'Waiting on customer', cls:'pill-orange', rank:2 };
  if(a.status === 'accepted') return { text:'Not started', cls:'pill-muted', rank:3 };
  return { text:'-', cls:'pill-muted', rank:4 };
}

async function bulkUpdateField(field, value){
  const ids = Array.from(S.selectedIds);
  if(!ids.length) return;
  try{
    const patch = { [field]: value, updated_at: new Date().toISOString() };
    const { data, error } = await sb.from('tuning_applications').update(patch).in('id', ids).select();
    if(error) throw error;
    (data || []).forEach(function(updated){
      const idx = S.applications.findIndex(function(a){ return a.id === updated.id; });
      if(idx !== -1) S.applications[idx] = updated;
    });
    ids.forEach(function(id){ logActivity(id, field, null, value); });
    toast('Updated ' + ids.length + ' application' + (ids.length===1?'':'s'));
    S.selectedIds.clear();
    renderNav();
    document.getElementById('appResults').innerHTML = renderAppResultsHtml();
  }catch(e){
    toast('Bulk update failed: ' + e.message, true);
  }
}

// Dashboard's "what's in flight and who needs to act" view - accepted,
// active, tune_sent, and revision_requested applications, sorted so
// whatever needs the tuner's attention right now rises to the top.
function activeAppsTable(rows, limit){
  let sorted = rows.slice().sort(function(a, b){
    const ra = waitingOnLabel(a).rank, rb = waitingOnLabel(b).rank;
    if(ra !== rb) return ra - rb;
    const da = daysSince(a.last_message_at || a.updated_at) || 0;
    const db = daysSince(b.last_message_at || b.updated_at) || 0;
    return db - da; // longest-waiting first within the same urgency
  });
  if(limit) sorted = sorted.slice(0, limit);
  let html = '<table><thead><tr><th>#</th><th>Customer</th><th>Car</th><th>Status</th><th>Waiting On</th><th>Last Activity</th></tr></thead><tbody>';
  sorted.forEach(function(a){
    const w = waitingOnLabel(a);
    const lastActivity = a.last_message_at ? (daysSince(a.last_message_at) + 'd ago') : (daysSince(a.updated_at) + 'd ago (no activity)');
    html += '<tr class="row-click" onclick="openApplication(\'' + a.id + '\')">'
      + '<td>' + (a.has_unread ? '<span class="unread-dot"></span>' : '') + '#' + a.application_number + '</td>'
      + '<td>' + escapeHtml(a.customer_name) + flagChips(a) + invoiceChip(a) + '<div class="file-meta">' + escapeHtml(a.customer_email) + '</div></td>'
      + '<td>' + escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ')) + '</td>'
      + '<td><span class="pill ' + (STATUS_PILL[a.status]||'pill-muted') + '">' + (STATUS_LABEL[a.status]||a.status) + '</span></td>'
      + '<td><span class="pill ' + w.cls + '">' + w.text + '</span></td>'
      + '<td>' + lastActivity + '</td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

/* ================= PANEL WIDTH ================= */
// Mirrors Support Center's ticket panel exactly: a three-step width cycle
// (narrow/wide/full) via a header button, remembered per-user across
// sessions. Applied to the element via data-w rather than rewritten into
// the CSS, so the slide-in transition keeps working.
function _ghostWidthGet(){
  try{ const v = localStorage.getItem('ghost_panel_width'); if(v==='narrow'||v==='wide'||v==='full') return v; }catch(_){}
  return 'wide';
}
function applyGhostPanelWidth(){
  const p = document.getElementById('tk-panel');
  if(!p) return;
  const w = _ghostWidthGet();
  p.setAttribute('data-w', w);
  const b = document.getElementById('tk-width-btn');
  if(b) b.title = 'Panel width: ' + w + ' (click to cycle)';
}
function cycleGhostPanelWidth(){
  const order = ['narrow','wide','full'];
  const next = order[(order.indexOf(_ghostWidthGet()) + 1) % order.length];
  try{ localStorage.setItem('ghost_panel_width', next); }catch(_){}
  applyGhostPanelWidth();
}
window.cycleGhostPanelWidth = cycleGhostPanelWidth;

  }
  html += '</select></div>';

  html += '</div>';
  return html;
}

async function updateStatus(appId, newStatus, quiet, skipUndo){
  const app = S.applications.find(function(a){ return a.id === appId; });
  if(!app) return;
  const oldStatus = app.status;
  if(oldStatus === newStatus) return;

  // Baseline-log check: starting a build without a stock log from the
  // customer is usually a mistake, but not always (a log may have come in
  // another way), so this warns with an override rather than blocking.
  if(!quiet && newStatus === 'active'){
    const logCount = await countCustomerLogs(appId);
    if(logCount === 0 && !confirm('No baseline datalog has been uploaded by this customer yet.\n\nMove to In Progress anyway?')){
      if(S.openAppId === appId) renderPanelShell_refresh(app);
      return;
    }
  }

  let declinedReason = app.declined_reason;
  let noteToCustomer = null;
  if(!quiet && newStatus === 'needs_info'){
    const reason = prompt('What do you need from the customer? This is sent to them as a message:');
    if(reason) noteToCustomer = reason;
  }
  if(!quiet && newStatus === 'declined'){
    const reason = prompt('Reason for declining (kept internal, optional):');
    if(reason) declinedReason = reason;
  }

  const patch = { status:newStatus, updated_at:new Date().toISOString() };
  if(newStatus === 'declined') patch.declined_reason = declinedReason;
  if(!app.reviewed_at && oldStatus === 'submitted'){
    patch.reviewed_at = new Date().toISOString();
    patch.reviewed_by = S.user ? S.user.email : null;
  }
  if(!app.assigned_tuner) patch.assigned_tuner = S.settings.default_tuner || (S.user ? S.user.email : null);

  try{
    const { data, error } = await sb.from('tuning_applications').update(patch).eq('id', appId).select().single();
    if(error) throw error;
    Object.assign(app, data);

    if(noteToCustomer){
      const { data: msgData, error: msgErr } = await sb.from('tuning_messages').insert({
        application_id: appId,
        sender_type: 'tuner',
        sender_name: S.user ? S.user.email : null,
        body: noteToCustomer
      }).select().single();
      if(!msgErr){
        if(!S.messages[appId]) S.messages[appId] = [];
        S.messages[appId].push(msgData);
        pingPortal(appId);
      }
    }

    await logActivity(appId, 'status', oldStatus, newStatus);
    if(!quiet){
      callNotify('status_changed', { application_id: appId, new_status: newStatus });
      toast('Status updated to ' + STATUS_LABEL[newStatus]);
    }
    pingPortal(appId);
    renderPanelShell_refresh(app);
    renderPage();

    if(!skipUndo){
      pushUndo({
        label: 'status change on #' + app.application_number,
        undo: function(){ return updateStatus(appId, oldStatus, true, true); },
        redo: function(){ return updateStatus(appId, newStatus, true, true); }
      });
    }
  }catch(e){
    toast('Failed to update status: ' + e.message, true);
  }
}
window.updateStatus = updateStatus;

/* ---- keeping the tuner's place across a background redraw ----
   Live updates (a customer message, an invoice, a file, an application change)
   redraw the open panel by rebuilding it, which used to empty a half-typed
   reply and throw the cursor out of the box. A redraw marked { background:true }
   now puts back, for the same application and tab: every typed field (reply
   box, Edit Profile form, upload card...), which field has focus and where its
   cursor is, and the scroll position. Redraws the tuner causes themselves
   (sending, uploading, switching tab) are NOT marked, so they still reset
   fields as before. */
function panelCapture(){
  const el = document.getElementById('panelBody');
  if(!el || !el.dataset.rk) return null;
  const st = { key: el.dataset.rk, scroll: el.scrollTop, atBottom: el.scrollHeight - el.scrollTop - el.clientHeight < 60, fields: {}, hasFile: false, focus: null };
  el.querySelectorAll('input, textarea, select').forEach(function(c){
    if(c.type === 'file'){ if(c.files && c.files.length) st.hasFile = true; return; }
    if(!c.id) return;
    st.fields[c.id] = (c.type === 'checkbox' || c.type === 'radio') ? { checked: c.checked } : { value: c.value };
  });
  const a = document.activeElement;
  if(a && a !== el && el.contains(a) && a.id){
    st.focus = { id: a.id };
    if(typeof a.selectionStart === 'number'){ st.focus.s = a.selectionStart; st.focus.e = a.selectionEnd; st.focus.top = a.scrollTop; }
  }
  return st;
}
function panelRestore(el, st){
  if(!st) return;
  Object.keys(st.fields).forEach(function(id){
    const c = document.getElementById(id);
    if(!c || !el.contains(c)) return;
    const f = st.fields[id];
    if('checked' in f) c.checked = f.checked; else if(c.value !== f.value) c.value = f.value;
  });
  // Content may have grown (a new message): someone at the bottom, writing a
  // reply, stays at the bottom so the box doesn't slide out of view.
  el.scrollTop = st.atBottom ? el.scrollHeight : st.scroll;
  if(st.focus){
    const c = document.getElementById(st.focus.id);
    if(c && el.contains(c)){
      try{ c.focus({ preventScroll: true }); }catch(e){ c.focus(); }
      if(st.focus.s != null && c.setSelectionRange){ try{ c.setSelectionRange(st.focus.s, st.focus.e); }catch(e){ /* not a text field */ } }
      if(st.focus.top != null) c.scrollTop = st.focus.top;
    }
  }
}

// Is the tuner in the middle of something in the panel body: a field focused
// (the keyboard may be open on a phone), a dropdown open, or a file picked?
function panelUserIsEditing(el){
  const fi = el.querySelector('input[type=file]');
  if(fi && fi.files && fi.files.length) return true;
  const a = document.activeElement;
  if(!a || a === el || !el.contains(a)) return false;
  if(a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') return true;
  if(a.tagName === 'INPUT') return ['checkbox', 'radio', 'button', 'submit', 'file', 'range'].indexOf(a.type) === -1;
  return !!a.isContentEditable;
}

// Header and status/assignee row refreshed in place, leaving the tabs and the
// body (where the tuner may be typing) untouched. One the tuner has open
// right now (a status picker) is left alone.
function refreshPanelHead(app){
  const live = document.getElementById('tk-panel'); if(!live) return;
  const tmp = document.createElement('div'); tmp.innerHTML = renderPanelShell(app);
  const cur = [live.children[0], live.children[1]], nu = [tmp.children[0], tmp.children[1]];   // snapshot first: moving a node out of tmp shifts its list
  const a = document.activeElement;
  for(let i = 0; i < 2; i++){
    if(!cur[i] || !nu[i]) continue;
    if(a && cur[i].contains(a)) continue;
    cur[i].replaceWith(nu[i]);
  }
  applyGhostPanelWidth();
}

function renderPanelShell_refresh(app, opts){
  if(opts && opts.background && document.getElementById('panelBody')){
    refreshPanelHead(app);
    renderPanelBody({ background: true });
    return;
  }
  document.getElementById('tk-panel').innerHTML = renderPanelShell(app);
  applyGhostPanelWidth();
  renderPanelBody();
}

function renderPanelBody(opts){
  const app = S.applications.find(function(a){ return a.id === S.openAppId; });
  if(!app) return;
  const el = document.getElementById('panelBody');
  if(!el) return;
  const bg = !!(opts && opts.background), key = app.id + ':' + S.activeTab;
  const firstTime = el.dataset.rk !== key, wasBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 160;
  if(bg && el.dataset.rk === key){
    // A live update. The reply box is NEVER rebuilt: on a phone, destroying a
    // focused box closes the keyboard (and code can't reopen it), and rewriting
    // it mid-sentence upsets autocorrect. So on the Messages tab only the
    // conversation above it is refreshed.
    const list = document.getElementById('msgList');
    if(S.activeTab === 'messages' && list && document.getElementById('replyBody')){
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60, top = el.scrollTop;
      list.innerHTML = renderMessageListHtml(app);
      el.scrollTop = atBottom ? el.scrollHeight : top;      // someone writing a reply at the bottom stays at the bottom
      const t0 = document.getElementById('panelTabs'); if(t0) t0.innerHTML = tabButtons();
      return;
    }
    // Any other tab: don't rebuild it under someone who is typing in it. Their
    // next action (save, send, switch tab) redraws with fresh data anyway.
    if(panelUserIsEditing(el)){ S.panelStale = true; return; }
  }
  S.panelStale = false;
  let st = opts && opts.captured !== undefined ? opts.captured : (bg ? panelCapture() : null);
  if(st && st.key !== key) st = null;                // only ever restore into the same application + tab
  if(bg && st && st.hasFile) return;                 // a file is picked but not uploaded yet: leave the picker alone
  if(S.activeTab === 'overview') el.innerHTML = S.editingOverview ? renderOverviewEdit(app) : renderOverview(app);
  else if(S.activeTab === 'messages') el.innerHTML = renderMessagesTab(app);
  else if(S.activeTab === 'files') el.innerHTML = renderFilesTab(app);
  else if(S.activeTab === 'invoices') el.innerHTML = renderInvoicesSection(app);
  else if(S.activeTab === 'activity') el.innerHTML = renderActivityTab(app);
  // Keep the tab badges (unpaid invoice count) in step with every re-render.
  const tabs = document.getElementById('panelTabs');
  if(tabs) tabs.innerHTML = tabButtons();
  wireDropzones();
  el.dataset.rk = key;
  panelRestore(el, st);
  // On a phone a conversation opens at the newest message with the reply box
  // right under it; the same after sending, if you were already at the bottom.
  if(!bg && S.activeTab === 'messages' && isPhone() && (firstTime || wasBottom)) el.scrollTop = el.scrollHeight;
}

// Best-effort, computed client-side from data already loaded - no schema
// changes needed. Maintenance dates are free text by design (see schema
// notes), so date parsing here is a heuristic: it only ever flags things
// it's confident about, never blocks or corrects what the customer typed.
function computeFlags(a){
  const flags = [];
  if(a.has_ds1 === false && a.purchasing_ds1_through_us === false) flags.push('No DS1 plan');

  function monthsSince(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr);
    if(isNaN(d.getTime())) return null;
    return (Date.now() - d.getTime()) / (1000*60*60*24*30);
  }
  [['spark_plug_date','Plugs overdue'], ['oil_change_date','Oil overdue'],
   ['trans_service_date','Trans service overdue'], ['air_filter_date','Air filter overdue']].forEach(function(f){
    const m = monthsSince(a[f[0]]);
    if(m !== null && m > 18) flags.push(f[1]);
  });

  if(a.maintenance_self_performed === false && !a.maintenance_shop_name) flags.push('Missing shop name');

  const coreFields = ['car_year','car_make','car_model','car_mileage','customer_name','customer_email'];
  if(coreFields.some(function(f){ return !a[f]; })) flags.push('Incomplete profile');

  return flags;
}

function findRepeatApplications(a){
  if(!a.customer_email) return [];
  return S.applications.filter(function(x){
    return x.id !== a.id && x.customer_email && x.customer_email.toLowerCase() === a.customer_email.toLowerCase();
  });
}

function flagChips(a){
  return computeFlags(a).map(function(f){ return '<span class="flag-chip">' + escapeHtml(f) + '</span>'; }).join('');
}

/* ================= UNPAID INVOICES (dashboard + list badges) ================= */
// An invoice counts as stale once it's been unpaid this many days since it
// was sent - the point where a reminder is probably worth sending.
const STALE_INVOICE_DAYS = 7;

async function loadUnpaidInvoices(){
  try{
    const { data, error } = await sb.from('tuning_invoices')
      .select('id,application_id,amount,sent_at,reminder_count,last_reminded_at')
      .eq('status', 'sent')
      .order('sent_at', { ascending:true });
    if(error) throw error;
    S.unpaidInvoices = data || [];
  }catch(e){ /* non-critical: badges just don't show */ }
}

function invoiceAgeDays(inv){ return daysSince(inv.sent_at) || 0; }
function isStaleInvoice(inv){ return invoiceAgeDays(inv) >= STALE_INVOICE_DAYS; }

function invoiceChip(a){
  const mine = S.unpaidInvoices.filter(function(i){ return i.application_id === a.id; });
  if(!mine.length) return '';
  const total = mine.reduce(function(sum, i){ return sum + (Number(i.amount) || 0); }, 0);
  const oldest = Math.max.apply(null, mine.map(invoiceAgeDays));
  const stale = oldest >= STALE_INVOICE_DAYS;
  return '<span class="inv-chip' + (stale ? ' stale' : '') + '" title="' + mine.length + ' unpaid invoice' + (mine.length > 1 ? 's' : '') + '">'
    + 'Unpaid $' + total.toFixed(2) + (stale ? ' - ' + oldest + 'd' : '') + '</span>';
}

function renderUnpaidInvoicesTable(limit){
  let rows = S.unpaidInvoices.slice().sort(function(x, y){ return invoiceAgeDays(y) - invoiceAgeDays(x); });
  if(limit) rows = rows.slice(0, limit);
  let html = '<table><thead><tr><th>#</th><th>Customer</th><th>Amount</th><th>Sent</th><th>Reminders</th><th></th></tr></thead><tbody>';
  rows.forEach(function(inv){
    const a = S.applications.find(function(x){ return x.id === inv.application_id; });
    if(!a) return;
    const age = invoiceAgeDays(inv);
    html += '<tr class="row-click" onclick="openApplication(\'' + a.id + '\')">'
      + '<td>#' + a.application_number + '</td>'
      + '<td>' + escapeHtml(a.customer_name) + '<div class="file-meta">' + escapeHtml(a.customer_email) + '</div></td>'
      + '<td>$' + Number(inv.amount || 0).toFixed(2) + '</td>'
      + '<td><span class="pill ' + (isStaleInvoice(inv) ? 'pill-red' : 'pill-yellow') + '">' + age + 'd ago</span></td>'
      + '<td>' + (inv.reminder_count ? inv.reminder_count + ' (last ' + daysSince(inv.last_reminded_at) + 'd ago)' : '-') + '</td>'
      + '<td onclick="event.stopPropagation()"><button class="btn btn-sm" id="remindBtn-' + inv.id + '" onclick="sendInvoiceReminder(\'' + a.id + '\',\'' + inv.id + '\')">Remind</button></td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

// Re-sends Shopify's invoice email for an unpaid invoice (same payment link).
// Not wired into undo: an email can't be unsent.
async function sendInvoiceReminder(appId, invoiceId){
  const a = S.applications.find(function(x){ return x.id === appId; });
  if(!confirm('Email ' + (a ? a.customer_name : 'the customer') + ' a payment reminder for this invoice?')) return;
  const btns = [document.getElementById('remindBtn-' + invoiceId), document.getElementById('panelRemindBtn-' + invoiceId)];
  btns.forEach(function(b){ if(b){ b.disabled = true; b.textContent = 'Sending...'; } });
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'remind', invoice_id: invoiceId })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Reminder failed');
    if(result.invoice && S.invoices[appId]) replaceInvoiceInState(appId, result.invoice);
    await loadUnpaidInvoices();
    renderPage();
    toast('Payment reminder sent');
  }catch(e){
    toast('Failed to send reminder: ' + e.message, true);
    btns.forEach(function(b){ if(b){ b.disabled = false; b.textContent = b.id.indexOf('panel') === 0 ? 'Send Reminder' : 'Remind'; } });
  }
}
window.sendInvoiceReminder = sendInvoiceReminder;

// Invoice tracking is deliberately separate from shopify_order_number /
// payment_status above - those track the ORIGINAL Shopify purchase, this
// tracks an invoice the tuner sends once an application is accepted (extra
// work, revisions, whatever the acceptance covers). Available once the
// application has reached accepted or later, and stays visible after that
// even if status later moves to archived - once an invoice has been sent
// or paid, that record shouldn't disappear.
function canManageInvoice(a){
  const reachedAccepted = ['accepted','active','tune_sent','revision_requested','completed'].indexOf(a.status) !== -1;
  const hasInvoices = Array.isArray(S.invoices[a.id]) && S.invoices[a.id].length > 0;
  return reachedAccepted || hasInvoices;
}
function invoiceStatusLabel(s){
  return { sent:'Awaiting Payment', paid:'Paid', cancelled:'Cancelled', refunded:'Refunded' }[s] || s;
}
function invoiceStatusPillClass(s){
  return { sent:'pill-yellow', paid:'pill-green', cancelled:'pill-muted', refunded:'pill-red' }[s] || 'pill-muted';
}

// Renders the whole "Invoices" section for the Overview tab: every invoice
// this application has ever had (an additional tune, extra dyno time, a
// second round of work all just become another entry here), each with its
// own status and its own actions, plus a "Send New Invoice" button that's
// always available - sending never touches an earlier invoice.
// Invoices tab. Each invoice is one compact row (status, number, total,
// date) that expands for line items. Only one primary action is shown on
// the row; everything else lives in its "More" menu, so the list stays
// scannable even with several invoices.
function renderInvoicesSection(a){
  if(!canManageInvoice(a)){
    return '<div class="empty-state" style="padding:24px 0">Invoicing opens once this application is accepted.'
      + '<div style="margin-top:14px"><button class="btn btn-sm" onclick="openLinkPaymentModal(\'' + a.id + '\')">Customer already paid? Link their payment</button></div></div>';
  }
  const invoices = S.invoices[a.id] || [];
  // Numbered oldest-first so "Invoice 1" stays Invoice 1 as more are added.
  const numberOf = {};   // "Invoice 1, 2, 3" counts only invoices sent from the app - outside payments are labelled on their own
  invoices.filter(function(i){ return !isOutsidePayment(i); }).sort(function(x, y){ return new Date(x.created_at) - new Date(y.created_at); })
    .forEach(function(inv, i){ numberOf[inv.id] = i + 1; });
  const owed = invoices.filter(function(i){ return i.status === 'sent'; }).reduce(function(t, i){ return t + (Number(i.amount) || 0); }, 0);
  const paid = invoices.filter(function(i){ return i.status === 'paid'; }).reduce(function(t, i){ return t + (Number(i.amount) || 0); }, 0);

  let html = '<div class="inv-head">'
    + '<div class="file-meta">Outstanding <strong style="color:' + (owed ? 'var(--orange)' : 'var(--text)') + '">$' + owed.toFixed(2) + '</strong> &middot; Paid <strong>$' + paid.toFixed(2) + '</strong></div>'
    + '<span class="inv-head-btns"><button class="btn btn-sm" onclick="openLinkPaymentModal(\'' + a.id + '\')">Link outside payment</button>'
    + '<button class="btn btn-sm btn-primary" onclick="openSendInvoiceModal(\'' + a.id + '\')">+ New Invoice</button></span>'
    + '</div>';

  if(!invoices.length) return html + '<div class="empty-state" style="padding:24px 0">No invoices sent yet.</div>';

  html += invoices.map(function(inv){
    const lines = Array.isArray(inv.line_items) ? inv.line_items : [];
    const when = inv.status === 'refunded' ? 'Refunded ' + fmtDate(inv.refunded_at) + (inv.refunded_amount != null && Number(inv.refunded_amount) < Number(inv.amount||0) - 0.01 ? ' (partial, $' + Number(inv.refunded_amount).toFixed(2) + ')' : '')
      : (inv.status === 'paid' ? 'Paid ' + (dateOnlyPaid(inv) ? fmtDateShort(inv.paid_at) : fmtDate(inv.paid_at)) + outsideTag(inv)
      : (inv.status === 'cancelled' ? 'Cancelled ' + fmtDate(inv.cancelled_at) : 'Sent ' + fmtDate(inv.sent_at) + ' &middot; ' + (daysSince(inv.sent_at) || 0) + 'd'));
    const stale = inv.status === 'sent' && (daysSince(inv.sent_at) || 0) >= STALE_INVOICE_DAYS;

    let primary = '';
    let menu = '';
    if(inv.status === 'sent'){
      primary = '<button class="btn btn-sm" id="panelRemindBtn-' + inv.id + '" onclick="sendInvoiceReminder(\'' + a.id + '\',\'' + inv.id + '\')">Send Reminder</button>';
      menu = '<div class="more-wrap"><button class="btn btn-sm more-btn" onclick="toggleMoreMenu(this)">More &#9662;</button>'
        + '<div class="more-menu">'
        + '<a onclick="openEditInvoiceModal(\'' + a.id + '\',\'' + inv.id + '\')">Edit &amp; resend</a>'
        + '<a id="refreshInvoiceBtn-' + inv.id + '" onclick="refreshInvoiceStatus(\'' + a.id + '\',\'' + inv.id + '\')">Check payment in Shopify</a>'
        + (inv.invoice_url ? '<a onclick="copyInvoiceLink(\'' + escapeHtml(inv.invoice_url) + '\')">Copy payment link</a><a href="' + escapeHtml(inv.invoice_url) + '" target="_blank" rel="noopener">Open payment page</a>' : '')
        + '<a onclick="closeMoreMenus();openLinkPaymentModal(\'' + a.id + '\',\'' + inv.id + '\')">Paid outside the app&hellip;</a>'
        + '<a id="cancelInvoiceBtn-' + inv.id + '" class="danger" onclick="cancelInvoice(\'' + a.id + '\',\'' + inv.id + '\')">Cancel invoice</a>'
        + '</div></div>';
    } else if(inv.status === 'paid'){
      // A recorded payment (Zelle, cash...) has no Shopify order, so there is nothing to check for a refund.
      const hasOrder = !!inv.shopify_order_id || (!inv.source || inv.source === 'app') && !inv.payment_method;
      primary = hasOrder ? '<button class="btn btn-sm" id="checkRefundBtn-' + inv.id + '" onclick="checkInvoiceRefund(\'' + a.id + '\',\'' + inv.id + '\')">Check for Refund</button>' : '';
      if(isOutsidePayment(inv) || inv.shopify_order_id){
        menu = '<div class="more-wrap"><button class="btn btn-sm more-btn" onclick="toggleMoreMenu(this)">More &#9662;</button><div class="more-menu">'
          + (inv.shopify_order_id ? '<a onclick="closeMoreMenus();openOrderInShopify(\'' + inv.shopify_order_id + '\')">Open order in Shopify</a>' : '')
          + (isOutsidePayment(inv) ? '<a class="danger" onclick="closeMoreMenus();unlinkOutsidePayment(\'' + a.id + '\',\'' + inv.id + '\')">' + (inv.source === 'manual' ? 'Remove this record' : 'Remove the link') + '</a>' : '')
          + '</div></div>';
      }
    } else if(inv.status === 'cancelled'){
      // No live Shopify draft order left to edit or resend once cancelled -
      // "Resend" and "Edit & resend" both create a brand NEW invoice (same
      // pattern as "Send New Invoice"), pre-filled with this one's line
      // items; the cancelled row itself is untouched unless deleted.
      primary = '<button class="btn btn-sm" id="resendInvoiceBtn-' + inv.id + '" onclick="resendCancelledInvoice(\'' + a.id + '\',\'' + inv.id + '\')">Resend</button>';
      menu = '<div class="more-wrap"><button class="btn btn-sm more-btn" onclick="toggleMoreMenu(this)">More &#9662;</button>'
        + '<div class="more-menu">'
        + '<a onclick="openResendInvoiceModal(\'' + a.id + '\',\'' + inv.id + '\')">Edit &amp; resend</a>'
        + '<a id="deleteInvoiceBtn-' + inv.id + '" class="danger" onclick="deleteInvoice(\'' + a.id + '\',\'' + inv.id + '\')">Delete</a>'
        + '</div></div>';
    }

    const linesHtml = lines.length ? lines.map(function(l){
      return '<div class="invoice-line"><div class="invoice-line-desc">' + (l.quantity > 1 ? l.quantity + '&times; ' : '') + escapeHtml(l.title) + (l.type === 'custom' ? ' <span class="pill pill-muted">custom</span>' : '') + '</div>'
        + '<div class="invoice-line-amt"><span>$' + (Number(l.price) * Number(l.quantity||1)).toFixed(2) + '</span></div></div>';
    }).join('') : '<div class="invoice-empty">No line items on record.</div>';

    return '<div class="inv-row' + (inv.status === 'cancelled' ? ' cancelled' : '') + '">'
      + '<div class="inv-sum" onclick="this.parentNode.classList.toggle(\'open\')">'
        + '<span class="pill ' + (stale ? 'pill-red' : invoiceStatusPillClass(inv.status)) + '">' + invoiceStatusLabel(inv.status) + '</span>'
        + '<span class="inv-title">' + invTitle(inv, numberOf) + '<span class="file-meta"> &middot; ' + when + (inv.reminder_count ? ' &middot; reminded ' + inv.reminder_count + 'x' : '') + '</span></span>'
        + '<span class="inv-amt">$' + Number(inv.amount || 0).toFixed(2) + '</span>'
        + '<span class="inv-actions" onclick="event.stopPropagation()">' + primary + menu + '</span>'
      + '</div>'
      + '<div class="inv-detail">' + linesHtml + outsideDetail(inv)
        + (inv.notes ? '<div class="file-meta" style="margin-top:8px;font-style:italic">' + escapeHtml(inv.notes) + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
  return html;
}

/* ================= OUTSIDE PAYMENTS =================
   A customer who paid without a payment link from this app - through the regular
   Shopify store, Zelle, cash, a check - gets that payment attached to their application
   so it counts as paid everywhere and reminders stop. Server side: tuning-link-payment. */
const SHOPIFY_ADMIN_ORDERS = 'https://admin.shopify.com/store/tgk-motorsport/orders/';
const OUTSIDE_METHODS = ['Zelle', 'Venmo', 'PayPal', 'Cash App', 'Cash', 'Check', 'Bank transfer', 'Card (in person)', 'Other'];
// A payment the tuner typed in has a date but no time of day, so show just the date.
function dateOnlyPaid(inv){ return !!inv && (inv.source === 'manual' || (settledOutside(inv) && !inv.shopify_order_id)); }
function isOutsidePayment(inv){ return !!inv && (inv.source === 'shopify_order' || inv.source === 'manual'); }
function settledOutside(inv){ return !!inv && inv.status !== 'sent' && !isOutsidePayment(inv) && !!inv.payment_method; }
function invTitle(inv, numberOf){
  if(inv.source === 'shopify_order') return 'Order ' + escapeHtml(inv.shopify_order_name || '');
  if(inv.source === 'manual') return 'Payment received';
  return 'Invoice ' + (numberOf[inv.id] || '');
}
function outsideTag(inv){
  if(inv.source === 'shopify_order') return ' &middot; Shopify order (outside the app)';
  if(inv.source === 'manual') return ' &middot; ' + escapeHtml(inv.payment_method || 'Other') + (inv.payment_reference ? ' ' + escapeHtml(inv.payment_reference) : '') + ' (outside the app)';
  if(settledOutside(inv)) return ' &middot; ' + escapeHtml(inv.payment_method) + ' (settled outside the app)';
  return '';
}
function outsideDetail(inv){
  if(!isOutsidePayment(inv) && !settledOutside(inv)) return '';
  const bits = [];
  if(inv.payment_method) bits.push('Paid by <strong>' + escapeHtml(inv.payment_method) + '</strong>');
  if(inv.payment_reference) bits.push('Reference <strong>' + escapeHtml(inv.payment_reference) + '</strong>');
  if(inv.paid_by) bits.push(escapeHtml(inv.paid_by));
  return bits.length ? '<div class="file-meta" style="margin-top:8px">' + bits.join(' &middot; ') + '</div>' : '';
}
function openOrderInShopify(orderId){ window.open(SHOPIFY_ADMIN_ORDERS + encodeURIComponent(orderId), '_blank', 'noopener'); }
window.openOrderInShopify = openOrderInShopify;

async function callLinkPayment(body){
  const { data: sess } = await sb.auth.getSession();
  const token = sess && sess.session && sess.session.access_token;
  if(!token) throw new Error('Not signed in');
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-link-payment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  let result = null;
  try{ result = await resp.json(); }catch(e){ throw new Error('The link-payment service did not answer properly (is tuning-link-payment deployed?)'); }
  return result;
}

function lpOpenInvoices(appId){
  return (S.invoices[appId] || []).filter(function(i){ return i.status === 'sent'; })
    .sort(function(x, y){ return new Date(x.created_at) - new Date(y.created_at); });
}
function lpInvoiceLabel(appId, inv){
  const all = (S.invoices[appId] || []).filter(function(i){ return !isOutsidePayment(i); }).sort(function(x, y){ return new Date(x.created_at) - new Date(y.created_at); });
  return 'Invoice ' + (all.findIndex(function(i){ return i.id === inv.id; }) + 1) + ' - ' + money(inv.amount) + ' - sent ' + (daysSince(inv.sent_at) || 0) + 'd ago';
}
function lpToday(){ const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

async function openLinkPaymentModal(appId, settlesId){
  const app = S.applications.find(function(a){ return a.id === appId; });
  if(!app) return;
  if(!Array.isArray(S.invoices[appId])){ try{ await loadInvoices(appId); }catch(e){ /* the list is only used to offer open invoices */ } }
  S.lp = { appId: appId, tab: 'order', query: '', busy: false, order: null, err: '', settles: settlesId || '', ack: false, amount: '', method: '', ref: '', paidOn: lpToday(), desc: '' };
  openModal(renderLinkPaymentModal());
  setTimeout(function(){ const q = document.getElementById('lpQuery'); if(q && !isPhone()) q.focus(); }, 60);
}
window.openLinkPaymentModal = openLinkPaymentModal;

function lpCapture(){
  const L = S.lp; if(!L) return;
  const v = function(id){ const e = document.getElementById(id); return e ? e.value : null; };
  if(v('lpQuery') != null) L.query = v('lpQuery');
  if(v('lpAmount') != null) L.amount = v('lpAmount');
  if(v('lpMethod') != null) L.method = v('lpMethod');
  if(v('lpRef') != null) L.ref = v('lpRef');
  if(v('lpPaidOn') != null) L.paidOn = v('lpPaidOn');
  if(v('lpDesc') != null) L.desc = v('lpDesc');
  if(v('lpSettles') != null) L.settles = v('lpSettles');
  const ack = document.getElementById('lpAck'); if(ack) L.ack = ack.checked;
}
function lpAmountNum(){ const n = Number(String(S.lp.amount).replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; }
function lpCanSubmit(){
  const L = S.lp; if(!L || L.busy) return false;
  if(L.tab === 'order') return !!(L.order && L.order.linkable && (L.order.email_matches !== false || L.ack));
  return lpAmountNum() > 0 && !!L.method && !!L.paidOn;
}
function lpSubmitLabel(){
  const L = S.lp;
  if(L.busy) return 'Saving&hellip;';
  if(L.tab === 'order') return L.order && L.order.linkable ? 'Link order ' + escapeHtml(L.order.order.name) + ' &middot; ' + money(L.order.order.net) : 'Link order';
  return lpAmountNum() > 0 ? 'Record payment &middot; ' + money(lpAmountNum()) : 'Record payment';
}
function lpRefreshFoot(){
  const b = document.getElementById('lpSubmit'); if(!b) return;
  b.innerHTML = lpSubmitLabel(); b.disabled = !lpCanSubmit();
}
function lpInput(){ lpCapture(); lpRefreshFoot(); }
window.lpInput = lpInput;

function lpResultHtml(){
  const L = S.lp;
  if(L.busy && L.tab === 'order' && !L.order) return '<div class="file-meta" style="padding:10px 0">Looking in Shopify&hellip;</div>';
  if(L.err) return '<div class="lp-box lp-err">' + escapeHtml(L.err) + '</div>';
  const r = L.order; if(!r) return '';
  const o = r.order;
  const lines = (o.line_items || []).map(function(l){ return '<div class="lp-line"><span>' + (l.quantity > 1 ? l.quantity + '&times; ' : '') + escapeHtml(l.title) + '</span><span>' + money(l.price * (l.quantity || 1)) + '</span></div>'; }).join('');
  let html = '<div class="lp-order">'
    + '<div class="lp-order-top"><div><div class="lp-order-name">Order ' + escapeHtml(o.name) + '</div><div class="file-meta">' + fmtDate(o.created_at) + '</div></div>'
    + '<div class="lp-order-amt">' + money(o.net) + '<div class="file-meta">' + (o.refunded > 0 ? 'after ' + money(o.refunded) + ' refunded' : escapeHtml(String(o.financial_status || '').toLowerCase().replace(/_/g, ' '))) + '</div></div></div>'
    + '<div class="lp-who">' + escapeHtml(o.customer_name || 'No customer name') + (o.email ? ' &middot; ' + escapeHtml(o.email) : '') + '</div>'
    + (lines ? '<div class="lp-lines">' + lines + '</div>' : '') + '</div>';
  if(!r.linkable) html += '<div class="lp-box lp-err">' + escapeHtml(r.reason || 'This order can\'t be linked.') + '</div>';
  else if(r.email_matches === true) html += '<div class="lp-box lp-ok">&#10003; The order\'s email matches this customer.</div>';
  else if(r.email_matches === false) html += '<div class="lp-box lp-warn">This order\'s email (<strong>' + escapeHtml(o.email) + '</strong>) is different from this customer\'s (<strong>' + escapeHtml(r.application.email || 'none on file') + '</strong>).'
    + '<label class="lp-ack"><input type="checkbox" id="lpAck" onchange="lpInput()"' + (L.ack ? ' checked' : '') + '> It is the right customer - link it anyway</label></div>';
  return html;
}

function lpBodyHtml(){
  const L = S.lp;
  if(L.tab === 'order'){
    return '<label class="form-label" for="lpQuery">Order number or link</label>'
      + '<div class="lp-find"><input class="form-input" id="lpQuery" inputmode="text" autocomplete="off" placeholder="#4321, or paste the order link from Shopify" value="' + escapeHtml(L.query) + '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();lpLookup();}" oninput="lpInput()">'
      + '<button type="button" class="btn" id="lpFind" onclick="lpLookup()">Look up</button></div>'
      + '<div class="file-meta" style="margin:4px 0 10px">Shopify is checked directly - the amount comes from the order, not from anything typed here.</div>'
      + '<div id="lpResult">' + lpResultHtml() + '</div>';
  }
  return '<div class="lp-grid">'
    + '<div class="form-group"><label class="form-label" for="lpAmount">Amount paid</label><div class="inv-money-in lp-money"><span>$</span><input class="form-input" id="lpAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="' + escapeHtml(L.amount) + '" oninput="lpInput()"></div></div>'
    + '<div class="form-group"><label class="form-label" for="lpMethod">Paid by</label><select class="form-input" id="lpMethod" onchange="lpInput()"><option value="">Choose&hellip;</option>'
      + OUTSIDE_METHODS.map(function(m){ return '<option' + (L.method === m ? ' selected' : '') + '>' + escapeHtml(m) + '</option>'; }).join('') + '</select></div>'
    + '<div class="form-group"><label class="form-label" for="lpPaidOn">Date paid</label><input class="form-input" id="lpPaidOn" type="date" max="' + lpToday() + '" value="' + escapeHtml(L.paidOn) + '" onchange="lpInput()"></div>'
    + '<div class="form-group"><label class="form-label" for="lpRef">Reference <span class="lp-opt">(optional)</span></label><input class="form-input" id="lpRef" placeholder="Confirmation or check #" value="' + escapeHtml(L.ref) + '" oninput="lpInput()"></div>'
    + '</div>'
    + '<div class="form-group"><label class="form-label" for="lpDesc">What it was for <span class="lp-opt">(optional - the customer sees this)</span></label><input class="form-input" id="lpDesc" placeholder="Tuning - paid outside the app" value="' + escapeHtml(L.desc) + '" oninput="lpInput()"></div>';
}

function lpSettleHtml(){
  const L = S.lp, open = lpOpenInvoices(L.appId);
  if(!open.length) return '';
  return '<div class="lp-settle"><label class="form-label" for="lpSettles">This payment settles</label>'
    + '<select class="form-input" id="lpSettles" onchange="lpInput()"><option value="">Nothing - just record the payment</option>'
    + open.map(function(i){ return '<option value="' + i.id + '"' + (L.settles === i.id ? ' selected' : '') + '>' + escapeHtml(lpInvoiceLabel(L.appId, i)) + '</option>'; }).join('') + '</select>'
    + '<div class="file-meta" style="margin-top:4px">Choosing an invoice marks it paid and <strong>cancels its payment link</strong>, so the customer can\'t pay it a second time.</div></div>';
}

function renderLinkPaymentModal(){
  const L = S.lp, app = S.applications.find(function(a){ return a.id === L.appId; });
  return '<div class="modal lp-modal">'
    + '<div class="inv-top"><div><div class="modal-title" style="margin:0">Link an outside payment</div>'
    + '<div class="file-meta" style="margin-top:3px">Application #' + app.application_number + ' &middot; ' + escapeHtml(app.customer_name) + (app.customer_email ? ' &middot; ' + escapeHtml(app.customer_email) : '') + '</div></div>'
    + '<button type="button" class="inv-close" aria-label="Close" onclick="closeModal()">&times;</button></div>'
    + '<p class="lp-lead">For a customer who paid <strong>without</strong> a payment link from this app &mdash; through the regular store, Zelle, cash and so on. It then shows as paid everywhere, and reminders stop.</p>'
    + '<div class="fx-seg lp-seg"><button type="button" class="' + (L.tab === 'order' ? 'on' : '') + '" onclick="lpSetTab(\'order\')">Shopify order</button>'
    + '<button type="button" class="' + (L.tab === 'other' ? 'on' : '') + '" onclick="lpSetTab(\'other\')">Other payment</button></div>'
    + '<div id="lpBody">' + lpBodyHtml() + '</div>'
    + lpSettleHtml()
    + '<div class="inv-foot"><button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn btn-primary" id="lpSubmit" onclick="lpSubmit()"' + (lpCanSubmit() ? '' : ' disabled') + '>' + lpSubmitLabel() + '</button></div>'
    + '</div>';
}

function lpSetTab(tab){
  lpCapture(); S.lp.tab = tab; S.lp.err = '';
  openModal(renderLinkPaymentModal());
  setTimeout(function(){ const f = document.getElementById(tab === 'order' ? 'lpQuery' : 'lpAmount'); if(f && !isPhone()) f.focus(); }, 60);
}
window.lpSetTab = lpSetTab;

async function lpLookup(){
  lpCapture();
  const L = S.lp; if(!L || L.busy) return;
  if(!String(L.query).trim()){ L.err = 'Enter an order number like #4321, or paste the order link from Shopify.'; L.order = null; document.getElementById('lpResult').innerHTML = lpResultHtml(); lpRefreshFoot(); return; }
  L.busy = true; L.err = ''; L.order = null; L.ack = false;
  document.getElementById('lpResult').innerHTML = lpResultHtml();
  const find = document.getElementById('lpFind'); if(find){ find.disabled = true; find.textContent = 'Looking...'; }
  lpRefreshFoot();
  try{
    const res = await callLinkPayment({ action: 'lookup_order', application_id: L.appId, query: L.query.trim() });
    if(!S.lp || S.lp !== L) return;                       // the modal was closed or reopened meanwhile
    if(!res.success) L.err = res.error || 'Lookup failed';
    else L.order = res;
  }catch(e){ if(S.lp === L) L.err = e.message; }
  if(S.lp !== L) return;
  L.busy = false;
  const out = document.getElementById('lpResult'); if(out) out.innerHTML = lpResultHtml();
  const find2 = document.getElementById('lpFind'); if(find2){ find2.disabled = false; find2.textContent = 'Look up'; }
  lpRefreshFoot();
}
window.lpLookup = lpLookup;

async function lpSubmit(){
  lpCapture();
  const L = S.lp; if(!L || !lpCanSubmit()) return;
  L.busy = true; lpRefreshFoot();
  try{
    let res;
    if(L.tab === 'order'){
      res = await callLinkPayment({ action: 'link_order', application_id: L.appId, order_id: L.order.order.id, settles_invoice_id: L.settles || undefined, confirm_email_mismatch: L.ack === true });
      if(!res.success && res.code === 'email_mismatch'){
        L.busy = false; L.err = ''; L.order = Object.assign({}, L.order, { email_matches: false, application: { email: res.application_email } });
        document.getElementById('lpResult').innerHTML = lpResultHtml(); lpRefreshFoot();
        toast('Please confirm this is the right customer first', true); return;
      }
    }else{
      res = await callLinkPayment({ action: 'record_payment', application_id: L.appId, amount: lpAmountNum(), method: L.method, reference: L.ref || undefined, paid_on: L.paidOn || undefined, description: L.desc || undefined, settles_invoice_id: L.settles || undefined });
    }
    if(!res.success) throw new Error(res.error || 'Saving failed');
    const appId = L.appId, settled = !!L.settles, name = L.tab === 'order' ? L.order.order.name : null;
    S.lp = null; closeModal();
    if(settled) S.unpaidInvoices = S.unpaidInvoices.filter(function(i){ return i.id !== res.invoice.id; });
    replaceInvoiceInState(appId, res.invoice);
    renderNav(); renderPage();
    toast(name ? 'Order ' + name + ' linked - marked paid' : 'Payment recorded - marked paid');
  }catch(e){
    if(S.lp === L){ L.busy = false; lpRefreshFoot(); }
    toast('Could not save: ' + e.message, true);
  }
}
window.lpSubmit = lpSubmit;

// Takes back a linked order / recorded payment that was entered by mistake (never an invoice sent from the app).
async function unlinkOutsidePayment(appId, invoiceId){
  const inv = (S.invoices[appId] || []).find(function(i){ return i.id === invoiceId; });
  if(!inv) return;
  const what = inv.source === 'manual' ? 'this recorded payment' : 'the link to ' + (inv.shopify_order_name ? 'order ' + inv.shopify_order_name : 'this order');
  if(!confirm('Remove ' + what + ' (' + money(inv.amount) + ')? The customer will show as not having paid it. The Shopify order itself is not changed.')) return;
  try{
    const res = await callLinkPayment({ action: 'unlink', invoice_id: invoiceId });
    if(!res.success) throw new Error(res.error || 'Removing failed');
    const list = S.invoices[appId]; if(list){ const i = list.findIndex(function(x){ return x.id === invoiceId; }); if(i !== -1) list.splice(i, 1); }
    if(S.openAppId === appId) renderPanelBody();
    toast('Removed');
  }catch(e){ toast('Could not remove it: ' + e.message, true); }
}
window.unlinkOutsidePayment = unlinkOutsidePayment;

function toggleMoreMenu(btn){
  const menu = btn.nextElementSibling;
  const wasOpen = menu.classList.contains('open');
  closeMoreMenus();
  if(!wasOpen) menu.classList.add('open');
}
window.toggleMoreMenu = toggleMoreMenu;
function closeMoreMenus(){ document.querySelectorAll('.more-menu.open').forEach(function(m){ m.classList.remove('open'); }); }
document.addEventListener('click', function(ev){ if(!ev.target.closest || !ev.target.closest('.more-btn')) closeMoreMenus(); });

function copyInvoiceLink(url){
  closeMoreMenus();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast('Payment link copied'); }, function(){ prompt('Copy this payment link:', url); });
  } else prompt('Copy this payment link:', url);
}
window.copyInvoiceLink = copyInvoiceLink;

async function loadInvoiceCatalog(){
  if(S.invoiceCatalog || S.invoiceCatalogLoading) return S.invoiceCatalog;
  S.invoiceCatalogLoading = true;
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'catalog' })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Catalog load failed');
    S.invoiceCatalog = result.variants || [];
  }catch(e){
    toast('Failed to load Shopify product catalog: ' + e.message, true);
    S.invoiceCatalog = [];
  }
  S.invoiceCatalogLoading = false;
  return S.invoiceCatalog;
}

function invoiceLineTotal(){
  return S.modalInvoiceLines.reduce(function(sum, l){ return sum + (Number(l.price)||0) * (Number(l.quantity)||1); }, 0);
}

// Always starts a brand new invoice - sending never touches an earlier one,
// which is exactly what lets a customer who wants an additional tune get a
// second invoice without disturbing the first.
async function openSendInvoiceModal(appId){
  const app = S.applications.find(function(a){ return a.id === appId; });
  if(!app) return;
  S.modalInvoiceId = null;
  S.modalInvoiceLines = [];
  S.invAppId = appId; S.invPickQuery = ''; S.invInvalid = {};
  openModal('<div class="modal inv-modal"><div class="modal-title">Loading products from Shopify&hellip;</div></div>');
  await loadInvoiceCatalog();
  openModal(renderInvoiceModalHtml(appId, ''));
}
window.openSendInvoiceModal = openSendInvoiceModal;

// Edits one specific still-unpaid invoice in place (its line items, its
// existing Shopify draft order) - for fixing a mistake before the customer
// pays, not for adding a new charge (use "Send New Invoice" for that).
async function openEditInvoiceModal(appId, invoiceId){
  const invoice = (S.invoices[appId] || []).find(function(i){ return i.id === invoiceId; });
  if(!invoice) return;
  S.modalInvoiceId = invoiceId;
  S.modalInvoiceLines = Array.isArray(invoice.line_items) ? JSON.parse(JSON.stringify(invoice.line_items)) : [];

  openModal('<div class="modal inv-modal"><div class="modal-title">Loading products from Shopify&hellip;</div></div>');
  await loadInvoiceCatalog();
  openModal(renderInvoiceModalHtml(appId, invoice.notes || ''));
}
window.openEditInvoiceModal = openEditInvoiceModal;

// Cancelled invoices have no live Shopify draft order left to edit - so
// "editing" one means building a brand NEW invoice pre-filled with its old

  S.modalInvoiceId = null;
  S.modalInvoiceLines = Array.isArray(invoice.line_items) ? JSON.parse(JSON.stringify(invoice.line_items)) : [];

window.openResendInvoiceModal = openResendInvoiceModal;

// One-click version of the above - no modal, just re-sends the exact same
// line items as a fresh invoice. Same sendInvoiceLines() the undo/redo
// system already uses to redo a cancelled invoice.
async function resendCancelledInvoice(appId, invoiceId){
  const invoice = (S.invoices[appId] || []).find(function(i){ return i.id === invoiceId; });
  if(!invoice) return;
  const btn = document.getElementById('resendInvoiceBtn-' + invoiceId);

    toast('Sent as a new invoice with the same line items');

// Permanently removes a cancelled invoice's record - unlike Cancel, which
// deliberately keeps the row for history, this actually deletes it. Routed
// through the edge function (service role) rather than a direct client
// delete, so the server can enforce that only a cancelled invoice - never
// a paid, refunded, or still-unpaid one - can ever be removed this way.
async function deleteInvoice(appId, invoiceId){
  if(!confirm('Permanently delete this cancelled invoice? This removes it from history for good and cannot be undone.')) return;
  const btn = document.getElementById('deleteInvoiceBtn-' + invoiceId);
  if(btn) btn.textContent = 'Deleting...';
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'delete', invoice_id: invoiceId })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Delete failed');
    const list = S.invoices[appId];
    if(list){ const idx = list.findIndex(function(i){ return i.id === invoiceId; }); if(idx !== -1) list.splice(idx, 1); }
    if(S.openAppId === appId) renderPanelBody();
    toast('Invoice deleted');
    return;
  }catch(e){
    toast('Failed to delete invoice: ' + e.message, true);
  }
  if(btn) btn.textContent = 'Delete';
}
window.deleteInvoice = deleteInvoice;

// Invoice builder: an invoice-style line table (SKU first), a searchable
// product picker, and editable custom lines. Typing in a qty/price/
// description cell updates amounts and totals in place (no re-render, so
// the field keeps focus); adding or removing a line re-renders.
function invSendLabel(){
  const t = invoiceLineTotal();
  return (S.modalInvoiceId ? 'Save &amp; resend' : 'Send invoice') + (t > 0 ? ' &middot; ' + money(t) : '');
}

function renderInvoiceModalHtml(appId, notesValue){
  const app = S.applications.find(function(a){ return a.id === appId; });
  const isEdit = !!S.modalInvoiceId;
  const lines = S.modalInvoiceLines;
  const bad = S.invInvalid || {};

  let rows = '';
  if(!lines.length){
    rows = '<tr class="inv-empty-row"><td colspan="6">No items yet. Search for a product above, or add a custom line.</td></tr>';
  }
  lines.forEach(function(l, i){
    const isCustom = l.type === 'custom';
    const amount = (Number(l.price) || 0) * (Number(l.quantity) || 1);
    rows += '<tr>'
      + '<td class="c-sku" data-label="SKU">' + (isCustom ? '<span class="inv-custom-tag">Custom</span>' : '<span class="inv-sku">' + escapeHtml(l.sku || '-') + '</span>') + '</td>'
      + '<td class="c-desc" data-label="Description">' + (isCustom
          ? '<input class="inv-cell' + (bad['d' + i] ? ' invalid' : '') + '" id="invDesc-' + i + '" value="' + escapeHtml(l.title || '') + '" placeholder="Describe the item" oninput="invSetField(' + i + ',\'title\',this.value)">'
          : '<span class="inv-desc">' + escapeHtml(l.title) + '</span>') + '</td>'
      + '<td class="c-qty" data-label="Qty"><input class="inv-cell inv-num" type="number" inputmode="numeric" min="1" step="1" value="' + (Number(l.quantity) || 1) + '" oninput="invSetField(' + i + ',\'quantity\',this.value)" onblur="invNormalizeQty(' + i + ',this)"></td>'
      + '<td class="c-price" data-label="Unit price">' + (isCustom
          ? '<span class="inv-money-in"><span>$</span><input class="inv-cell inv-num' + (bad['p' + i] ? ' invalid' : '') + '" type="number" inputmode="decimal" min="0" step="0.01" value="' + (l.price === '' || l.price == null ? '' : Number(l.price).toFixed(2)) + '" placeholder="0.00" oninput="invSetField(' + i + ',\'price\',this.value)"></span>'
          : '<span class="inv-amt">' + money(l.price) + '</span>') + '</td>'
      + '<td class="c-amount" data-label="Amount"><span class="inv-amt" id="invAmt-' + i + '">' + money(amount) + '</span></td>'
      + '<td class="c-x"><button type="button" class="inv-x" aria-label="Remove line" onclick="removeInvoiceLine(\'' + appId + '\',' + i + ')">&times;</button></td>'
      + '</tr>';
  });

  const count = lines.reduce(function(n, l){ return n + (Number(l.quantity) || 1); }, 0);
  return '<div class="modal inv-modal">'
    + '<div class="inv-top"><div>'
      + '<div class="modal-title" style="margin:0">' + (isEdit ? 'Edit invoice' : 'New invoice') + '</div>'
      + '<div class="file-meta" style="margin-top:3px">Application #' + app.application_number + ' &middot; ' + escapeHtml(app.customer_name) + ' &middot; ' + escapeHtml(app.customer_email || '') + '</div>'
    + '</div><button type="button" class="inv-close" aria-label="Close" onclick="closeModal()">&times;</button></div>'

    + '<div class="inv-toolbar">'
      + '<div class="inv-pick">'
        + '<input class="form-input" id="invPickInput" autocomplete="off" placeholder="Add a product - search by SKU or name" value="' + escapeHtml(S.invPickQuery || '') + '"'
        + ' onfocus="invPickOpen(true)" oninput="invPickFilter(this.value)" onkeydown="invPickKey(event, \'' + appId + '\')" onblur="setTimeout(function(){ invPickOpen(false); }, 150)">'
        + '<div class="inv-pick-list" id="invPickList"></div>'
      + '</div>'
      + '<button type="button" class="btn" onclick="addCustomLine(\'' + appId + '\')">+ Custom line</button>'
    + '</div>'

    + '<div class="inv-table-wrap"><table class="inv-table"><thead><tr>'
      + '<th class="c-sku">SKU</th><th class="c-desc">Description</th><th class="c-qty">Qty</th><th class="c-price">Unit price</th><th class="c-amount">Amount</th><th class="c-x"></th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'

    + '<div class="inv-bottom">'
      + '<label class="inv-notes"><span class="form-label">Message to customer <span style="text-transform:none;font-weight:500;letter-spacing:0">(optional, shown in the invoice email)</span></span>'
      + '<textarea class="form-input" id="invoiceNotesInput" placeholder="e.g. Covers dyno time and revision work">' + escapeHtml(notesValue || '') + '</textarea></label>'
      + '<div class="inv-totals">'
        + '<div class="inv-tot-row"><span>Items</span><span id="invCount">' + count + '</span></div>'
        + '<div class="inv-tot-row"><span>Subtotal</span><span id="invSubtotal">' + money(invoiceLineTotal()) + '</span></div>'
        + '<div class="inv-tot-row inv-grand"><span>Total</span><span id="invTotal">' + money(invoiceLineTotal()) + '</span></div>'
        + '<div class="inv-tax-note">Any tax is added by Shopify on the payment page.</div>'
      + '</div>'
    + '</div>'

    + '<div class="inv-foot">'
      + '<button class="btn" onclick="closeModal()">Cancel</button>'
      + '<button class="btn btn-primary" id="invSendBtn" onclick="confirmSendInvoice(\'' + appId + '\')"' + (lines.length ? '' : ' disabled') + '>' + invSendLabel() + '</button>'

// Totals, amounts and the send button, updated in place while typing.
function invRefreshTotals(){
  S.modalInvoiceLines.forEach(function(l, i){
    const el = document.getElementById('invAmt-' + i);
    if(el) el.textContent = money((Number(l.price) || 0) * (Number(l.quantity) || 1));
  });
  const t = invoiceLineTotal();
  const count = S.modalInvoiceLines.reduce(function(n, l){ return n + (Number(l.quantity) || 1); }, 0);
  const set = function(id, v){ const el = document.getElementById(id); if(el) el.textContent = v; };
  set('invSubtotal', money(t)); set('invTotal', money(t)); set('invCount', String(count));
  const b = document.getElementById('invSendBtn');
  if(b){ b.innerHTML = invSendLabel(); b.disabled = !S.modalInvoiceLines.length; }
}

function invSetField(i, field, v){
  const l = S.modalInvoiceLines[i]; if(!l) return;
  if(field === 'quantity'){ const n = parseInt(v, 10); l.quantity = n > 0 ? n : 1; }
  else if(field === 'price'){ l.price = v === '' ? '' : parseFloat(v); }
  else l[field] = v;
  if(S.invInvalid){ delete S.invInvalid['d' + i]; delete S.invInvalid['p' + i]; }
  invRefreshTotals();
}
window.invSetField = invSetField;
function invNormalizeQty(i, el){ const l = S.modalInvoiceLines[i]; if(l) el.value = l.quantity; }
window.invNormalizeQty = invNormalizeQty;

// ---- product picker
function invPickMatches(q){
  q = (q || '').trim().toLowerCase();
  return (S.invoiceCatalog || []).map(function(v, idx){ return { v: v, idx: idx }; })
    .filter(function(x){ return !q || ((x.v.sku || '') + ' ' + x.v.title).toLowerCase().indexOf(q) !== -1; })
    .sort(function(a, b){ return String(a.v.sku || '~').localeCompare(String(b.v.sku || '~')); });
}
function invPickRender(){
  const list = document.getElementById('invPickList'); if(!list) return;
  if(!(S.invoiceCatalog || []).length){ list.innerHTML = '<div class="inv-pick-empty">No Ghostronics products found in Shopify.</div>'; return; }
  const m = invPickMatches(S.invPickQuery);
  list.innerHTML = m.length ? m.map(function(x, k){
    return '<button type="button" class="inv-pick-item' + (k === (S.invPickHi || 0) ? ' hi' : '') + '" onmousedown="event.preventDefault()" onclick="invPick(' + x.idx + ')">'
      + '<span class="inv-sku">' + escapeHtml(x.v.sku || '-') + '</span>'
      + '<span class="inv-pick-name">' + escapeHtml(x.v.title) + '</span>'
      + '<span class="inv-pick-price">' + money(x.v.price) + '</span></button>';
  }).join('') : '<div class="inv-pick-empty">No product matches "' + escapeHtml(S.invPickQuery) + '". Use + Custom line for a one-off item.</div>';
}
function invPickOpen(on){
  const list = document.getElementById('invPickList'); if(!list) return;
  list.classList.toggle('open', !!on);
  if(on){ S.invPickHi = 0; invPickRender(); }
}
window.invPickOpen = invPickOpen;
function invPickFilter(v){ S.invPickQuery = v; S.invPickHi = 0; invPickOpen(true); }
window.invPickFilter = invPickFilter;
function invPickKey(ev, appId){
  const m = invPickMatches(S.invPickQuery);
  if(ev.key === 'ArrowDown'){ ev.preventDefault(); S.invPickHi = Math.min(m.length - 1, (S.invPickHi || 0) + 1); invPickRender(); }
  else if(ev.key === 'ArrowUp'){ ev.preventDefault(); S.invPickHi = Math.max(0, (S.invPickHi || 0) - 1); invPickRender(); }
  else if(ev.key === 'Enter'){ ev.preventDefault(); const x = m[S.invPickHi || 0]; if(x) invPick(x.idx); }
  else if(ev.key === 'Escape'){ invPickOpen(false); }
}
window.invPickKey = invPickKey;
// Picking a product already on the invoice bumps its quantity instead of
// adding a duplicate line.
function invPick(idx){
  const v = (S.invoiceCatalog || [])[idx]; if(!v) return;
  const existing = S.modalInvoiceLines.find(function(l){ return l.type === 'product' && String(l.variant_id) === String(v.variant_id); });
  if(existing) existing.quantity = (Number(existing.quantity) || 1) + 1;
  else S.modalInvoiceLines.push({ type:'product', variant_id: v.variant_id, sku: v.sku, title: v.title, price: v.price, quantity: 1 });
  S.invPickQuery = '';
  reopenInvoiceModal(S.invAppId);
  const inp = document.getElementById('invPickInput'); if(inp) inp.focus();
}
window.invPick = invPick;

function reopenInvoiceModal(appId){
  const notesInput = document.getElementById('invoiceNotesInput');
  const notesValue = notesInput ? notesInput.value : '';
  S.invAppId = appId;
  openModal(renderInvoiceModalHtml(appId, notesValue));
}

function addCustomLine(appId){
  S.modalInvoiceLines.push({ type:'custom', title:'', price:'', quantity:1 });
  reopenInvoiceModal(appId);
  const el = document.getElementById('invDesc-' + (S.modalInvoiceLines.length - 1));
  if(el) el.focus();
}
window.addCustomLine = addCustomLine;

function removeInvoiceLine(appId, idx){
  S.modalInvoiceLines.splice(idx, 1);
  S.invInvalid = {};
  reopenInvoiceModal(appId);
}
window.removeInvoiceLine = removeInvoiceLine;

// Custom lines need a description and a price above $0 before sending;
// problems are highlighted in the table rather than just toasted.
function invValidate(){
  const bad = {};
  S.modalInvoiceLines.forEach(function(l, i){
    if(l.type !== 'custom') return;
    if(!String(l.title || '').trim()) bad['d' + i] = true;
    if(!(Number(l.price) > 0)) bad['p' + i] = true;
  });
  S.invInvalid = bad;
  return !Object.keys(bad).length;
}


function replaceInvoiceInState(appId, invoice){
  const list = S.invoices[appId] || (S.invoices[appId] = []);
  const idx = list.findIndex(function(i){ return i.id === invoice.id; });
  if(idx !== -1) list[idx] = invoice; else list.unshift(invoice);
  if(S.openAppId === appId) renderPanelBody();
}

// Low-level "call tuning-invoice's send action" - always creates a brand
// new invoice. Used by the modal's Send button and as the redo half of an
// invoice-cancel undo entry, so redoing a cancelled invoice doesn't need to
// reopen the modal.
async function sendInvoiceLines(appId, lines, notes){
  const { data: sess } = await sb.auth.getSession();
  const token = sess && sess.session && sess.session.access_token;
  if(!token) throw new Error('Not signed in');
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ action: 'send', application_id: appId, line_items: lines, notes: notes })
  });
  const result = await resp.json();
  if(!result.success) throw new Error(result.error || 'Send failed');
  replaceInvoiceInState(appId, result.invoice);
  return result.invoice;
}

// Edits and re-sends one specific existing (still-unpaid) invoice.
async function updateInvoiceLines(appId, invoiceId, lines, notes){
  const { data: sess } = await sb.auth.getSession();
  const token = sess && sess.session && sess.session.access_token;
  if(!token) throw new Error('Not signed in');
  const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ action: 'update', invoice_id: invoiceId, line_items: lines, notes: notes })
  });
  const result = await resp.json();
  if(!result.success) throw new Error(result.error || 'Update failed');
  replaceInvoiceInState(appId, result.invoice);
  return result.invoice;
}

async function confirmSendInvoice(appId){
  if(!S.modalInvoiceLines.length){ toast('Add at least one line item', true); return; }
  if(!invValidate()){
    reopenInvoiceModal(appId);
    toast('Custom lines need a description and a price', true);
    return;
  }
  const notesInput = document.getElementById('invoiceNotesInput');
  const notes = notesInput.value.trim() || null;
  const lines = S.modalInvoiceLines.slice();
  const editingInvoiceId = S.modalInvoiceId;

  const sendBtn = document.getElementById('invSendBtn');
  if(sendBtn){ sendBtn.disabled = true; sendBtn.textContent = editingInvoiceId ? 'Saving...' : 'Sending...'; }

  try{
    const app = S.applications.find(function(a){ return a.id === appId; });

    if(editingInvoiceId){
      // Snapshot what's being replaced so undo can put it back with another edit.
      const before = (S.invoices[appId] || []).find(function(i){ return i.id === editingInvoiceId; });
      const beforeLines = before && Array.isArray(before.line_items) ? before.line_items.slice() : [];
      const beforeNotes = before ? before.notes : null;

      await updateInvoiceLines(appId, editingInvoiceId, lines, notes);
      closeModal();
      toast('Invoice updated and resent via Shopify');

      pushUndo({
        label: 'invoice edit on #' + (app ? app.application_number : appId),
        undo: function(){ return updateInvoiceLines(appId, editingInvoiceId, beforeLines, beforeNotes); },
        redo: function(){ return updateInvoiceLines(appId, editingInvoiceId, lines, notes); }
      });
    } else {
      const invoice = await sendInvoiceLines(appId, lines, notes);
      closeModal();
      toast('Invoice sent via Shopify');

      // "A way to undo orders": the invoice this just created is a real
      // Shopify draft order, so undoing it means actually cancelling that
      // draft order in Shopify, not just reverting a local field.
      pushUndo({
        label: 'invoice send on #' + (app ? app.application_number : appId),
        undo: function(){ return cancelInvoice(appId, invoice.id, true, true); },
        redo: function(){ return sendInvoiceLines(appId, lines, notes); }
      });
    }
  }catch(e){
    toast('Failed to save invoice: ' + e.message, true);
    if(sendBtn){ sendBtn.disabled = false; sendBtn.innerHTML = invSendLabel(); }
  }
}
window.confirmSendInvoice = confirmSendInvoice;

// The explicit "undo an order" action: deletes the Shopify draft order
// (only possible while it's unpaid - Shopify won't let a completed draft
// order be deleted) and marks that one invoice 'cancelled' - other
// invoices on the same application are untouched. Available both as its
// own button on that invoice, and as what pressing the global Undo button
// does right after a send.
async function cancelInvoice(appId, invoiceId, quiet, skipUndo){
  const invoice = (S.invoices[appId] || []).find(function(i){ return i.id === invoiceId; });
  if(!invoice) return;
  if(!quiet && !confirm('Cancel this invoice? This deletes the draft order in Shopify - the customer will no longer be able to pay it.')) return;

  // Snapshot what's being cancelled before the server wipes the draft
  // order, so an undo of this cancel (redo of the original send) has
  // something to resend.
  const snapshotLines = Array.isArray(invoice.line_items) ? invoice.line_items.slice() : null;
  const snapshotNotes = invoice.notes || null;

  const btn = document.getElementById('cancelInvoiceBtn-' + invoiceId);
  if(btn){ btn.disabled = true; btn.textContent = 'Cancelling...'; }

  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'cancel', invoice_id: invoiceId })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Cancel failed');
    replaceInvoiceInState(appId, result.invoice);
    if(!quiet) toast('Invoice cancelled');

    if(!skipUndo && snapshotLines && snapshotLines.length){
      const app = S.applications.find(function(a){ return a.id === appId; });
      pushUndo({
        label: 'invoice cancel on #' + (app ? app.application_number : appId),
        undo: function(){ return sendInvoiceLines(appId, snapshotLines, snapshotNotes); },
        redo: function(){ return cancelInvoice(appId, invoiceId, true, true); }
      });
    }
  }catch(e){
    toast('Failed to cancel invoice: ' + e.message, true);
    if(btn){ btn.disabled = false; btn.textContent = 'Cancel invoice'; }
  }
}
window.cancelInvoice = cancelInvoice;

async function refreshInvoiceStatus(appId, invoiceId){
  const btn = document.getElementById('refreshInvoiceBtn-' + invoiceId);
  if(btn){ btn.disabled = true; btn.textContent = 'Checking...'; }
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'refresh', invoice_id: invoiceId })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Refresh failed');
    if(result.invoice) replaceInvoiceInState(appId, result.invoice);
    toast(result.changed ? 'Invoice is paid - Shopify confirmed it' : 'Still unpaid as of Shopify\'s last word');
    return;
  }catch(e){
    toast('Shopify check failed: ' + e.message, true);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Check payment in Shopify'; }
}
window.refreshInvoiceStatus = refreshInvoiceStatus;

// Manual pull for the case a webhook already fired into a void - the order
// was cancelled/refunded before this invoice had shopify_order_id backfilled,
// or the webhook subscriptions simply weren't set up yet at the time. Asks
// Shopify for the order's current financial_status directly, right now,
// instead of waiting on an event that already happened and won't repeat.
async function checkInvoiceRefund(appId, invoiceId){
  const btn = document.getElementById('checkRefundBtn-' + invoiceId);
  if(btn){ btn.disabled = true; btn.textContent = 'Checking...'; }
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-invoice', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: 'check_refund', invoice_id: invoiceId })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Check failed');
    if(result.invoice) replaceInvoiceInState(appId, result.invoice);
    toast(result.changed ? 'Refund found - invoice marked refunded' : 'Still shows paid - no refund found in Shopify');
    return;
  }catch(e){
    toast('Shopify check failed: ' + e.message, true);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Check for Refund'; }
}
window.checkInvoiceRefund = checkInvoiceRefund;


// Collapsible Overview section. Only Car Information is open by default -
// the rest of the intake is reference material, not something to scroll
// past every time an application is opened.
function ovSection(title, open, body){
  return '<details class="ov-sec"' + (open ? ' open' : '') + '><summary>' + title + '</summary><div class="ov-body">' + body + '</div></details>';
}

// At-a-glance strip at the top of Overview: the handful of facts a tuner
// actually needs before reading anything else.
function renderOverviewSummary(a){
  const unpaid = S.unpaidInvoices.filter(function(i){ return i.application_id === a.id; });
  const owed = unpaid.reduce(function(sum, i){ return sum + (Number(i.amount) || 0); }, 0);
  const days = stageDays(a);
  const items = [
    ['Car', escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ') || '-')],
    ['Mileage', escapeHtml(String(a.car_mileage || '-'))],
    ['DS1', a.has_ds1 ? 'Has one' : (a.purchasing_ds1_through_us ? 'Buying through us' : 'No')],
    ['Ethanol', yn(a.plan_ethanol)],
    ['In this stage', days + ' day' + (days === 1 ? '' : 's')],
    ['Unpaid', unpaid.length ? '<a onclick="switchTab(\'invoices\')" style="cursor:pointer;color:var(--orange);font-weight:700">$' + owed.toFixed(2) + '</a>' : 'None']
  ];
  return '<div class="ov-summary">' + items.map(function(it){
    return '<div><div class="dl-label">' + it[0] + '</div><div class="ov-val">' + it[1] + '</div></div>';
  }).join('') + '</div>';
}

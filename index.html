// Revenue and per-stage turnaround need data the app doesn't otherwise
// keep in memory (every invoice, every status change), so it's fetched
// fresh each time the Reports page is opened.
async function loadReportData(){
  S.reportLoading = true;
  try{
    const [inv, logs] = await Promise.all([
      sb.from('tuning_invoices').select('application_id,status,amount,line_items,sent_at,paid_at').range(0, 9999),
      sb.from('tuning_activity_log').select('application_id,old_value,new_value,created_at')
        .eq('field_changed', 'status').order('created_at', { ascending:true }).range(0, 9999)
    ]);
    if(inv.error) throw inv.error;
    if(logs.error) throw logs.error;
    S.reportData = { invoices: inv.data || [], statusLogs: logs.data || [] };
  }catch(e){
    toast('Failed to load report data: ' + e.message, true);
    S.reportData = { invoices: [], statusLogs: [] };
  }
  S.reportLoading = false;
  if(S.page === 'reports') renderPage();
}

function monthKey(iso){
  const d = new Date(iso);
  return { key: d.getFullYear() * 100 + (d.getMonth() + 1), label: d.toLocaleDateString(undefined, { month:'short', year:'numeric' }) };
}

// Horizontal bar list: rows of [label, value, displayText].
function barList(rows){
  if(!rows.length) return '<div class="empty-state">No data yet.</div>';
  const max = Math.max.apply(null, rows.map(function(r){ return r[1]; })) || 1;
  return rows.map(function(r){
    const pct = Math.max(2, Math.round((r[1] / max) * 100));
    return '<div class="bar-row"><div class="bar-label">' + escapeHtml(r[0]) + '</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
      + '<div class="bar-val">' + r[2] + '</div></div>';
  }).join('');
}

// Average days spent in each stage, reconstructed from the status-change
// history: each change closes out the stage being left. The stage an
// application is currently in isn't counted until it leaves it.
function computeStageDurations(){
  const byApp = {};
  S.reportData.statusLogs.forEach(function(l){ (byApp[l.application_id] = byApp[l.application_id] || []).push(l); });
  const totals = {}, counts = {};
  let firstTuneDays = [];
  S.applications.forEach(function(a){
    const logs = byApp[a.id] || [];
    let enteredAt = new Date(a.created_at);
    let firstTuneSeen = false;
    logs.forEach(function(l){
      const t = new Date(l.created_at);
      const stage = l.old_value;
      if(stage){
        totals[stage] = (totals[stage] || 0) + (t - enteredAt) / 86400000;
        counts[stage] = (counts[stage] || 0) + 1;
      }
      if(l.new_value === 'tune_sent' && !firstTuneSeen){
        firstTuneSeen = true;
        firstTuneDays.push((t - new Date(a.created_at)) / 86400000);
      }
      enteredAt = t;
    });
  });
  const avgFirstTune = firstTuneDays.length ? firstTuneDays.reduce(function(x, y){ return x + y; }, 0) / firstTuneDays.length : null;
  return { totals: totals, counts: counts, avgFirstTune: avgFirstTune, firstTuneCount: firstTuneDays.length };
}

function money(n){ return '$' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 }); }

function renderReports(){
  if(!S.reportData){
    if(!S.reportLoading) loadReportData();
    return '<div class="empty-state">Loading reports&hellip;</div>';
  }
  const apps = S.applications;
  const invoices = S.reportData.invoices;
  const paid = invoices.filter(function(i){ return i.status === 'paid'; });
  const open = invoices.filter(function(i){ return i.status === 'sent'; });
  const collected = paid.reduce(function(t, i){ return t + (Number(i.amount) || 0); }, 0);
  const outstanding = open.reduce(function(t, i){ return t + (Number(i.amount) || 0); }, 0);
  const payDays = paid.filter(function(i){ return i.sent_at && i.paid_at; }).map(function(i){ return (new Date(i.paid_at) - new Date(i.sent_at)) / 86400000; });
  const avgPayDays = payDays.length ? payDays.reduce(function(x, y){ return x + y; }, 0) / payDays.length : null;
  const reviewed = apps.filter(function(a){ return a.review_rating; });
  const avgRating = reviewed.length ? reviewed.reduce(function(t, a){ return t + a.review_rating; }, 0) / reviewed.length : null;
  const stages = computeStageDurations();

  let html = '<div class="stat-row">';
  html += statCard(money(collected), 'Revenue Collected', 'sc-green');
  html += statCard(money(outstanding), 'Outstanding', outstanding ? 'sc-attn' : '');
  html += statCard(stages.avgFirstTune !== null ? stages.avgFirstTune.toFixed(1) + 'd' : '-', 'Submit to First Tune', 'sc-teal');
  html += statCard(avgRating !== null ? avgRating.toFixed(1) + ' / 5' : '-', 'Avg Review (' + reviewed.length + ')', '');
  html += '</div>';

  // Revenue by month (by payment date)
  const rev = {};
  paid.forEach(function(i){
    if(!i.paid_at) return;
    const m = monthKey(i.paid_at);
    if(!rev[m.key]) rev[m.key] = { label: m.label, total: 0 };
    rev[m.key].total += Number(i.amount) || 0;
  });
  html += dashHead('Revenue by Month', paid.length + ' paid invoice' + (paid.length === 1 ? '' : 's')
    + (avgPayDays !== null ? ' &middot; paid on average ' + avgPayDays.toFixed(1) + ' days after sending' : ''));
  html += '<div class="tbl-wrap report-box">' + barList(Object.keys(rev).sort().map(function(k){ return [rev[k].label, rev[k].total, money(rev[k].total)]; })) + '</div>';

  // Time in each stage
  const stageRows = BOARD_COLUMNS.filter(function(st){ return stages.counts[st]; }).map(function(st){
    const avg = stages.totals[st] / stages.counts[st];
    return [STATUS_LABEL[st] || st, avg, avg.toFixed(1) + 'd'];
  });
  html += dashHead('Average Time in Each Stage', 'Where builds actually spend their time - completed stages only');
  html += '<div class="tbl-wrap report-box">' + barList(stageRows) + '</div>';

  // Top products by paid revenue
  const prod = {};
  paid.forEach(function(i){
    (Array.isArray(i.line_items) ? i.line_items : []).forEach(function(l){
      const k = l.title || 'Untitled';
      if(!prod[k]) prod[k] = { qty: 0, total: 0 };
      const q = Number(l.quantity) || 1;
      prod[k].qty += q;
      prod[k].total += (Number(l.price) || 0) * q;
    });
  });
  const prodRows = Object.keys(prod).sort(function(x, y){ return prod[y].total - prod[x].total; }).slice(0, 8)
    .map(function(k){ return [k, prod[k].total, money(prod[k].total) + ' &middot; ' + prod[k].qty + ' sold']; });
  html += dashHead('Top Products', 'By paid revenue');
  html += '<div class="tbl-wrap report-box">' + barList(prodRows) + '</div>';

  // Everything below is reference detail - collapsed by default.
  const statusCounts = {};
  apps.forEach(function(a){ statusCounts[a.status] = (statusCounts[a.status]||0) + 1; });
  const vol = {};
  apps.forEach(function(a){
    const m = monthKey(a.created_at);
    if(!vol[m.key]) vol[m.key] = { label: m.label, count: 0 };
    vol[m.key].count++;
  });
  const declineCounts = {};
  apps.filter(function(a){ return a.status === 'declined' && a.declined_reason; }).forEach(function(a){
    const key = a.declined_reason.trim();
    declineCounts[key] = (declineCounts[key]||0) + 1;
  });
  const ratingRows = [5,4,3,2,1].map(function(n){
    const c = reviewed.filter(function(a){ return a.review_rating === n; }).length;
    return [n + ' star', c, String(c)];
  });
  const revisionRate = apps.length ? Math.round((S.revisionCount / apps.length) * 100) : 0;

  html += '<div style="margin-top:20px">';
  html += ovSection('Applications by Month (' + apps.length + ' total, ' + revisionRate + '% revision rate)', false,
    barList(Object.keys(vol).sort().map(function(k){ return [vol[k].label, vol[k].count, String(vol[k].count)]; })));
  html += ovSection('Status Breakdown', false, '<div class="dl-grid">' + Object.keys(STATUS_LABEL).map(function(st){ return dl(STATUS_LABEL[st], String(statusCounts[st] || 0)); }).join('') + '</div>');
  html += ovSection('Review Scores', false, reviewed.length ? barList(ratingRows) : '<div class="empty-state">No reviews yet.</div>');
  const dk = Object.keys(declineCounts).sort(function(x, y){ return declineCounts[y] - declineCounts[x]; });
  html += ovSection('Decline Reasons', false, dk.length ? barList(dk.map(function(k){ return [k, declineCounts[k], String(declineCounts[k])]; })) : '<div class="empty-state">No declines recorded.</div>');
  html += '</div>';
  return html;
}

// One column per active stage. Drag a card to another column to change
// its status - that goes through updateStatus(), so the same prompts,
// customer notification, baseline-log check, and undo all apply.
const BOARD_COLUMNS = ['submitted','under_review','needs_info','accepted','active','tune_sent','revision_requested'];
// Days in a stage before a card turns yellow / red. Stages where the
// customer holds the ball (needs_info, tune_sent) get more slack.
const BOARD_AGING = {
  submitted:[1,3], under_review:[2,4], needs_info:[4,8], accepted:[3,7],
  active:[4,8], tune_sent:[7,14], revision_requested:[2,4]
};

function stageDays(a){ return daysSince(a.status_changed_at || a.updated_at) || 0; }

function renderBoard(){
  const counts = {};
  BOARD_COLUMNS.forEach(function(st){ counts[st] = S.applications.filter(function(a){ return a.status === st; }).length; });
  const activeStage = BOARD_COLUMNS.indexOf(S.boardStage) !== -1 ? S.boardStage : (BOARD_COLUMNS.filter(function(st){ return counts[st]; })[0] || BOARD_COLUMNS[0]);
  let html = '<div class="board-stages">' + BOARD_COLUMNS.map(function(st){
    return '<button class="bs-chip' + (st === activeStage ? ' on' : '') + '" onclick="setBoardStage(\'' + st + '\')">' + escapeHtml(STATUS_LABEL[st] || st) + ' <b>' + counts[st] + '</b></button>';
  }).join('') + '</div>';
  html += '<div class="board-hint file-meta">Drag a card to change its status. Cards turn yellow, then red, the longer they sit in a stage.</div>';
  html += '<div class="board">';
  BOARD_COLUMNS.forEach(function(st){
    const cards = S.applications.filter(function(a){ return a.status === st; })
      .sort(function(x, y){ return stageDays(y) - stageDays(x); });
    html += '<div class="board-col' + (st === activeStage ? ' active' : '') + '" data-status="' + st + '" ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event,\'' + st + '\')">'
      + '<div class="board-col-head"><span>' + escapeHtml(STATUS_LABEL[st] || st) + '</span><span class="nav-badge">' + cards.length + '</span></div>';
    cards.forEach(function(a){
      const d = stageDays(a);
      const lim = BOARD_AGING[st] || [3,7];
      const age = d >= lim[1] ? 'age-late' : (d >= lim[0] ? 'age-warn' : '');
      html += '<div class="board-card ' + age + '" draggable="true" ondragstart="boardDragStart(event,\'' + a.id + '\')" onclick="openApplication(\'' + a.id + '\')">'
        + '<div style="display:flex;justify-content:space-between;gap:6px"><strong>#' + a.application_number + (a.has_unread ? ' <span class="unread-dot"></span>' : '') + '</strong>'
        + '<span class="board-age ' + age + '">' + d + 'd</span></div>'
        + '<div class="board-name">' + escapeHtml(a.customer_name) + '</div>'
        + '<div class="file-meta">' + escapeHtml([a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ')) + '</div>'
        + (invoiceChip(a) ? '<div style="margin-top:4px;margin-left:-6px">' + invoiceChip(a) + '</div>' : '')
        + '</div>';
    });
    if(!cards.length) html += '<div class="board-empty">-</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function boardDragStart(ev, appId){ ev.dataTransfer.setData('text/plain', appId); ev.dataTransfer.effectAllowed = 'move'; }
window.boardDragStart = boardDragStart;
function boardDragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
window.boardDragOver = boardDragOver;
function boardDragLeave(ev){ ev.currentTarget.classList.remove('drag-over'); }
window.boardDragLeave = boardDragLeave;
async function boardDrop(ev, status){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const appId = ev.dataTransfer.getData('text/plain');
  const a = S.applications.find(function(x){ return x.id === appId; });

  await updateStatus(appId, status);

async function countCustomerLogs(appId){
  if(S.files[appId]) return S.files[appId].filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; }).length;
  try{
    const { count, error } = await sb.from('tuning_files').select('id', { count:'exact', head:true })
      .eq('application_id', appId).eq('uploaded_by', 'customer').eq('file_type', 'log');
    if(error) throw error;
    return count || 0;
  }catch(e){ return 0; }
}

// Suggests a guide by matching its keywords against the car. Longest
// keyword wins, so "RS7" beats "S7" and "4.0T" beats "T".
function suggestLogGuide(a){
  const car = [a.car_year, a.car_make, a.car_model].filter(Boolean).join(' ').toLowerCase();
  if(!car) return null;
  let best = null, bestLen = 0;
  S.logGuides.forEach(function(g){
    (g.match_keywords || '').split(',').map(function(k){ return k.trim().toLowerCase(); }).filter(Boolean).forEach(function(k){
      if(car.indexOf(k) !== -1 && k.length > bestLen){ best = g; bestLen = k.length; }
    });
  });
  return best;
}

function renderLogGuideSection(a){
  const files = S.files[a.id] || [];
  const logs = files.filter(function(f){ return f.uploaded_by === 'customer' && f.file_type === 'log'; });
  const current = S.logGuides.find(function(g){ return g.id === a.log_guide_id; });
  const suggested = !current ? suggestLogGuide(a) : null;
  const opts = '<option value="">No guide assigned</option>' + S.logGuides.map(function(g){
    return '<option value="' + g.id + '"' + (g.id === a.log_guide_id ? ' selected' : '') + '>' + escapeHtml(g.name) + (suggested && suggested.id === g.id ? ' (suggested)' : '') + '</option>';
  }).join('');
  const status = logs.length
    ? '<span class="pill pill-green">Baseline log received</span>'
    : '<span class="pill pill-orange">No customer log yet</span>';

  let html = '<div class="fx-card">';
  html += '<div class="fx-head"><span class="fx-title">Logging guide</span>' + status + '</div>';
  if(!S.logGuides.length){
    html += '<div class="file-meta">No guides yet. Add one under <a onclick="goPage(\'logguides\')" style="cursor:pointer;color:var(--teal-d);font-weight:600">Logging Guides</a> so customers know how to log.</div>';
  } else {
    html += '<select class="form-input" onchange="assignLogGuide(\'' + a.id + '\', this.value)">' + opts + '</select>';
    if(suggested) html += '<button class="btn btn-sm fx-suggest" onclick="assignLogGuide(\'' + a.id + '\',\'' + suggested.id + '\')">Use suggested: ' + escapeHtml(suggested.name) + '</button>';
  }
  html += '<div class="fx-note">'
    + (logs.length
        ? logs.length + ' customer log' + (logs.length > 1 ? 's' : '') + ' &middot; latest ' + fmtDate(logs[0].created_at)
        : (current ? 'The customer sees the "' + escapeHtml(current.name) + '" instructions on their portal.' : 'Assign a guide so the customer knows how to log.'))
    + '</div></div>';
  return html;
}

async function assignLogGuide(appId, guideId){
  const app = S.applications.find(function(a){ return a.id === appId; });
  if(!app) return;
  const oldId = app.log_guide_id || null;
  const newId = guideId || null;
  if(oldId === newId) return;
  try{
    const { error } = await sb.from('tuning_applications').update({ log_guide_id: newId }).eq('id', appId);
    if(error) throw error;
    app.log_guide_id = newId;
    const g = S.logGuides.find(function(x){ return x.id === newId; });
    await logActivity(appId, 'log_guide', null, g ? g.name : 'None');
    pingPortal(appId);
    renderPanelBody();
    toast(g ? 'Logging guide set: ' + g.name : 'Logging guide removed');
  }catch(e){ toast('Failed to set guide: ' + e.message, true); }
}
window.assignLogGuide = assignLogGuide;

function renderLogGuideForm(g){

function openLogGuideForm(id){
  if(S.logGuideFormOpen && !S.editingGuideId && !id){ closeLogGuideForm(); return; }
  S.logGuideFormOpen = true; S.editingGuideId = id; renderPage();
}
window.openLogGuideForm = openLogGuideForm;
function closeLogGuideForm(){ S.logGuideFormOpen = false; S.editingGuideId = null; renderPage(); }
window.closeLogGuideForm = closeLogGuideForm;

async function saveLogGuide(){
  const name = document.getElementById('lgName').value.trim();
  if(!name){ toast('Guide name is required', true); return; }
  const row = {
    name: name,
    match_keywords: document.getElementById('lgKeywords').value.trim() || null,
    parameters: document.getElementById('lgParams').value.trim() || null,
    procedure: document.getElementById('lgProcedure').value.trim() || null,
    updated_at: new Date().toISOString()
  };
  try{
    let res;
    if(S.editingGuideId) res = await sb.from('tuning_log_guides').update(row).eq('id', S.editingGuideId).select().single();
    else res = await sb.from('tuning_log_guides').insert(Object.assign({ created_by: S.user.email }, row)).select().single();
    if(res.error) throw res.error;
    const idx = S.logGuides.findIndex(function(x){ return x.id === res.data.id; });
    if(idx !== -1) S.logGuides[idx] = res.data; else S.logGuides.push(res.data);
    S.logGuides.sort(function(a, b){ return a.name.localeCompare(b.name); });
    closeLogGuideForm();
    toast('Logging guide saved');
  }catch(e){ toast('Failed to save: ' + e.message, true); }
}
window.saveLogGuide = saveLogGuide;

async function archiveLogGuide(id){
  const g = S.logGuides.find(function(x){ return x.id === id; });
  if(!confirm('Archive "' + (g ? g.name : 'this guide') + '"? Applications using it will keep showing it until reassigned.')) return;
  try{
    const { error } = await sb.from('tuning_log_guides').update({ is_archived:true, updated_at:new Date().toISOString() }).eq('id', id);
    if(error) throw error;
    S.logGuides = S.logGuides.filter(function(x){ return x.id !== id; });
    renderPage();
    toast('Guide archived');
  }catch(e){ toast('Failed to archive: ' + e.message, true); }
}
window.archiveLogGuide = archiveLogGuide;

async function archiveLibraryEntry(id){

/* ================= ECU REFERENCE ================= */
function unlockLabel(s){
  return { unlocked:'Unlocked', needs_unlock:'Needs Unlock', not_supported:'Not Supported', unknown:'Unknown' }[s] || 'Unknown';
}
function unlockPillClass(s){
  return { unlocked:'pill-green', needs_unlock:'pill-orange', not_supported:'pill-red', unknown:'pill-muted' }[s] || 'pill-muted';
}

function renderEcuReference(){
  let html = '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
  html += '<h2 style="margin:0">ECU Compatibility Reference</h2>';
  html += '<button class="btn btn-sm" onclick="toggleEcuForm()">' + (S.ecuFormOpen ? 'Cancel' : '+ Add Platform') + '</button>';
  html += '</div>';
  html += '<div style="color:var(--text3);font-size:var(--t-sm);margin-bottom:14px">What tool and unlock status a platform needs, so "can we even tune this" is a lookup, not a memory test.</div>';

  else {
    html += '<table><thead><tr><th>Platform</th><th>ECU</th><th>Tool Required</th><th>Unlock Status</th><th>Notes</th><th></th></tr></thead><tbody>';

      html += '<tr>'
        + '<td><strong>' + escapeHtml(r.platform_name) + '</strong></td>'
        + '<td>' + escapeHtml(r.ecu_hardware) + '</td>'
        + '<td>' + escapeHtml(r.tool_required) + '</td>'

function renderEcuForm(){
  return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px">'
    + '<div class="form-group"><label class="form-label">Platform</label><input class="form-input" id="ecuPlatform" placeholder="e.g. 8V/8V.5 A3/S3 2.0T EA888 Gen3"></div>'

function toggleEcuForm(){

}
window.toggleEcuForm = toggleEcuForm;

async function saveEcuEntry(){

  const tool = document.getElementById('ecuTool').value.trim() || null;
  const unlock = document.getElementById('ecuUnlock').value;
  const notes = document.getElementById('ecuNotes').value.trim() || null;
  try{
    const { data, error } = await sb.from('tuning_ecu_reference').insert({
      platform_name: platform, ecu_hardware: hardware, tool_required: tool, unlock_status: unlock, notes: notes
    }).select().single();
    if(error) throw error;
    S.ecuReference.push(data);
    S.ecuReference.sort(function(a,b){ return a.platform_name.localeCompare(b.platform_name); });

    renderPage();
    toast('Saved');
  }catch(e){ toast('Failed: ' + e.message, true); }
}
window.saveEcuEntry = saveEcuEntry;

async function deleteEcuEntry(id){
  if(!confirm('Delete this reference entry?')) return;
  try{
    const { error } = await sb.from('tuning_ecu_reference').delete().eq('id', id);
    if(error) throw error;
    S.ecuReference = S.ecuReference.filter(function(r){ return r.id !== id; });

window.deleteEcuEntry = deleteEcuEntry;

async function deleteTemplate(id){

window.deleteTemplate = deleteTemplate;

var inPasswordRecovery = false;
document.addEventListener('DOMContentLoaded', async function(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // A click on the "reset password" email link lands back here with a
  // recovery session. Catch that before the normal session check below
  // would otherwise treat it as an ordinary sign-in and drop the user
  // straight into the app.
  sb.auth.onAuthStateChange(function(event){
    if(event === 'PASSWORD_RECOVERY'){
      inPasswordRecovery = true;
      document.getElementById('auth-gate').classList.remove('hidden');
      document.getElementById('tgk-app').classList.add('hidden');
      showAuthView('newpass');
    }
  });

  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user && !inPasswordRecovery){
      await afterLogin(data.session.user);
    }
  }catch(e){ /* fall through to login screen */ }
});
</script>

async function saveOverviewEdit(appId){
  const app = S.applications.find(function(x){ return x.id === appId; });
  if(!app) return;

  const val = function(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const boolVal = function(id){ const v = val(id); return v === 'yes' ? true : (v === 'no' ? false : null); };
  const numOrText = function(v){ if(!v) return null; return isNaN(Number(v)) ? v : Number(v); };
  const textOrNull = function(v){ return v ? v : null; };

  const patch = {
    customer_name: val('ovf_customer_name'),
    customer_email: val('ovf_customer_email'),
    car_year: numOrText(val('ovf_car_year')),
    car_make: textOrNull(val('ovf_car_make')),
    car_model: textOrNull(val('ovf_car_model')),
    car_mileage: numOrText(val('ovf_car_mileage')),
    existing_customer: textOrNull(val('ovf_existing_customer')),
    tuning_reason: textOrNull(val('ovf_tuning_reason')),
    mod_intake: textOrNull(val('ovf_mod_intake')),
    mod_turbos: textOrNull(val('ovf_mod_turbos')),
    mod_cooling: textOrNull(val('ovf_mod_cooling')),
    mod_wastegates: textOrNull(val('ovf_mod_wastegates')),
    mod_map_sensors: textOrNull(val('ovf_mod_map_sensors')),
    mod_downpipes_exhaust: textOrNull(val('ovf_mod_downpipes_exhaust')),
    mod_transmission_tune: textOrNull(val('ovf_mod_transmission_tune')),
    mod_fueling: textOrNull(val('ovf_mod_fueling')),
    has_water_meth: boolVal('ovf_has_water_meth'),
    plan_ethanol: boolVal('ovf_plan_ethanol'),
    has_ds1: boolVal('ovf_has_ds1'),
    purchasing_ds1_through_us: boolVal('ovf_purchasing_ds1_through_us'),
    other_mods: textOrNull(val('ovf_other_mods')),
    spark_plug_date: textOrNull(val('ovf_spark_plug_date')),
    spark_plug_mileage: numOrText(val('ovf_spark_plug_mileage')),
    spark_plug_brand: textOrNull(val('ovf_spark_plug_brand')),
    spark_plug_gap: textOrNull(val('ovf_spark_plug_gap')),
    oil_change_date: textOrNull(val('ovf_oil_change_date')),
    oil_change_mileage: numOrText(val('ovf_oil_change_mileage')),
    oil_brand_weight: textOrNull(val('ovf_oil_brand_weight')),
    trans_service_date: textOrNull(val('ovf_trans_service_date')),
    trans_service_mileage: numOrText(val('ovf_trans_service_mileage')),
    air_filter_date: textOrNull(val('ovf_air_filter_date')),
    air_filter_mileage: numOrText(val('ovf_air_filter_mileage')),
    maintenance_self_performed: boolVal('ovf_maintenance_self_performed'),
    maintenance_shop_name: textOrNull(val('ovf_maintenance_shop_name')),
    customer_country: textOrNull(val('ovf_customer_country')),
    decision_notes: textOrNull(val('ovf_decision_notes')),
    declined_reason: textOrNull(val('ovf_declined_reason'))
  };

  if(!patch.customer_name){ toast('Customer name is required', true); return; }
  if(!patch.customer_email){ toast('Customer email is required', true); return; }

  const btn = document.getElementById('ovfSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    const { data, error } = await sb.from('tuning_applications').update(patch).eq('id', appId).select().single();
    if(error) throw error;

    // Only log fields that actually changed, so the Activity tab reads as
    // a real changelog rather than a wall of every field on every save.
    const changedFields = Object.keys(patch).filter(function(k){ return String(app[k] == null ? '' : app[k]) !== String(patch[k] == null ? '' : patch[k]); });
    if(changedFields.length){
      await sb.from('tuning_activity_log').insert({
        application_id: appId,
        field_changed: 'profile_edited',
        old_value: null,
        new_value: changedFields.join(', '),
        changed_by: (S.user && S.user.email) || 'Unknown'
      });
    }

    const idx = S.applications.findIndex(function(x){ return x.id === appId; });
    if(idx !== -1) S.applications[idx] = data;
    S.editingOverview = false;
    renderNav();
    renderPanelShell_refresh(data);
    toast('Profile updated');
  }catch(e){
    toast('Failed to save: ' + e.message, true);
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
  }
}
window.saveOverviewEdit = saveOverviewEdit;

/* ---- reply drafts: one per application, kept until it is sent ----
   Held in memory and in localStorage, so a half-written reply survives a
   redraw of the panel, switching tabs, closing the panel and a page reload. */
const REPLY_DRAFT_TIMERS = {};
function replyDraftKey(appId){ return 'tgk-reply-draft-' + appId; }
function replyDraftGet(appId){
  S.msgDrafts = S.msgDrafts || {};
  if(S.msgDrafts[appId] === undefined){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(replyDraftKey(appId)) || 'null'); }catch(e){ d = null; }
    S.msgDrafts[appId] = d && typeof d.t === 'string' ? { text: d.t, note: !!d.n } : null;
  }
  return S.msgDrafts[appId];
}
function replyDraftClear(appId){
  S.msgDrafts = S.msgDrafts || {};
  S.msgDrafts[appId] = null;
  clearTimeout(REPLY_DRAFT_TIMERS[appId]);
  try{ localStorage.removeItem(replyDraftKey(appId)); }catch(e){ /* storage unavailable */ }
}
function replyDraftSave(appId){
  const ta = document.getElementById('replyBody'), cb = document.getElementById('replyIsNote');
  if(!ta) return;
  const text = ta.value, note = !!(cb && cb.checked);
  if(!text && !note) replyDraftClear(appId);
  else {
    S.msgDrafts = S.msgDrafts || {};
    S.msgDrafts[appId] = { text: text, note: note };          // in memory straight away
    clearTimeout(REPLY_DRAFT_TIMERS[appId]);                   // to disk once typing pauses
    REPLY_DRAFT_TIMERS[appId] = setTimeout(function(){ try{ localStorage.setItem(replyDraftKey(appId), JSON.stringify({ t: text, n: note })); }catch(e){ /* storage unavailable */ } }, 400);
  }
  const hint = document.getElementById('replyDraftHint');
  if(hint) hint.textContent = text.trim() ? 'Draft saved' : '';
}
window.replyDraftSave = replyDraftSave;

// Just the conversation - the part that can be refreshed in place while the
// reply box underneath it stays exactly as it is.
function msgDayLabel(iso){
  const d = new Date(iso), n = new Date(), y = new Date(n); y.setDate(n.getDate() - 1);
  if(d.toDateString() === n.toDateString()) return 'Today';
  if(d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtClock(iso){ return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function renderMessageListHtml(a){
  const msgs = S.messages[a.id] || [];
  let html = '';
  if(!msgs.length) html += '<div class="empty-state">No messages yet. Send the first one below.</div>';
  let lastDay = '', lastWho = '', lastName = '', lastAt = 0;
  msgs.forEach(function(m){
    const at = new Date(m.created_at).getTime(), day = new Date(m.created_at).toDateString();
    if(day !== lastDay){ html += '<div class="msg-day">' + escapeHtml(msgDayLabel(m.created_at)) + '</div>'; lastDay = day; lastWho = ''; }
    // Pre-migration rows won't have message_type set yet - fall back to
    // the exact body prefix the edge function has always used, so old
    // revision requests still get the prominent treatment.
    const isRevisionRequest = m.message_type === 'revision_request'
      || (m.sender_type === 'system' && /^Customer requested a revision/.test(m.body || ''));
    const cls = isRevisionRequest ? 'msg-revision' : (m.sender_type === 'system' ? 'msg-system' : (m.is_internal_note ? 'msg-note' : (m.sender_type === 'tuner' ? 'msg-tuner' : 'msg-customer')));
    const who = isRevisionRequest ? 'rev' : (m.sender_type === 'system' ? 'sys' : (m.is_internal_note ? 'note' : m.sender_type));
    const name = m.sender_name || m.sender_type;
    // A run of messages from the same person within ten minutes reads as one
    // block: name and time on the first, just the text after.
    const grouped = (who === 'tuner' || who === 'customer' || who === 'note') && who === lastWho && name === lastName && at - lastAt < 10 * 60e3;
    html += '<div class="msg ' + cls + (grouped ? ' grouped' : '') + '">';
    if(isRevisionRequest){
      html += '<div class="msg-revision-badge">&#8635; Revision Requested</div>';
      html += '<div class="msg-meta">' + escapeHtml(a.customer_name) + ' &middot; ' + fmtClock(m.created_at) + '</div>';
    } else if(m.sender_type !== 'system' && !grouped){
      html += '<div class="msg-meta">' + escapeHtml(name) + (m.is_internal_note ? ' (internal note)' : '') + ' &middot; ' + fmtClock(m.created_at) + '</div>';
    }
    html += '<div class="msg-body">' + escapeHtml(m.body) + '</div>';
    html += '</div>';
    lastWho = who; lastName = name; lastAt = at;
  });
  return html;
}

function renderMessagesTab(a){
  let html = '<div class="msg-list" id="msgList">' + renderMessageListHtml(a) + '</div>';

  html += '<div class="panel-foot" style="border:none;padding:0;margin-top:8px">';
  if(S.templates.length){
    html += '<select class="form-input" style="margin-bottom:8px" onchange="applyTemplate(this.value)"><option value="">Insert a template...</option>';
    S.templates.forEach(function(t){ html += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });
    html += '</select>';
  }
  const draft = replyDraftGet(a.id);
  // (the newline after the tag is swallowed by the HTML parser, so a draft that starts with a blank line keeps it)
  html += '<textarea class="form-input" id="replyBody" placeholder="Write a reply to the customer..." style="min-height:90px" oninput="replyDraftSave(\'' + a.id + '\')">\n' + escapeHtml(draft ? draft.text : '') + '</textarea>';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">';
  html += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><label class="check-row"><input type="checkbox" id="replyIsNote" onchange="replyDraftSave(\'' + a.id + '\')"' + (draft && draft.note ? ' checked' : '') + '> Internal note (not sent to customer)</label>'
    + '<span class="file-meta" id="replyDraftHint">' + (draft && draft.text.trim() ? 'Draft saved' : '') + '</span></div>';
  html += '<button class="btn btn-primary" onclick="sendMessage(\'' + a.id + '\')">Send</button>';
  html += '</div></div>';
  return html;
}

// Template variables - filled from the open application when a template
// is inserted. Unknown {tokens} are left as-is so a typo is visible rather
// than silently vanishing.
const PORTAL_BASE_URL = 'https://ghost.tgkmotorsport.com';
const TEMPLATE_VARS = [
  { key:'first_name', desc:"Customer's first name" },
  { key:'customer_name', desc:"Customer's full name" },
  { key:'app_number', desc:'Application number' },
  { key:'car', desc:'Year make model' },
  { key:'status', desc:'Current status' },
  { key:'log_guide', desc:'Assigned logging guide name' },
  { key:'portal_link', desc:"Customer's portal link" }
];
function fillTemplate(body, a){
  if(!a) return body;
  const g = S.logGuides.find(function(x){ return x.id === a.log_guide_id; });
  const vals = {
    first_name: (a.customer_name || '').trim().split(/\s+/)[0] || '',
    customer_name: a.customer_name || '',
    app_number: '#' + a.application_number,
    car: [a.car_year, a.car_make, a.car_model].filter(Boolean).join(' '),
    status: STATUS_LABEL[a.status] || a.status,
    log_guide: g ? g.name : '',
    portal_link: a.portal_access_token ? PORTAL_BASE_URL + '/portal.html?token=' + encodeURIComponent(a.portal_access_token) : ''
  };
  return body.replace(/\{([a-z_]+)\}/g, function(m, k){ return Object.prototype.hasOwnProperty.call(vals, k) ? vals[k] : m; });
}
function applyTemplate(id){
  if(!id) return;
  const t = S.templates.find(function(x){ return String(x.id) === String(id); });
  const a = S.applications.find(function(x){ return x.id === S.openAppId; });
  if(t){ document.getElementById('replyBody').value = fillTemplate(t.body, a); if(S.openAppId) replyDraftSave(S.openAppId); }
}
window.applyTemplate = applyTemplate;

async function sendMessage(appId){
  const body = document.getElementById('replyBody').value.trim();
  if(!body){ toast('Write a message first', true); return; }
  const isNote = document.getElementById('replyIsNote').checked;

  try{
    const { data, error } = await sb.from('tuning_messages').insert({
      application_id: appId,
      sender_type: 'tuner',
      sender_name: S.user.email,
      body: body,
      is_internal_note: isNote
    }).select().single();
    if(error) throw error;
    if(!S.messages[appId]) S.messages[appId] = [];
    S.messages[appId].push(data);

    if(!isNote){
      const nowIso = new Date().toISOString();
      await sb.from('tuning_applications').update({ customer_has_unread:true, updated_at:nowIso }).eq('id', appId);
      const app = S.applications.find(function(x){ return x.id === appId; });
      if(app){ app.customer_has_unread = true; app.last_message_at = nowIso; app.last_message_by = 'tuner'; }
      callNotify('new_message', { application_id: appId, message_body: body });
      pingPortal(appId);
    }
    await logActivity(appId, isNote ? 'internal_note' : 'message', null, null);
    replyDraftClear(appId);          // sent: the draft is done with
    renderPanelBody();
    toast(isNote ? 'Note saved' : 'Message sent');
  }catch(e){
    toast('Failed to send: ' + e.message, true);
  }
}
window.sendMessage = sendMessage;

const TUNE_FUELS = ['91 pump','93 pump','E30','E40','E50','E85','Race fuel','Flex'];

function nextRevisionNumber(appId){
  const tunes = (S.files[appId] || []).filter(function(f){ return f.file_type === 'tune'; });
  const max = tunes.reduce(function(m, f){ return Math.max(m, f.revision_number || 0); }, 0);
  return max + 1;
}

  const shown = files.filter(function(f){ return filt === 'all' || kindOf(f) === filt; })

// Deletes the stored file and its record. Not undoable - storage deletes
// are permanent - so it confirms first, with a stronger warning for the
// tune the customer currently has flashed.
async function deleteFile(appId, fileId){
  const f = (S.files[appId] || []).find(function(x){ return x.id === fileId; });
  if(!f) return;
  const who = f.uploaded_by === 'customer' ? 'uploaded by the customer' : 'uploaded by a tuner';
  let msg = 'Delete "' + f.file_name + '" (' + who + ')?\n\nThis permanently removes the file for both you and the customer.';
  if(f.file_type === 'tune' && f.is_current) msg += '\n\nThis is the tune marked "Currently flashed" - the customer will no longer see it.';
  if(!confirm(msg)) return;
  try{
    const { error: stErr } = await sb.storage.from('tuning-files').remove([f.file_path]);
    // A missing storage object shouldn't block cleaning up the record.
    if(stErr && !/not.?found/i.test(stErr.message || '')) throw stErr;
    const { error } = await sb.from('tuning_files').delete().eq('id', fileId);
    if(error) throw error;
    S.files[appId] = (S.files[appId] || []).filter(function(x){ return x.id !== fileId; });
    S.pendingLogs = (S.pendingLogs || []).filter(function(x){ return x.id !== fileId; });
    await logActivity(appId, 'file_deleted', f.file_name, null);
    pingPortal(appId);
    renderNav();
    renderPanelBody();
    toast('File deleted');
  }catch(e){ toast('Delete failed: ' + e.message, true); }
}
window.deleteFile = deleteFile;

function setUploadType(t){
  // Keep a chosen file across the switch - re-rendering would drop it.
  const input = document.getElementById('fileInput');
  const kept = input && input.files && input.files.length ? input.files : null;
  S.uploadType = t;
  renderPanelBody();
  if(kept){
    const fresh = document.getElementById('fileInput');
    try{ fresh.files = kept; dzChanged('fileInput'); }catch(e){ /* older browser: re-pick */ }
  }
}
window.setUploadType = setUploadType;

// Styled file picker: the real input is hidden inside a drop zone, so the
// browser's native "Choose File" button never shows. Drag-and-drop works
// on desktop; tapping opens the picker on phones.
function fileDropHtml(id, enableBtnId){
  return '<label class="dropzone" id="dz-' + id + '" data-input="' + id + '"' + (enableBtnId ? ' data-btn="' + enableBtnId + '"' : '') + '>'
    + '<input type="file" id="' + id + '" class="dz-input" onchange="dzChanged(\'' + id + '\')">'
    + '<span class="dz-empty"><span class="dz-strong">Drop a file here</span> or <span class="dz-link">browse</span></span>'
    + '<span class="dz-file"><span class="dz-name"></span><span class="dz-size"></span>'
    + '<button type="button" class="dz-clear" aria-label="Remove file" onclick="event.preventDefault();dzClear(\'' + id + '\')">&times;</button></span>'
    + '</label>';
}
function fmtBytes(n){ return n < 1024 ? n + ' B' : (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'); }
function dzChanged(id){
  const input = document.getElementById(id), zone = document.getElementById('dz-' + id);
  if(!input || !zone) return;
  const f = input.files && input.files[0];
  zone.classList.toggle('has-file', !!f);
  if(f){ zone.querySelector('.dz-name').textContent = f.name; zone.querySelector('.dz-size').textContent = fmtBytes(f.size); }
  const btnId = zone.getAttribute('data-btn');
  const btn = btnId && document.getElementById(btnId);
  if(btn) btn.disabled = !f;
}
window.dzChanged = dzChanged;
function dzClear(id){ const input = document.getElementById(id); if(input){ input.value = ''; dzChanged(id); } }
window.dzClear = dzClear;
function wireDropzones(){
  document.querySelectorAll('.dropzone').forEach(function(zone){
    if(zone._wired) return;
    zone._wired = true;
    ['dragenter','dragover'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      const id = zone.getAttribute('data-input'), input = document.getElementById(id);
      if(input && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        try{ input.files = e.dataTransfer.files; }catch(err){ /* very old browser */ }
        dzChanged(id);
      }
    });
  });
}

// Clears the current flag on every tune for this application. Must run
// BEFORE marking a new one - the unique index allows only one current tune.
async function clearCurrentTune(appId){
  const { error } = await sb.from('tuning_files').update({ is_current:false })
    .eq('application_id', appId).eq('file_type', 'tune').eq('is_current', true);
  if(error) throw error;
  (S.files[appId] || []).forEach(function(f){ if(f.file_type === 'tune') f.is_current = false; });
}

async function setCurrentTune(appId, fileId){
  const rec = (S.files[appId] || []).find(function(x){ return x.id === fileId; });
  if(rec && rec.uploaded_by === 'customer'){ toast("A file the customer sent can't be marked as the tune on their car", true); return; }
  try{
    // One transaction server-side (clear old + set new), shared with the
    // customer portal - see tuning_set_current_tune in Phase 19.
    const { data, error } = await sb.rpc('tuning_set_current_tune', { p_file_id: fileId, p_marked_by: S.user.email });
    if(error) throw error;
    (S.files[appId] || []).forEach(function(f){ if(f.file_type === 'tune') f.is_current = false; });
    const list = S.files[appId] || [];
    const idx = list.findIndex(function(f){ return f.id === fileId; });
    if(idx !== -1) list[idx] = data;
    await logActivity(appId, 'current_tune', null, data.file_name + (data.revision_number ? ' (rev ' + data.revision_number + ')' : ''));
    pingPortal(appId);
    renderPanelBody();
    toast('Marked as currently flashed');
  }catch(e){ toast('Failed to update: ' + e.message, true); }
}
window.setCurrentTune = setCurrentTune;

async function uploadFile(appId){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file){ toast('Choose a file first', true); return; }
  const type = document.getElementById('fileTypeSelect').value;
  const isTune = type === 'tune';
  const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
  const revision = isTune ? (val('fileRevision') || null) : null;
  const fuel = isTune ? (val('fileFuel') || null) : null;
  const changelog = isTune ? (val('fileChangelog').trim() || null) : null;
  const cur = document.getElementById('fileIsCurrent');
  const markCurrent = isTune && !!(cur && cur.checked);
  const upBtn = document.getElementById('uploadBtn');
  if(upBtn){ upBtn.disabled = true; upBtn.textContent = 'Uploading...'; }
  const path = appId + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

  try{
    const { error: upErr } = await sb.storage.from('tuning-files').upload(path, file);
    if(upErr) throw upErr;

    if(markCurrent) await clearCurrentTune(appId);

    const { data, error } = await sb.from('tuning_files').insert({
      application_id: appId,
      uploaded_by: 'tuner',
      uploaded_by_name: S.user.email,
      file_name: file.name,
      file_path: path,
      file_type: type,
      revision_number: revision ? parseInt(revision, 10) : null,
      fuel: fuel,
      description: changelog,
      is_current: markCurrent,
      flashed_marked_by: markCurrent ? S.user.email : null,
      flashed_marked_at: markCurrent ? new Date().toISOString() : null
    }).select().single();
    if(error) throw error;

    if(!S.files[appId]) S.files[appId] = [];
    if(!S.files[appId].some(function(f){ return f.id === data.id; })) S.files[appId].unshift(data);
    await logActivity(appId, 'file_uploaded', null, file.name);

    if(isTune){
      await sb.from('tuning_applications').update({ customer_has_unread:true, updated_at:new Date().toISOString() }).eq('id', appId);
      const app = S.applications.find(function(x){ return x.id === appId; });
      if(app) app.customer_has_unread = true;
    }
    callNotify('file_uploaded', { application_id: appId, file_name: file.name, file_type: type });
    pingPortal(appId);
    renderPanelBody();
    toast('File uploaded');
  }catch(e){
    toast('Upload failed: ' + e.message, true);
    if(upBtn){ upBtn.disabled = false; upBtn.textContent = 'Retry upload'; }
  }
}
window.uploadFile = uploadFile;

/* ================= DATALOG VIEWER ================= */
// Generic CSV log viewer: finds the header row itself (logs often carry
// preamble lines), detects the delimiter, and lets the tuner pick which
// columns to chart. Nothing here assumes DS1's column names - flag rules
// are tuner-defined against the real headers (tuning_log_rules).

function splitLogLine(line, delim){
  if(line.indexOf('"') === -1) return line.split(delim).map(function(c){ return c.trim(); });
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(ch === '"'){ if(q && line[i+1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if(ch === delim && !q){ out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}

function toNum(v, commaDecimal){
  if(v === '' || v == null) return NaN;
  return Number(commaDecimal ? String(v).replace(',', '.') : v);
}

// Rows may differ from the header's width only in harmless ways - a delimiter
// at the end of every data row, or the last cell or two left off. Anything
// else is a damaged line and is skipped rather than shifting every column.
function fitCells(cells, W){
  const n = cells.length;
  if(n === W) return cells;
  if(n > W){ for(let i = W; i < n; i++) if(cells[i] !== '') return null; return cells.slice(0, W); }
  if(W - n <= 2){ const out = cells.slice(); while(out.length < W) out.push(''); return out; }
  return null;
}

// Time stamps that aren't plain numbers: "14:03:22.250", "03:22.250" (mm:ss)
// and "2026-09-24 14:03:22.250". Returns seconds, or NaN when it isn't one.
function parseTimeCell(s){
  let m = /^(\d{4})[-\/](\d{2})[-\/](\d{2})[T ](\d{1,2}):(\d{2}):(\d{2}(?:\.\d+)?)(?:Z|[+-]\d{2}:?\d{2})?$/.exec(s);
  if(m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], 0) / 1000 + parseFloat(m[6]);
  m = /^(\d{1,2}):(\d{2}):(\d{2}(?:\.\d+)?)$/.exec(s);
  if(m) return +m[1] * 3600 + +m[2] * 60 + parseFloat(m[3]);
  m = /^(\d{1,3}):(\d{2}(?:\.\d+)?)$/.exec(s);
  if(m) return +m[1] * 60 + parseFloat(m[2]);
  return NaN;
}
const TIME_HDR = /time|sec|stamp|\bdate\b|clock|elapsed/i;

function parseLog(text){
  text = String(text).replace(/^\uFEFF/, '');   // byte-order mark from Excel / Windows exports
  const lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ''; });
  if(lines.length < 3) throw new Error('This file does not look like a datalog (too few lines).');
  // Delimiter: whichever of , ; tab appears most consistently in the first lines.
  const sample = lines.slice(0, 60);
  let delim = ',', best = 0;
  [',', ';', '\t'].forEach(function(d){
    const counts = sample.map(function(l){ return l.split(d).length - 1; }).filter(function(c){ return c > 0; });
    if(counts.length > best){ best = counts.length; delim = d; }
  });
  const commaDecimal = delim !== ',';
  const numRatio = function(cells){
    const n = cells.filter(function(c){ return c !== '' && !isNaN(toNum(c, commaDecimal)); }).length;
    return cells.length ? n / cells.length : 0;
  };
  // Filled-cell ratio: DS1 writes a near-empty marker row ("0,,,,") right
  // under the header, so empty cells must not count against a row.
  const filledRatio = function(cells){
    const filled = cells.filter(function(c){ return c !== ''; });
    return filled.length / Math.max(1, cells.length);
  };
  const trimEnd = function(cells){ let n = cells.length; while(n > 2 && cells[n - 1] === '') n--; return n === cells.length ? cells : cells.slice(0, n); };
  // Header = the text row followed by the LONGEST run of equal-width,
  // mostly-numeric rows. Taking the first candidate isn't enough: loggers
  // like JB4 start with settings blocks (a name row + a value row) that
  // look like a tiny table, and the real data only starts after them.
  // A header is also never a near-empty marker row like DS1's "0,,,,".
  let headerIdx = -1, bestRun = 0;
  for(let i = 0; i < Math.min(200, lines.length - 1); i++){
    const a = trimEnd(splitLogLine(lines[i], delim));
    if(a.length < 2 || numRatio(a) >= 0.5 || filledRatio(a) < 0.5) continue;
    let run = 0;
    for(let j = i + 1; j < lines.length && run < 500; j++){
      const b = fitCells(splitLogLine(lines[j], delim), a.length);
      if(!b) break;
      if(filledRatio(b) < 0.5) continue;
      if(numRatio(b) >= 0.6) run++; else break;
    }
    if(run > bestRun){ bestRun = run; headerIdx = i; }
  }
  if(headerIdx === -1) throw new Error('Could not find a header row in this file.');
  // Anything above the header is kept as log info: pairs of a name row and
  // a value row of the same width (JB4: firmware, VIN, map settings...).
  const preamble = [];
  for(let r = 0; r + 1 < headerIdx; r++){
    const kr = splitLogLine(lines[r], delim), vr = splitLogLine(lines[r + 1], delim);
    if(kr.length < 2 || kr.length !== vr.length || numRatio(kr) >= 0.5) continue;
    kr.forEach(function(k, x){ if(k && vr[x] !== '' && vr[x] !== undefined) preamble.push({ k: k, v: vr[x] }); });
    r++;
  }
  const rawHeaders = trimEnd(splitLogLine(lines[headerIdx], delim)).map(function(h, i){ return h || ('Column ' + (i + 1)); });
  // Two columns with the same name would share one set of roles, rules and
  // comparisons, so repeats get a "~2" suffix (ahead of any unit, so the
  // unit still parses).
  const seen = {};
  const headers = rawHeaders.map(function(h){
    seen[h] = (seen[h] || 0) + 1;
    if(seen[h] === 1) return h;
    const u = chUnitRaw(h), bs = chBase(h);
    return bs + ' ~' + seen[h] + (u ? ' [' + u + ']' : '');
  });
  const W = headers.length;
  const cols = headers.map(function(){ return []; });
  const filledN = new Array(W).fill(0);
  const rawT = headers.map(function(h){ return TIME_HDR.test(h) ? [] : null; });
  for(let r = headerIdx + 1; r < lines.length; r++){
    const cells = fitCells(splitLogLine(lines[r], delim), W);
    if(!cells) continue;
    if(filledRatio(cells) < 0.5) continue; // marker / padding rows
    for(let c = 0; c < W; c++){
      if(cells[c] !== '') filledN[c]++;
      cols[c].push(toNum(cells[c], commaDecimal));
      if(rawT[c]) rawT[c].push(cells[c]);
    }
  }
  const rowCount = cols[0].length;
  if(!rowCount) throw new Error('No data rows found under the header.');
  // A channel is numeric when most of what it HOLDS is numeric - a slow
  // channel that is blank on most rows is still a real channel.
  const minFilled = Math.max(2, Math.ceil(rowCount * 0.05));
  const numeric = headers.map(function(h, c){
    if(filledN[c] < minFilled) return false;
    let ok = 0; const col = cols[c];
    for(let i = 0; i < rowCount; i++) if(!isNaN(col[i])) ok++;
    return ok / filledN[c] >= 0.8;
  });
  // Time columns written as clock times / date-times rather than numbers.
  const textTime = {};
  headers.forEach(function(h, c){
    if(numeric[c] || !rawT[c]) return;
    const nonEmpty = rawT[c].filter(function(s){ return s !== ''; }).length;
    if(!nonEmpty) return;
    const vals = rawT[c].map(function(s){ return s === '' ? NaN : parseTimeCell(s); });
    if(vals.filter(function(v){ return !isNaN(v); }).length / nonEmpty < 0.95) return;
    let off = 0, prev = NaN;   // clock time with no date: a big drop means it passed midnight
    for(let i = 0; i < vals.length; i++){
      if(isNaN(vals[i])) continue;
      let v = vals[i] + off;
      if(!isNaN(prev) && v < prev - 43200){ off += 86400; v += 86400; }
      vals[i] = v; prev = v;
    }
    cols[c] = vals; numeric[c] = true; textTime[c] = true;
  });
  // Time axis: a time-like header that mostly increases; otherwise sample index.
  let timeIdx = -1;
  headers.forEach(function(h, c){
    if(timeIdx !== -1 || !numeric[c] || !TIME_HDR.test(h)) return;
    let up = 0;
    for(let i = 1; i < rowCount; i++) if(cols[c][i] >= cols[c][i - 1]) up++;
    if(up / Math.max(1, rowCount - 1) > 0.95) timeIdx = c;
  });
  // Show time relative to the first sample, and in seconds when the log
  // records milliseconds (DS1: "Timestamp [ms]").
  let timeScale = 1, timeUnit = '';
  if(timeIdx !== -1){
    const h = headers[timeIdx];
    if(textTime[timeIdx]) timeUnit = 's';
    else if(/[\[(]\s*ms\s*[\])]|\bms\b/i.test(h)){ timeScale = 1000; timeUnit = 's'; }
    else if(/[\[(]\s*s(ec(onds?)?)?\s*[\])]/i.test(h)) timeUnit = 's';
  }
  let t0 = 0;
  if(timeIdx !== -1){ for(let i = 0; i < rowCount; i++){ if(!isNaN(cols[timeIdx][i])){ t0 = cols[timeIdx][i]; break; } } }
  // Sample rate (median step), so the viewer can say how much detail the
  // log really holds - 1 Hz logs can't show a half-second knock event.
  let hz = 0;
  if(timeIdx !== -1 && rowCount > 2){
    const tc = cols[timeIdx], step = Math.max(1, Math.floor(rowCount / 2000)), d = [];
    for(let i = step; i < rowCount; i += step){ const dd = (tc[i] - tc[i - step]) / step; if(dd > 0) d.push(dd); }
    d.sort(function(x, y){ return x - y; });
    const med = d.length ? d[d.length >> 1] / timeScale : 0;
    hz = med > 0 ? 1 / med : 0;
  }
  return applyLogProfile({ headers: headers, cols: cols, numeric: numeric, timeIdx: timeIdx, rows: rowCount, delim: delim,
    t0: t0, timeScale: timeScale, timeUnit: timeUnit, preamble: preamble, hz: hz });
}

function logSignature(headers){ return 'tgk-logview:' + headers.join('|').slice(0, 400); }
function normCol(x){ return String(x || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

async function loadLogRules(){
  try{
    const { data, error } = await sb.from('tuning_log_rules').select('*').order('created_at', { ascending:true });
    if(error) throw error;
    S.logRules = data || [];
  }catch(e){ S.logRules = []; }
}

// Rule -> columns. An exact header match wins; otherwise every header that
// contains the rule's name matches. That's what lets one rule on
// "IKCtl_agKnkInt_as8" check all six per-cylinder DS1 columns [0]..[5].
function ruleColumns(rule, log){
  const want = normCol(rule.column_name);
  if(!want) return [];
  const exact = [], partial = [];
  log.headers.forEach(function(h, i){
    if(!log.numeric[i] || i === log.timeIdx) return;
    const n = normCol(h);
    if(n === want) exact.push(i);
    else if(n.indexOf(want) !== -1) partial.push(i);
  });
  return exact.length ? exact : partial;
}

// Per rule: which columns tripped, how many separate events (runs of
// consecutive samples), and the worst value. hitsByCol drives the red
// markers on each chart.
function evaluateRules(log){
  return (S.logRules || []).map(function(rule){
    const cols = ruleColumns(rule, log);
    const th = Number(rule.threshold);
    const out = { rule: rule, cols: cols, hitsByCol: {}, events: 0, worst: null, worstCol: -1, trippedCols: [], total: 0 };
    cols.forEach(function(c){
      const data = colData(log, c), hits = [];
      for(let i = 0; i < data.length; i++){
        const v = data[i];
        if(isNaN(v)) continue;
        if(rule.operator === '>' ? v > th : v < th){
          hits.push(i);
          if(out.worst === null || (rule.operator === '>' ? v > out.worst : v < out.worst)){ out.worst = v; out.worstCol = c; }
        }
      }
      if(!hits.length) return;
      out.hitsByCol[c] = hits;
      out.trippedCols.push(c);
      out.total += hits.length;
      for(let k = 0; k < hits.length; k++) if(k === 0 || hits[k] - hits[k - 1] > 1) out.events++;
    });
    return out;
  });
}

// log.xShift lines a compared log up with this one (see logApplyAlign); 0 otherwise.
function xValue(log, i){ return (log.timeIdx !== -1 ? (log.cols[log.timeIdx][i] - log.t0) / log.timeScale : i) - (log.xShift || 0); }

// Fuel cut / overrun: on lift-off the ECU stops injecting and lambda
// channels jump to their maximum (16 on DS1/Bosch), passing through values
// like 2-12 on the way. A gasoline engine never runs at lambda >= 2 while
// combusting, so any sample where ANY lambda channel (actual or setpoint)
// reads >= 2 is overrun. With "Hide fuel cut" on, those samples are gaps
// on every lambda chart and are ignored by flag rules - otherwise a lean
// rule fires every time the driver lifts.
const FUEL_CUT_LAMBDA = 2.0;
function mixtureKind(log, c){
  const m = log.meta && log.meta[c];
  if(m && (m.role === 'lambda' || m.role === 'lambda_target')) return 'lambda';
  if(m && (m.role === 'afr' || m.role === 'afr2')) return 'afr';
  if(!m && /^lam|lambda/i.test(log.headers[c] || '')) return 'lambda';
  return null;
}
function isLambdaCol(log, c){ return mixtureKind(log, c) !== null; }
// Fuel cut / overrun. Lambda: any lambda channel >= 2 (no combustion runs
// that lean). AFR loggers (e.g. JB4) peg their wideband near 20 on lift-off,
// so AFR >= 19.9 counts only while the pedal is closed.
function fuelCutMask(log){
  if(log._fcMask) return log._fcMask;
  const lam = [], afr = [];
  log.headers.forEach(function(h, c){ if(!log.numeric[c]) return; const k = mixtureKind(log, c); if(k === 'lambda') lam.push(c); else if(k === 'afr') afr.push(c); });
  const ped = roleCols(log, 'pedal')[0];
  const mask = new Array(log.rows).fill(false);
  for(let i = 0; i < log.rows; i++){
    if(lam.some(function(c){ return log.cols[c][i] >= FUEL_CUT_LAMBDA; })){ mask[i] = true; continue; }
    if(afr.length){
      const closed = ped === undefined ? false : !(log.cols[ped][i] >= 5);
      if(closed && afr.some(function(c){ return log.cols[c][i] >= 19.9; })) mask[i] = true;
      else if(ped === undefined && afr.some(function(c){ return log.cols[c][i] >= FUEL_CUT_LAMBDA * 14.7; })) mask[i] = true;
    }
  }
  log._fcMask = mask;
  return mask;
}
function colData(log, c){
  const hide = !S.logView || S.logView.hideFuelCut !== false;
  if(!hide || !isLambdaCol(log, c)) return log.cols[c];
  log._fc = log._fc || {};
  if(!log._fc[c]){
    const mask = fuelCutMask(log);
    log._fc[c] = log.cols[c].map(function(v, i){ return mask[i] ? NaN : v; });
  }
  return log._fc[c];
}
function fuelCutCount(log){ return fuelCutMask(log).filter(Boolean).length; }
function logSpan(log){ return log.rows > 1 ? xValue(log, log.rows - 1) : 1; }
// Nearest sample at time t (logs are time-ordered).
function sampleAt(log, t){
  let lo = 0, hi = log.rows - 1;
  while(hi - lo > 1){ const mid = (lo + hi) >> 1; if(xValue(log, mid) < t) lo = mid; else hi = mid; }
  return Math.abs(xValue(log, lo) - t) <= Math.abs(xValue(log, hi) - t) ? lo : hi;
}
// Matching channel in the comparison log, by normalized header name.
function compareCol(c){
  const V = S.logView;
  if(!V || !V.compare) return -1;
  const want = normCol(V.log.headers[c]);
  const b = V.compare.log;
  for(let i = 0; i < b.headers.length; i++) if(b.numeric[i] && normCol(b.headers[i]) === want) return i;
  return -1;
}
function timeLabel(log){ return log.timeIdx === -1 ? 'Sample' : (log.timeUnit ? 'Time (' + log.timeUnit + ')' : log.headers[log.timeIdx]); }
function fmtNum(v){ if(v === null || isNaN(v)) return '-'; const a = Math.abs(v); return a >= 1000 ? v.toFixed(0) : (a >= 10 ? v.toFixed(1) : v.toFixed(2)); }
// Per-channel precision: lambda is read to the third decimal (0.853 vs 0.850
// is a real difference), everything else keeps fmtNum's 3-significant style.
function fmtV(log, c, v){
  if(v === null || v === undefined || isNaN(v)) return '-';
  const m = log.meta && log.meta[c];
  if(m && (m.role === 'lambda' || m.role === 'lambda_target')) return v.toFixed(3);
  return fmtNum(v);
}
function fmtHz(hz){ return (hz >= 10 ? Math.round(hz) : hz.toFixed(1)) + ' Hz'; }
function logChartHeight(){ try{ const v = Number(localStorage.getItem('tgk-logview-h')); return [120, 170, 260].indexOf(v) !== -1 ? v : 170; }catch(e){ return 170; } }

async function fetchLog(path){
  const { data, error } = await sb.storage.from('tuning-files').createSignedUrl(path, 600);
  if(error) throw error;
  const resp = await fetch(data.signedUrl);
  if(!resp.ok) throw new Error('Download failed (' + resp.status + ')');
  return parseLog(await resp.text());
}

async function openLogViewer(fileId, path, opts){
  // Name/application are looked up rather than passed through onclick, so
  // file names with quotes can't break the handler.
  let fileName = 'Datalog', appId = null;
  Object.keys(S.files).forEach(function(k){ (S.files[k] || []).forEach(function(f){ if(f.id === fileId){ fileName = f.file_name; appId = k; } }); });
  (S.pendingLogs || []).forEach(function(f){ if(f.id === fileId){ fileName = f.file_name; appId = f.application_id; } });
  openModal('<div class="modal log-modal"><div class="modal-title">Loading ' + escapeHtml(fileName) + '&hellip;</div></div>');
  try{
    const log = await fetchLog(path);
    if(!S.logRules) await loadLogRules();
    if(appId && !S.files[appId]) await loadFiles(appId); // for the "Compare with" list
    // Saved layout for logs with these same channels (v2 = charts of
    // several series; v1 was a flat list of single-channel charts).
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(logSignature(log.headers)) || 'null'); }catch(e){ saved = null; }
    const valid = function(c){ return typeof c === 'number' && c < log.headers.length && log.numeric[c] && c !== log.timeIdx; };
    let charts = [], units = 'native';
    if(saved && saved.v === 2){
      charts = (saved.charts || []).map(function(ch){ return ch.filter(valid); }).filter(function(ch){ return ch.length; });
      units = saved.units === 'us' ? 'us' : 'native';
    } else if(Array.isArray(saved)){
      charts = saved.filter(valid).map(function(c){ return [c]; });
    }
    S.logView = { fileId: fileId, path: path, fileName: fileName, appId: appId, log: log, charts: [], filter: '', compare: null, hideFuelCut: true, units: units, range: null };
    if(!charts.length) charts = buildPreset(log, 'Overview');
    if(!charts.length){
      log.headers.forEach(function(h, c){ if(charts.length < 3 && valid(c)) charts.push([c]); });
    }
    S.logView.charts = charts;
    renderLogViewer();
    saveLogAnalysis(fileId, analyzeLog(log));
  }catch(e){
    // Labelled a log but not actually a datalog table (a text note, a
    // spreadsheet export...): show it as an ordinary file rather than an error.
    if(opts && opts.fallback){
      const rec = findFileRecord(fileId);
      if(rec){ fvOpen(rec, { as: FV_TEXT[fileExt(rec.file_name)] ? 'text' : 'other', note: "This isn't a datalog table, so it's shown as a regular file." }); return; }
    }
    openModal('<div class="modal"><div class="modal-title">Could not open log</div><p class="file-meta">' + escapeHtml(e.message) + '</p>'
      + '<div class="modal-footer"><button class="btn btn-sm" onclick="downloadFile(\'' + fileId + '\',\'' + path + '\')">Download instead</button><button class="btn btn-sm" onclick="closeModal()">Close</button></div></div>');
  }
}
window.openLogViewer = openLogViewer;

async function setLogCompare(fileId){
  const V = S.logView; if(!V) return;
  if(!fileId){ V.compare = null; renderLogViewer(); return; }
  const f = (S.files[V.appId] || []).find(function(x){ return x.id === fileId; });
  if(!f) return;
  toast('Loading ' + f.file_name + '...');
  try{
    V.compare = { fileId: f.id, fileName: f.file_name, log: await fetchLog(f.file_path) };
    V.align = V.align || 'start';
    logApplyAlign();
    renderLogViewer();
  }catch(e){ toast('Could not load comparison log: ' + e.message, true); }
}
window.setLogCompare = setLogCompare;

function toggleFuelCut(on){ if(S.logView){ S.logView.hideFuelCut = on; renderLogViewer(); } }

window.viewLocalLog = viewLocalLog;

// Downsample to ~W buckets keeping each bucket's min and max, so short
// spikes (a knock event, a boost overshoot) survive on a long log.
/* ---------- LOG FORMAT PROFILES ---------- */
// parseLog finds the data table (STRUCTURE); this layer decides what each
// column MEANS. A profile recognizes one logger's files and maps columns
// to roles (rpm, boost, per-cylinder knock, ...) with units. Everything
// downstream - names, layouts, WOT zoom, fuel-cut handling, analysis -
// asks for roles, never raw column names. Adding a logger = adding one
// profile. Unknown formats get the GENERIC best guess, and a tuner can
// reassign any column in the viewer; that correction is saved per format.
const LOG_ROLES = {
  rpm:{label:'Engine speed'}, pedal:{label:'Accelerator pedal'}, throttle:{label:'Throttle angle'},
  speed:{label:'Vehicle speed'}, gear:{label:'Gear'}, load:{label:'Load'},
  boost:{label:'Boost pressure (actual)'}, boost_target:{label:'Boost pressure (target)'}, boost2:{label:'Boost pressure (bank 2)'},
  boost_ecu:{label:'ECU boost'}, boost_target_ecu:{label:'ECU boost target'}, wgdc:{label:'Wastegate duty'},
  timing:{label:'Ignition timing'}, ign_cyl:{label:'Ignition timing', group:true},
  knock_cyl:{label:'Knock retard', group:true},
  lambda:{label:'Lambda'}, lambda_target:{label:'Lambda target'}, afr:{label:'AFR'}, afr2:{label:'AFR (bank 2)'},
  hpfp:{label:'Rail pressure (actual)'}, hpfp_target:{label:'Rail pressure (setpoint)'}, lpfp:{label:'Low-pressure fuel'},
  inj_time:{label:'Injection time'}, fuel_trim:{label:'Fuel trim'}, ethanol:{label:'Ethanol content'},
  iat:{label:'Intake air temp'}, coolant:{label:'Coolant temp'}, oil_temp:{label:'Oil temp'}, trans_temp:{label:'Trans temp'},
  maf:{label:'Mass airflow'}, ambient:{label:'Ambient pressure', allowFlat:true}
};

// map entries: [role, regex on the column name (unit stripped), options]
// options: unit (when the file doesn't say), sign for knock (-1 = values are
// negative retard like DS1, +1 = positive degrees pulled like JB4, 0 = infer).
const LOG_PROFILES = [
  { id:'ds1', name:'DS1',
    detect: function(h){ return h.some(function(x){ return /^(nmot_w|IKCtl_agKnkInt|pvdr_w|zwoutzyl)/i.test(chBase(x)); }); },
    map: [ ['rpm',/^nmot_w$/i], ['pedal',/^AccP_r_VW$/i], ['throttle',/^wdk_w/i], ['speed',/^CHdT_vVehloc$/i],
      ['gear',/^CoEng_nrActGearHem$/i], ['load',/^rl_w$/i], ['iat',/^tans/i], ['coolant',/^tmot/i],
      ['oil_temp',/^SLmpCtl_tOilSwmp/i], ['knock_cyl',/^IKCtl_agKnkInt/i,{sign:-1}], ['ign_cyl',/^zwoutzyl/i],
      ['inj_time',/^InjSys_tiInjSum$/i], ['lpfp',/^FuelP_pAct$/i], ['hpfp',/^prist_w/i], ['hpfp_target',/^prsoll_w/i],
      ['boost',/^pvdr_w/i,{abs:true}], ['boost_target',/^pvds_w/i,{abs:true}], ['ambient',/^pu_w$/i], ['lambda',/^lam/i] ] },
  { id:'jb4', name:'JB4', timeUnit:'s',
    detect: function(h, pre){ return pre.some(function(p){ return /JB4_MAC_Address/i.test(p.k); }) || (h.indexOf('WGDC_FF') !== -1 && h.indexOf('ECU Boost') !== -1); },
    note: 'JB4 files carry no units or channel descriptions. Ign_2 to Ign_8 are treated as per-cylinder timing corrections (degrees pulled) because that is how they behave in the logs checked. "Target" is not treated as boost target because it does not track boost. Boost vs target compares the ECU\'s own boost reading with the ECU\'s own target, so both numbers come from the same source; the JB4 sensor\'s peak is reported next to it. Reassign anything under Channel roles if needed.',
    map: [ ['rpm',/^RPM$/i], ['pedal',/^Pedal$/i], ['throttle',/^Throttle$/i], ['speed',/^Speed$/i,{unit:'mph'}], ['gear',/^GEAR$/i],
      ['boost',/^Boost$/i,{unit:'psi',abs:false}], ['boost2',/^Boost2$/i,{unit:'psi',abs:false}], ['boost_ecu',/^ECU Boost$/i,{unit:'psi',abs:false}],
      ['boost_target_ecu',/^ECU Target$/i,{unit:'psi',abs:false}], ['wgdc',/^WGDC$/i,{unit:'%'}], ['timing',/^Timing$/i,{unit:'deg'}],
      ['knock_cyl',/^Ign_(\d+)$/i,{sign:1, unit:'deg'}], ['afr',/^AFR$/i], ['afr2',/^AFR2$/i], ['hpfp',/^FuelP High$/i],
      ['lpfp',/^FuelP Low$/i], ['fuel_trim',/^Fuel Trims$/i], ['ethanol',/^E85$/i,{unit:'%'}], ['iat',/^IAT$/i,{unit:'deg F'}],
      ['coolant',/^Water Temp$/i,{unit:'deg F'}], ['oil_temp',/^Oil Temp$/i,{unit:'deg F'}], ['trans_temp',/^Trans Temp$/i,{unit:'deg F'}],
      ['maf',/^MAF$/i] ] },
  { id:'generic', name:'Unrecognized format (best guess)',
    detect: function(){ return true; },
    note: 'This logger is not recognized, so channels were matched by common names. Check Channel roles and correct anything wrong - the correction is remembered for every log from this logger.',
    map: [ ['rpm',/^(rpm|engine ?(speed|rpm)|eng ?spd)/i], ['pedal',/(accel|pedal)/i], ['throttle',/(throttle|tps)/i],
      ['gear',/^(gear|current ?gear)/i], ['speed',/(vehicle ?speed|^speed$|^vss|^mph|km\/?h)/i],
      ['boost_target',/(boost|map).*(target|request|set|desired|cmd)|(target|requested|desired).*(boost|pressure)/i],
      ['boost',/^(boost|boost ?pressure|map|manifold ?(abs|pressure)?)/i], ['ambient',/(ambient|baro\w*).*(press|pres)|^baro/i],
      ['knock_cyl',/(knock|kr|kc|timing ?corr|ign\w* ?corr)\D*(\d)/i,{sign:0}],
      ['ign_cyl',/(ign\w*|timing|spark)\D*cyl\D*(\d)|^(ign|timing)[ _-]?(\d)$/i],
      ['timing',/^(ign(ition)?( ?timing| ?advance)?|timing( ?advance)?|spark ?adv\w*)$/i],
      ['lambda_target',/lambda.*(target|req|set|cmd)|(target|commanded).*lambda/i], ['lambda',/lambda/i],
      ['afr',/(^afr|air ?fuel)/i], ['hpfp',/(rail|hpfp|high.*fuel|fuel.*high)/i], ['lpfp',/(lpfp|low.*fuel|fuel.*low)/i],
      ['iat',/(^iat|intake ?air|charge ?air)/i], ['coolant',/(coolant|water ?temp|^ect)/i], ['oil_temp',/oil ?temp/i],
      ['ethanol',/(ethanol|^e85|flex)/i], ['wgdc',/(wgdc|wastegate)/i], ['load',/load/i], ['maf',/^maf/i] ] }
];

const HEADER_META = {};   // column name -> { role, idx, unit, sign } for name/unit lookups
function chMeta(h){ return HEADER_META[h] || null; }

function roleOverrides(){
  try{ return JSON.parse((S.settings && S.settings.log_role_maps) || '{}') || {}; }catch(e){ return {}; }
}
function logFingerprint(log){
  let hsh = 0; const str = log.headers.join('|');
  for(let i = 0; i < str.length; i++){ hsh = ((hsh << 5) - hsh + str.charCodeAt(i)) | 0; }

    html += '<div class="lv-note">Low sample rate (' + fmtHz(log.hz) + '): anything shorter than about ' + fmtNum(1 / log.hz) + ' s - a brief knock event or boost spike - can fall between samples and not show here.</div>';
  }

  // Toolbar
  const others = (S.files[V.appId] || []).filter(function(f){ return f.id !== V.fileId && isLogFile(f); });
  html += '<div class="lv-bar">'
    + '<div class="lv-presets"><span class="lv-lbl">Layout</span>' + Object.keys(LOG_PRESETS).map(function(p){
        return buildPreset(log, p).length ? '<button class="lv-chip" onclick="logApplyPreset(\'' + p + '\')">' + p + '</button>' : '';
      }).join('') + '</div>'
    + '<div class="lv-segs"><div class="lv-seg" title="Chart height">' + [[120, 'Compact'], [170, 'Normal'], [260, 'Tall']].map(function(o){
        return '<button class="' + (chartH === o[0] ? 'on' : '') + '" onclick="logSetHeight(' + o[0] + ')">' + o[1] + '</button>';
      }).join('') + '</div>'
    + (hasAbs ? '<div class="lv-seg" title="Boost pressure reference: absolute (about 1 atmosphere at idle) or gauge (0 at idle)"><button class="' + (!gaugeOn ? 'on' : '') + '" onclick="logSetGauge(false)">Boost: Absolute</button><button class="' + (gaugeOn ? 'on' : '') + '" onclick="logSetGauge(true)">Gauge</button></div>' : '')
    + '<div class="lv-seg" title="Units"><button class="' + (V.units !== 'us' ? 'on' : '') + '" onclick="logSetUnits(\'native\')">Native</button><button class="' + (V.units === 'us' ? 'on' : '') + '" onclick="logSetUnits(\'us\')">psi / F / mph</button></div></div>'
    + '</div>';
  html += '<div class="lv-bar">'
    + '<label class="lv-tool"><span class="lv-lbl">Compare</span><select class="form-input" onchange="setLogCompare(this.value)"><option value="">None</option>'
    + others.map(function(f){ return '<option value="' + f.id + '"' + (V.compare && V.compare.fileId === f.id ? ' selected' : '') + '>' + escapeHtml(f.file_name) + ' (' + fmtDate(f.created_at) + ')</option>'; }).join('')
    + '</select></label>'
    + (hasAbs && gaugeOn ? (function(){
        const am = logAmbient(log);
        return '<label class="lv-tool" title="Ambient (barometric) pressure subtracted from the boost channels. Estimated automatically - type a value to override it (' + (am.hpa * 0.0145038).toFixed(2) + ' psi / ' + (am.hpa * 0.02953).toFixed(2) + ' inHg)."><span class="lv-lbl">Ambient</span>'
          + '<input class="form-input lv-amb" type="number" step="1" min="600" max="1100" value="' + Math.round(am.hpa) + '" onchange="logSetAmbient(this.value)"> hPa'
          + '<span class="file-meta">' + escapeHtml(logAmbientNote(log)) + (B && logHasAbsBoost(B) ? ' &middot; compared log ' + Math.round(logAmbient(B).hpa) : '') + '</span>'
          + (am.src === 'manual' ? '<a class="lv-auto" onclick="logSetAmbient(\'\')">Auto</a>' : '') + '</label>';
      })() : '')
    + (canAlign ? '<div class="lv-tool"><span class="lv-lbl">Align</span><div class="lv-seg" style="margin-left:0"><button class="' + (V.align !== 'pull' ? 'on' : '') + '" onclick="logSetAlign(\'start\')">Log start</button><button class="' + (V.align === 'pull' ? 'on' : '') + '" onclick="logSetAlign(\'pull\')">Pull 1</button></div></div>' : '')
    + (fc ? '<label class="lv-tool"><input type="checkbox" ' + (V.hideFuelCut ? 'checked' : '') + ' onchange="toggleFuelCut(this.checked)"> Hide fuel cut on lambda/AFR <span class="file-meta">(' + fc + ')</span></label>' : '')
    + '<span class="lv-zoom">' + (V.range ? 'Zoom ' + fmtNum(r.a) + '-' + fmtNum(r.b) + ' s <a onclick="logResetZoom()">Reset</a>' : (logIsCoarse() ? 'Pinch a chart to zoom' : 'Drag across a chart to zoom')) + '</span>'
    + (logWotRange(log) ? '<button class="lv-chip" onclick="logZoomWot()">Zoom to WOT</button>' : '')
    + '</div>';
  if(B){
    html += '<div class="lv-legend-note"><span class="lg-solid"></span>' + escapeHtml(V.fileName) + '<span class="lg-dash"></span>' + escapeHtml(V.compare.fileName) + ' <span class="file-meta">' + (V.align === 'pull' && canAlign ? 'aligned on the start of pull 1 in each log' : 'aligned from the start of each log') + '</span></div>';
  }

  // Flags
  const chips = function(res, prefix, muted){
    return res.filter(function(x){ return x.total; }).map(function(x){
      const where = x.cols.length > 1 ? ' on ' + x.trippedCols.length + ' of ' + x.cols.length : '';
      return '<span class="log-flag' + (muted ? ' muted' : '') + '"' + (muted ? '' : ' onclick="logFocusColumn(' + x.worstCol + ')"') + '>' + prefix + escapeHtml(x.rule.label) + ': ' + x.events + ' event' + (x.events === 1 ? '' : 's') + where + ', worst ' + fmtNum(x.worst) + '</span>';
    }).join('');
  };
  const firedA = results.filter(function(x){ return x.total; }).length;
  html += '<div class="log-flags">';
  if(!(S.logRules || []).length) html += '<span class="file-meta">No flag rules yet - add one at the bottom to auto-check every log.</span>';
  else if(!firedA) html += '<span class="pill pill-green">No flags</span>';
  html += chips(results, B ? 'This log: ' : '', false);
  if(B) html += chips(resultsB, 'Compared: ', true) || '<span class="pill pill-green">Compared log: no flags</span>';
  html += '</div>';

  // Automatic pull analysis (and the compared log's, for "vs" values)
  html += renderAnalysisPanel(log, A, B, AB);

  // Time readout
  html += '<div class="lv-readout" id="logReadout"><span class="file-meta">' + logHint() + '</span></div>';

  // Charts
  const xt = niceTicks(r.a, r.b, 9);
  const xPct = function(t){ return ((t - r.a) / (r.b - r.a)) * 100; };
  html += '<div id="logCharts" style="--lc-h:' + chartH + 'px">';
  if(!V.charts.length) html += '<div class="empty-state">Pick a layout above or add channels below.</div>';
  V.charts.forEach(function(cols, k){
    let yMin = Infinity, yMax = -Infinity;
    cols.forEach(function(c){
      const e = seriesExtent(log, c, r); if(e){ yMin = Math.min(yMin, e[0]); yMax = Math.max(yMax, e[1]); }
      const cb = B ? compareCol(c) : -1;
      if(cb !== -1){ const eb = seriesExtent(B, cb, r); if(eb){ yMin = Math.min(yMin, eb[0]); yMax = Math.max(yMax, eb[1]); } }
    });
    if(yMin === Infinity){ yMin = 0; yMax = 1; }
    const yt = niceTicks(yMin, yMax, 5);
    yMin = yt.lo; yMax = yt.hi;
    const yy = function(v){ return LOG_PAD + (H - 2 * LOG_PAD) * (1 - (v - yMin) / (yMax - yMin)); };

    let grid = '';
    // Full-throttle pulls shaded behind the traces.
    A.pulls.forEach(function(p){
      const px0 = Math.max(0, xPct(p.t0)), px1 = Math.min(100, xPct(p.t1));
      if(px1 <= px0) return;
      grid += '<rect class="lv-pull" x="' + (px0 * (W - 1) / 100).toFixed(1) + '" y="0" width="' + ((px1 - px0) * (W - 1) / 100).toFixed(1) + '" height="' + H + '"/>';
    });
    yt.ticks.forEach(function(v){ grid += '<line x1="0" x2="' + W + '" y1="' + yy(v).toFixed(1) + '" y2="' + yy(v).toFixed(1) + '" class="lv-grid"/>'; });
    xt.ticks.forEach(function(t){ if(t < r.a || t > r.b) return; const x = (xPct(t) * (W - 1) / 100).toFixed(1); grid += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + H + '" class="lv-grid"/>'; });

    let marks = '';
    results.forEach(function(res){
      cols.forEach(function(c){
        const hits = res.hitsByCol[c]; if(!hits) return;
        hits.forEach(function(i){
          const t = xValue(log, i); if(t < r.a || t > r.b) return;
          const x = (xPct(t) * (W - 1) / 100).toFixed(1);
          marks += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + H + '" class="log-hitline"/>';
        });
        const conv = chConv(log.headers[c], log);
        const th = conv.f ? conv.f(Number(res.rule.threshold)) : Number(res.rule.threshold);
        if(th >= yMin && th <= yMax) marks += '<line x1="0" x2="' + W + '" y1="' + yy(th).toFixed(1) + '" y2="' + yy(th).toFixed(1) + '" class="log-threshold"/>';
      });
    });

    let paths = '';
    cols.forEach(function(c, i){
      const color = LOG_COLORS[i % LOG_COLORS.length];
      const cb = B ? compareCol(c) : -1;
      if(cb !== -1) paths += '<path d="' + seriesPath(B, cb, W, H, LOG_PAD, r, yMin, yMax) + '" class="lv-line lv-dash" style="stroke:' + color + '"/>';
      paths += '<path d="' + seriesPath(log, c, W, H, LOG_PAD, r, yMin, yMax) + '" class="lv-line" style="stroke:' + color + '"/>';
    });

    // Legend with live values. When every series is one per-cylinder group
    // (knock [0]..[5]), the name is shown once and each entry is just its
    // index - much shorter, especially on a phone.
    const oneGroup = cols.length > 1 && cols.every(function(c){ return chIndex(log.headers[c]) !== null && chGroupKey(log.headers[c]) === chGroupKey(log.headers[cols[0]]); });
    const groupHead = oneGroup
      ? '<span class="lg-group">' + escapeHtml(chFriendly(log.headers[cols[0]]) || chGroupRaw(log.headers[cols[0]]))
        + (chConv(log.headers[cols[0]], log).unit ? ' <span class="lg-unit">' + escapeHtml(chConv(log.headers[cols[0]], log).unit) + '</span>' : '')
        + (chFriendly(log.headers[cols[0]]) ? ' <span class="lg-raw">' + escapeHtml(chGroupRaw(log.headers[cols[0]])) + '</span>' : '') + '</span>'
      : '';
    const legend = groupHead + cols.map(function(c, i){
      const h = log.headers[c], color = LOG_COLORS[i % LOG_COLORS.length];
      const st = seriesStats(log, c, r), cv = chConv(h, log), unit = oneGroup ? '' : cv.unit + (cv.gauge ? ' gauge' : '');
      const tip = h + (st ? ' | min ' + fmtV(log, c, st.min) + ' avg ' + fmtV(log, c, st.avg) + ' max ' + fmtV(log, c, st.max) : '');
      // Until the cursor is on the chart, each series shows its min-max over
      // the visible window (so the numbers are there without hovering).
      const idle = st ? fmtV(log, c, st.min) + (fmtV(log, c, st.min) !== fmtV(log, c, st.max) ? '\u2013' + fmtV(log, c, st.max) : '') : '';
      return '<span class="lg-item' + (oneGroup ? ' lg-compact' : '') + '" title="' + escapeHtml(tip) + '"><i style="background:' + color + '"></i>'
        + '<span class="lg-name">' + escapeHtml(oneGroup ? '[' + chIndex(h) + ']' : chName(h)) + '</span>'
        + (!oneGroup && chFriendly(h) ? '<span class="lg-raw">' + escapeHtml(chBase(h)) + '</span>' : '')
        + '<span class="lg-val' + (idle ? ' lg-idle' : '') + '" id="lv-' + k + '-' + i + '"' + (idle ? ' data-idle="' + escapeHtml(idle) + '"' : '') + '>' + escapeHtml(idle) + '</span>'
        + (B && compareCol(c) !== -1 ? '<span class="lg-valb" id="lvb-' + k + '-' + i + '"></span>' : '')
        + (unit ? '<span class="lg-unit">' + escapeHtml(unit) + '</span>' : '')
        + (cols.length > 1 ? '<a class="lg-x" onclick="logRemoveSeries(' + k + ',' + c + ')" title="Remove from chart">&times;</a>' : '')
        + '</span>';
    }).join('');
    const addOpts = logChannelEntries(log).filter(function(e){ return e.cols.some(function(c){ return cols.indexOf(c) === -1; }); })
      .map(function(e){ return '<option value="' + e.key + '">' + escapeHtml(e.label) + '</option>'; }).join('');

    html += '<div class="lc">'
      + '<div class="lc-head"><div class="lc-legend">' + legend + '</div>'
      + '<div class="lc-tools"><select class="lc-add" onchange="logOverlay(' + k + ', this.value)"><option value="">+ Overlay</option>' + addOpts + '</select>'
      + '<a class="lg-x" onclick="logRemoveChart(' + k + ')" title="Remove chart">&times;</a></div></div>'
      + '<div class="lc-body" ondblclick="logResetZoom()"><div class="lc-y">' + yt.ticks.map(function(v){ return '<span style="top:' + (yy(v) / H * 100).toFixed(2) + '%">' + fmtTick(v, yt.step) + '</span>'; }).join('') + '</div>'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="lv-svg" data-k="' + k + '" onpointerdown="logDown(event,this)" onpointermove="logMove(event,this)" onpointerup="logUp(event,this)" onpointercancel="logUp(event,this)" onpointerleave="logLeave(event)">'
      + grid + marks + paths
      + '<rect class="lv-sel" x="0" y="0" width="0" height="' + H + '"/>'
      + '<line class="log-cursor" x1="-10" x2="-10" y1="0" y2="' + H + '"/>'
      + '</svg></div></div>';
  });
  if(V.charts.length){
    html += '<div class="lc-x"><div class="lc-y-sp"></div><div class="lc-x-track">'
      + xt.ticks.filter(function(t){ return t >= r.a && t <= r.b; }).map(function(t){ return '<span style="left:' + xPct(t).toFixed(2) + '%">' + fmtTick(t, xt.step) + '</span>'; }).join('')
      + '</div></div>'
      + (A.pulls.length ? '<div class="lc-x"><div class="lc-y-sp"></div><div class="lc-pulls">' + A.pulls.map(function(p, n){
          const mid = (xPct(p.t0) + xPct(p.t1)) / 2;
          return (mid < 0 || mid > 100) ? '' : '<span class="lc-pm" style="left:' + mid.toFixed(2) + '%" onclick="logZoomPull(' + n + ')" title="Zoom to pull ' + (n + 1) + '">P' + (n + 1) + '</span>';
        }).join('') + '</div></div>' : '')
      + '<div class="lc-x-title">' + escapeHtml(log.timeIdx !== -1 ? 'Time (s)' : 'Sample') + (A.pulls.length ? ' <span class="file-meta">&middot; shaded = full-throttle pulls</span>' : '') + '</div>';
  }
  html += '</div>';

  // Format, log info and channel roles
  html += '<div style="margin-top:14px">' + renderFormatSection(log) + '</div>';

  // Channel picker
  html += '<details class="ov-sec" data-sec="channels"' + logSecOpen('channels') + '><summary>Add channels (' + V.charts.length + ' chart' + (V.charts.length === 1 ? '' : 's') + ')</summary><div class="ov-body">'
    + '<input class="form-input" placeholder="Filter channels..." value="' + escapeHtml(V.filter) + '" oninput="logFilter(this.value)" style="margin-bottom:8px" id="logFilterInput">'
    + '<div class="log-channels" id="logChannels">' + renderLogChannelList(V.filter.toLowerCase()) + '</div></div></details>';

  // Rules
  const numericCols = log.headers.map(function(h, i){ return i; }).filter(function(i){ return log.numeric[i] && i !== log.timeIdx; });
  html += '<details class="ov-sec" data-sec="rules"' + logSecOpen('rules') + '><summary>Flag rules (' + (S.logRules || []).length + ', shared by all tuners)</summary><div class="ov-body">';
  (S.logRules || []).forEach(function(rl){
    const res = results.find(function(x){ return x.rule.id === rl.id; });
    const cover = !res || !res.cols.length ? ' &middot; not in this log' : (res.cols.length > 1 ? ' &middot; checks ' + res.cols.length + ' channels' : '');
    html += '<div class="log-rule"><span><strong>' + escapeHtml(rl.label) + '</strong> <span class="file-meta">' + escapeHtml(rl.column_name) + ' ' + rl.operator + ' ' + rl.threshold + cover + '</span></span>'
      + '<a class="log-x" onclick="deleteLogRule(\'' + rl.id + '\')" title="Delete rule">&times;</a></div>';
  });
  html += '<div class="log-rule-form">'
    + '<select class="form-input" id="lrCol">' + numericCols.map(function(i){ return '<option value="' + escapeHtml(log.headers[i]) + '">' + escapeHtml(chName(log.headers[i]) + (chFriendly(log.headers[i]) ? ' - ' + chBase(log.headers[i]) : '')) + '</option>'; }).join('') + '</select>'
    + '<select class="form-input" id="lrOp" style="width:70px"><option value="&gt;">&gt;</option><option value="&lt;">&lt;</option></select>'
    + '<input class="form-input" id="lrTh" type="number" step="any" placeholder="Threshold" style="width:110px">'
    + '<input class="form-input" id="lrLabel" placeholder="Label, e.g. Timing pulled" style="flex:1;min-width:140px">'
    + '<label class="check-row" style="font-size:var(--t-sm)"><input type="checkbox" id="lrAllCyl" checked> All cylinders</label>'
    + '<button class="btn btn-sm btn-primary" onclick="addLogRule()">Add rule</button></div>'
    + '<div class="file-meta" style="margin-top:6px">Thresholds use the log\'s native units (e.g. hPa, deg CA). A rule matches any log with that channel.</div>';
  html += '</div></details>';

  html += '</div>';
  openModal(html);
  logRestoreUi();
}

function renderLogChannelList(filt){
  const V = S.logView, log = V.log;
  const html = logChannelEntries(log).map(function(e){
    const hay = (e.label + ' ' + e.raw).toLowerCase();
    if(filt && hay.indexOf(filt) === -1) return '';
    const on = V.charts.some(function(ch){ return e.cols.every(function(c){ return ch.indexOf(c) !== -1; }); });
    return '<label class="log-ch' + (on ? ' on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="logToggleEntry(\'' + e.key + '\')"> '
      + escapeHtml(e.label) + (e.label !== e.raw ? ' <span class="lg-raw">' + escapeHtml(e.raw) + '</span>' : '') + '</label>';
  }).join('');
  return html || '<span class="file-meta">No matching channels.</span>';
}

/* ---------- state changes ---------- */
const LOG_MAX_CHART_COUNT = 16;
function logSaveSelection(){
  try{ localStorage.setItem(logSignature(S.logView.log.headers), JSON.stringify({ v:2, charts:S.logView.charts, units:S.logView.units })); }catch(e){ /* storage unavailable */ }
}
function logEntryCols(key){
  const e = logChannelEntries(S.logView.log).find(function(x){ return x.key === key; });
  return e ? e.cols : [];
}
function logToggleEntry(key){
  const V = S.logView, cols = logEntryCols(key);
  const idx = V.charts.findIndex(function(ch){ return cols.every(function(c){ return ch.indexOf(c) !== -1; }); });
  if(idx !== -1){
    V.charts[idx] = V.charts[idx].filter(function(c){ return cols.indexOf(c) === -1; });
    if(!V.charts[idx].length) V.charts.splice(idx, 1);
  } else {
    if(V.charts.length >= LOG_MAX_CHART_COUNT){ toast('All ' + LOG_MAX_CHART_COUNT + ' chart slots are in use - remove a chart first', true); renderLogViewer(); return; }
    V.charts.push(cols.slice(0, LOG_MAX_SERIES));
  }
  logSaveSelection(); renderLogViewer();
}
window.logToggleEntry = logToggleEntry;
// Overlay a channel (or a whole per-cylinder group) onto chart k. A group is
// added whole or not at all, and when the chart is full the selection becomes
// a new chart right below it instead of being dropped.
function logOverlay(k, key){
  if(!key) return;
  const V = S.logView, cols = logEntryCols(key), ch = V.charts[k];
  if(!ch) return;
  const add = cols.filter(function(c){ return ch.indexOf(c) === -1; });
  if(!add.length) return;
  if(ch.length + add.length <= LOG_MAX_SERIES){
    add.forEach(function(c){ ch.push(c); });
  } else if(V.charts.length < LOG_MAX_CHART_COUNT){
    V.charts.splice(k + 1, 0, add.slice(0, LOG_MAX_SERIES));
    toast('That chart is full (' + LOG_MAX_SERIES + ' channels) - added as a new chart just below it');
  } else {
    toast('That chart is full and all ' + LOG_MAX_CHART_COUNT + ' chart slots are in use - remove something first', true);
    renderLogViewer(); return;
  }
  logSaveSelection(); renderLogViewer();
}
window.logOverlay = logOverlay;
function logRemoveSeries(k, c){
  const V = S.logView;
  V.charts[k] = V.charts[k].filter(function(x){ return x !== c; });
  if(!V.charts[k].length) V.charts.splice(k, 1);
  logSaveSelection(); renderLogViewer();
}
window.logRemoveSeries = logRemoveSeries;
function logRemoveChart(k){ S.logView.charts.splice(k, 1); logSaveSelection(); renderLogViewer(); }
window.logRemoveChart = logRemoveChart;
function logApplyPreset(name){ S.logView.charts = buildPreset(S.logView.log, name); logSaveSelection(); renderLogViewer(); }
window.logApplyPreset = logApplyPreset;
function logSetUnits(u){ S.logView.units = u; logSaveSelection(); renderLogViewer(); }
function logSetGauge(on){
  const V = S.logView; if(!V) return;
  V.gauge = !!on;
  try{ localStorage.setItem('tgk-logview-gauge', on ? '1' : '0'); }catch(e){ /* storage unavailable */ }
  renderLogViewer();
}
window.logSetGauge = logSetGauge;
// Manual ambient pressure (hPa) for the open log; empty goes back to automatic.
function logSetAmbient(val){
  const V = S.logView; if(!V) return;
  const n = parseFloat(val);
  if(String(val).trim() === '' || isNaN(n)) V.log.ambOverride = 0;
  else if(n < 600 || n > 1100){ toast('Ambient pressure should be between 600 and 1100 hPa', true); renderLogViewer(); return; }
  else V.log.ambOverride = n;
  renderLogViewer();
}
window.logSetAmbient = logSetAmbient;
function logSetHeight(h){ const V = S.logView; if(!V) return; V.chartH = h; try{ localStorage.setItem('tgk-logview-h', String(h)); }catch(e){ /* storage unavailable */ } renderLogViewer(); }
window.logSetHeight = logSetHeight;
// Compare alignment. "start" lines both logs up at t=0; "pull" shifts the
// compared log so its first full-throttle pull begins when this log's does -
// the like-for-like view for before/after tune comparisons.
function logApplyAlign(){
  const V = S.logView; if(!V || !V.compare) return;
  const B = V.compare.log; B.xShift = 0;
  if(V.align === 'pull'){
    const pa = findPulls(V.log)[0], pb = findPulls(B)[0];
    if(pa && pb) B.xShift = xValue(B, pb[0]) - xValue(V.log, pa[0]);
  }
}
function logSetAlign(mode){ const V = S.logView; if(!V) return; V.align = mode; logApplyAlign(); renderLogViewer(); }
window.logSetAlign = logSetAlign;
function logPullsToggleAll(){
  const ds = Array.prototype.slice.call(document.querySelectorAll('#modalOverlay details.an-pd'));
  const allOpen = ds.length > 0 && ds.every(function(d){ return d.open; });
  ds.forEach(function(d){ d.open = !allOpen; });
}
window.logPullsToggleAll = logPullsToggleAll;
window.logSetUnits = logSetUnits;
// Flag chip click: make sure the tripped channel (its whole cylinder group)
// is charted, at the top.
function logFocusColumn(c){
  const V = S.logView; if(!V || c < 0) return;
  const h = V.log.headers[c];
  const key = chIndex(h) !== null ? 'g:' + chGroupKey(h) : 'c:' + c;
  const cols = logEntryCols(key);
  const idx = V.charts.findIndex(function(ch){ return ch.indexOf(c) !== -1; });
  if(idx > 0){ V.charts.unshift(V.charts.splice(idx, 1)[0]); }
  else if(idx === -1){
    V.charts.unshift(cols.slice(0, LOG_MAX_SERIES));
    if(V.charts.length > LOG_MAX_CHART_COUNT){ V.charts.pop(); toast('Chart limit reached - the bottom chart was replaced by this one', true); }
  }
  logSaveSelection(); renderLogViewer();
}
window.logFocusColumn = logFocusColumn;
function logFilter(v){
  S.logView.filter = v;
  const el = document.getElementById('logChannels');
  if(el) el.innerHTML = renderLogChannelList(v.toLowerCase());
}
window.logFilter = logFilter;

/* ---------- zoom ---------- */
// Longest stretch at >= 95% pedal (or throttle, if no pedal channel).
function logWotRange(log){
  let c = findCols(log, /^AccP_r_VW$/i)[0];
  if(c === undefined) c = findCols(log, /^wdk_w/i)[0];
  if(c === undefined) return null;
  const d = log.cols[c];
  let best = null, start = -1;
  for(let i = 0; i <= d.length; i++){
    const on = i < d.length && d[i] >= 95;
    if(on && start === -1) start = i;
    if(!on && start !== -1){
      if(!best || (i - start) > (best[1] - best[0])) best = [start, i - 1];
      start = -1;
    }
  }
  if(!best || best[1] - best[0] < 2) return null;
  const a = xValue(log, best[0]), b = xValue(log, best[1]);
  const padT = (b - a) * 0.15;
  return [Math.max(0, a - padT), Math.min(logSpan(log), b + padT)];
}
function logZoomWot(){ const w = logWotRange(S.logView.log); if(w){ S.logView.range = w; renderLogViewer(); } }
window.logZoomWot = logZoomWot;
function logResetZoom(){ const V = S.logView; if(V && V.range){ V.range = null; V.lastClick = null; renderLogViewer(); } }
window.logResetZoom = logResetZoom;

function logFrac(ev, svg){
  const rect = svg.getBoundingClientRect();
  return Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
}
// Double-click / double-tap, detected from the pointer events themselves rather
// than the browser's dblclick: that event is skipped by some browsers when
// pointer capture is on, and phones only fire it for fairly quick taps.
// Two clicks within 0.5 s and 24 px of each other count.
function logRegisterClick(ev){
  const V = S.logView; if(!V) return false;
  const now = Date.now(), L = V.lastClick;
  if(L && now - L.t < 500 && Math.abs(ev.clientX - L.x) < 24 && Math.abs(ev.clientY - L.y) < 24){ V.lastClick = null; return true; }
  V.lastClick = { t: now, x: ev.clientX, y: ev.clientY };
  return false;
}
function logIsTouch(ev){ return ev.pointerType === 'touch' || ev.pointerType === 'pen'; }
function logTouchCount(){ return Object.keys(S.logView.ptrs || {}).length; }

// Mouse: hover reads values, drag selects a range to zoom.
// Touch: one finger reads values (tap or slide - the crosshair stays after
// lifting), two fingers pinch-zoom around the point between them, and a
// double-tap resets. Vertical swipes still scroll the page (touch-action:
// pan-y on the chart), so the charts never trap scrolling.
function logDown(ev, svg){
  const V = S.logView; if(!V) return;
  if(logIsTouch(ev)){
    V.ptrs = V.ptrs || {};
    V.ptrs[ev.pointerId] = { x: ev.clientX, x0: ev.clientX, y0: ev.clientY };
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){ /* not supported */ }
    const n = logTouchCount();
    if(n === 1){
      V.tapPinched = false;
      logShowCursor(logFrac(ev, svg));
    } else if(n === 2){
      V.tapPinched = true;
      const xs = Object.keys(V.ptrs).map(function(k){ return V.ptrs[k].x; });
      const rect = svg.getBoundingClientRect();
      const r = logRange();
      V.pinch = {
        d0: Math.max(20, Math.abs(xs[0] - xs[1])),
        cf: Math.min(1, Math.max(0, ((xs[0] + xs[1]) / 2 - rect.left) / rect.width)),
        a0: r.a, b0: r.b, full: r.full, next: null
      };
      V.lastClick = null;
      logLeave();
    }
    return;
  }
  if(ev.button !== undefined && ev.button !== 0) return;
  V.drag = { f0: logFrac(ev, svg), cx0: ev.clientX };
  try{ svg.setPointerCapture(ev.pointerId); }catch(e){ /* not supported */ }
}
window.logDown = logDown;

function logMove(ev, svg){
  const V = S.logView; if(!V) return;
  if(logIsTouch(ev)){
    if(!V.ptrs || !V.ptrs[ev.pointerId]) return;
    V.ptrs[ev.pointerId].x = ev.clientX;
    if(V.pinch && logTouchCount() >= 2){
      const P = V.pinch;
      const xs = Object.keys(V.ptrs).map(function(k){ return V.ptrs[k].x; });
      const d = Math.max(20, Math.abs(xs[0] - xs[1]));
      const span0 = P.b0 - P.a0;
      const minSpan = Math.max(P.full / 500, 0.05);
      let span = Math.min(P.full, Math.max(minSpan, span0 * (P.d0 / d)));
      const tc = P.a0 + P.cf * span0;          // time under the fingers stays put
      let a = tc - P.cf * span;
      a = Math.max(0, Math.min(P.full - span, a));
      P.next = [a, a + span];
      // Live preview: stretch the already-drawn charts via viewBox; the
      // real redraw (sharp lines, new axis labels) happens on release.
      const vx = ((a - P.a0) / span0) * 1000, vw = (span / span0) * 1000;
      document.querySelectorAll('#logCharts .lv-svg').forEach(function(el){
        el.setAttribute('viewBox', vx.toFixed(2) + ' 0 ' + vw.toFixed(2) + ' ' + LOG_CH);
      });
      return;
    }
    if(logTouchCount() === 1 && !V.pinch) logShowCursor(logFrac(ev, svg));
    return;
  }
  const f = logFrac(ev, svg);
  logShowCursor(f);
  if(V.drag){
    const x0 = Math.min(V.drag.f0, f) * 1000, w = Math.abs(f - V.drag.f0) * 1000;
    document.querySelectorAll('#logCharts .lv-sel').forEach(function(rc){ rc.setAttribute('x', x0.toFixed(1)); rc.setAttribute('width', w.toFixed(1)); });
  }
}
window.logMove = logMove;

function logUp(ev, svg){
  const V = S.logView; if(!V) return;
  if(logIsTouch(ev)){
    const pt = V.ptrs && V.ptrs[ev.pointerId];
    if(pt && ev.type === 'pointerup' && !V.pinch && !V.tapPinched && Math.abs(ev.clientX - pt.x0) < 12 && Math.abs(ev.clientY - pt.y0) < 12){
      if(logRegisterClick(ev)){ if(V.ptrs) delete V.ptrs[ev.pointerId]; logResetZoom(); return; }
    }
    if(V.ptrs) delete V.ptrs[ev.pointerId];
    if(V.pinch && logTouchCount() < 2){
      const next = V.pinch.next, full = V.pinch.full;
      V.pinch = null;
      V.ptrs = {};
      if(next){
        V.range = (next[1] - next[0]) >= full * 0.995 ? null : next;
        renderLogViewer();
      }
    }
    return;
  }
  if(!V.drag) return;
  const f = logFrac(ev, svg), f0 = V.drag.f0;
  V.dragX0 = V.drag.cx0;
  V.drag = null;
  document.querySelectorAll('#logCharts .lv-sel').forEach(function(rc){ rc.setAttribute('width', 0); });
  if(Math.abs(ev.clientX - V.dragX0) < 5){ // a click, not a drag
    if(logRegisterClick(ev)) logResetZoom();
    return;
  }
  V.lastClick = null;
  const r = logRange();
  const a = r.a + Math.min(f, f0) * (r.b - r.a), b = r.a + Math.max(f, f0) * (r.b - r.a);
  if(b - a <= 0) return;
  V.range = [a, b];
  renderLogViewer();
}
window.logUp = logUp;

// Mouse leaving clears the crosshair; on touch it stays so the values can
// be read after lifting the finger.
function logLeave(ev){
  if(ev && logIsTouch(ev)) return;
  document.querySelectorAll('#logCharts .log-cursor').forEach(function(l){ l.setAttribute('x1', -10); l.setAttribute('x2', -10); });
  // Back to each series' min-max for the visible window.
  document.querySelectorAll('#logCharts .lg-val[data-idle]').forEach(function(el){ el.textContent = el.getAttribute('data-idle'); el.classList.add('lg-idle'); });
  document.querySelectorAll('#logCharts .lg-valb').forEach(function(el){ el.textContent = ''; });
  const ro = document.getElementById('logReadout');
  if(ro) ro.innerHTML = '<span class="file-meta">' + logHint() + '</span>';
}
window.logLeave = logLeave;

// Crosshair on every chart plus each series' value at that moment.
function logIsCoarse(){ try{ return window.matchMedia && window.matchMedia('(pointer:coarse)').matches; }catch(e){ return false; } }
function logHint(short){
  if(logIsCoarse()) return short ? 'pinch to zoom &middot; double-tap to reset' : 'Touch a chart to read values &middot; pinch with two fingers to zoom &middot; double-tap to reset';
  return short ? 'drag to zoom &middot; double-click to reset' : 'Hover for values &middot; drag to zoom &middot; double-click to reset';
}
function logShowCursor(f){
  const V = S.logView, log = V.log, B = V.compare ? V.compare.log : null;
  const r = logRange(), t = r.a + f * (r.b - r.a);
  const x = (f * 999).toFixed(1);
  document.querySelectorAll('#logCharts .log-cursor').forEach(function(l){ l.setAttribute('x1', x); l.setAttribute('x2', x); });
  const ia = sampleAt(log, t), ib = B ? sampleAt(B, t) : -1;
  V.charts.forEach(function(cols, k){
    cols.forEach(function(c, i){
      const el = document.getElementById('lv-' + k + '-' + i);
      if(el){ el.textContent = fmtV(log, c, displayData(log, c)[ia]); el.classList.remove('lg-idle'); }
      const cb = B ? compareCol(c) : -1;
      const eb = document.getElementById('lvb-' + k + '-' + i);
      if(eb && cb !== -1) eb.textContent = '/ ' + fmtV(B, cb, displayData(B, cb)[ib]);
    });
  });
  const ro = document.getElementById('logReadout');
  if(ro) ro.innerHTML = '<strong>' + fmtNum(t) + (log.timeIdx !== -1 ? ' s' : '') + '</strong> <span class="file-meta">&middot; ' + logHint(true) + '</span>';

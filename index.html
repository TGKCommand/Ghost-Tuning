function chFriendly(h){
  const m = chMeta(h); if(!m) return null;
  if(m.role === 'knock_cyl' && m.sign === 1) return 'Timing correction';
  return LOG_ROLES[m.role] ? LOG_ROLES[m.role].label : null;
}
function chName(h){
  const f = chFriendly(h), idx = chIndex(h);
  return (f || chBase(h).replace(/\[\d+\]/, '')) + (idx !== null ? ' [' + idx + ']' : '');
}

// Unit handling. "native" keeps the log's units; "us" converts pressure to
// psi, temperature to F and speed to mph. Flag rules always evaluate in
// the log's native units.
function chConv(h){
  let u = chUnitRaw(h).toLowerCase();
  if(!u){ const mt = chMeta(h); if(mt && mt.unit) u = mt.unit.toLowerCase(); }
  const us = S.logView && S.logView.units === 'us';
  const nice = { 'grad kw':'deg CA', 'grad c':'deg C', 'deg c':'deg C', 'deg f':'deg F', '1/min':'rpm', 'psi':'psi', 'mph':'mph', 'deg':'deg', '%':'%', '-':'', '':'' };
  if(us){
    if(u === 'hpa') return { f:function(v){ return v * 0.0145038; }, unit:'psi' };
    if(u === 'kpa') return { f:function(v){ return v * 0.145038; }, unit:'psi' };
    if(u === 'mpa') return { f:function(v){ return v * 145.038; }, unit:'psi' };
    if(u === 'bar') return { f:function(v){ return v * 14.5038; }, unit:'psi' };
    if(u === 'grad c' || u === 'deg c') return { f:function(v){ return v * 9 / 5 + 32; }, unit:'deg F' };
    if(u === 'km/h') return { f:function(v){ return v * 0.621371; }, unit:'mph' };
  }
  return { f:null, unit: Object.prototype.hasOwnProperty.call(nice, u) ? nice[u] : chUnitRaw(h) };
}
function displayData(log, c){
  const conv = chConv(log.headers[c]);
  const base = colData(log, c);
  if(!conv.f) return base;
  const key = (S.logView && S.logView.hideFuelCut !== false ? 'f' : 'r') + c;
  log._disp = log._disp || {};
  if(!log._disp[key]) log._disp[key] = base.map(function(v){ return isNaN(v) ? NaN : conv.f(v); });
  return log._disp[key];
}

// Channels available to chart: per-cylinder arrays ([0]..[n]) collapse
// into one group entry, so "Knock retard [0-5]" is one click.
function logChannelEntries(log){
  const groups = {}, order = [];
  log.headers.forEach(function(h, c){
    if(!log.numeric[c] || c === log.timeIdx) return;
    const idx = chIndex(h);
    const key = idx !== null ? 'g:' + chGroupKey(h) : 'c:' + c;
    if(!groups[key]){ groups[key] = { key:key, cols:[], label:'' }; order.push(key); }
    groups[key].cols.push(c);
  });
  return order.map(function(k){
    const g = groups[k], h = log.headers[g.cols[0]];
    g.label = g.cols.length > 1 ? (chFriendly(h) || chGroupRaw(h)) + ' [' + chIndex(h) + '-' + chIndex(log.headers[g.cols[g.cols.length - 1]]) + ']' : chName(h);
    g.raw = g.cols.length > 1 ? chGroupRaw(h) : chBase(h);
    return g;
  });
}
function findCols(log, re){
  const role = RE_ROLE[re.source];
  if(role && log.roles) return roleCols(log, role);
  const out = [];
  log.headers.forEach(function(h, c){ if(log.numeric[c] && c !== log.timeIdx && re.test(chGroupKey(h))) out.push(c); });
  return out;
}

// One-click layouts built from verified channels; charts with no matching
// columns in this log are skipped.
// Layouts by role, so they work for any recognized format. Charts whose
// roles aren't in a log are skipped.
const LOG_PRESETS = {
  Overview: [['rpm'], ['pedal', 'throttle'], ['load'], ['speed']],
  Boost:    [['boost', 'boost_target', 'boost2'], ['rpm'], ['load'], ['throttle'], ['boost_ecu', 'boost_target_ecu'], ['wgdc']],
  Ignition: [['knock_cyl'], ['ign_cyl', 'timing'], ['rpm']],
  Fueling:  [['hpfp', 'hpfp_target'], ['lpfp'], ['lambda', 'lambda_target', 'afr', 'afr2'], ['inj_time'], ['fuel_trim']]
};
function buildPreset(log, name){
  return (LOG_PRESETS[name] || []).map(function(chart){
    let cols = [];
    chart.forEach(function(r){ cols = cols.concat(typeof r === 'string' ? roleCols(log, r) : findCols(log, r)); });
    return cols.slice(0, 8);
  }).filter(function(cols){ return cols.length; });
}

/* ---------- axes ---------- */
function niceNum(x, round){
  const e = Math.floor(Math.log10(x)), f = x / Math.pow(10, e);
  let nf;
  if(round) nf = f < 1.5 ? 1 : (f < 3 ? 2 : (f < 7 ? 5 : 10));
  else nf = f <= 1 ? 1 : (f <= 2 ? 2 : (f <= 5 ? 5 : 10));
  return nf * Math.pow(10, e);
}
function niceTicks(min, max, count){
  if(!(max > min)){ const d = Math.abs(min) || 1; min -= d * 0.1; max += d * 0.1; }
  // Single rounding of the raw step - rounding the range first as well
  // overshoots and leaves a band of empty chart above/below the data.
  const step = niceNum((max - min) / Math.max(1, count - 1), true);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for(let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { ticks: ticks, step: step, lo: lo, hi: hi };
}
function fmtTick(v, step){
  const dec = step >= 1 ? 0 : Math.min(3, Math.ceil(-Math.log10(step)));
  return v.toFixed(dec);
}

function logRange(){
  const V = S.logView, B = V.compare ? V.compare.log : null;
  const full = Math.max(logSpan(V.log), B ? logSpan(B) : 0) || 1;
  return V.range ? { a: V.range[0], b: V.range[1], full: full } : { a: 0, b: full, full: full };
}

// Min/max-per-pixel path over the visible window. Missing samples
// (fuel cut, gaps) break the line instead of bridging it.
function seriesPath(log, c, W, H, pad, r, yMin, yMax){
  const data = displayData(log, c), n = data.length;
  const y = function(v){ return pad + (H - 2 * pad) * (1 - (v - yMin) / (yMax - yMin)); };
  const lo = [], hi = [], brk = [];
  let saw = false, pending = false;
  for(let i = 0; i < n; i++){
    const t = xValue(log, i);
    if(t < r.a || t > r.b){ continue; }
    const v = data[i];
    if(isNaN(v)){ if(saw) pending = true; continue; }
    const b = Math.min(W - 1, Math.max(0, Math.round(((t - r.a) / (r.b - r.a)) * (W - 1))));
    if(pending){ brk[b] = true; pending = false; }
    saw = true;
    if(lo[b] === undefined || v < lo[b]) lo[b] = v;
    if(hi[b] === undefined || v > hi[b]) hi[b] = v;
  }
  let d = '', first = true;
  for(let b = 0; b < W; b++){
    if(lo[b] === undefined) continue;
    d += ((first || brk[b]) ? 'M' : 'L') + b + ' ' + y(lo[b]).toFixed(1);
    if(hi[b] !== lo[b]) d += 'L' + b + ' ' + y(hi[b]).toFixed(1);
    first = false;
  }
  return d;
}
function seriesExtent(log, c, r){
  const data = displayData(log, c);
  let min = Infinity, max = -Infinity;
  for(let i = 0; i < data.length; i++){
    const t = xValue(log, i);
    if(t < r.a || t > r.b) continue;
    const v = data[i];
    if(!isNaN(v)){ if(v < min) min = v; if(v > max) max = v; }
  }
  return min === Infinity ? null : [min, max];
}
function seriesStats(log, c, r){
  const data = displayData(log, c);
  let min = Infinity, max = -Infinity, sum = 0, n = 0;
  for(let i = 0; i < data.length; i++){
    const t = xValue(log, i);
    if(t < r.a || t > r.b) continue;
    const v = data[i];
    if(!isNaN(v)){ if(v < min) min = v; if(v > max) max = v; sum += v; n++; }
  }
  return n ? { min:min, max:max, avg:sum / n } : null;
}

/* ---------- render ---------- */
const LOG_CH = 170, LOG_PAD = 6;

function renderLogViewer(){
  const V = S.logView; if(!V) return;
  const log = V.log, B = V.compare ? V.compare.log : null;
  const results = evaluateRules(log);
  const resultsB = B ? evaluateRules(B) : [];
  const r = logRange();
  const W = 1000, H = LOG_CH;
  const fc = fuelCutCount(log);

  let html = '<div class="modal log-modal">';
  // Header
  html += '<div class="lv-top"><div><div class="modal-title" style="margin-bottom:2px">' + escapeHtml(V.fileName || 'Datalog') + '</div>'
    + '<div class="file-meta">' + escapeHtml(log.profile ? log.profile.name : 'Log') + ' &middot; ' + log.rows.toLocaleString() + ' samples &middot; ' + log.headers.length + ' channels'
    + (log.timeIdx !== -1 ? ' &middot; ' + fmtNum(logSpan(log)) + ' s' : ' &middot; no time column (x-axis is sample number)') + '</div></div>'
    + '<div style="display:flex;gap:6px">' + (V.fileId ? '<button class="btn btn-sm" onclick="downloadFile(\'' + V.fileId + '\',\'' + V.path + '\')">Download</button>' : '') + '<button class="btn btn-sm" onclick="closeModal();S.logView=null">Close</button></div></div>';

  // Toolbar
  const others = (S.files[V.appId] || []).filter(function(f){ return f.id !== V.fileId && isLogFile(f); });
  html += '<div class="lv-bar">'
    + '<div class="lv-presets"><span class="lv-lbl">Layout</span>' + Object.keys(LOG_PRESETS).map(function(p){
        return buildPreset(log, p).length ? '<button class="lv-chip" onclick="logApplyPreset(\'' + p + '\')">' + p + '</button>' : '';
      }).join('') + '</div>'
    + '<div class="lv-seg" title="Units"><button class="' + (V.units !== 'us' ? 'on' : '') + '" onclick="logSetUnits(\'native\')">Native</button><button class="' + (V.units === 'us' ? 'on' : '') + '" onclick="logSetUnits(\'us\')">psi / F / mph</button></div>'
    + '</div>';
  html += '<div class="lv-bar">'
    + '<label class="lv-tool"><span class="lv-lbl">Compare</span><select class="form-input" onchange="setLogCompare(this.value)"><option value="">None</option>'
    + others.map(function(f){ return '<option value="' + f.id + '"' + (V.compare && V.compare.fileId === f.id ? ' selected' : '') + '>' + escapeHtml(f.file_name) + ' (' + fmtDate(f.created_at) + ')</option>'; }).join('')
    + '</select></label>'
    + (fc ? '<label class="lv-tool"><input type="checkbox" ' + (V.hideFuelCut ? 'checked' : '') + ' onchange="toggleFuelCut(this.checked)"> Hide fuel cut on lambda/AFR <span class="file-meta">(' + fc + ')</span></label>' : '')
    + '<span class="lv-zoom">' + (V.range ? 'Zoom ' + fmtNum(r.a) + '-' + fmtNum(r.b) + ' s <a onclick="logResetZoom()">Reset</a>' : (logIsCoarse() ? 'Pinch a chart to zoom' : 'Drag across a chart to zoom')) + '</span>'
    + (logWotRange(log) ? '<button class="lv-chip" onclick="logZoomWot()">Zoom to WOT</button>' : '')
    + '</div>';
  if(B){
    html += '<div class="lv-legend-note"><span class="lg-solid"></span>' + escapeHtml(V.fileName) + '<span class="lg-dash"></span>' + escapeHtml(V.compare.fileName) + ' <span class="file-meta">aligned from the start of each log</span></div>';
  }

  // Flags
  const chips = function(res, prefix, muted){
    return res.filter(function(x){ return x.total; }).map(function(x){
      const where = x.cols.length > 1 ? ' on ' + x.trippedCols.length + ' of ' + x.cols.length : '';
      return '<span class="log-flag' + (muted ? ' muted' : '') + '"' + (muted ? '' : ' onclick="logFocusColumn(' + x.worstCol + ')"') + '>' + prefix + escapeHtml(x.rule.label) + ': ' + x.events + ' event' + (x.events === 1 ? '' : 's') + where + ', worst ' + fmtNum(x.worst) + '</span>';
    }).join('');
  };
  const firedA = results.filter(function(x){ return x.total; }).length;
  html += '<div class="log-flags">';
  if(!(S.logRules || []).length) html += '<span class="file-meta">No flag rules yet - add one at the bottom to auto-check every log.</span>';
  else if(!firedA) html += '<span class="pill pill-green">No flags</span>';
  html += chips(results, B ? 'This log: ' : '', false);
  if(B) html += chips(resultsB, 'Compared: ', true) || '<span class="pill pill-green">Compared log: no flags</span>';
  html += '</div>';

  // Automatic pull analysis (and the compared log's, for "vs" values)
  html += renderAnalysisPanel(log, analyzeLog(log), B, B ? analyzeLog(B) : null);

  // Time readout
  html += '<div class="lv-readout" id="logReadout"><span class="file-meta">' + logHint() + '</span></div>';

  // Charts
  const xt = niceTicks(r.a, r.b, 9);
  const xPct = function(t){ return ((t - r.a) / (r.b - r.a)) * 100; };
  html += '<div id="logCharts">';
  if(!V.charts.length) html += '<div class="empty-state">Pick a layout above or add channels below.</div>';
  V.charts.forEach(function(cols, k){
    let yMin = Infinity, yMax = -Infinity;
    cols.forEach(function(c){
      const e = seriesExtent(log, c, r); if(e){ yMin = Math.min(yMin, e[0]); yMax = Math.max(yMax, e[1]); }
      const cb = B ? compareCol(c) : -1;
      if(cb !== -1){ const eb = seriesExtent(B, cb, r); if(eb){ yMin = Math.min(yMin, eb[0]); yMax = Math.max(yMax, eb[1]); } }
    });
    if(yMin === Infinity){ yMin = 0; yMax = 1; }
    const yt = niceTicks(yMin, yMax, 5);
    yMin = yt.lo; yMax = yt.hi;
    const yy = function(v){ return LOG_PAD + (H - 2 * LOG_PAD) * (1 - (v - yMin) / (yMax - yMin)); };

    let grid = '';
    yt.ticks.forEach(function(v){ grid += '<line x1="0" x2="' + W + '" y1="' + yy(v).toFixed(1) + '" y2="' + yy(v).toFixed(1) + '" class="lv-grid"/>'; });
    xt.ticks.forEach(function(t){ if(t < r.a || t > r.b) return; const x = (xPct(t) * (W - 1) / 100).toFixed(1); grid += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + H + '" class="lv-grid"/>'; });

    let marks = '';
    results.forEach(function(res){
      cols.forEach(function(c){
        const hits = res.hitsByCol[c]; if(!hits) return;
        hits.forEach(function(i){
          const t = xValue(log, i); if(t < r.a || t > r.b) return;
          const x = (xPct(t) * (W - 1) / 100).toFixed(1);
          marks += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + H + '" class="log-hitline"/>';
        });
        const conv = chConv(log.headers[c]);
        const th = conv.f ? conv.f(Number(res.rule.threshold)) : Number(res.rule.threshold);
        if(th >= yMin && th <= yMax) marks += '<line x1="0" x2="' + W + '" y1="' + yy(th).toFixed(1) + '" y2="' + yy(th).toFixed(1) + '" class="log-threshold"/>';
      });
    });

    let paths = '';
    cols.forEach(function(c, i){
      const color = LOG_COLORS[i % LOG_COLORS.length];
      const cb = B ? compareCol(c) : -1;
      if(cb !== -1) paths += '<path d="' + seriesPath(B, cb, W, H, LOG_PAD, r, yMin, yMax) + '" class="lv-line lv-dash" style="stroke:' + color + '"/>';
      paths += '<path d="' + seriesPath(log, c, W, H, LOG_PAD, r, yMin, yMax) + '" class="lv-line" style="stroke:' + color + '"/>';
    });

    // Legend with live values. When every series is one per-cylinder group
    // (knock [0]..[5]), the name is shown once and each entry is just its
    // index - much shorter, especially on a phone.
    const oneGroup = cols.length > 1 && cols.every(function(c){ return chIndex(log.headers[c]) !== null && chGroupKey(log.headers[c]) === chGroupKey(log.headers[cols[0]]); });
    const groupHead = oneGroup
      ? '<span class="lg-group">' + escapeHtml(chFriendly(log.headers[cols[0]]) || chGroupRaw(log.headers[cols[0]]))
        + (chConv(log.headers[cols[0]]).unit ? ' <span class="lg-unit">' + escapeHtml(chConv(log.headers[cols[0]]).unit) + '</span>' : '')
        + (chFriendly(log.headers[cols[0]]) ? ' <span class="lg-raw">' + escapeHtml(chGroupRaw(log.headers[cols[0]])) + '</span>' : '') + '</span>'
      : '';
    const legend = groupHead + cols.map(function(c, i){
      const h = log.headers[c], color = LOG_COLORS[i % LOG_COLORS.length];
      const st = seriesStats(log, c, r), unit = oneGroup ? '' : chConv(h).unit;
      const tip = h + (st ? ' | min ' + fmtNum(st.min) + ' avg ' + fmtNum(st.avg) + ' max ' + fmtNum(st.max) : '');
      return '<span class="lg-item' + (oneGroup ? ' lg-compact' : '') + '" title="' + escapeHtml(tip) + '"><i style="background:' + color + '"></i>'
        + '<span class="lg-name">' + escapeHtml(oneGroup ? '[' + chIndex(h) + ']' : chName(h)) + '</span>'
        + (!oneGroup && chFriendly(h) ? '<span class="lg-raw">' + escapeHtml(chBase(h)) + '</span>' : '')
        + '<span class="lg-val" id="lv-' + k + '-' + i + '"></span>'
        + (B && compareCol(c) !== -1 ? '<span class="lg-valb" id="lvb-' + k + '-' + i + '"></span>' : '')
        + (unit ? '<span class="lg-unit">' + escapeHtml(unit) + '</span>' : '')
        + (cols.length > 1 ? '<a class="lg-x" onclick="logRemoveSeries(' + k + ',' + c + ')" title="Remove from chart">&times;</a>' : '')
        + '</span>';
    }).join('');
    const addOpts = logChannelEntries(log).filter(function(e){ return e.cols.some(function(c){ return cols.indexOf(c) === -1; }); })
      .map(function(e){ return '<option value="' + e.key + '">' + escapeHtml(e.label) + '</option>'; }).join('');

    html += '<div class="lc">'
      + '<div class="lc-head"><div class="lc-legend">' + legend + '</div>'
      + '<div class="lc-tools"><select class="lc-add" onchange="logOverlay(' + k + ', this.value)"><option value="">+ Overlay</option>' + addOpts + '</select>'
      + '<a class="lg-x" onclick="logRemoveChart(' + k + ')" title="Remove chart">&times;</a></div></div>'
      + '<div class="lc-body"><div class="lc-y">' + yt.ticks.map(function(v){ return '<span style="top:' + (yy(v) / H * 100).toFixed(2) + '%">' + fmtTick(v, yt.step) + '</span>'; }).join('') + '</div>'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="lv-svg" data-k="' + k + '" onpointerdown="logDown(event,this)" onpointermove="logMove(event,this)" onpointerup="logUp(event,this)" onpointercancel="logUp(event,this)" onpointerleave="logLeave(event)" ondblclick="logResetZoom()">'
      + grid + marks + paths
      + '<rect class="lv-sel" x="0" y="0" width="0" height="' + H + '"/>'
      + '<line class="log-cursor" x1="-10" x2="-10" y1="0" y2="' + H + '"/>'
      + '</svg></div></div>';
  });
  if(V.charts.length){
    html += '<div class="lc-x"><div class="lc-y-sp"></div><div class="lc-x-track">'
      + xt.ticks.filter(function(t){ return t >= r.a && t <= r.b; }).map(function(t){ return '<span style="left:' + xPct(t).toFixed(2) + '%">' + fmtTick(t, xt.step) + '</span>'; }).join('')
      + '</div></div><div class="lc-x-title">' + escapeHtml(log.timeIdx !== -1 ? 'Time (s)' : 'Sample') + '</div>';
  }
  html += '</div>';

  // Format, log info and channel roles
  html += '<div style="margin-top:14px">' + renderFormatSection(log) + '</div>';

  // Channel picker
  html += '<details class="ov-sec"><summary>Add channels (' + V.charts.length + ' chart' + (V.charts.length === 1 ? '' : 's') + ')</summary><div class="ov-body">'
    + '<input class="form-input" placeholder="Filter channels..." value="' + escapeHtml(V.filter) + '" oninput="logFilter(this.value)" style="margin-bottom:8px" id="logFilterInput">'
    + '<div class="log-channels" id="logChannels">' + renderLogChannelList(V.filter.toLowerCase()) + '</div></div></details>';

  // Rules
  const numericCols = log.headers.map(function(h, i){ return i; }).filter(function(i){ return log.numeric[i] && i !== log.timeIdx; });
  html += '<details class="ov-sec"><summary>Flag rules (' + (S.logRules || []).length + ', shared by all tuners)</summary><div class="ov-body">';
  (S.logRules || []).forEach(function(rl){
    const res = results.find(function(x){ return x.rule.id === rl.id; });
    const cover = !res || !res.cols.length ? ' &middot; not in this log' : (res.cols.length > 1 ? ' &middot; checks ' + res.cols.length + ' channels' : '');
    html += '<div class="log-rule"><span><strong>' + escapeHtml(rl.label) + '</strong> <span class="file-meta">' + escapeHtml(rl.column_name) + ' ' + rl.operator + ' ' + rl.threshold + cover + '</span></span>'
      + '<a class="log-x" onclick="deleteLogRule(\'' + rl.id + '\')" title="Delete rule">&times;</a></div>';
  });
  html += '<div class="log-rule-form">'
    + '<select class="form-input" id="lrCol">' + numericCols.map(function(i){ return '<option value="' + escapeHtml(log.headers[i]) + '">' + escapeHtml(chName(log.headers[i]) + (chFriendly(log.headers[i]) ? ' - ' + chBase(log.headers[i]) : '')) + '</option>'; }).join('') + '</select>'
    + '<select class="form-input" id="lrOp" style="width:70px"><option value="&gt;">&gt;</option><option value="&lt;">&lt;</option></select>'
    + '<input class="form-input" id="lrTh" type="number" step="any" placeholder="Threshold" style="width:110px">'
    + '<input class="form-input" id="lrLabel" placeholder="Label, e.g. Timing pulled" style="flex:1;min-width:140px">'
    + '<label class="check-row" style="font-size:var(--t-sm)"><input type="checkbox" id="lrAllCyl" checked> All cylinders</label>'
    + '<button class="btn btn-sm btn-primary" onclick="addLogRule()">Add rule</button></div>'
    + '<div class="file-meta" style="margin-top:6px">Thresholds use the log\'s native units (e.g. hPa, deg CA). A rule matches any log with that channel.</div>';
  html += '</div></details>';

  html += '</div>';
  openModal(html);
  const fi = document.getElementById('logFilterInput');
  if(fi && V.focusFilter){ fi.focus(); fi.setSelectionRange(fi.value.length, fi.value.length); V.focusFilter = false; }
}

function renderLogChannelList(filt){
  const V = S.logView, log = V.log;
  const html = logChannelEntries(log).map(function(e){
    const hay = (e.label + ' ' + e.raw).toLowerCase();
    if(filt && hay.indexOf(filt) === -1) return '';
    const on = V.charts.some(function(ch){ return e.cols.every(function(c){ return ch.indexOf(c) !== -1; }); });
    return '<label class="log-ch' + (on ? ' on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="logToggleEntry(\'' + e.key + '\')"> '
      + escapeHtml(e.label) + (e.label !== e.raw ? ' <span class="lg-raw">' + escapeHtml(e.raw) + '</span>' : '') + '</label>';
  }).join('');
  return html || '<span class="file-meta">No matching channels.</span>';
}

/* ---------- state changes ---------- */
const LOG_MAX_CHART_COUNT = 8;
function logSaveSelection(){
  try{ localStorage.setItem(logSignature(S.logView.log.headers), JSON.stringify({ v:2, charts:S.logView.charts, units:S.logView.units })); }catch(e){ /* storage unavailable */ }
}
function logEntryCols(key){
  const e = logChannelEntries(S.logView.log).find(function(x){ return x.key === key; });
  return e ? e.cols : [];
}
function logToggleEntry(key){
  const V = S.logView, cols = logEntryCols(key);
  const idx = V.charts.findIndex(function(ch){ return cols.every(function(c){ return ch.indexOf(c) !== -1; }); });
  if(idx !== -1){
    V.charts[idx] = V.charts[idx].filter(function(c){ return cols.indexOf(c) === -1; });
    if(!V.charts[idx].length) V.charts.splice(idx, 1);
  } else {
    if(V.charts.length >= LOG_MAX_CHART_COUNT){ toast('Up to ' + LOG_MAX_CHART_COUNT + ' charts - overlay onto an existing chart instead', true); renderLogViewer(); return; }
    V.charts.push(cols.slice(0, 8));
  }
  logSaveSelection(); renderLogViewer();
}
window.logToggleEntry = logToggleEntry;
function logOverlay(k, key){
  if(!key) return;
  const V = S.logView, cols = logEntryCols(key);
  cols.forEach(function(c){ if(V.charts[k].indexOf(c) === -1 && V.charts[k].length < 8) V.charts[k].push(c); });
  logSaveSelection(); renderLogViewer();
}
window.logOverlay = logOverlay;
function logRemoveSeries(k, c){
  const V = S.logView;
  V.charts[k] = V.charts[k].filter(function(x){ return x !== c; });
  if(!V.charts[k].length) V.charts.splice(k, 1);
  logSaveSelection(); renderLogViewer();
}
window.logRemoveSeries = logRemoveSeries;
function logRemoveChart(k){ S.logView.charts.splice(k, 1); logSaveSelection(); renderLogViewer(); }
window.logRemoveChart = logRemoveChart;
function logApplyPreset(name){ S.logView.charts = buildPreset(S.logView.log, name); logSaveSelection(); renderLogViewer(); }
window.logApplyPreset = logApplyPreset;
function logSetUnits(u){ S.logView.units = u; logSaveSelection(); renderLogViewer(); }
window.logSetUnits = logSetUnits;
// Flag chip click: make sure the tripped channel (its whole cylinder group)
// is charted, at the top.
function logFocusColumn(c){
  const V = S.logView; if(!V || c < 0) return;
  const h = V.log.headers[c];
  const key = chIndex(h) !== null ? 'g:' + chGroupKey(h) : 'c:' + c;
  const cols = logEntryCols(key);
  const idx = V.charts.findIndex(function(ch){ return ch.indexOf(c) !== -1; });
  if(idx > 0){ V.charts.unshift(V.charts.splice(idx, 1)[0]); }
  else if(idx === -1){ V.charts.unshift(cols.slice(0, 8)); if(V.charts.length > LOG_MAX_CHART_COUNT) V.charts.pop(); }
  logSaveSelection(); renderLogViewer();
}
window.logFocusColumn = logFocusColumn;
function logFilter(v){
  S.logView.filter = v;
  const el = document.getElementById('logChannels');
  if(el) el.innerHTML = renderLogChannelList(v.toLowerCase());
}
window.logFilter = logFilter;

/* ---------- zoom ---------- */
// Longest stretch at >= 95% pedal (or throttle, if no pedal channel).
function logWotRange(log){
  let c = findCols(log, /^AccP_r_VW$/i)[0];
  if(c === undefined) c = findCols(log, /^wdk_w/i)[0];
  if(c === undefined) return null;
  const d = log.cols[c];
  let best = null, start = -1;
  for(let i = 0; i <= d.length; i++){
    const on = i < d.length && d[i] >= 95;
    if(on && start === -1) start = i;
    if(!on && start !== -1){
      if(!best || (i - start) > (best[1] - best[0])) best = [start, i - 1];
      start = -1;
    }
  }
  if(!best || best[1] - best[0] < 2) return null;
  const a = xValue(log, best[0]), b = xValue(log, best[1]);
  const padT = (b - a) * 0.15;
  return [Math.max(0, a - padT), Math.min(logSpan(log), b + padT)];
}
function logZoomWot(){ const w = logWotRange(S.logView.log); if(w){ S.logView.range = w; renderLogViewer(); } }
window.logZoomWot = logZoomWot;
function logResetZoom(){ if(S.logView){ S.logView.range = null; renderLogViewer(); } }
window.logResetZoom = logResetZoom;

function logFrac(ev, svg){
  const rect = svg.getBoundingClientRect();
  return Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
}
function logIsTouch(ev){ return ev.pointerType === 'touch' || ev.pointerType === 'pen'; }
function logTouchCount(){ return Object.keys(S.logView.ptrs || {}).length; }

// Mouse: hover reads values, drag selects a range to zoom.
// Touch: one finger reads values (tap or slide - the crosshair stays after
// lifting), two fingers pinch-zoom around the point between them, and a
// double-tap resets. Vertical swipes still scroll the page (touch-action:
// pan-y on the chart), so the charts never trap scrolling.
function logDown(ev, svg){
  const V = S.logView; if(!V) return;
  if(logIsTouch(ev)){
    V.ptrs = V.ptrs || {};
    V.ptrs[ev.pointerId] = { x: ev.clientX };
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){ /* not supported */ }
    const n = logTouchCount();
    if(n === 1){
      const now = Date.now();
      if(V.lastTap && now - V.lastTap < 300 && Math.abs(ev.clientX - V.lastTapX) < 30){
        V.lastTap = 0; logResetZoom(); return;
      }
      V.lastTap = now; V.lastTapX = ev.clientX;
      logShowCursor(logFrac(ev, svg));
    } else if(n === 2){
      const xs = Object.keys(V.ptrs).map(function(k){ return V.ptrs[k].x; });
      const rect = svg.getBoundingClientRect();
      const r = logRange();
      V.pinch = {
        d0: Math.max(20, Math.abs(xs[0] - xs[1])),
        cf: Math.min(1, Math.max(0, ((xs[0] + xs[1]) / 2 - rect.left) / rect.width)),
        a0: r.a, b0: r.b, full: r.full, next: null
      };
      V.lastTap = 0;
      logLeave();
    }
    return;
  }
  if(ev.button !== undefined && ev.button !== 0) return;
  V.drag = { f0: logFrac(ev, svg) };
  try{ svg.setPointerCapture(ev.pointerId); }catch(e){ /* not supported */ }
}
window.logDown = logDown;

function logMove(ev, svg){
  const V = S.logView; if(!V) return;
  if(logIsTouch(ev)){
    if(!V.ptrs || !V.ptrs[ev.pointerId]) return;
    V.ptrs[ev.pointerId].x = ev.clientX;
    if(V.pinch && logTouchCount() >= 2){
      const P = V.pinch;
      const xs = Object.keys(V.ptrs).map(function(k){ return V.ptrs[k].x; });
      const d = Math.max(20, Math.abs(xs[0] - xs[1]));
      const span0 = P.b0 - P.a0;
      const minSpan = Math.max(P.full / 500, 0.05);
      let span = Math.min(P.full, Math.max(minSpan, span0 * (P.d0 / d)));
      const tc = P.a0 + P.cf * span0;          // time under the fingers stays put
      let a = tc - P.cf * span;
      a = Math.max(0, Math.min(P.full - span, a));
      P.next = [a, a + span];
      // Live preview: stretch the already-drawn charts via viewBox; the
      // real redraw (sharp lines, new axis labels) happens on release.
      const vx = ((a - P.a0) / span0) * 1000, vw = (span / span0) * 1000;
      document.querySelectorAll('#logCharts .lv-svg').forEach(function(el){
        el.setAttribute('viewBox', vx.toFixed(2) + ' 0 ' + vw.toFixed(2) + ' ' + LOG_CH);
      });
      return;
    }
    if(logTouchCount() === 1 && !V.pinch) logShowCursor(logFrac(ev, svg));
    return;
  }
  const f = logFrac(ev, svg);
  logShowCursor(f);
  if(V.drag){
    const x0 = Math.min(V.drag.f0, f) * 1000, w = Math.abs(f - V.drag.f0) * 1000;
    document.querySelectorAll('#logCharts .lv-sel').forEach(function(rc){ rc.setAttribute('x', x0.toFixed(1)); rc.setAttribute('width', w.toFixed(1)); });
  }
}
window.logMove = logMove;

function logUp(ev, svg){
  const V = S.logView; if(!V) return;
  if(logIsTouch(ev)){
    if(V.ptrs) delete V.ptrs[ev.pointerId];
    if(V.pinch && logTouchCount() < 2){
      const next = V.pinch.next, full = V.pinch.full;
      V.pinch = null;
      V.ptrs = {};
      if(next){
        V.range = (next[1] - next[0]) >= full * 0.995 ? null : next;
        renderLogViewer();
      }
    }
    return;
  }
  if(!V.drag) return;
  const f = logFrac(ev, svg), f0 = V.drag.f0;
  V.drag = null;
  document.querySelectorAll('#logCharts .lv-sel').forEach(function(rc){ rc.setAttribute('width', 0); });
  if(Math.abs(f - f0) < 0.01) return; // a click, not a drag
  const r = logRange();
  const a = r.a + Math.min(f, f0) * (r.b - r.a), b = r.a + Math.max(f, f0) * (r.b - r.a);
  if(b - a <= 0) return;
  V.range = [a, b];
  renderLogViewer();
}
window.logUp = logUp;

// Mouse leaving clears the crosshair; on touch it stays so the values can
// be read after lifting the finger.
function logLeave(ev){
  if(ev && logIsTouch(ev)) return;
  document.querySelectorAll('#logCharts .log-cursor').forEach(function(l){ l.setAttribute('x1', -10); l.setAttribute('x2', -10); });
}
window.logLeave = logLeave;

// Crosshair on every chart plus each series' value at that moment.
function logIsCoarse(){ try{ return window.matchMedia && window.matchMedia('(pointer:coarse)').matches; }catch(e){ return false; } }
function logHint(short){
  if(logIsCoarse()) return short ? 'pinch to zoom &middot; double-tap to reset' : 'Touch a chart to read values &middot; pinch with two fingers to zoom &middot; double-tap to reset';
  return short ? 'drag to zoom &middot; double-click to reset' : 'Hover for values &middot; drag to zoom &middot; double-click to reset';
}
function logShowCursor(f){
  const V = S.logView, log = V.log, B = V.compare ? V.compare.log : null;
  const r = logRange(), t = r.a + f * (r.b - r.a);
  const x = (f * 999).toFixed(1);
  document.querySelectorAll('#logCharts .log-cursor').forEach(function(l){ l.setAttribute('x1', x); l.setAttribute('x2', x); });
  const ia = sampleAt(log, t), ib = B ? sampleAt(B, t) : -1;
  V.charts.forEach(function(cols, k){
    cols.forEach(function(c, i){
      const el = document.getElementById('lv-' + k + '-' + i);
      if(el) el.textContent = fmtNum(displayData(log, c)[ia]);
      const cb = B ? compareCol(c) : -1;
      const eb = document.getElementById('lvb-' + k + '-' + i);
      if(eb && cb !== -1) eb.textContent = '/ ' + fmtNum(displayData(B, cb)[ib]);
    });
  });
  const ro = document.getElementById('logReadout');
  if(ro) ro.innerHTML = '<strong>' + fmtNum(t) + (log.timeIdx !== -1 ? ' s' : '') + '</strong> <span class="file-meta">&middot; ' + logHint(true) + '</span>';
}


/* ================= AUTOMATIC LOG ANALYSIS ================= */
// Finds full-throttle pulls and summarizes what a tuner checks first. Uses
// only channels whose meaning is known (see LOG_PROFILES); anything a
// log doesn't have is simply left out. Thresholds only decide what gets
// highlighted - the numbers are always shown - and they are tuner-set
// (tuning_settings.analysis_thresholds), with these as defaults.
const ANALYSIS_DEFAULTS = {
  knock_warn: -2.0,          // deg CA of retard on any cylinder
  boost_short_warn: 150,     // hPa below target, after spool
  boost_over_warn: 200,      // hPa above target
  rail_short_warn_pct: 10,   // % below rail pressure setpoint
  lpfp_drop_warn_pct: 15,    // % drop from pre-pull low-pressure fuel
  iat_rise_warn: 15          // deg C rise across a pull
};
function analysisThresholds(){
  let t = {};
  try{ t = JSON.parse((S.settings && S.settings.analysis_thresholds) || '{}') || {}; }catch(e){ t = {}; }
  const out = {};
  Object.keys(ANALYSIS_DEFAULTS).forEach(function(k){ out[k] = (typeof t[k] === 'number' && !isNaN(t[k])) ? t[k] : ANALYSIS_DEFAULTS[k]; });
  return out;
}

function aCol(log, re){ return findCols(log, re)[0]; }
function aVals(log, c, i0, i1){
  const d = colData(log, c), out = [];
  for(let i = i0; i <= i1; i++){ const v = d[i]; if(!isNaN(v)) out.push(v); }
  return out;
}
function aMin(a){ return a.length ? Math.min.apply(null, a) : null; }
function aMax(a){ return a.length ? Math.max.apply(null, a) : null; }
function aAvg(a){ return a.length ? a.reduce(function(x, y){ return x + y; }, 0) / a.length : null; }
function aMedian(a){ if(!a.length) return null; const s = a.slice().sort(function(x, y){ return x - y; }); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

// Full-throttle pulls: runs of pedal >= 95% (throttle >= 90% if there's no
// pedal channel), at least 1 s long. Short gaps (<= 2 samples, e.g. a
// shift) are bridged so one pull isn't split in two.
function findPulls(log){
  let c = aCol(log, /^AccP_r_VW$/i), th = 95;
  if(c === undefined){ c = aCol(log, /^wdk_w/i); th = 90; }
  if(c === undefined) return [];
  const d = log.cols[c], runs = [];
  let start = -1, gap = 0;
  for(let i = 0; i <= d.length; i++){
    const on = i < d.length && d[i] >= th;
    if(on){ if(start === -1) start = i; gap = 0; }
    else if(start !== -1){
      gap++;
      if(gap > 2 || i === d.length){ runs.push([start, i - gap]); start = -1; gap = 0; }
    }
  }
  return runs.filter(function(r){ return xValue(log, r[1]) - xValue(log, r[0]) >= 1.0; });
}

// Samples around a gear change (and sudden RPM drops, for logs with no
// gear channel). Boost always dips through a shift - that's normal and
// mustn't be reported as a boost-control shortfall.
// Samples around a gear change (or a sudden RPM drop when there's no gear
// channel). Boost always dips through a shift, which is normal - and the
// dip starts slightly before the gear channel changes. The window is by
// TIME (0.6 s before to 0.8 s after), because logging rates differ
// hugely: DS1 ~16 samples/s, JB4 about 1.
function shiftMask(log, i0, i1){
  const mask = {}, gear = aCol(log, /^CoEng_nrActGearHem$/i), rpm = aCol(log, /^nmot_w$/i);
  const G = gear !== undefined ? log.cols[gear] : null, R = rpm !== undefined ? log.cols[rpm] : null;
  const mark = function(i){
    const t = xValue(log, i);
    mask[i] = true; mask[i - 1] = true;
    for(let k = i - 1; k >= 0 && t - xValue(log, k) <= 0.6; k--) mask[k] = true;
    for(let k = i + 1; k < log.rows && xValue(log, k) - t <= 0.8; k++) mask[k] = true;
  };
  for(let i = i0 + 1; i <= i1; i++){
    if(G && !isNaN(G[i]) && !isNaN(G[i - 1]) && G[i] !== G[i - 1]) mark(i);
    else if(R && !isNaN(R[i]) && !isNaN(R[i - 1]) && R[i - 1] - R[i] > 300) mark(i);
  }
  return mask;
}

function analyzePull(log, r, th){
  const i0 = r[0], i1 = r[1];
  const P = { i0:i0, i1:i1, t0:xValue(log, i0), t1:xValue(log, i1), findings:[] };
  const rpm = aCol(log, /^nmot_w$/i);
  if(rpm !== undefined){ const v = aVals(log, rpm, i0, i1); P.rpmStart = v[0]; P.rpmEnd = v[v.length - 1]; P.rpmMax = aMax(v); }
  const gear = aCol(log, /^CoEng_nrActGearHem$/i);
  if(gear !== undefined){
    const g = aVals(log, gear, i0, i1).filter(function(x){ return x > 0; });
    if(g.length){ P.gearFrom = Math.round(aMin(g)); P.gearTo = Math.round(aMax(g)); }
  }

  // Boost vs target. "After spool" = from the first sample where actual
  // reaches 90% of target onward, so turbo lag isn't counted as a shortfall.
  const ba = aCol(log, /^pvdr_w/i), bs = aCol(log, /^pvds_w/i);
  if(ba !== undefined){
    const A = colData(log, ba);
    P.boostPeak = aMax(aVals(log, ba, i0, i1));
    if(bs !== undefined){
      const T = colData(log, bs);
      let spool = -1;
      for(let i = i0; i <= i1; i++) if(!isNaN(A[i]) && !isNaN(T[i]) && A[i] >= T[i] * 0.9){ spool = i; break; }
      P.boostTarget = aMedian(aVals(log, bs, i0, i1));
      const shifting = shiftMask(log, i0, i1);
      let over = null, short = null;
      // Overshoot counts everywhere (a spike on a shift is exactly what to
      // catch); shortfall ignores shift dips, which are normal.
      let overAtShift = false;
      for(let i = (spool === -1 ? i1 + 1 : spool); i <= i1; i++){
        if(isNaN(A[i]) || isNaN(T[i])) continue;
        const dlt = A[i] - T[i];
        if(over === null || dlt > over){ over = dlt; overAtShift = !!shifting[i]; }
        if(!shifting[i] && (short === null || -dlt > short)) short = -dlt;
      }
      P.boostOverAtShift = overAtShift;
      P.boostOver = over !== null ? Math.max(0, over) : null;
      P.boostShort = short !== null ? Math.max(0, short) : null;
      P.spoolAt = spool !== -1 ? xValue(log, spool) - P.t0 : null;
      const bf = hpaFactor(unitOf(log, ba));
      if(P.boostShort !== null && P.boostShort * bf >= th.boost_short_warn) P.findings.push({ sev:'warn', text:'Boost ' + aFmtDelta(log, /^pvdr_w/i, P.boostShort) + ' under target (outside shifts)' });
      if(P.boostOver !== null && P.boostOver * bf >= th.boost_over_warn) P.findings.push({ sev:'warn', text:'Boost overshoot ' + aFmtDelta(log, /^pvdr_w/i, P.boostOver) + ' over target' + (P.boostOverAtShift ? ' (on a shift)' : '') });
      if(spool === -1) P.findings.push({ sev:'warn', text:'Boost never reached 90% of target' });
    }
  }

  // Knock per cylinder, normalized to retard (<= 0; more negative = more
  // pulled) whatever the logger's sign convention: DS1 logs negative retard,
  // JB4 logs positive degrees pulled.
  const kc = findCols(log, /^IKCtl_agKnkInt/i);
  if(kc.length){
    const sg = knockSign(log, kc);
    P.knockSign = sg;
    P.knock = kc.map(function(c){
      const v = aVals(log, c, i0, i1).map(function(x){ return sg === 1 ? -x : x; });
      return { idx: chIndex(log.headers[c]), worst: aMin(v), events: v.filter(function(x){ return x <= -1; }).length };
    });
    const worst = P.knock.reduce(function(a, b){ return (b.worst !== null && (a === null || b.worst < a.worst)) ? b : a; }, null);
    P.knockWorst = worst;
    if(worst && worst.worst !== null && worst.worst <= th.knock_warn){
      P.findings.push({ sev:'bad', text: (sg === 1 ? 'Timing pulled ' + fmtNum(-worst.worst) : 'Knock retard ' + fmtNum(worst.worst)) + ' deg on cylinder [' + worst.idx + ']' });
    }
  }

  let tc = findCols(log, /^zwoutzyl/i);
  if(!tc.length) tc = roleCols(log, 'timing');
  if(tc.length){
    let all = [];
    tc.forEach(function(c){ all = all.concat(aVals(log, c, i0, i1)); });
    P.timingMin = aMin(all); P.timingAvg = aAvg(all);
  }

  const ra = aCol(log, /^prist_w/i), rs = aCol(log, /^prsoll_w/i);
  if(ra !== undefined && rs !== undefined){
    const A = colData(log, ra), T = colData(log, rs);
    let worstPct = 0, worstAbs = 0;
    for(let i = i0; i <= i1; i++){
      if(isNaN(A[i]) || isNaN(T[i]) || T[i] <= 0) continue;
      const sh = T[i] - A[i];
      if(sh > worstAbs){ worstAbs = sh; worstPct = sh / T[i] * 100; }
    }
    P.railShort = worstAbs; P.railShortPct = worstPct;
    if(worstPct >= th.rail_short_warn_pct) P.findings.push({ sev:'bad', text:'Rail pressure ' + worstPct.toFixed(0) + '% under setpoint' });
  } else if(ra !== undefined){
    P.railMin = aMin(aVals(log, ra, i0, i1));   // no setpoint logged - report the low point
  }

  const lp = aCol(log, /^FuelP_pAct$/i);
  if(lp !== undefined){
    const pre = aVals(log, lp, Math.max(0, i0 - 5), Math.max(0, i0 - 1));
    const base = pre.length ? aMedian(pre) : aVals(log, lp, i0, i0)[0];
    P.lpfpMin = aMin(aVals(log, lp, i0, i1));
    if(base && P.lpfpMin !== null){
      P.lpfpDropPct = Math.max(0, (base - P.lpfpMin) / base * 100);
      if(P.lpfpDropPct >= th.lpfp_drop_warn_pct) P.findings.push({ sev:'bad', text:'Low-pressure fuel dropped ' + P.lpfpDropPct.toFixed(0) + '%' });
    }
  }

  const lam = findCols(log, /^lam/i);
  if(lam.length){
    P.lambda = lam.map(function(c){ const v = aVals(log, c, i0, i1); return { name: chBase(log.headers[c]), min: aMin(v), max: aMax(v) }; });
  }
  const afrc = roleCols(log, 'afr').concat(roleCols(log, 'afr2'));
  if(afrc.length){
    P.afr = afrc.map(function(c){ const v = aVals(log, c, i0, i1); return { name: chBase(log.headers[c]), min: aMin(v), max: aMax(v) }; });
  }

  const iat = aCol(log, /^tans/i);
  if(iat !== undefined){
    const v = aVals(log, iat, i0, i1);
    P.iatStart = v[0]; P.iatMax = aMax(v);
    const iu = unitOf(log, iat), rise = P.iatMax - P.iatStart;
    const riseC = /f$/i.test(iu) ? rise * 5 / 9 : rise;       // threshold is in deg C
    if(v.length && riseC >= th.iat_rise_warn) P.findings.push({ sev:'warn', text:'Intake temp rose ' + fmtNum(rise) + ' ' + (iu || 'deg') });
  }
  return P;
}

function analyzeLog(log){
  const th = analysisThresholds();
  const pulls = findPulls(log).map(function(r){ return analyzePull(log, r, th); });
  const out = { pulls: pulls, thresholds: th };
  const ct = aCol(log, /^tmot/i);
  if(ct !== undefined) out.coolantMax = aMax(aVals(log, ct, 0, log.rows - 1));
  const ot = aCol(log, /^SLmpCtl_tOilSwmp/i);
  if(ot !== undefined) out.oilMax = aMax(aVals(log, ot, 0, log.rows - 1));
  out.worst = pulls.reduce(function(n, p){ return n + p.findings.filter(function(f){ return f.sev === 'bad'; }).length; }, 0);
  out.warns = pulls.reduce(function(n, p){ return n + p.findings.filter(function(f){ return f.sev === 'warn'; }).length; }, 0);
  return out;
}

// ---- Analysis panel in the viewer
function aFmt(log, re, v, withUnit){
  if(v === null || v === undefined || isNaN(v)) return '-';
  const c = aCol(log, re);
  const conv = c !== undefined ? chConv(log.headers[c]) : { f:null, unit:'' };
  const val = conv.f ? conv.f(v) : v;
  return fmtNum(val) + (withUnit && conv.unit ? ' ' + conv.unit : '');
}
// Differences (e.g. a boost shortfall) convert by scale only - no offset.
function aFmtDelta(log, re, v){
  if(v === null || v === undefined || isNaN(v)) return '-';
  const c = aCol(log, re);
  const conv = c !== undefined ? chConv(log.headers[c]) : { f:null, unit:'' };
  const val = conv.f ? conv.f(v) - conv.f(0) : v;
  return fmtNum(val) + (conv.unit ? ' ' + conv.unit : '');
}

function renderAnalysisPanel(log, A, B, AB){
  const th = A.thresholds;
  if(!A.pulls.length){
    return '<div class="an-panel"><div class="an-head"><span class="an-title">Pull analysis</span></div>'
      + '<div class="file-meta">No full-throttle pull found in this log (needs 1 s or more at 95%+ pedal).</div>'
      + renderThresholdEditor(th) + '</div>';
  }
  const issues = A.worst + A.warns;
  let html = '<div class="an-panel"><div class="an-head"><span class="an-title">Pull analysis</span>'
    + '<span class="file-meta">' + A.pulls.length + ' full-throttle pull' + (A.pulls.length === 1 ? '' : 's')
    + ' &middot; ' + (issues ? issues + ' to review' : 'nothing flagged') + '</span>'
    + '<a class="an-th-link" onclick="toggleThresholdEditor()">Thresholds</a></div>';
  if(S.showThresholds) html += renderThresholdEditor(th);

  A.pulls.forEach(function(p, n){
    const q = B && AB && AB.pulls[n] ? AB.pulls[n] : null;   // same-numbered pull in the compared log
    const cmp = function(v){ return q ? '<span class="an-vs">vs ' + v + '</span>' : ''; };
    html += '<div class="an-pull">';
    html += '<div class="an-pull-head"><strong>Pull ' + (n + 1) + '</strong>'
      + '<span class="file-meta">' + fmtNum(p.t0) + '-' + fmtNum(p.t1) + ' s'
      + (p.gearFrom ? ' &middot; gear ' + p.gearFrom + (p.gearTo !== p.gearFrom ? '-' + p.gearTo : '') : '')
      + (p.rpmStart !== undefined ? ' &middot; ' + fmtNum(p.rpmStart) + ' to ' + fmtNum(p.rpmMax) + ' rpm' : '') + '</span>'
      + '<button class="lv-chip" onclick="logZoomPull(' + n + ')">Zoom</button></div>';
    html += '<div class="an-findings">' + (p.findings.length
      ? p.findings.map(function(f){ return '<span class="an-f an-' + f.sev + '">' + escapeHtml(f.text) + '</span>'; }).join('')
      : '<span class="an-f an-ok">Nothing flagged</span>') + '</div>';

    const cells = [];
    if(p.boostPeak !== undefined){
      cells.push(['Boost', aFmt(log, /^pvdr_w/i, p.boostPeak, true) + (p.boostTarget !== undefined ? ' <span class="an-sub">target ' + aFmt(log, /^pvds_w/i, p.boostTarget) + '</span>' : '')
        + (p.boostOver !== undefined && p.boostOver !== null ? '<div class="an-sub">over ' + aFmtDelta(log, /^pvdr_w/i, p.boostOver) + (p.boostOverAtShift ? ' (shift)' : '') + ' &middot; under ' + aFmtDelta(log, /^pvdr_w/i, p.boostShort) + '</div>' : '')
        + cmp(q && q.boostPeak !== undefined ? aFmt(B, /^pvdr_w/i, q.boostPeak) : '-')]);
    }
    if(p.knock){
      const k = p.knock.map(function(c){
        const lvl = c.worst === null ? '' : (c.worst <= th.knock_warn ? ' bad' : (c.worst <= -1 ? ' warn' : ''));
        return '<span class="an-cyl' + lvl + '" title="' + c.events + ' samples at 1 deg or more">[' + c.idx + '] ' + fmtNum(p.knockSign === 1 ? -c.worst : c.worst) + '</span>';
      }).join('');
      cells.push([p.knockSign === 1 ? 'Timing pulled (deg)' : 'Knock retard (deg)', '<div class="an-cyls">' + k + '</div>'
        + cmp(q && q.knockWorst ? fmtNum(q.knockSign === 1 ? -q.knockWorst.worst : q.knockWorst.worst) + ' on [' + q.knockWorst.idx + ']' : '-')]);
    }
    if(p.timingMin !== undefined) cells.push(['Ignition timing', 'min ' + fmtNum(p.timingMin) + ' &middot; avg ' + fmtNum(p.timingAvg) + ' <span class="an-sub">deg</span>' + cmp(q && q.timingAvg !== undefined ? 'avg ' + fmtNum(q.timingAvg) : '-')]);
    if(p.railMin !== undefined && p.railShortPct === undefined) cells.push(['Rail pressure', 'min ' + aFmt(log, /^prist_w/i, p.railMin, true) + ' <span class="an-sub">no setpoint logged</span>']);
    if(p.railShortPct !== undefined) cells.push(['Rail pressure', (p.railShortPct >= 0.5 ? p.railShortPct.toFixed(1) + '% under setpoint' : 'on setpoint') + cmp(q && q.railShortPct !== undefined ? q.railShortPct.toFixed(1) + '%' : '-')]);
    if(p.lpfpMin !== undefined) cells.push(['Low-pressure fuel', 'min ' + aFmt(log, /^FuelP_pAct$/i, p.lpfpMin, true) + (p.lpfpDropPct >= 0.05 ? ' <span class="an-sub">-' + p.lpfpDropPct.toFixed(1) + '%</span>' : '') + cmp(q && q.lpfpMin !== undefined ? aFmt(B, /^FuelP_pAct$/i, q.lpfpMin) : '-')]);
    if(p.lambda) cells.push(['Lambda (under load)', p.lambda.map(function(l){ return '<div><span class="lg-raw">' + escapeHtml(l.name) + '</span> ' + fmtNum(l.min) + '-' + fmtNum(l.max) + '</div>'; }).join('')]);
    if(p.afr) cells.push(['AFR (under load)', p.afr.map(function(l){ return '<div><span class="lg-raw">' + escapeHtml(l.name) + '</span> ' + fmtNum(l.min) + '-' + fmtNum(l.max) + '</div>'; }).join('')]);
    if(p.iatStart !== undefined) cells.push(['Intake air temp', aFmt(log, /^tans/i, p.iatStart) + ' to ' + aFmt(log, /^tans/i, p.iatMax, true) + cmp(q && q.iatMax !== undefined ? aFmt(B, /^tans/i, q.iatMax) : '-')]);
    html += '<div class="an-grid">' + cells.map(function(c){ return '<div class="an-cell"><div class="an-label">' + c[0] + '</div><div class="an-val">' + c[1] + '</div></div>'; }).join('') + '</div>';
    html += '</div>';
  });
  const extra = [];
  if(A.coolantMax !== undefined) extra.push('Coolant max ' + aFmt(log, /^tmot/i, A.coolantMax, true));
  if(A.oilMax !== undefined) extra.push('Oil max ' + aFmt(log, /^SLmpCtl_tOilSwmp/i, A.oilMax, true));
  if(extra.length) html += '<div class="file-meta" style="margin-top:6px">Whole log: ' + extra.join(' &middot; ') + '</div>';
  if(B) html += '<div class="file-meta" style="margin-top:4px">"vs" values are the same-numbered pull in ' + escapeHtml(S.logView.compare.fileName) + '.</div>';
  html += '</div>';
  return html;
}

function logZoomPull(n){
  const V = S.logView; if(!V) return;
  const p = analyzeLog(V.log).pulls[n]; if(!p) return;
  const pad = (p.t1 - p.t0) * 0.1;
  V.range = [Math.max(0, p.t0 - pad), Math.min(logSpan(V.log), p.t1 + pad)];
  renderLogViewer();
}
window.logZoomPull = logZoomPull;

// ---- Saved per-log verdict (drives the Log Review list)
function analysisHeadline(A){
  const all = [];
  A.pulls.forEach(function(p){ p.findings.forEach(function(f){ all.push(f); }); });
  return { pulls: A.pulls.length, bad: A.worst, warn: A.warns,
    findings: all.slice(0, 4).map(function(f){ return { sev: f.sev, text: f.text }; }) };
}
async function saveLogAnalysis(fileId, A){
  const summary = analysisHeadline(A);
  try{
    const { error } = await sb.from('tuning_files').update({ analysis: summary, analyzed_at: new Date().toISOString() }).eq('id', fileId);
    if(error) throw error;
    const lists = [S.pendingLogs || []].concat(Object.keys(S.files).map(function(k){ return S.files[k] || []; }));
    lists.forEach(function(list){ list.forEach(function(f){ if(f.id === fileId) f.analysis = summary; }); });
  }catch(e){ /* column missing until Phase 20 runs - viewer still works */ }
}

// Log Review: analyze pending logs that don't have a verdict yet, one at a
// time in the background, so the list shows results without opening each.
let AUTO_ANALYZE_RUNNING = false;
async function autoAnalyzePending(){
  if(AUTO_ANALYZE_RUNNING) return;
  AUTO_ANALYZE_RUNNING = true;
  try{
    if(!S.logRules) await loadLogRules();
    const todo = (S.pendingLogs || []).filter(function(f){ return !f.analysis && isLogFile(f); });
    for(let i = 0; i < todo.length; i++){
      const f = todo[i];
      try{
        const log = await fetchLog(f.file_path);
        const prev = S.logView; S.logView = { hideFuelCut: true };  // analysis uses the fuel-cut filter
        const A = analyzeLog(log);
        S.logView = prev;
        await saveLogAnalysis(f.id, A);
        f.analysis = analysisHeadline(A);
      }catch(e){ f.analysis = { error: true }; }
      if(S.page === 'logreview') renderPage();
    }
  }finally{ AUTO_ANALYZE_RUNNING = false; }
}

function analysisChips(a){
  if(!a) return '<span class="file-meta">Analyzing&hellip;</span>';
  if(a.error) return '<span class="file-meta">Could not read this log</span>';
  if(!a.pulls) return '<span class="an-f an-muted">No full-throttle pull</span>';
  if(!a.findings || !a.findings.length) return '<span class="an-f an-ok">' + a.pulls + ' pull' + (a.pulls === 1 ? '' : 's') + ' &middot; nothing flagged</span>';
  return a.findings.map(function(f){ return '<span class="an-f an-' + f.sev + '">' + escapeHtml(f.text) + '</span>'; }).join('');
}


// ---- Format, log info and channel roles (viewer)
function renderFormatSection(log){
  const flat = log.headers.filter(function(h, c){ return log.numeric[c] && c !== log.timeIdx && colIsFlat(log, c); }).length;
  const cols = log.headers.map(function(h, c){ return c; }).filter(function(c){ return log.numeric[c] && c !== log.timeIdx && !colIsFlat(log, c); });
  const roleOpts = Object.keys(LOG_ROLES).sort(function(a, b){ return LOG_ROLES[a].label.localeCompare(LOG_ROLES[b].label); });
  const hasOverride = !!roleOverrides()[log.fingerprint];
  let html = '<details class="ov-sec"><summary>Format: ' + escapeHtml(log.profile.name) + ' &middot; channel roles'
    + (log.profile.id === 'generic' ? ' <span class="pill pill-orange" style="text-transform:none;letter-spacing:0">check</span>' : '') + '</summary><div class="ov-body">';
  if(log.profile.note) html += '<div class="file-meta" style="margin-bottom:10px">' + escapeHtml(log.profile.note) + '</div>';
  if(log.preamble && log.preamble.length){
    const show = log.preamble.slice(0, 40);
    html += '<div class="fm-info"><div class="an-label">Log info</div><div class="fm-kv">' + show.map(function(p){
      return '<span><b>' + escapeHtml(p.k) + '</b> ' + escapeHtml(p.v) + '</span>';
    }).join('') + (log.preamble.length > show.length ? '<span class="file-meta">+' + (log.preamble.length - show.length) + ' more</span>' : '') + '</div></div>';
  }
  html += '<div class="an-label" style="margin-top:10px">Channel roles</div>'
    + '<div class="file-meta" style="margin-bottom:6px">What each column means drives the names, layouts, fuel-cut handling and pull analysis. Changes apply to every log from this logger and are shared by all tuners.'
    + (flat ? ' ' + flat + ' empty or constant column' + (flat === 1 ? ' is' : 's are') + ' hidden.' : '') + '</div>';
  html += '<div class="fm-roles">' + cols.map(function(c){
    const cur = log.meta[c] ? log.meta[c].role : 'none';
    return '<label class="fm-role"><span class="fm-col">' + escapeHtml(log.headers[c]) + '</span><select class="form-input" data-col="' + escapeHtml(log.headers[c]) + '">'
      + '<option value="none"' + (cur === 'none' ? ' selected' : '') + '>- not used -</option>'
      + roleOpts.map(function(r){ return '<option value="' + r + '"' + (cur === r ? ' selected' : '') + '>' + escapeHtml(r === 'knock_cyl' ? 'Knock retard / timing pulled' : LOG_ROLES[r].label) + (LOG_ROLES[r].group ? ' (per cylinder)' : '') + '</option>'; }).join('')
      + '</select></label>';
  }).join('') + '</div>';
  html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">'
    + (hasOverride ? '<button class="btn btn-sm" onclick="resetRoleMap()">Reset to detected</button>' : '')
    + '<button class="btn btn-sm btn-primary" onclick="saveRoleMap()">Save roles</button></div>';
  html += '</div></details>';
  return html;
}

async function saveRoleMap(){
  const V = S.logView; if(!V) return;
  const log = V.log, map = {};
  document.querySelectorAll('.fm-roles select').forEach(function(sel){ map[sel.getAttribute('data-col')] = sel.value; });
  const all = roleOverrides();
  all[log.fingerprint] = map;
  await storeRoleMaps(all, 'Channel roles saved for this format');
}
window.saveRoleMap = saveRoleMap;
async function resetRoleMap(){
  const V = S.logView; if(!V) return;
  const all = roleOverrides();
  delete all[V.log.fingerprint];
  await storeRoleMaps(all, 'Channel roles reset to the detected format');
}
window.resetRoleMap = resetRoleMap;
async function storeRoleMaps(all, msg){
  try{
    const { error } = await sb.from('tuning_settings').upsert({ key:'log_role_maps', value: JSON.stringify(all), updated_by: S.user.email, updated_at: new Date().toISOString() });
    if(error) throw error;
    S.settings.log_role_maps = JSON.stringify(all);
    const V = S.logView;
    applyLogProfile(V.log);
    if(V.compare) applyLogProfile(V.compare.log);
    toast(msg);
    renderLogViewer();
  }catch(e){ toast('Could not save roles: ' + e.message, true); }
}

async function addLogRule(){
  let col = document.getElementById('lrCol').value;
  // Per-cylinder DS1 channel like "IKCtl_agKnkInt_as8[2] [Grad KW]": with
  // "All cylinders" on, store the base name so the rule covers [0]..[n].
  const allCyl = document.getElementById('lrAllCyl');
  if(allCyl && allCyl.checked && chIndex(col) !== null){
    col = chGroupRaw(col);
  }
  const op = document.getElementById('lrOp').value;
  const th = parseFloat(document.getElementById('lrTh').value);
  const label = document.getElementById('lrLabel').value.trim();
  if(!col){ toast('Pick a column', true); return; }
  if(isNaN(th)){ toast('Enter a threshold', true); return; }
  if(!label){ toast('Give the rule a label', true); return; }
  try{
    const { data, error } = await sb.from('tuning_log_rules').insert({ column_name: col, operator: op, threshold: th, label: label, created_by: S.user.email }).select().single();
    if(error) throw error;
    S.logRules.push(data);
    toast('Rule added');
    renderLogViewer();
  }catch(e){ toast('Failed to add rule: ' + e.message, true); }
}
window.addLogRule = addLogRule;

async function deleteLogRule(id){
  const r = (S.logRules || []).find(function(x){ return x.id === id; });
  if(!confirm('Delete the "' + (r ? r.label : 'rule') + '" rule? It applies to every log.')) return;
  try{
    const { error } = await sb.from('tuning_log_rules').delete().eq('id', id);
    if(error) throw error;
    S.logRules = S.logRules.filter(function(x){ return x.id !== id; });
    renderLogViewer();
  }catch(e){ toast('Failed to delete: ' + e.message, true); }
}
window.deleteLogRule = deleteLogRule;

function isLogFile(f){ return f.file_type === 'log' || /\.(csv|txt|log)$/i.test(f.file_name || ''); }

async function downloadFile(fileId, path){
  try{
    const { data, error } = await sb.storage.from('tuning-files').createSignedUrl(path, 3600);
    if(error) throw error;
    window.open(data.signedUrl, '_blank');
  }catch(e){
    toast('Could not generate download link: ' + e.message, true);
  }
}
window.downloadFile = downloadFile;

/* ---- activity tab ---- */
function describeActivity(l){
  let desc = l.field_changed || 'update';
  if(l.field_changed === 'status'){
    if(l.old_value === 'tune_sent' && l.new_value === 'revision_requested') desc = 'Customer requested a revision';
    else desc = 'Status changed from ' + (STATUS_LABEL[l.old_value]||l.old_value) + ' to ' + (STATUS_LABEL[l.new_value]||l.new_value);
  }
  else if(l.field_changed === 'message') desc = 'Message sent to customer';
  else if(l.field_changed === 'internal_note') desc = 'Internal note added';
  else if(l.field_changed === 'file_uploaded') desc = 'File uploaded: ' + l.new_value;
  else if(l.field_changed === 'assigned_tuner') desc = l.new_value && l.new_value !== 'Unassigned' ? 'Reassigned to ' + l.new_value : 'Unassigned';
  else if(l.field_changed === 'invoice_sent') desc = 'Invoice sent for ' + (l.new_value || 'an amount');
  else if(l.field_changed === 'invoice_paid') desc = 'Invoice marked paid' + (l.new_value ? ' (' + l.new_value + ')' : '');
  else if(l.field_changed === 'file_deleted') desc = 'File deleted: ' + (l.old_value || '');
  else if(l.field_changed === 'review_submitted') desc = 'Customer left a review: ' + (l.new_value || '');
  else if(l.field_changed === 'log_guide') desc = 'Logging guide set: ' + (l.new_value || 'None');
  else if(l.field_changed === 'current_tune') desc = 'Currently flashed set to ' + (l.new_value || '');
  else if(l.field_changed === 'mods_updated') desc = 'Customer updated their mods';
  else if(l.field_changed === 'invoice_reminder') desc = 'Payment reminder sent' + (l.new_value ? ' (' + l.new_value + ')' : '');
  else if(l.field_changed === 'invoice_cancelled') desc = 'Invoice cancelled' + (l.old_value ? ' (was ' + l.old_value + ')' : '');
  else if(l.field_changed === 'invoice_refunded') desc = 'Invoice refunded by Shopify' + (l.new_value ? ' (' + l.new_value + ')' : '');
  else if(l.field_changed === 'profile_edited') desc = 'Profile edited: ' + (l.new_value || '');
  else if(l.field_changed === 'invoice_deleted') desc = 'Invoice deleted' + (l.old_value ? ' (was ' + l.old_value + ')' : '');
  return desc;
}

// Accent color per event type, so the per-application Activity tab reads
// at a glance instead of everything looking the same.
function activityAccent(l){
  if(l.field_changed === 'status'){
    if(l.old_value === 'tune_sent' && l.new_value === 'revision_requested') return 'red';
    return 'teal';
  }
  if(l.field_changed === 'file_uploaded') return 'orange';
  if(l.field_changed === 'internal_note') return 'yellow';
  if(l.field_changed === 'message') return 'muted';
  if(l.field_changed === 'assigned_tuner') return 'muted';
  if(l.field_changed === 'invoice_sent') return 'yellow';
  if(l.field_changed === 'invoice_paid') return 'teal';
  if(l.field_changed === 'invoice_cancelled') return 'red';
  if(l.field_changed === 'invoice_refunded') return 'red';
  if(l.field_changed === 'profile_edited') return 'yellow';
  if(l.field_changed === 'invoice_deleted') return 'red';
  if(l.field_changed === 'invoice_reminder') return 'yellow';
  if(l.field_changed === 'current_tune') return 'teal';
  if(l.field_changed === 'log_guide') return 'muted';
  if(l.field_changed === 'review_submitted') return 'teal';
  if(l.field_changed === 'file_deleted') return 'red';
  if(l.field_changed === 'mods_updated') return 'orange';
  return 'muted';
}

function renderActivityTab(a){
  const log = S.activity[a.id] || [];
  if(!log.length) return '<div class="empty-state">No activity recorded yet.</div>';
  let html = '<div class="activity-timeline">';
  log.forEach(function(l){
    html += '<div class="activity-row activity-' + activityAccent(l) + '"><div class="when">' + fmtDate(l.created_at) + '</div><div>' + escapeHtml(describeActivity(l)) + ' <span class="file-meta">- ' + escapeHtml(l.changed_by||'') + '</span></div></div>';
  });
  html += '</div>';
  return html;
}

      const app = f.tuning_applications;

      html += '<tr>'
        + '<td><a href="#" onclick="event.preventDefault();jumpToApplication(\'' + f.application_id + '\',\'files\')">#' + (app ? app.application_number : '?') + ' - ' + escapeHtml(app ? app.customer_name : '') + '</a></td>'

// One page that answers "is everything actually working?" - live
// connection status, database self-checks (tuning_health()), the Shopify
// webhook, email delivery, and recent errors recorded by the edge functions.
const RT_EXPECTED_TABLES = ['tuning_activity_log','tuning_applications','tuning_files','tuning_invoices','tuning_messages'];

async function loadHealthBadge(){
  try{
    const since = new Date(Date.now() - 86400000).toISOString();
    const { count, error } = await sb.from('tuning_system_events').select('id', { count:'exact', head:true }).eq('level', 'error').gte('created_at', since);
    if(error) throw error;
    S.healthErrors = count || 0;
  }catch(e){ S.healthErrors = 0; }
  renderNav();

async function loadHealth(){
  S.healthLoading = true;
  try{
    const [h, ev] = await Promise.all([
      sb.rpc('tuning_health'),
      sb.from('tuning_system_events').select('*').order('created_at', { ascending:false }).limit(100)
    ]);
    if(h.error) throw h.error;
    S.health = h.data || {};
    S.healthEvents = (ev && !ev.error && ev.data) || [];
  }catch(e){
    S.health = { _error: e.message || String(e) };
    S.healthEvents = [];
  }
  S.healthLoading = false;
  if(S.page === 'health') renderPage();
}

function hAgo(iso){
  if(!iso) return 'never';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + ' min ago';
  if(m < 1440) return Math.round(m / 60) + ' h ago';
  return Math.round(m / 1440) + ' d ago';
}

function healthChecks(){
  const h = S.health || {}, t = h.triggers || {};
  const checks = [];
  const add = function(level, title, detail, fix){ checks.push({ level:level, title:title, detail:detail, fix:fix || '' }); };

  const rtVals = Object.keys(RT_STATUS).map(function(k){ return RT_STATUS[k]; });
  const rtBad = Object.keys(RT_STATUS).filter(function(k){ return RT_STATUS[k] !== 'SUBSCRIBED'; });
  if(!rtVals.length) add('warn', 'Live updates', 'Not connected yet.');
  else if(!rtBad.length) add('ok', 'Live updates', 'All ' + rtVals.length + ' live channels connected.');
  else add('bad', 'Live updates', 'Not connected: ' + rtBad.join(', ') + '. Changes still arrive via the 45 s backup check.', 'Usually a table missing from the realtime publication (see below).');

  const pub = h.realtime_tables || [];
  const missing = RT_EXPECTED_TABLES.filter(function(x){ return pub.indexOf(x) === -1; });
  add(missing.length ? 'bad' : 'ok', 'Realtime publication', missing.length ? 'Missing: ' + missing.join(', ') : 'All ' + RT_EXPECTED_TABLES.length + ' tables are streamed.', missing.length ? 'Run the Phase 16 migration.' : '');

  add(t.log_review_flag ? 'ok' : 'bad', 'Log Review flagging', t.log_review_flag ? 'Customer logs are flagged for review automatically.' : 'The trigger that flags customer logs is missing.', t.log_review_flag ? '' : 'Run the Phase 17 migration.');
  add(t.intake_defaults ? 'ok' : 'bad', 'New application defaults', t.intake_defaults ? 'New applications get status, portal link and default tuner.' : 'The intake trigger is missing.', t.intake_defaults ? '' : 'Run the Phase 18 migration.');
  add(t.stage_timer ? 'ok' : 'warn', 'Stage timers', t.stage_timer ? 'Board aging timers are tracked.' : 'Stage-change tracking trigger is missing - Board ages may be wrong.', t.stage_timer ? '' : 'Run the Phase 13 migration.');
  add(t.new_user_profile ? 'ok' : 'warn', 'New staff accounts', t.new_user_profile ? 'New sign-ups get a staff profile automatically.' : 'New sign-ups will not appear on the Team page.', t.new_user_profile ? '' : 'Run the Phase 10 migration.');

  if(!h.default_tuner) add('warn', 'Default tuner', 'No default tuner set - new applications arrive unassigned.', 'Set one on the Team page.');
  else add(h.default_tuner_has_access ? 'ok' : 'bad', 'Default tuner', h.default_tuner + (h.default_tuner_has_access ? '' : ' does not have Ghost Tuning access'), h.default_tuner_has_access ? '' : 'Turn on their access on the Team page.');

  const wh = h.last_webhook;
  if(wh) add('ok', 'Shopify payment webhook', 'Last delivery ' + hAgo(wh) + '.');
  else add(h.unpaid_invoices ? 'warn' : 'ok', 'Shopify payment webhook', h.unpaid_invoices ? 'No delivery recorded yet, with ' + h.unpaid_invoices + ' unpaid invoice' + (h.unpaid_invoices === 1 ? '' : 's') + '. Paid invoices will only update via "Check payment in Shopify".' : 'No delivery recorded yet (normal until an invoice is paid).', h.unpaid_invoices ? 'Confirm the Draft order update webhook in Shopify points at tuning-invoice-webhook.' : '');

  add(h.failed_emails_7d ? 'bad' : 'ok', 'Email delivery', h.failed_emails_7d ? h.failed_emails_7d + ' email' + (h.failed_emails_7d === 1 ? '' : 's') + ' failed in the last 7 days.' : 'No failed emails in the last 7 days.', h.failed_emails_7d ? 'See the events below - usually the Resend key or sending domain.' : '');

  add(h.unflagged_customer_logs ? 'warn' : 'ok', 'Unflagged customer logs', h.unflagged_customer_logs ? h.unflagged_customer_logs + ' customer log' + (h.unflagged_customer_logs === 1 ? '' : 's') + ' never reached Log Review.' : 'Every customer log reached Log Review.', h.unflagged_customer_logs ? 'Run the Phase 17 migration (its backfill fixes these).' : '');

  const oldest = h.oldest_pending_log ? (Date.now() - new Date(h.oldest_pending_log).getTime()) / 86400000 : 0;
  add(!h.pending_logs ? 'ok' : (oldest > 3 ? 'warn' : 'ok'), 'Log Review backlog', h.pending_logs ? h.pending_logs + ' waiting, oldest ' + hAgo(h.oldest_pending_log) + '.' : 'Nothing waiting.');
  add(h.unassigned_open_apps ? 'warn' : 'ok', 'Unassigned applications', h.unassigned_open_apps ? h.unassigned_open_apps + ' open application' + (h.unassigned_open_apps === 1 ? '' : 's') + ' with no tuner.' : 'Every open application has a tuner.');
  return checks;
}

function renderHealth(){
  if(!S.health){
    if(!S.healthLoading) loadHealth();
    return '<div class="empty-state">Running checks&hellip;</div>';
  }
  if(S.health._error){
    return '<div class="notice-banner red"><strong>Health checks unavailable:</strong> ' + escapeHtml(S.health._error) + '<br>Run the Phase 21 migration, which adds the checks and the events table.</div>';
  }
  const checks = healthChecks();
  const bad = checks.filter(function(c){ return c.level === 'bad'; }).length;
  const warn = checks.filter(function(c){ return c.level === 'warn'; }).length;
  const h = S.health;
  let html = '<div class="hl-banner hl-' + (bad ? 'bad' : (warn ? 'warn' : 'ok')) + '">'
    + '<strong>' + (bad ? (bad === 1 ? '1 problem needs attention' : bad + ' problems need attention') : (warn ? (warn === 1 ? '1 thing to look at' : warn + ' things to look at') : 'All systems normal')) + '</strong>'
    + '<span>' + (h.errors_24h || 0) + ' error' + (h.errors_24h === 1 ? '' : 's') + ' in the last 24 h</span>'
    + '<button class="btn btn-sm" onclick="S.health=null;renderPage()">Re-check</button></div>';

  html += '<div class="hl-checks">' + checks.map(function(c){
    return '<div class="hl-check"><span class="hl-dot hl-' + c.level + '"></span><div class="hl-body">'
      + '<div class="hl-title">' + escapeHtml(c.title) + '</div><div class="hl-detail">' + escapeHtml(c.detail) + '</div>'
      + (c.fix ? '<div class="hl-fix">' + escapeHtml(c.fix) + '</div>' : '') + '</div></div>';
  }).join('') + '</div>';

  html += '<div class="hl-check"><span class="hl-dot hl-warn"></span><div class="hl-body">'
    + '<div class="hl-title">Backfill Shopify order IDs</div>'
    + '<div class="hl-detail">Invoices marked paid before refund/cancellation tracking was added are missing the Shopify order id that a later refund or cancellation gets matched against - so those older invoices won\'t update automatically until this runs once.</div>'
    + '</div><button class="btn btn-sm" id="backfillOrderIdsBtn" style="align-self:center" onclick="runBackfillOrderIds()">Run Backfill</button></div>';

  const filt = S.healthFilter || 'problems';
  const events = (S.healthEvents || []).filter(function(e){ return filt === 'all' || e.level !== 'info'; });
  html += '<div class="dash-head"><div><div class="section-title" style="margin:0">Recent events</div>'
    + '<div class="file-meta" style="margin-top:2px">Recorded by the edge functions - errors, failed emails and Shopify webhook deliveries</div></div>'
    + '<div style="display:flex;gap:6px;align-items:center"><div class="fx-seg"><button class="' + (filt === 'problems' ? 'on' : '') + '" onclick="S.healthFilter=\'problems\';renderPage()">Problems</button><button class="' + (filt === 'all' ? 'on' : '') + '" onclick="S.healthFilter=\'all\';renderPage()">All</button></div>'
    + ((S.healthEvents || []).length ? '<button class="btn btn-sm" onclick="clearHealthEvents()">Clear</button>' : '') + '</div></div>';
  if(!events.length) html += '<div class="tbl-wrap"><div class="empty-state">' + (filt === 'all' ? 'No events recorded yet.' : 'No problems recorded.') + '</div></div>';
  else {
    html += '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Source</th><th>Level</th><th>What happened</th></tr></thead><tbody>'
      + events.map(function(e){
          return '<tr><td style="white-space:nowrap">' + fmtDate(e.created_at) + '</td><td style="white-space:nowrap"><span class="lg-raw">' + escapeHtml(e.source) + '</span></td>'
            + '<td><span class="pill ' + (e.level === 'error' ? 'pill-red' : (e.level === 'warn' ? 'pill-yellow' : 'pill-muted')) + '">' + escapeHtml(e.level) + '</span></td>'
            + '<td>' + escapeHtml(e.message) + hlDetail(e.detail) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
  }
  return html;
}

// Event detail as readable "label: value" lines. A provider response that
// is itself JSON (e.g. Resend's {"message": ...}) is reduced to its message.
function hlDetail(d){
  if(!d || typeof d !== 'object') return '';
  const rows = Object.keys(d).map(function(k){
    let v = d[k];
    if(typeof v === 'string' && v.charAt(0) === '{'){ try{ const j = JSON.parse(v); v = j.message || j.error || v; }catch(e){ /* keep raw */ } }
    if(v && typeof v === 'object') v = JSON.stringify(v);
    return '<div><span class="hl-k">' + escapeHtml(k.replace(/_/g, ' ')) + '</span> ' + escapeHtml(String(v)).slice(0, 240) + '</div>';
  }).join('');
  return '<div class="hl-detail-box">' + rows + '</div>';
}

// One-off maintenance action (see tuning-backfill-order-ids) - fills in
// shopify_order_id on paid invoices that predate refund/cancellation
// tracking, so those older invoices start reacting to Shopify refunds too.
// Safe to click more than once; already-backfilled invoices are skipped.
async function runBackfillOrderIds(){
  if(!confirm('Fetch each paid invoice\'s Shopify order id from Shopify? This only touches invoices that don\'t have one yet.')) return;
  const btn = document.getElementById('backfillOrderIdsBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Running...'; }
  try{
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if(!token) throw new Error('Not signed in');
    const resp = await fetch(SUPABASE_URL + '/functions/v1/tuning-backfill-order-ids', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({})
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Backfill failed');
    toast('Backfilled ' + result.updated + ', skipped ' + result.skipped + (result.failed ? ', ' + result.failed + ' failed' : '')
      + (result.more ? ' - more remain, click Run Backfill again' : ''));
  }catch(e){
    toast('Backfill failed: ' + e.message, true);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Run Backfill'; }
}

// SKUs used by more than one variant - these make the invoice picker
// ambiguous, so they're flagged.
function duplicateSkus(){
  const seen = {}, dup = {};
  (S.products || []).forEach(function(p){ p.variants.forEach(function(v){
    const k = (v.sku || '').trim().toLowerCase();
    if(!k) return;
    if(seen[k]) dup[k] = v.sku.trim(); else seen[k] = true;
  }); });
  return dup;
}

  }
  const dup = duplicateSkus();
  let html = '<div class="dash-head" style="margin-top:0"><div><div class="section-title" style="margin:0">Ghost Tuning Products</div>'
    + '<div class="file-meta" style="margin-top:2px">Live from Shopify (vendor Ghostronics). These are what the invoice product picker offers.</div></div>'
    + '<button class="btn btn-sm btn-primary" onclick="openProductForm(null)">+ Add Product</button></div>';
  if(Object.keys(dup).length){
    html += '<div class="notice-banner red"><strong>Duplicate SKUs:</strong> ' + Object.keys(dup).map(function(k){ return escapeHtml(dup[k]); }).join(', ') + ' - more than one product uses the same SKU, which makes invoices ambiguous.</div>';
  }
  if(S.productFormOpen && !S.editingProductId) html += renderProductForm(null);
  if(!S.products.length && !S.productFormOpen) return html + '<div class="empty-state">No Ghostronics products found in Shopify.</div>';

  html += '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th style="text-align:right">Price</th><th></th></tr></thead><tbody>';
  S.products.forEach(function(p){
    if(S.productFormOpen && S.editingProductId === p.id){
      html += '<tr><td colspan="4" style="padding:0">' + renderProductForm(p) + '</td></tr>';
      return;
    }
    p.variants.forEach(function(v, i){
      const isDup = v.sku && dup[v.sku.trim().toLowerCase()];
      html += '<tr>'
        + '<td>' + (i === 0 ? '<strong>' + escapeHtml(p.title) + '</strong>' : '') + (v.title && v.title !== 'Default Title' ? '<div class="file-meta">' + escapeHtml(v.title) + '</div>' : '') + '</td>'
        + '<td>' + (v.sku ? escapeHtml(v.sku) : '<span class="file-meta">-</span>') + (isDup ? ' <span class="flag-chip">Duplicate</span>' : '') + '</td>'
        + '<td style="text-align:right;font-variant-numeric:tabular-nums">' + money(v.price) + '</td>'
        + '<td style="text-align:right;white-space:nowrap">' + (i === 0
            ? '<button class="btn btn-sm" onclick="openProductForm(\'' + p.id + '\')">Edit</button> <button class="btn btn-sm" style="color:var(--red)" onclick="deleteProduct(\'' + p.id + '\')">Delete</button>'
            : '') + '</td>'
        + '</tr>';
    });
  });
  html += '</tbody></table></div>';
  return html;
}

async function saveProduct(productId){
  const title = document.getElementById('pfTitle').value.trim();
  if(!title){ toast('Title is required', true); return; }
  const skus = document.querySelectorAll('.pf-sku');
  const prices = document.querySelectorAll('.pf-price');
  const variants = [];
  for(let i = 0; i < skus.length; i++){
    const price = parseFloat(prices[i].value);
    if(isNaN(price) || price < 0){ toast('Enter a valid price', true); return; }
    variants.push({ id: skus[i].getAttribute('data-vid') || null, sku: skus[i].value.trim(), price: price });
  }
  const desc = document.getElementById('pfDesc').value.trim();
  const descHtml = desc ? escapeHtml(desc).replace(/\n/g, '<br>') : '';
  const btn = document.getElementById('pfSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  try{
    await productsCall({ action:'product_save', product_id: productId || null, title: title, description: descHtml, variants: variants });
    S.invoiceCatalog = null; // invoice picker refetches with the change
    S.productFormOpen = false; S.editingProductId = null;
    toast(productId ? 'Product updated in Shopify' : 'Product created in Shopify');
    await loadProducts();
  }catch(e){
    toast('Save failed: ' + e.message, true);
    if(btn){ btn.disabled = false; btn.textContent = productId ? 'Save to Shopify' : 'Create in Shopify'; }
  }
}
window.saveProduct = saveProduct;

async function deleteProduct(productId){
  const p = (S.products || []).find(function(x){ return x.id === productId; });
  if(!confirm('Delete "' + (p ? p.title : 'this product') + '" from Shopify?\n\nThis cannot be undone. Invoices already sent keep their line items, but an unpaid invoice that includes it can no longer be edited.')) return;
  try{
    await productsCall({ action:'product_delete', product_id: productId });
